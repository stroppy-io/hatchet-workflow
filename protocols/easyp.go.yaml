lint:
  use:
    - DEFAULT
  enum_zero_value_suffix: NONE
  service_suffix: Service
  ignore: []
  except: []
  allow_comment_ignores: false
  ignore_only: {}
deps:
  - github.com/bufbuild/protoc-gen-validate@v1.3.3
  - github.com/cludden/protoc-gen-go-temporal@v1.23.1
  - github.com/temporalio/api@v1.62.12
  - github.com/stroppy-io/schemapb@v1.4.4
  - github.com/gopherex/protoc-gen-go-ogen@v1.1.4
  - github.com/gopherex/protoc-gen-go-graphql@v1.0.5
#  - github.com/yaroher/protoc-gen-go-plain@v0.7.17
#  - github.com/yaroher/ratel@v0.4.26
generate:
  inputs:
    - directory: cloud
  plugins:
    - name: go
      out: ../internal/proto
      opts:
        paths: source_relative
#    - name: go-hashpb
#      out: ../internal/proto
#      opts:
#        paths: source_relative
    - name: protoc-gen-go-jx
      out: ../internal/proto
      opts:
        paths: source_relative
    - name: validate
      out: ../internal/proto
      opts:
        lang: go
        paths: source_relative
#    - name: go-plain
#      out: ../internal/proto
#      opts:
#        paths: source_relative
#        json_jx: false
#        jx_pb: false
#        pool: false
#    - name: ratel
#      out: ../internal/proto
#      opts:
#        paths: source_relative
    - name: go_temporal
      out: ../internal/proto
      opts:
        paths: source_relative
        docs-out: ../docs/proto
        enable-codec: true
        enable-patch-support: true
        workflow-update-enabled: true
        ignore-acronyms: Service
#        cli-enabled: true
#    - name: go-graphql
#      opts:
#        paths: source_relative

breaking:
  ignore: []
  against_git_ref: master-worker
