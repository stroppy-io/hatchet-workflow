syntax = "proto3";

package cloud.api;

import "models/settings.proto";
import "models/tenant.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/api";

message ListSettingsRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message = {required: true}];
}

message SetSettingRequest {
    models.SettingsItemId id = 2 [(validate.rules).message = {required: true}];
    models.SettingsItem.Value value = 3 [(validate.rules).message = {required: true}];
}

message SetSettingManyRequest {
    repeated SetSettingRequest settings = 2 [(validate.rules).message = {required: true}];
}

service SettingsService {
    rpc ListSettings (ListSettingsRequest) returns (models.SettingsItem.List) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }
    rpc SetSetting (SetSettingRequest) returns (models.SettingsItem) {
        option idempotency_level = IDEMPOTENT;
    }
    rpc SetSettingMany (SetSettingManyRequest) returns (models.SettingsItem.List) {
        option idempotency_level = IDEMPOTENT;
    }
}

