syntax = "proto3";

package cloud.api;

import "google/protobuf/duration.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/api";

message TokenPair {
    string access_token = 1;
    string refresh_token = 2;
    // Access token lifetime in seconds (client uses for proactive refresh).
    google.protobuf.Duration access_token_expires_in = 3;
    // Refresh token lifetime in seconds.
    google.protobuf.Duration refresh_token_expires_in = 4;
}

message LoginRequest {
    string email = 1 [(validate.rules).string.email = true];
    string password = 2 [(validate.rules).string.min_len = 8];
}

message LoginResponse {
    TokenPair tokens = 1;
}

message RefreshTokenRequest {
    string refresh_token = 1 [(validate.rules).string.min_len = 8];
}

message RefreshTokenResponse {
    TokenPair tokens = 1;
}

service AuthService {
    rpc Login (LoginRequest) returns (LoginResponse) {
        option idempotency_level = IDEMPOTENT;
    }
    rpc RefreshTokens (RefreshTokenRequest) returns (RefreshTokenResponse) {
        option idempotency_level = IDEMPOTENT;
    }
}