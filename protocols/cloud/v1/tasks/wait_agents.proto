syntax = "proto3";

package cloud.v1.tasks;

import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/tasks";


/* WaitAgentsTask — block until every listed machine_id has an agent
   registered in AgentHub for this DagRun. Polls the hub until all
   resolve or `timeout_seconds` elapses. Emitted after `provision`. */
message WaitAgentsTask {
    repeated string machine_ids = 1 [(validate.rules).repeated.min_items = 1];
    uint32 timeout_seconds = 2 [(validate.rules).uint32 = {gte: 1, lte: 7200}];
}
