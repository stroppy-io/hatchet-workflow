syntax = "proto3";

package cloud.v1.deployment;

import "cloud/v1/common/status.proto";
import "cloud/v1/common/tags.proto";
import "cloud/v1/deployment/docker.proto";
import "cloud/v1/deployment/provider.proto";
import "cloud/v1/deployment/quota.proto";
import "cloud/v1/deployment/yandex.proto";
import "validate/validate.proto";
import "ogen/ogen.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/deployment";

/*
    infrastructure.proto separates provider inputs from provider outputs.
    InfrastructurePlan is available before provisioning. InfrastructureState is
    filled only after Docker/Terraform/provider apply returns runtime facts.
 */

/*
    InfrastructurePlan is the provider-specific machine/resource intent.
 */
message InfrastructurePlan {
    /*
        provider selects the backend that will materialize this plan.
     */
    deployment.Provider provider = 1 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    /*
        settings are provider account/network/auth settings.
     */
    deployment.ProviderSettings settings = 2;
    /*
        machines are provider-specific resources keyed back to topology.Node.id.
     */
    repeated MachinePlan machines = 3 [(validate.rules).repeated.min_items = 1];
    /*
        labels are structured metadata attached to the plan.
     */
    map<string, string> labels = 4 [(validate.rules).map.max_pairs = 128];
    /*
        tags are arbitrary metadata attached to the plan.
     */
    common.Tags tags = 5;
}

/*
    MachinePlan is provider input for one logical node.
 */
message MachinePlan {
    /*
        node_id links this machine to topology.Node.id.
     */
    string node_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /*
        provider_params are typed provider-specific inputs.
     */
    oneof provider_params {
        option (ogen.oneof) = { schema_mode: ONEOF_SCHEMA_MODE_OBJECT };
        option (validate.required) = true;
        deployment.Docker.Container docker = 10;
        deployment.Yandex.Vm yandex = 11;
    }
    /*
        quota_requests are computed preflight quota requests for this machine.
     */
    repeated deployment.Quota.Request quota_requests = 20 [(validate.rules).repeated.max_items = 64];
    /*
        labels are structured metadata attached to the machine plan.
     */
    map<string, string> labels = 21 [(validate.rules).map.max_pairs = 128];
    /*
        tags are arbitrary metadata attached to the machine plan.
     */
    common.Tags tags = 22;
}

/*
    InfrastructureState is provider output after provisioning.
 */
message InfrastructureState {
    /*
        provider echoes the backend that produced this state.
     */
    deployment.Provider provider = 1 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    /*
        machines are runtime states keyed back to topology.Node.id.
     */
    repeated MachineState machines = 2 [(validate.rules).repeated.min_items = 1];
    /*
        labels are structured metadata attached to the state.
     */
    map<string, string> labels = 3 [(validate.rules).map.max_pairs = 128];
    /*
        tags are arbitrary metadata attached to the state.
     */
    common.Tags tags = 4;
}

/*
    Endpoint is a runtime address reachable on a machine or managed resource.
 */
message Endpoint {
    /*
        name is a stable endpoint name, e.g. private, public, agent, postgres.
     */
    string name = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        address is an IP or DNS name allocated/resolved at runtime.
     */
    string address = 2 [(validate.rules).string = {min_len: 1, max_len: 256}];
    /*
        port is the endpoint port, when applicable.
     */
    optional uint32 port = 3 [(validate.rules).uint32.lte = 65535];
    /*
        labels are structured metadata attached to the endpoint.
     */
    map<string, string> labels = 4 [(validate.rules).map.max_pairs = 64];
}

/*
    MachineState is runtime provider output for one logical node.
 */
message MachineState {
    /*
        node_id links this state to topology.Node.id.
     */
    string node_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /*
        provider_resource_id is the VM/container/resource id assigned by the
        provider.
     */
    string provider_resource_id = 2 [(validate.rules).string.max_len = 256];
    /*
        status is the runtime status reported by the deployment layer.
     */
    common.Status status = 3;
    /*
        endpoints are addresses allocated by the provider.
     */
    repeated Endpoint endpoints = 4 [(validate.rules).repeated.max_items = 64];
    /*
        provider_output is typed provider-specific runtime output.
     */
    oneof provider_output {
        option (ogen.oneof) = { schema_mode: ONEOF_SCHEMA_MODE_OBJECT };
        deployment.Docker.ContainerOutput docker = 10;
        deployment.Yandex.VmOutput yandex = 11;
    }
    /*
        allocated_quotas are provider quotas granted/consumed by this machine.
     */
    repeated deployment.Quota.Allocation allocated_quotas = 20 [(validate.rules).repeated.max_items = 64];
    /*
        labels are structured metadata attached to the machine state.
     */
    map<string, string> labels = 21 [(validate.rules).map.max_pairs = 128];
    /*
        tags are arbitrary metadata attached to the machine state.
     */
    common.Tags tags = 22;
}
