syntax = "proto3";

package cloud.v1.deployment;

import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/deployment";

/*
    Yandex is the protobuf boundary for the single Yandex Cloud Terraform root.
    Input is serialized into tfvars before terraform apply. Output mirrors the
    Terraform outputs consumed by the planner after apply.
 */
message Yandex {

    /* Input contains all variables passed to deployments/terraform/yandex. */
    message Input {
        /* network describes VPC subnets and security groups. */
        Network network = 1 [(validate.rules).message.required = true];
        /* compute describes VM instances. */
        Compute compute = 2 [(validate.rules).message.required = true];
        /* managed_ydb optionally creates Yandex Managed Service for YDB. */
        ManagedYdb managed_ydb = 3;
    }
    /* Output mirrors Terraform outputs. */
    message Output {
        /* vms contains VM outputs keyed by VM name. */
        map<string, VmOutput> vms = 1;
        /* managed_ydb contains managed YDB outputs when created. */
        ManagedYdbOutput managed_ydb = 2;
        /* service_account_id is attached to VMs when managed_ydb is present. */
        string service_account_id = 3;
    }

    /* Enums groups all closed-set values used as strings on the wire.
       Wire fields stay strings so protojson.Marshal yields tfvars directly.
       Go code uses these enums internally and translates to strings before marshal.
    */

    /* QuotaKind enumerates the Yandex Cloud quota metric ids checked before
       an apply. Wire string equals the yc quota metric id. Covers every
       Compute, VPC and Managed YDB quota (the services this root provisions). */
    enum QuotaKind {
        QUOTA_KIND_UNSPECIFIED = 0;

        /* Compute Cloud. */
        /* maps to "compute.instances.count". */
        QUOTA_KIND_COMPUTE_INSTANCES_COUNT = 1;
        /* maps to "compute.instanceMemory.size". */
        QUOTA_KIND_COMPUTE_INSTANCE_MEMORY_SIZE = 2;
        /* maps to "compute.instanceGroups.count". */
        QUOTA_KIND_COMPUTE_INSTANCE_GROUPS_COUNT = 3;
        /* maps to "compute.placementGroups.count". */
        QUOTA_KIND_COMPUTE_PLACEMENT_GROUPS_COUNT = 4;
        /* maps to "compute.instanceCores.count". */
        QUOTA_KIND_COMPUTE_INSTANCE_CORES_COUNT = 5;
        /* maps to "compute.instanceHighFreqCores.count". */
        QUOTA_KIND_COMPUTE_INSTANCE_HIGH_FREQ_CORES_COUNT = 6;
        /* maps to "compute.instanceGpus.count". */
        QUOTA_KIND_COMPUTE_INSTANCE_GPUS_COUNT = 7;
        /* maps to "compute.instanceA100Gpus.count". */
        QUOTA_KIND_COMPUTE_INSTANCE_A100_GPUS_COUNT = 8;
        /* maps to "compute.instanceV3IGpus.count". */
        QUOTA_KIND_COMPUTE_INSTANCE_V3I_GPUS_COUNT = 9;
        /* maps to "compute.instanceT4Gpus.count". */
        QUOTA_KIND_COMPUTE_INSTANCE_T4_GPUS_COUNT = 10;
        /* maps to "compute.instanceT4Gpus.count.ru-central1-d". */
        QUOTA_KIND_COMPUTE_INSTANCE_T4_GPUS_COUNT_RU_CENTRAL1_D = 11;
        /* maps to "compute.instanceT4IGpus.count". */
        QUOTA_KIND_COMPUTE_INSTANCE_T4I_GPUS_COUNT = 12;
        /* maps to "compute.disks.count". */
        QUOTA_KIND_COMPUTE_DISKS_COUNT = 13;
        /* maps to "compute.hddDisks.size". */
        QUOTA_KIND_COMPUTE_HDD_DISKS_SIZE = 14;
        /* maps to "compute.ssdDisks.size". */
        QUOTA_KIND_COMPUTE_SSD_DISKS_SIZE = 15;
        /* maps to "compute.ssdNonReplicatedDisks.size". */
        QUOTA_KIND_COMPUTE_SSD_NON_REPLICATED_DISKS_SIZE = 16;
        /* maps to "compute.ssdIOM3Disks.size". */
        QUOTA_KIND_COMPUTE_SSD_IO_M3_DISKS_SIZE = 17;
        /* maps to "compute.diskPlacementGroups.count". */
        QUOTA_KIND_COMPUTE_DISK_PLACEMENT_GROUPS_COUNT = 18;
        /* maps to "compute.filesystems.count". */
        QUOTA_KIND_COMPUTE_FILESYSTEMS_COUNT = 19;
        /* maps to "compute.hddFilesystems.size". */
        QUOTA_KIND_COMPUTE_HDD_FILESYSTEMS_SIZE = 20;
        /* maps to "compute.ssdFilesystems.size". */
        QUOTA_KIND_COMPUTE_SSD_FILESYSTEMS_SIZE = 21;
        /* maps to "compute.images.count". */
        QUOTA_KIND_COMPUTE_IMAGES_COUNT = 22;
        /* maps to "compute.images.size". */
        QUOTA_KIND_COMPUTE_IMAGES_SIZE = 23;
        /* maps to "compute.diskPools.count". */
        QUOTA_KIND_COMPUTE_DISK_POOLS_COUNT = 24;
        /* maps to "compute.snapshots.count". */
        QUOTA_KIND_COMPUTE_SNAPSHOTS_COUNT = 25;
        /* maps to "compute.snapshots.size". */
        QUOTA_KIND_COMPUTE_SNAPSHOTS_SIZE = 26;
        /* maps to "compute.snapshotSchedules.count". */
        QUOTA_KIND_COMPUTE_SNAPSHOT_SCHEDULES_COUNT = 27;
        /* maps to "compute.dedicatedHosts.count". */
        QUOTA_KIND_COMPUTE_DEDICATED_HOSTS_COUNT = 28;
        /* maps to "compute.hostGroups.count". */
        QUOTA_KIND_COMPUTE_HOST_GROUPS_COUNT = 29;
        /* maps to "compute.reservedInstancePools.count". */
        QUOTA_KIND_COMPUTE_RESERVED_INSTANCE_POOLS_COUNT = 30;

        /* VPC. */
        /* maps to "vpc.networks.count". */
        QUOTA_KIND_VPC_NETWORKS_COUNT = 40;
        /* maps to "vpc.subnets.count". */
        QUOTA_KIND_VPC_SUBNETS_COUNT = 41;
        /* maps to "vpc.externalAddresses.count". */
        QUOTA_KIND_VPC_EXTERNAL_ADDRESSES_COUNT = 42;
        /* maps to "vpc.externalStaticAddresses.count". */
        QUOTA_KIND_VPC_EXTERNAL_STATIC_ADDRESSES_COUNT = 43;
        /* maps to "vpc.routeTables.count". */
        QUOTA_KIND_VPC_ROUTE_TABLES_COUNT = 44;
        /* maps to "vpc.staticRoutes.count". */
        QUOTA_KIND_VPC_STATIC_ROUTES_COUNT = 45;
        /* maps to "vpc.securityGroups.count". */
        QUOTA_KIND_VPC_SECURITY_GROUPS_COUNT = 46;

        /* Managed Service for YDB. */
        /* maps to "ydb.serverlessDatabases.count". */
        QUOTA_KIND_YDB_SERVERLESS_DATABASES_COUNT = 60;
        /* maps to "ydb.serverlessRequestUnitsPerSecond.count". */
        QUOTA_KIND_YDB_SERVERLESS_REQUEST_UNITS_PER_SECOND_COUNT = 61;
        /* maps to "ydb.serverlessStorage.size". */
        QUOTA_KIND_YDB_SERVERLESS_STORAGE_SIZE = 62;
        /* maps to "ydb.dedicatedDatabases.count". */
        QUOTA_KIND_YDB_DEDICATED_DATABASES_COUNT = 63;
        /* maps to "ydb.dedicatedComputeCores.count". */
        QUOTA_KIND_YDB_DEDICATED_COMPUTE_CORES_COUNT = 64;
        /* maps to "ydb.dedicatedComputeMemory.size". */
        QUOTA_KIND_YDB_DEDICATED_COMPUTE_MEMORY_SIZE = 65;
        /* maps to "ydb.dedicatedComputeNodes.count". */
        QUOTA_KIND_YDB_DEDICATED_COMPUTE_NODES_COUNT = 66;
    }

    /* DiskType maps to yandex_compute_disk.type tf string. */
    enum DiskType {
        DISK_TYPE_UNSPECIFIED = 0;
        /* maps to "network-ssd". */
        DISK_TYPE_NETWORK_SSD = 1;
        /* maps to "network-hdd". */
        DISK_TYPE_NETWORK_HDD = 2;
        /* maps to "network-ssd-nonreplicated". */
        DISK_TYPE_NETWORK_SSD_NONREPLICATED = 3;
        /* maps to "network-ssd-io-m3". */
        DISK_TYPE_NETWORK_SSD_IO_M3 = 4;
    }

    /* NetworkAcceleration maps to yandex_compute_instance.network_acceleration_type. */
    enum NetworkAcceleration {
        NETWORK_ACCELERATION_UNSPECIFIED = 0;
        /* maps to "standard". */
        NETWORK_ACCELERATION_STANDARD = 1;
        /* maps to "software_accelerated". */
        NETWORK_ACCELERATION_SOFTWARE_ACCELERATED = 2;
    }

    /* PlatformId maps to yandex_compute_instance.platform_id. */
    enum PlatformId {
        PLATFORM_ID_UNSPECIFIED = 0;
        /* maps to "standard-v1". */
        PLATFORM_ID_STANDARD_V1 = 1;
        /* maps to "standard-v2". */
        PLATFORM_ID_STANDARD_V2 = 2;
        /* maps to "standard-v3". */
        PLATFORM_ID_STANDARD_V3 = 3;
        /* maps to "highfreq-v3". */
        PLATFORM_ID_HIGHFREQ_V3 = 4;
    }

    /* YDB-domain enums live in cloud.v1.runtime.domain.Database.Ydb (database.proto).
       Planner maps domain enums to tf strings before protojson.Marshal. */

    /* Zone maps to Yandex Cloud availability zone strings. */
    enum Zone {
        ZONE_UNSPECIFIED = 0;
        /* maps to "ru-central1-a". */
        ZONE_RU_CENTRAL1_A = 1;
        /* maps to "ru-central1-b". */
        ZONE_RU_CENTRAL1_B = 2;
        /* maps to "ru-central1-c". */
        ZONE_RU_CENTRAL1_C = 3;
        /* maps to "ru-central1-d". */
        ZONE_RU_CENTRAL1_D = 4;
    }

    /* Network describes existing VPC network and subnets created for a run. */
    message Network {
        /* name is a prefix for created subnet and security group names. */
        string name = 1 [(validate.rules).string = {min_len: 1, max_len: 63}];
        /* network_id is an existing Yandex VPC network id. */
        string network_id = 2 [(validate.rules).string.min_len = 1];
        /* cidr is the base CIDR used when Terraform needs to derive subnets. */
        string cidr = 3 [(validate.rules).string.min_len = 1];
        /* zone is the default VM zone. Closed set: see Enums.Zone. */
        string zone = 4 [(validate.rules).string = {in: ["ru-central1-a", "ru-central1-b", "ru-central1-c", "ru-central1-d"]}];
        /* subnets contains explicit subnets keyed by stable name. */
        map<string, Subnet> subnets = 5 [(validate.rules).map.max_pairs = 64];
        /* managed_zones lists zones used for dedicated Managed YDB subnets. Closed set: see Enums.Zone. */
        repeated string managed_zones = 6 [(validate.rules).repeated = {max_items: 16, items: {string: {in: ["ru-central1-a", "ru-central1-b", "ru-central1-c", "ru-central1-d"]}}}];
    }

    /* Subnet describes one VPC subnet to create. */
    message Subnet {
        /* zone is Yandex Cloud availability zone. Closed set: see Enums.Zone. */
        string zone = 1 [(validate.rules).string = {in: ["ru-central1-a", "ru-central1-b", "ru-central1-c", "ru-central1-d"]}];
        /* cidr is subnet IPv4 CIDR. */
        string cidr = 2 [(validate.rules).string.min_len = 1];
    }

    /* Compute describes VM instances created by Terraform. */
    message Compute {
        /* platform_id is Yandex Compute platform id, e.g. standard-v2.
           Closed set: see Enums.PlatformId. */
        string platform_id = 1 [(validate.rules).string = {in: ["standard-v1", "standard-v2", "standard-v3", "highfreq-v3"]}];
        /* image_id is boot image id. */
        string image_id = 2 [(validate.rules).string.min_len = 1];
        /* serial_port_enable enables serial console metadata. */
        bool serial_port_enable = 3;
        /* vms contains VM specs keyed by instance name. */
        map<string, Vm> vms = 4 [(validate.rules).map.min_pairs = 1];
    }

    /* Vm is the runtime yandex_compute_instance spec. */
    message Vm {
        /* cores is VM vCPU count. */
        uint32 cores = 1 [(validate.rules).uint32.gt = 0];
        /* memory_gb is VM RAM in GiB. */
        uint64 memory_gb = 2 [(validate.rules).uint64.gt = 0];
        /* boot_disk_gb is boot disk size in GiB. */
        uint64 boot_disk_gb = 3 [(validate.rules).uint64.gt = 0];
        /* boot_disk_type is boot disk type id. Closed set: see Enums.DiskType. */
        string boot_disk_type = 4 [(validate.rules).string = {in: ["network-ssd", "network-hdd", "network-ssd-nonreplicated", "network-ssd-io-m3"]}];
        /* zone overrides Network.zone. Empty means use default zone. Closed set when set: see Enums.Zone. */
        string zone = 5 [(validate.rules).string = {in: ["", "ru-central1-a", "ru-central1-b", "ru-central1-c", "ru-central1-d"]}];
        /* internal_ip is VM private address in selected subnet. */
        string internal_ip = 6 [(validate.rules).string.min_len = 1];
        /* public_ip requests NAT public address. */
        bool public_ip = 7;
        /* user_data is cloud-init user-data. */
        string user_data = 8;
        /* network_acceleration selects Compute network acceleration mode.
           Closed set: "standard" | "software_accelerated". See Enums.NetworkAcceleration. */
        string network_acceleration = 9 [(validate.rules).string = {in: ["standard", "software_accelerated"]}];
        /* secondary_disks contains raw attached disks. */
        repeated Disk secondary_disks = 10 [(validate.rules).repeated.max_items = 64];
    }

    /* Disk describes an additional yandex_compute_disk attached to a VM. */
    message Disk {
        /* device_name becomes virtio serial visible in guest. */
        string device_name = 1 [(validate.rules).string.min_len = 1];
        /* size_gb is disk size in GiB. */
        uint32 size_gb = 2 [(validate.rules).uint32.gt = 0];
        /* type is Yandex disk type id. Closed set: see Enums.DiskType. */
        string type = 3 [(validate.rules).string = {in: ["network-ssd", "network-hdd", "network-ssd-nonreplicated", "network-ssd-io-m3"]}];
    }

    /* ManagedYdb describes optional Yandex Managed Service for YDB resources. */
    message ManagedYdb {
        /* name is YDB database name. */
        string name = 1 [(validate.rules).string = {min_len: 3, max_len: 63}];
        /* folder_id is Yandex Cloud folder id. */
        string folder_id = 2 [(validate.rules).string.min_len = 1];
        /* location_id is YDB location id. Closed set: see YdbLocationId. */
        string location_id = 3 [(validate.rules).string = {in: ["ru-central1", "kz1"]}];
        /* deletion_protection protects the Terraform resource from accidental deletion. */
        bool deletion_protection = 4;
        /* labels are applied to the managed YDB resource. */
        map<string, string> labels = 5 [(validate.rules).map.max_pairs = 64];
        /* service_account_name overrides the generated stroppy service account name. */
        string service_account_name = 6 [(validate.rules).string.max_len = 63];

        oneof kind {
            option (validate.required) = true;
            /* serverless creates yandex_ydb_database_serverless. */
            Serverless serverless = 10 [(validate.rules).message.required = true];
            /* dedicated creates yandex_ydb_database_dedicated. */
            Dedicated dedicated = 11 [(validate.rules).message.required = true];
        }

        /* Serverless contains yandex_ydb_database_serverless.serverless_database fields. */
        message Serverless {
            /* enable_throttling_rcu_limit enables throttling_rcu_limit. */
            bool enable_throttling_rcu_limit = 1;
            /* throttling_rcu_limit limits request units per second. */
            uint32 throttling_rcu_limit = 2;
            /* provisioned_rcu_limit is provisioned request units per second. */
            uint32 provisioned_rcu_limit = 3;
            /* storage_size_limit is serverless storage size limit in GB. */
            uint32 storage_size_limit = 4;
        }

        /* Dedicated contains yandex_ydb_database_dedicated fields. */
        message Dedicated {
            /* resource_preset_id is YDB dedicated resource preset id.
               See cloud.v1.runtime.domain.Database.Ydb.Managed.ResourcePresetId for domain enum.
               Planner maps domain enum → tf string. Open set on the wire (yc adds presets). */
            string resource_preset_id = 1 [(validate.rules).string.min_len = 1];
            /* scale_policy selects fixed or auto scaling. */
            ScalePolicy scale_policy = 2 [(validate.rules).message.required = true];
            /* storage_config configures dedicated database storage. */
            StorageConfig storage_config = 3 [(validate.rules).message.required = true];
            /* subnet_ids optionally overrides generated subnet ids. */
            repeated string subnet_ids = 4 [(validate.rules).repeated.max_items = 16];
            /* security_group_ids optionally attaches security groups to YDB. */
            repeated string security_group_ids = 5 [(validate.rules).repeated.max_items = 16];
            /* assign_public_ips maps to yandex_ydb_database_dedicated.assign_public_ips. */
            bool assign_public_ips = 6;
        }

        /* ScalePolicy maps to yandex_ydb_database_dedicated.scale_policy. */
        message ScalePolicy {
            oneof policy {
                option (validate.required) = true;
                /* fixed creates scale_policy.fixed_scale. */
                Fixed fixed = 1 [(validate.rules).message.required = true];
                /* auto creates scale_policy.auto_scale and enable_autoscaling label. */
                Auto auto = 2 [(validate.rules).message.required = true];
            }

            /* Fixed configures fixed node count. */
            message Fixed {
                /* size is number of YDB nodes. */
                uint32 size = 1 [(validate.rules).uint32.gte = 1];
            }

            /* Auto configures YDB dedicated autoscaling. */
            message Auto {
                /* min_size is minimum node count. */
                uint32 min_size = 1 [(validate.rules).uint32.gte = 1];
                /* max_size is maximum node count. */
                uint32 max_size = 2 [(validate.rules).uint32.gte = 1];
                /* cpu_utilization_percent is target tracking CPU threshold. */
                uint32 cpu_utilization_percent = 3 [(validate.rules).uint32 = {gte: 1, lte: 100}];
            }
        }

        /* StorageConfig maps to yandex_ydb_database_dedicated.storage_config. */
        message StorageConfig {
            /* group_count is number of storage groups. */
            uint32 group_count = 1 [(validate.rules).uint32.gte = 1];
            /* storage_type_id is YDB storage type id. Closed set: see Enums.YdbStorageType. */
            string storage_type_id = 2 [(validate.rules).string = {in: ["ssd", "rot", "local-ssd"]}];
        }
    }

    /* VmOutput describes one created VM. */
    message VmOutput {
        /* id is yandex_compute_instance id. */
        string id = 1;
        /* internal_ip is private IP address. */
        string internal_ip = 2;
        /* public_ip is NAT IP address. */
        string public_ip = 3;
    }

    /* ManagedYdbOutput describes created managed YDB database. */
    message ManagedYdbOutput {
        /* id is managed YDB resource id. */
        string id = 1;
        /* type is serverless or dedicated. */
        string type = 2;
        /* name is managed YDB resource name. */
        string name = 3;
        /* folder_id is Yandex Cloud folder id. */
        string folder_id = 4;
        /* location_id is YDB location id. */
        string location_id = 5;
        /* database_path is full YDB database path. */
        string database_path = 6;
        /* ydb_api_endpoint is API endpoint. */
        string ydb_api_endpoint = 7;
        /* ydb_full_endpoint is full YDB endpoint. */
        string ydb_full_endpoint = 8;
        /* document_api_endpoint is serverless Document API endpoint. */
        string document_api_endpoint = 9;
        /* tls_enabled reports whether TLS is enabled. */
        bool tls_enabled = 10;
        /* status is provider-reported database status. */
        string status = 11;
        /* created_at is provider-reported creation time. */
        string created_at = 12;
        /* labels are provider-reported labels. */
        map<string, string> labels = 13;
        /* resource_preset_id is dedicated resource preset id. */
        string resource_preset_id = 14;
        /* network_id is dedicated database network id. */
        string network_id = 15;
        /* subnet_ids are dedicated database subnet ids. */
        repeated string subnet_ids = 16;
        /* storage_config is dedicated database storage config. */
        Yandex.ManagedYdb.StorageConfig storage_config = 17;
        /* scale_policy is dedicated database scale policy. */
        Yandex.ManagedYdb.ScalePolicy scale_policy = 18;
        /* raw contains provider-specific output fields. */
        map<string, string> raw = 20;
    }
}
