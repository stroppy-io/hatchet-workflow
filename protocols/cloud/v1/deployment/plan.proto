syntax = "proto3";

package cloud.v1.deployment;

import "cloud/v1/common/cmd.proto";
import "cloud/v1/common/dir.proto";
import "cloud/v1/common/file.proto";
import "cloud/v1/common/status.proto";
import "cloud/v1/common/tags.proto";
import "validate/validate.proto";
import "ogen/ogen.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/deployment";

/*
    plan.proto defines the agent-executable deployment plan produced by the
    build/render stage. It is separate from topology spec and provider runtime
    state.
 */

/*
    DeploymentPlan is the ordered set of component deployments for a topology.
 */
message DeploymentPlan {
    /*
        components are the per-component deployment plans.
     */
    repeated ComponentDeployment components = 1 [(validate.rules).repeated.min_items = 1];
    /*
        labels are structured metadata attached to the plan.
     */
    map<string, string> labels = 2 [(validate.rules).map.max_pairs = 128];
    /*
        tags are arbitrary metadata attached to the plan.
     */
    common.Tags tags = 3;
}

/*
    ComponentDeployment is the agent plan for one logical component.
 */
message ComponentDeployment {
    /*
        component_id links this plan to topology.Component.id.
     */
    string component_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /*
        node_id links this plan to topology.Node.id / infrastructure.MachineState.
     */
    string node_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /*
        global_priority orders this component relative to components on other
        nodes.
     */
    uint32 global_priority = 3;
    /*
        node_priority orders this component relative to colocated components on
        the same node.
     */
    uint32 node_priority = 4;
    /*
        depends_on_component_ids are explicit component dependencies.
     */
    repeated string depends_on_component_ids = 5 [(validate.rules).repeated = {max_items: 64, items: {string: {min_len: 1, max_len: 128}}}];
    /*
        steps are ordered agent actions for this component.
     */
    repeated AgentStep steps = 6 [(validate.rules).repeated.min_items = 1];
    /*
        status is execution status, filled by plan execution.
     */
    common.Status status = 7;
    /*
        labels are structured metadata attached to this component deployment.
     */
    map<string, string> labels = 8 [(validate.rules).map.max_pairs = 128];
    /*
        tags are arbitrary metadata attached to this component deployment.
     */
    common.Tags tags = 9;
}

/*
    AgentStep is one filesystem or command action routed to a node agent.
 */
message AgentStep {
    /*
        id is stable within the component deployment.
     */
    string id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /*
        order is the component-local execution order.
     */
    uint32 order = 2;
    /*
        action is the actual agent operation.
     */
    oneof action {
        option (ogen.oneof) = { schema_mode: ONEOF_SCHEMA_MODE_OBJECT };
        option (validate.required) = true;
        common.Dir create_dir = 10;
        common.File write_file = 11;
        common.File fetch_file = 12;
        common.Cmd call_cmd = 13;
    }
    /*
        status is execution status, filled by plan execution.
     */
    common.Status status = 20;
    /*
        labels are structured metadata attached to the step.
     */
    map<string, string> labels = 21 [(validate.rules).map.max_pairs = 64];
    /*
        tags are arbitrary metadata attached to the step.
     */
    common.Tags tags = 22;
}
