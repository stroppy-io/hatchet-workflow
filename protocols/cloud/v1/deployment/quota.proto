syntax = "proto3";

package cloud.v1.deployment;

import "cloud/v1/deployment/provider.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/deployment";


/*
    Quota is one provider quota reading captured during a preflight check.
    The reading is provider-agnostic: provider selects which QuotaKind enum
    quota_kind_enum_value refers to, since Docker.QuotaKind and
    Yandex.QuotaKind reuse the same numeric values.
 */
message Quota {
    /*
        Info identifies which quota a reading refers to, independent of any
        numbers. It is the shared key embedded in both State and Allocation.
     */
    message Info {
        /* provider selects the deployment backend this reading belongs to and,
           with it, the QuotaKind enum that quota_kind_enum_value indexes. */
        deployment.Provider provider = 1 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
        /* name is the provider-reported quota name, e.g. the metric/quota id
           that quota_kind_enum_value resolves to. */
        string name = 2 [(validate.rules).string.min_len = 1];
        /* units is the provider-reported unit of used and limit, e.g.
           "count", "cores", "bytes", "GB". */
        string units = 6 [(validate.rules).string = {min_len: 1, max_len: 32}];
    }

    /*
        State is a full quota reading observed during a preflight check:
        what the provider reports as used, available and the hard limit.
     */
    message State {
        /* info identifies the provider and quota kind this reading is for. */
        Info info = 1 [(validate.rules).message.required = true];
        /* used is the amount currently consumed in this quota, in info.units. */
        uint64 used = 3;
        /* available is the amount currently free in this quota, in info.units. */
        uint64 available = 5;
        /* limit is the maximum allowed for this quota, in info.units. */
        uint64 limit = 4;
    }

    /*
        Request is the amount one deployment asks to consume from a quota
        during a preflight check, before it is committed as an Allocation.
     */
    message Request {
        /* info identifies the provider and quota kind being requested. */
        Info info = 1 [(validate.rules).message.required = true];
        /* request is the amount this deployment requests, in info.units. */
        uint64 request = 3;
    }

    /*
        Allocation is the amount one deployment intends to consume from a quota.
        Summed across deployments and checked against State to decide if an
        apply fits within the remaining headroom.
     */
    message Allocation {
        /* info identifies the provider and quota kind being allocated. */
        Info info = 1 [(validate.rules).message.required = true];
        /* used is the amount this deployment requests, in info.units. */
        uint64 used = 3;
    }
}
