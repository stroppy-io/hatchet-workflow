syntax = "proto3";

package cloud.v1.catalog;

import "v1/common/timestamps.proto";
import "goplain/goplain.proto";
import "v1/common/identity.proto";
import "v1/iam/tenant.proto";
import "ratelproto/ratelproto.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/catalog";


/* YandexCloudPlatformId — Yandex Cloud VM platform architecture tier. */
enum YandexCloudPlatformId {
    YANDEX_CLOUD_PLATFORM_ID_UNSPECIFIED = 0; // Default unset state.
    YANDEX_CLOUD_PLATFORM_ID_STANDARD_V1 = 1; // First-generation standard x86-64 platform.
    YANDEX_CLOUD_PLATFORM_ID_STANDARD_V2 = 2; // Second-generation standard x86-64 platform.
    YANDEX_CLOUD_PLATFORM_ID_STANDARD_V3 = 3; // Third-generation standard x86-64 platform.
    YANDEX_CLOUD_PLATFORM_ID_STANDARD_V4A = 4; // Fourth-generation AMD-based standard platform.
    YANDEX_CLOUD_PLATFORM_ID_AMD_V1 = 5; // AMD EPYC-based platform variant.
    YANDEX_CLOUD_PLATFORM_ID_HIGHFREQ_V3 = 6; // High-frequency third-generation x86-64 platform.
    YANDEX_CLOUD_PLATFORM_ID_HIGHFREQ_V4A = 7; // High-frequency fourth-generation AMD platform.
}

/* YandexCloudZone — Yandex Cloud availability zone region. */
enum YandexCloudZone {
    YANDEX_CLOUD_ZONE_UNSPECIFIED = 0; // Default unset state.
    YANDEX_CLOUD_ZONE_RU_CENTRAL1_A = 1; // Central Russia A zone.
    YANDEX_CLOUD_ZONE_RU_CENTRAL1_B = 2; // Central Russia B zone.
    YANDEX_CLOUD_ZONE_RU_CENTRAL1_D = 3; // Central Russia D zone.
}

message SettingsItemId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }
message SettingsItem {
    message List {repeated SettingsItem settings_items = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "settings_items"
        indexes: [
            {name: "settings_items_tenant_part_key_uniq", columns: ["tenant_id", "part", "key"], unique: true}
        ]
    };

    SettingsItemId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    cloud.v1.iam.TenantId tenant_id = 2 [
        (ratel.column).constraints = {
            references_schema: "public"
            references_table: "tenants"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 3 [(goplain.field).embed = true];

    /* Part — setting namespace/partition for credential grouping. */
    enum Part {
        PART_UNSPECIFIED = 0; // Default unset state.
        PART_YANDEX_CLOUD = 1; // Yandex Cloud credentials partition.
    }
    Part part = 10 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    /* Key — setting identifier for Yandex Cloud configuration parameters. */
    enum Key {
        KEY_UNSPECIFIED = 0; // Default unset state.
        KEY_YANDEX_CLOUD_TOKEN = 1; // API authentication token.
        KEY_YANDEX_CLOUD_CLOUD_ID = 2; // Cloud account identifier.
        KEY_YANDEX_CLOUD_FOLDER_ID = 3; // Folder/project resource ID.
        KEY_YANDEX_CLOUD_ZONE = 4; // Default availability zone.
        KEY_YANDEX_CLOUD_NETWORK_ID = 5; // VPC network resource ID.
        KEY_YANDEX_CLOUD_NETWORK_NAME = 6; // VPC network display name.
        KEY_YANDEX_CLOUD_SUBNET_CIDR = 7; // Subnet CIDR block.
        KEY_YANDEX_CLOUD_PLATFORM_ID = 8; // VM platform architecture tier.
        KEY_YANDEX_CLOUD_IMAGE_ID = 9; // Compute image identifier.
        KEY_YANDEX_CLOUD_ASSIGN_PUBLIC_IP = 10; // Enable public IP assignment.
        KEY_YANDEX_CLOUD_SOFTWARE_ACCELERATED_NETWORK = 11; // Enable software packet acceleration.
        KEY_YANDEX_CLOUD_SSH_USER = 12; // SSH login username.
        KEY_YANDEX_CLOUD_SSH_PUBLIC_KEY = 13; // SSH public key for authentication.
    }
    Key key = 11 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    message Value {
        oneof value {
            option (validate.required) = true;
            string string_value = 1;
            bool bool_value = 2;
            YandexCloudPlatformId yandex_cloud_platform_id = 3 [(validate.rules).enum.defined_only = true];
            YandexCloudZone yandex_cloud_zone = 4 [(validate.rules).enum.defined_only = true];
        }
    }
    Value value = 12 [
        (goplain.field).serialize = true,
        (ratel.column).constraints.default_value = "'{}'::jsonb"
    ];
}
