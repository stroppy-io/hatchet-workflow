syntax = "proto3";

package cloud.v1.models;

import "cloud/v1/common/entity.proto";
import "cloud/v1/deployment/provider.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/models";

/*
    TenantSettingsRecord is the per-tenant configuration — exactly one row per
    tenant (entity.tenant_id identifies it). Distinct from the global control-plane
    api.PlatformSettings. Starter field set; extend as features need it.
 */
message TenantSettingsRecord {
    common.Entity entity = 1 [(validate.rules).message.required = true];

    // Default provider preselected in the wizards for this tenant.
    deployment.Provider default_provider = 2;
    // Default rating membership for new runs (see TestRunRecord). Optional so unset
    // = platform defaults (tenant true, global false).
    optional bool default_in_tenant_rating = 3;
    optional bool default_in_global_rating = 4;
    // Default suite parallelism. 0 = unlimited.
    uint32 default_max_parallel = 5;
    // Retention for finished runs in days. 0 = keep forever.
    uint32 run_retention_days = 6;

    /*
        Per-provider configuration for this tenant: one ProviderSettings per
        provider the tenant has set up (credentials / region / global sizing
        policy, as baked values against the provider's settings schema). This is
        what the wizards/deploy use as the provider base. SENSITIVE: the baked
        values carry secrets (mark secret fields in the schema); guard reads.
        At most one entry per Provider.
     */
    repeated deployment.ProviderSettings providers = 7;
}
