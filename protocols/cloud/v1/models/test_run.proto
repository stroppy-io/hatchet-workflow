syntax = "proto3";

package cloud.v1.models;

import "cloud/v1/common/entity.proto";
import "cloud/v1/common/status.proto";
import "cloud/v1/common/trigger.proto";
import "cloud/v1/deployment/provider.proto";
import "cloud/v1/domain/database.proto";
import "cloud/v1/domain/test.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/models";

/*
    TestRunRecord is a persisted test execution (one table). The baked spec is the
    input to TestWorkflow; status tracks the run lifecycle; suite_run_id links it to
    a parent SuiteRunRecord when the run is part of a suite (empty = standalone).

    `spec` is a baked Struct and is NOT queryable. For the runs table (filter / sort
    / display of db, workload, preset, topology, progress, duration, ...) the server
    DENORMALIZES those into flat columns in `summary`, filled at Start and updated
    as the run progresses.

    Runtime observations (logs/metrics) are keyed by the run id directly (no dag
    id) — see monitor/logs.proto, monitor/metrics.proto.
 */
message TestRunRecord {
    common.Entity entity = 1 [(validate.rules).message.required = true];
    // Baked run spec — the TestWorkflow input (details/relaunch, not for queries).
    domain.TestRun spec = 2 [(validate.rules).message.required = true];
    // Lifecycle status (PENDING/RUNNING/COMPLETED/FAILED/CANCELLING/CANCELLED/...).
    common.Status status = 3;
    // Owning suite run, empty for a standalone run.
    string suite_run_id = 4 [(validate.rules).string.max_len = 64];
    // Root cause of the run: MANUAL / CRON / API. For a suite child it carries the
    // PARENT suite run's trigger (e.g. CRON), while suite membership is shown by
    // suite_run_id. So "cron + from suite" = trigger=CRON && suite_run_id set.
    common.Trigger trigger = 7;

    // Rating membership, set at creation (any path: manual/wizard/suite/cron).
    // in_tenant_rating defaults TRUE (counts in this tenant's leaderboard);
    // in_global_rating defaults FALSE (publishing to the cross-system / public
    // leaderboard is explicit opt-in). Both global views (public + system-wide
    // private) key off in_global_rating.
    bool in_tenant_rating = 8;
    bool in_global_rating = 9;

    // The live pipeline is NOT stored here — it is runtime, fetched via
    // TestRunOverviewService (monitor.PipelineView). Field 5 retired.
    reserved 5;

    // Denormalized, queryable facets for the runs table (incl. progress_pct, which
    // the backend derives from the live pipeline / Temporal).
    Summary summary = 6;

    /*
        Summary is the flat, indexed projection of the run used by the table:
        every field is filterable and sortable without touching the baked spec.
     */
    message Summary {
        // --- database ---
        domain.Database.Kind db_kind = 1;
        string db_preset_id = 2 [(validate.rules).string.max_len = 64];
        string db_preset_name = 3 [(validate.rules).string.max_len = 255];
        // --- workload ---
        string workload_preset_id = 4 [(validate.rules).string.max_len = 64];
        string workload_name = 5 [(validate.rules).string.max_len = 255];
        string stroppy_version = 6 [(validate.rules).string.max_len = 64];
        // --- topology ---
        string topology_label = 7 [(validate.rules).string.max_len = 128]; // e.g. "PG HA x3"
        uint32 node_count = 8;
        // --- provider ---
        deployment.Provider provider = 9;
        // --- runtime ---
        // progress_pct (0..100) derived on the backend from the pipeline / Temporal.
        uint32 progress_pct = 10 [(validate.rules).uint32.lte = 100];
        google.protobuf.Timestamp started_at = 11;
        google.protobuf.Timestamp finished_at = 12;
        // duration: finished_at - started_at, or live elapsed while running.
        google.protobuf.Duration duration = 13;
    }
}
