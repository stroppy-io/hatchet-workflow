syntax = "proto3";

package cloud.v1.models;

import "cloud/v1/common/tags.proto";
import "cloud/v1/domain/database.proto";
import "cloud/v1/domain/test.proto";
import "cloud/v1/domain/workload.proto";
import "cloud/v1/models/common.proto";
import "goplain/goplain.proto";
import "ratelproto/ratelproto.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/models";


message Preset {
    message List {repeated Preset presets = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "presets"
    };
    models.Entity entity = 1 [(goplain.field).embed = true];
    models.Own owned = 2 [(goplain.field).embed = true];
    common.Tags tags = 3 [
        (goplain.field).serialize = true
    ];

    /*
        BDD decision (B6): kind is kept alongside the oneof discriminator below
        as a cheap DB filter/index (list "all DATABASE presets" without parsing
        the oneof). Validation MUST enforce that kind matches the selected oneof
        branch (KIND_DATABASE <-> database_preset, etc.); a mismatch is rejected.
     */
    enum Kind {
        KIND_UNSPECIFIED = 0;
        KIND_WORKLOAD = 1;
        KIND_DATABASE = 2;
        KIND_TEST = 3;
    }
    Kind kind = 4 [(validate.rules).enum = {defined_only: true, not_in: [0]}];

    /* is_system marks a platform-seeded preset (bootstrapped at server start, not
       owned by a tenant user). System presets are read-only catalog entries:
       visible to every tenant, not user-editable/deletable. */
    bool is_system = 5;

    /* name + description are the catalog display fields (a preset is a named,
       reusable template). */
    optional string name = 6 [(validate.rules).string = {min_len: 1, max_len: 255}];
    optional string description = 7 [(validate.rules).string.max_len = 1024];

    oneof preset {
        option (goplain.oneof).embed = true;
        option (validate.required) = true;
        domain.WorkloadPreset workload_preset = 10 [
            (goplain.field).serialize = true,
            (validate.rules).message.required = true
        ];
        domain.DatabasePreset database_preset = 11 [
            (goplain.field).serialize = true,
            (validate.rules).message.required = true
        ];
        domain.TestPreset test_preset = 12 [
            (goplain.field).serialize = true,
            (validate.rules).message.required = true
        ];
    }
}