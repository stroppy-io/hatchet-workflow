syntax = "proto3";

package cloud.v1.iam;

import "v1/common/timestamps.proto";
import "v1/iam/tenant.proto";
import "v1/iam/user.proto";
import "goplain/goplain.proto";
import "ratelproto/ratelproto.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/iam";


/* TenantRole — role of a user within a tenant. */
enum TenantRole {
    TENANT_ROLE_UNSPECIFIED = 0;
    TENANT_ROLE_VIEWER      = 1;   // read-only
    TENANT_ROLE_MEMBER      = 2;   // run tests
    TENANT_ROLE_ADMIN       = 3;   // manage presets, settings
    TENANT_ROLE_OWNER       = 4;   // manage members + billing
}


message TenantMemberId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }
/* TenantMember — N:M link between User and Tenant with a role.
   Primary lookup: (user_id, tenant_id). */
message TenantMember {
    message List {repeated TenantMember members = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "tenant_members"
        indexes: [
            {name: "tenant_members_user_tenant_uniq", columns: ["user_id", "tenant_id"], unique: true},
            {name: "tenant_members_tenant_idx",       columns: ["tenant_id"]},
            {name: "tenant_members_user_idx",         columns: ["user_id"]}
        ]
    };

    TenantMemberId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    cloud.v1.iam.TenantId tenant_id = 2 [
        (ratel.column).constraints = {
            references_schema: "public"
            references_table: "tenants"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];
    cloud.v1.iam.UserId user_id = 3 [
        (ratel.column).constraints = {
            references_schema: "public"
            references_table: "users"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 4 [(goplain.field).embed = true];

    TenantRole role = 10 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
}


message AddMemberRequest {
    TenantId tenant_id = 1 [(validate.rules).message = {required: true}];
    UserId   user_id   = 2 [(validate.rules).message = {required: true}];
    TenantRole role    = 3 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
}

message UpdateMemberRoleRequest {
    TenantMemberId member_id = 1 [(validate.rules).message = {required: true}];
    TenantRole role          = 2 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
}


service TenantMemberService {
    rpc AddMember        (AddMemberRequest)        returns (TenantMember)      { option idempotency_level = IDEMPOTENT; }
    rpc UpdateMemberRole (UpdateMemberRoleRequest) returns (TenantMember)      { option idempotency_level = IDEMPOTENT; }
    rpc RemoveMember     (TenantMemberId)          returns (TenantMember)      { option idempotency_level = IDEMPOTENT; }
    rpc ListByTenant     (TenantId)                returns (TenantMember.List) { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc ListByUser       (UserId)                  returns (TenantMember.List) { option idempotency_level = NO_SIDE_EFFECTS; }
}
