syntax = "proto3";

package cloud.v1.iam;

import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/iam";

/*
    claims.proto describes WHAT the access token carries and, just as
    importantly, what it does NOT. It is the contract between the auth subsystem
    (which mints the token) and every service that authorizes a request from it.

    NOTE ON ENCODING. AccessClaims is a CONTRACT, not the wire format. On the
    wire the access token is a signed JWT whose JSON claims map onto these fields
    (account_id -> "sub", issued_at -> "iat", expires_at -> "exp", is_admin -> a
    private claim). Do NOT protobuf-serialize this message into the token; it
    exists to pin down which claims are present and why.

    ============================================================================
    TENANT-AGNOSTIC TOKEN (the GitHub-org model)
    ============================================================================

    A Tenant is like a GitHub organization: one Account belongs to many tenants
    and moves between them freely. To make that frictionless, the access token
    is TENANT-AGNOSTIC — it identifies the ACCOUNT and nothing tenant-specific.
    Switching tenant is just navigating to a different /t/<slug> URL; the token
    is NOT re-minted, there is no "switch tenant" call, and one token works
    across every tenant the account can reach.

    The active tenant therefore comes from the URL, never from the token, and
    the account's authority IN that tenant is resolved PER REQUEST.

    ============================================================================
    HOW THE PIECES FIT: URL, JWT, AUTHORIZATION
    ============================================================================

    A user-facing request looks like:

        GET /t/<slug>/runs
        Authorization: Bearer <access_token>

    Request flow:
      1. Verify the JWT signature -> trust the AccessClaims (account_id, is_admin).
      2. Resolve the URL's <slug> to a tenant id via the gate's INTERNAL cached
         slug -> id map. This is NOT the public GetTenant RPC (that one is
         permissioned and a non-member could not call it); the gate resolves
         identity-only, then authorizes.
      3. is_admin == true -> full access, skip the rest (platform super-user).
      4. Look up Membership(account_id, tenant_id). None -> the account is not in
         this tenant -> reject (404/403). This is the org-membership gate.
      5. Resolve the membership's role_ids -> the union of their Permissions
         (server-side, cached). Check the required Permission against that union.

    Steps 4-5 run on EVERY request. Cache the slug->id map and the
    membership->permissions resolve (Valkey) so the cost is a cache hit, not a
    DB round-trip. Cache invalidation on membership/role edits is what makes
    revocation effectively immediate (see STALENESS).

    ============================================================================
    WHAT GOES IN THE TOKEN (and why so little)
    ============================================================================

    IN:
      - account_id : who the caller is (canonical Account.id, never
                     nickname/email, which are mutable).
      - is_admin   : platform super-user shortcut, checkable without any DB hit.

    OUT (deliberately NOT embedded):
      - tenant_id  : the token is tenant-agnostic; the active tenant is the URL
                     slug, resolved per request. Putting a tenant in the token
                     would force a re-mint on every org switch.
      - role_ids / Permission[] : resolved live from Membership per request, so
                     they are always current and never bloat or stale the token.
      - tenant slug / name : mutable display/routing strings — never authority.
      - the account's membership list : derived on demand, not carried.

    STALENESS: because authority is resolved per request (only account_id +
    is_admin live in the token), editing a role, changing a membership, or
    removing the account from a tenant takes effect on the NEXT request (modulo
    cache TTL/invalidation) — no waiting for the token to expire. The only
    point-in-time copy is is_admin: demoting a platform admin still waits for the
    token to expire, so keep the access-token TTL short.
 */
message AccessClaims {
    /*
        account_id is the canonical Account.id the token was issued for. It is
        the JWT subject; nickname/email are never used here because they are
        mutable. Everything tenant-specific is resolved from this id per request.
     */
    string account_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        is_admin mirrors Account.is_admin at mint time. It is the break-glass
        platform super-user flag, letting the gate grant full access across all
        tenants without a DB/role lookup. Because it is a point-in-time copy,
        demoting an admin only takes effect once the token expires (keep TTL
        short); all other authority is resolved live and is not subject to this.
     */
    bool is_admin = 2;
    /*
        issued_at is when the token was minted (maps to JWT "iat").
     */
    google.protobuf.Timestamp issued_at = 3;
    /*
        expires_at is when the token stops being valid (maps to JWT "exp").
     */
    google.protobuf.Timestamp expires_at = 4;
}
