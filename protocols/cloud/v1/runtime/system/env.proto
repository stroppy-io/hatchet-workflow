syntax = "proto3";

package cloud.v1.runtime.system;

import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/runtime/system";

/* Env describes environment variables for a process or rendered config. */
message Env {
    /* values contains environment variables. */
    map<string, string> values = 1 [(validate.rules).map.max_pairs = 256];
}
