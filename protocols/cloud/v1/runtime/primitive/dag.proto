syntax = "proto3";

package cloud.v1.runtime.primitive;

import "cloud/v1/runtime/primitive/retry.proto";
import "cloud/v1/runtime/primitive/status.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/runtime/primitive";


/*
    Dag is a stateful execution snapshot for a directed acyclic graph.

    Architecture decision: everything executable is represented as a Dag.

    The runtime does not know about domain entities such as suites, tests,
    deployments, Terraform runs, machines, or agents. Domain layers compile
    those entities into Dag payloads, and the runtime only executes nodes,
    edges, retry policy, cancellation, failure propagation, and persistence
    snapshots.

    Common shapes:

    1. Suite run

        A suite run is a top-level persisted Dag whose nodes represent the
        suite workflow. Test runs may be embedded when they are small and must
        be part of the same persisted snapshot, or referenced when they need
        their own lifecycle, processor lease, admission policy, or independent
        observability.

        Example:

            Dag(id = suite_run_dag)
              node prepare_environment: task_state
              node test_a: dag_ref(test_a_dag)
              node test_b: dag_ref(test_b_dag)
              node cleanup: task_state, always_run = true

            edges:
              prepare_environment -> test_a
              prepare_environment -> test_b
              test_a -> cleanup
              test_b -> cleanup

    2. Test run

        A test run is also a Dag. It can contain provisioning, configuration,
        workload execution, result collection, and cleanup. If a part must be
        executed as an ordered command stream on an agent, that part is modeled
        as an embedded command Dag.

        Example:

            Dag(id = test_run_dag)
              node render_config: task_state
              node terraform_apply: task_state
              node install_and_run: sub_dag(commands_dag)
              node collect_results: task_state
              node terraform_destroy: task_state, always_run = true

            edges:
              render_config -> terraform_apply
              terraform_apply -> install_and_run
              install_and_run -> collect_results
              terraform_apply -> terraform_destroy
              install_and_run -> terraform_destroy

    3. Agent command queue

        There is no separate durable agent command queue table. A command queue
        is an embedded Dag: the parent node owns a sub-Dag, and each command is
        a task node inside that sub-Dag. The task input contains a typed
        runtime.agent.Command wrapped in google.protobuf.Any. Node status,
        retry state, failures, timestamps, and logs are correlated through the
        node execution_id.

        Example:

            node install_and_run: sub_dag(commands_dag)

            commands_dag:
              node install_packages:
                execution_id = cmd_install_packages
                task_state.handler_name = "agent.command"
                task_state.input = Any(runtime.agent.Command)

              node render_service:
                execution_id = cmd_render_service
                task_state.handler_name = "agent.command"
                task_state.input = Any(runtime.agent.Command)

              node start_service:
                execution_id = cmd_start_service
                task_state.handler_name = "agent.command"
                task_state.input = Any(runtime.agent.Command)

            edges:
              install_packages -> render_service
              render_service -> start_service

        The agent API leases and reports a command by:

            DagId + Node.execution_id

        It must not use structural paths. Node.id is local to one Dag and is
        used by edges. Node.execution_id is the stable external identity inside
        the persisted top-level Dag aggregate, including embedded sub-Dags.

    The scheduler loads and saves the whole Dag aggregate as one unit. A
    top-level Dag is persisted in the dags table; a sub-Dag is embedded in its
    owning node and is not persisted as a separate database row. A dag_ref node
    points at another persisted Dag and lets parent Dags orchestrate independent
    child Dags without embedding their full payload.

    Execution model:
    - a node becomes ready when its incoming edges are satisfied according to
      the node join policy;
    - an edge without a condition is satisfied when the source node reaches
      STATUS_COMPLETED;
    - an edge with on_status is satisfied when the source node reaches that
      terminal status;
    - an edge with predicate_name is satisfied when the registered predicate
      returns true after the source node reaches a terminal status;
    - ready nodes are admitted by Dag.Scheduling.max_parallelism and then by
      node priority;
    - a task node executes its TaskState payload;
    - a sub-Dag node executes the nested Dag and mirrors its terminal result
      into the owning node status;
    - a dag_ref node executes or waits for another persisted Dag through the
      runtime's DagRefRunner and mirrors its terminal result into the owning
      node status;
    - Dag.Scheduling.on_node_failure controls whether ordinary pending nodes
      continue to be admitted after a node fails;
    - Node.Scheduling.always_run nodes are reserved for cleanup/teardown and
      may still run after failure or cancellation.

    Cross-boundary edges are not allowed: edges inside a Dag may reference only
    nodes from that same Dag. Parent Dag edges depend on the owning sub-Dag node,
    not on nodes inside the nested Dag.
*/
/*
    BDD decisions (C12, features/orchestration/compile-to-dag.feature) — how the
    planner compiles a TestPreset snapshot into a Dag (replaces run.builder.Build):

    - graph shape is emergent from Database.Options (etcd/patroni/proxy nodes
      appear only when the options require them).
    - on-host agent work is a per-command sub_dag: each WRITE_FILE / RUN_CMD /
      start-service is its own node with its own retry and execution_id; the
      agent leases and reports by DagId + Node.execution_id.
    - old phase Deps become edges; old AlwaysRun becomes Node.Scheduling.always_run.
    - no shared mutable State: values flow via Node TaskState.output and
      render.Binding (resolved from Deployment.Output). The Dag is a
      self-contained reproducible snapshot.
    - old MustComplete (provision must finish/roll back even on cancel) is
      expressed as an always_run teardown node with edges from provision; no new
      flag. UI TODO: cancel/teardown behavior must be drawable as a distinct
      state (separate task).

    BDD decision (D18): a task node needs an explicit execution-locus marker so
    the agent Poll handler offers only agent nodes and the server runs the rest
    (terraform/docker need control-plane creds + daemon). PROPOSED:

        enum ExecutionLocus {
          EXECUTION_LOCUS_UNSPECIFIED = 0;  // defaults to SERVER
          EXECUTION_LOCUS_SERVER = 1;       // control-plane handler (tf, docker, render, collect)
          EXECUTION_LOCUS_AGENT  = 2;       // leased by an agent via Poll (on-host ops)
        }
        // Node.TaskState gains: ExecutionLocus locus = 4;

    Today the split is implicit via handler_name "agent.command"; the enum makes
    it explicit.
 */
message Dag {
    /*
        Failure is a normalized execution error.

        Plain error strings are enough for logs, but not enough for UI filters,
        retry decisions, grouping, or root-cause navigation. This record keeps
        both human-readable text and stable machine-readable context.
     */
    message Failure {
        /* message is the human-readable error text. */
        string message = 1 [(validate.rules).string = {min_len: 1, max_len: 8192}];
        /*
            code is a stable machine-readable error class.
            Examples: TERRAFORM_APPLY_FAILED, AGENT_UNREACHABLE,
            COMMAND_EXIT_FAILED, CONFIG_RENDER_FAILED, DAG_CANCELLED.
         */
        string code = 2 [(validate.rules).string.max_len = 128];
        /*
            source identifies the subsystem that produced the error.
            Examples: dag_executor, terraform, agent, docker, ssh, stroppy.
         */
        string source = 3 [(validate.rules).string.max_len = 128];
        /*
            phase identifies where inside the node/task the error happened.
            Examples: terraform_apply, install_package, render_config,
            start_service, run_stroppy.
         */
        string phase = 4 [(validate.rules).string.max_len = 128];
        /* attempt is the node attempt that produced this failure. First attempt is 1. */
        uint32 attempt = 5;
        /* retryable is the executor/task opinion before retry policy limits are applied. */
        bool retryable = 6;
        /* occurred_at is when this failure was observed. */
        google.protobuf.Timestamp occurred_at = 7;
        /* metadata stores small diagnostic labels such as workdir_id, machine_id, or command. */
        map<string, string> metadata = 8 [(validate.rules).map.max_pairs = 64];
    }

    /* Node is a single schedulable unit inside a Dag. */
    message Node {
        /* TaskState contains opaque task input and produced task output. */
        message TaskState {
            /*
                ExecutionLocus marks where this task runs (H26/D18): SERVER tasks
                run on the control-plane (terraform, docker, render, collect);
                AGENT tasks are leased by an agent via Poll (on-host ops). The
                Poll handler offers only AGENT nodes. UNSPECIFIED defaults to SERVER.
             */
            enum ExecutionLocus {
                EXECUTION_LOCUS_UNSPECIFIED = 0;
                EXECUTION_LOCUS_SERVER = 1;
                EXECUTION_LOCUS_AGENT = 2;
            }
            /* id is unique within this Dag and is the address used by edges. */
            string handler_name = 1 [(validate.rules).string.min_len = 1];
            /* input is the typed payload consumed by the task executor. */
            google.protobuf.Any input = 2 [(validate.rules).any.required = true];
            /* output is the typed payload produced after task completion. */
            google.protobuf.Any output = 3;
            /* locus marks server-plane vs agent execution. */
            ExecutionLocus locus = 4 [(validate.rules).enum.defined_only = true];
        }

        /*
            DagRef points at another persisted Dag.

            This is intentionally a plain string rather than models.DagId so the
            runtime primitive package stays independent from database models.
            Persisted implementations should store a cloud.v1.models.DagId value.
         */
        message DagRef {
            /* dag_id is the id of the persisted child Dag. */
            string dag_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
        }

        /* Scheduling controls admission and dependency merge behavior for one node. */
        message Scheduling {
            /* JoinPolicy defines how incoming edges are merged before this node becomes ready. */
            enum JoinPolicy {
                /* UNSPECIFIED defaults to JOIN_POLICY_ALL. */
                JOIN_POLICY_UNSPECIFIED = 0;
                /* ALL requires every incoming edge to be satisfied. */
                JOIN_POLICY_ALL = 1;
                /* ANY requires at least one incoming edge to be satisfied. */
                JOIN_POLICY_ANY = 2;
            }

            /*
                retry_policy stores static retry configuration for this node.
                Runtime retry progress lives in Node.Execution.retry_state.
             */
            primitive.Retry.Policy retry_policy = 4 [(validate.rules).message.required = true];
            /* always_run allows cleanup nodes to run after failure or cancellation. */
            bool always_run = 5;
            /* priority orders ready nodes when max_parallelism leaves limited slots. Higher runs earlier. */
            int32 priority = 6;
            /* join_policy controls how incoming edges are joined. UNSPECIFIED defaults to ALL. */
            JoinPolicy join_policy = 7 [(validate.rules).enum.defined_only = true];
        }

        /*
            Execution stores node-local runtime state.

            Scheduling answers "how may this node run"; Execution answers
            "what actually happened while it was running".
         */
        message Execution {
            /* status mirrors Node.status so consumers can read one complete runtime block. */
            primitive.Status status = 1 [(validate.rules).enum = {defined_only: true, not_in: [0, 7]}];
            /*
                retry_state stores runtime retry progress: current attempt,
                next retry time, current delay, last error, and attempt timestamps.
             */
            primitive.Retry.State retry_state = 2;
            /*
                failure is the current/final root failure for this node.
                For STATUS_RETRY_WAIT this is the latest failure.
             */
            Failure failure = 3;
            /* failures keeps structured attempt-level failure history. */
            repeated Failure failures = 4 [(validate.rules).repeated.max_items = 128];
            /* started_at is when the node first entered STATUS_RUNNING. */
            google.protobuf.Timestamp started_at = 5;
            /* finished_at is when the node reached a terminal status. */
            google.protobuf.Timestamp finished_at = 6;
        }

        /* id is unique within this Dag and is the local address used by edges in this Dag. */
        string id = 1 [(validate.rules).string.min_len = 1];
        /* status is the current node execution state. */
        primitive.Status status = 2 [(validate.rules).enum = {defined_only: true, not_in: [0, 7]}];
        /* scheduling contains node-local retry, priority, and join settings. */
        Scheduling scheduling = 3 [(validate.rules).message.required = true];
        /* metadata contains node labels and executor-specific annotations. */
        map<string, string> metadata = 4;
        /*
            execution_id is the immutable external identity of this node inside
            the persisted top-level Dag aggregate.

            Unlike id, it is not a graph-local edge address. It must remain
            stable when a node is moved into or out of an embedded sub-Dag, and
            it must be unique across the whole persisted Dag payload, including
            embedded sub-Dags. External APIs, leases, reports, and logs should
            use execution_id instead of a structural path.
         */
        string execution_id = 5 [(validate.rules).string = {min_len: 1, max_len: 128}];

        /* variant selects whether this node executes a task, an embedded Dag, or a persisted Dag ref. */
        oneof variant {
            option (validate.required) = true;
            /* task_state executes a single task implementation. */
            TaskState task_state = 10 [(validate.rules).message.required = true];
            /* sub_dag executes an embedded Dag snapshot. It is not a separate database row. */
            Dag sub_dag = 11 [(validate.rules).message.required = true];
            /* dag_ref executes or waits for a separate persisted Dag. */
            DagRef dag_ref = 12 [(validate.rules).message.required = true];
        }
        /* execution stores runtime progress and diagnostics for this node. */
        Execution execution = 20;
    }

    /* Edge is a dependency from source node to target node. */
    message Edge {
        /* id is unique within this Dag. */
        string id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
        /* source references the upstream node id in the same Dag. */
        string source = 2 [(validate.rules).string = {min_len: 1, max_len: 256}];
        /* target references the downstream node id in the same Dag. */
        string target = 3 [(validate.rules).string = {min_len: 1, max_len: 256}];

        /* condition defines when this edge is satisfied. Empty condition means source STATUS_COMPLETED. */
        oneof condition {
            /* predicate_name identifies a registered Go predicate evaluated after source termination. */
            string predicate_name = 10;
            /* on_status satisfies this edge when source reaches the selected terminal status. */
            primitive.Status on_status = 11 [
                (validate.rules).enum = {defined_only: true, not_in: [0, 1, 2, 5, 7]}
            ];
        }
    }

    /* id is the persistent aggregate id for a top-level Dag. */
    string id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /* status is the current aggregate execution state. */
    primitive.Status status = 3 [
        (validate.rules).enum = {defined_only: true, not_in: [0, 5, 6]}
    ];

    /* nodes contains all nodes that belong directly to this Dag. */
    repeated Node nodes = 4 [(validate.rules).repeated.min_items = 1];
    /* edges contains dependencies between nodes that belong directly to this Dag. */
    repeated Edge edges = 5;
    /* input is the opaque payload consumed by this Dag or by its first tasks. */
    google.protobuf.Any input = 6;

    /*
        Execution stores aggregate runtime state for the whole Dag.

        Detailed retry history stays on Node.Execution. This block is for
        quick overview, terminal status, and root-cause navigation.
     */
    message Execution {
        /* status mirrors Dag.status so consumers can read one complete runtime block. */
        primitive.Status status = 1 [(validate.rules).enum = {defined_only: true, not_in: [0, 5, 6]}];
        /* failed_node_id points to the first/root failed node, when known. */
        string failed_node_id = 2 [(validate.rules).string.max_len = 256];
        /* failure is the root Dag failure, usually copied from the failed node. */
        Failure failure = 3;
        /* failures contains compact terminal/root failures, not every retry attempt. */
        repeated Failure failures = 4 [(validate.rules).repeated.max_items = 128];
        /* started_at is when the Dag first entered STATUS_RUNNING. */
        google.protobuf.Timestamp started_at = 5;
        /* finished_at is when the Dag reached a terminal status. */
        google.protobuf.Timestamp finished_at = 6;
    }

    /* Scheduling controls graph-level admission and failure behavior. */
    message Scheduling {
        /* OnNodeFailure controls whether failed nodes stop admission of ordinary pending nodes. */
        enum OnNodeFailure {
            /* UNSPECIFIED is reserved; callers must select CONTINUE or STOP. */
            ON_NODE_FAILURE_UNSPECIFIED = 0;
            /* CONTINUE allows independent ready nodes to keep running after a node fails. */
            ON_NODE_FAILURE_CONTINUE = 1;
            /* STOP prevents new ordinary nodes from starting after a node fails. */
            ON_NODE_FAILURE_STOP = 2;
        }

        /* max_parallelism limits concurrently running ready nodes within this Dag. 0 means unlimited. */
        uint32 max_parallelism = 1 [(validate.rules).uint32.lte = 1024];
        /* on_node_failure selects graph-level behavior after a node reaches STATUS_FAILED. */
        OnNodeFailure on_node_failure = 2 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
        /* is_sub_dag marks embedded Dags that must not be persisted independently. */
        bool is_sub_dag = 3;
    }

    /* scheduling contains graph-level parallelism and failure policy. */
    Scheduling scheduling = 7 [(validate.rules).message.required = true];
    /* metadata contains Dag labels and scheduler-specific annotations. */
    map<string, string> metadata = 8;
    /* execution stores aggregate progress and root failure diagnostics. */
    Execution execution = 20;
}
