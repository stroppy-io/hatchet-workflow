syntax = "proto3";

package cloud.v1.runtime.render;

import "cloud/v1/runtime/system/cmd.proto";
import "cloud/v1/runtime/system/env.proto";
import "cloud/v1/runtime/system/file.proto";
import "cloud/v1/runtime/system/service.proto";
import "validate/validate.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/runtime/render";

message CfgValue {
    system.File file = 10;
    system.Service service = 12;
    google.protobuf.Struct struct = 14;
}


/*
    Config is a rendered preview surface shown to a user before runtime planning.
    It contains generated artifacts and user overrides, but it is not an
    execution plan. A planner later converts accepted rendered items into
    runtime.ops and DAG nodes.

    BDD decision (B3, features/catalog/database-render.feature):

    Invariant "preview == execution": the same renderer feeds both the wizard
    preview and the on-host artifact. The preview Item content is byte-for-byte
    equal to the WRITE_FILE operation the agent receives, EXCEPT for the
    explicitly declared set of runtime bindings. No other divergence is allowed.

    Runtime values (real IPs, hostnames, etcd endpoints, connect_address) are
    known only after provisioning. They are NOT magic string placeholders.
    They are modeled as a typed render.Binding on an Item and resolved at the
    plan->execute seam from semantic topology coordinates.

    Anti-leak rules:
    - down: system.File / ops / agent / primitive.Dag only ever see resolved
      values; a WRITE_FILE carrying an unresolved binding is invalid.
    - up: domain.* never references render.Binding; bindings are an artifact of
      rendering, not of intent.

    ADDED (H4): the typed Config.Item.Binding below — token + component_ids
    (plain string ids, runtime-pure) + a free-string attr (no enum, self-
    describing). Replaces the old dbconfig Substitute*Placeholders string magic.
 */
message Config {
    /* id identifies this render result. */
    string id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /* items contains rendered artifacts available for preview and override. */
    repeated Item items = 2 [(validate.rules).repeated.max_items = 1024];
    /* overrides contains user changes applied on top of generated defaults. */
    repeated Override overrides = 3 [(validate.rules).repeated.max_items = 256];

    /*
        Binding is a typed runtime late-binding hole in an item's content (B3,
        H4). The renderer leaves `token` in the rendered bytes; at the
        plan->execute seam the resolver replaces it with the runtime value of
        `attr` for the referenced topology component(s), read from
        Deployment.Output (D18). Replaces the old string placeholders.

        - component_ids is repeated to support multi-component values (e.g. an
          etcd HOSTS list); a single value is a one-element list.
        - attr is a free STRING, not an enum (self-describing, like metrics
          H46): the resolver interprets it ("private_ip", "public_ip",
          "endpoint", "port", "hosts", ...); a new attr needs no proto change.
        - kept independent of domain/models: component reference is a plain
          string id (like DagRef), so render stays runtime-pure.
     */
    message Binding {
        /* token is the placeholder substring inside the item content. */
        string token = 1 [(validate.rules).string = {min_len: 1, max_len: 256}];
        /* component_ids are the topology component ids whose runtime value to resolve. */
        repeated string component_ids = 2 [(validate.rules).repeated = {min_items: 1, max_items: 64}];
        /* attr is the free-string runtime attribute to resolve (no enum). */
        string attr = 3 [(validate.rules).string = {min_len: 1, max_len: 64}];
    }

    /* Item is one rendered artifact visible to the user. */
    message Item {
        /* id is stable across re-renders and is used by overrides. */
        string id = 1 [(validate.rules).string = {min_len: 1, max_len: 256}];
        /* overridden is true when the item includes a user override. */
        bool overridden = 5;
        /* bindings are the runtime late-binding holes in this item's content. */
        repeated Binding bindings = 6 [(validate.rules).repeated.max_items = 256];

        oneof rendered {
            option (validate.required) = true;
            /* file contains rendered file content and metadata. */
            system.File file = 10;
            /* environment contains rendered environment variables. */
            system.Env environment = 11;
            /* service contains rendered service definition. */
            system.Service service = 12;
            /* command contains rendered command specification. */
            system.Cmd.Spec command = 13;
            /* struct contains rendered struct content. (now used only for ydb managed tf config) */
            google.protobuf.Struct struct = 14;
        }
    }

    /* Override is a user change applied to one rendered item. */
    message Override {
        /* item_id references Config.Item.id. */
        string item_id = 1 [(validate.rules).string = {min_len: 1, max_len: 256}];

        oneof override {
            option (validate.required) = true;
            /* file replaces a rendered file item. */
            system.File file = 10;
            /* environment replaces a rendered environment item. */
            system.Env environment = 11;
            /* service replaces a rendered service item. */
            system.Service service = 12;
            /* command replaces a rendered command item. */
            system.Cmd.Spec command = 13;
            /* text_patch replaces text content for text-like rendered items. */
            TextPatch text_patch = 20;
            /* key_value_patch updates map-like rendered items. */
            KeyValuePatch key_value_patch = 21;
        }

        /* TextPatch replaces text content for a rendered item. */
        message TextPatch {
            /* content contains replacement text. */
            string content = 1 [(validate.rules).string.max_bytes = 1048576];
        }

        /* KeyValuePatch updates key-value rendered content. */
        message KeyValuePatch {
            /* set contains keys to create or replace. */
            map<string, string> set = 1 [(validate.rules).map.max_pairs = 256];
            /* remove contains keys to remove. */
            repeated string remove = 2 [(validate.rules).repeated.max_items = 256];
        }
    }
}
