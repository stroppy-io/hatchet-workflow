syntax = "proto3";

package cloud.v1.stroppy;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "v1/iam/tenant.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/stroppy";


// ============================================================================
// Versions — cached proxy to GitHub releases/commits feed for the stroppy binary.
// ============================================================================

message StroppyVersion {
    string tag = 1;             // semver tag, e.g. "v4.1.0"
    bool prerelease = 2;
    optional google.protobuf.Timestamp published_at = 3;
    string release_url = 4;
    repeated string asset_urls = 5;
}

message StroppyCommit {
    string sha = 1;
    string short_sha = 2;
    string message = 3;
    optional google.protobuf.Timestamp committed_at = 4;
    string author = 5;
    /* prerelease_tag — auto-tag built for this commit (e.g. "v4.1.0-rc.5+abc1234"). */
    string prerelease_tag = 6;
}

message StroppyVersionList { repeated StroppyVersion versions = 1; }
message StroppyCommitList  { repeated StroppyCommit commits = 1; }


// ============================================================================
// Wizard helpers — server-side wrappers around the stroppy binary used by the
// SPA to render workout structure and the final stroppy-config.json without
// persisting a TestRun. No state mutation.
// ============================================================================

/* ProbeWorkloadFile — auxiliary workload artifact (SQL templates, scripts)
   that the probe binary needs to inspect alongside stroppy-config.json. */
message ProbeWorkloadFile {
    string name = 1 [(validate.rules).string = {min_len: 1, max_len: 256}];
    string content = 2 [(validate.rules).string.max_bytes = 4194304];   // 4 MiB
}

/* ProbeStroppyConfigRequest — wizard "stroppy" step. Server executes
   `stroppy probe -f <config> -o json` against the chosen stroppy binary
   version and returns the parsed workout structure that the SPA renders
   (env declarations, steps, SQL sections, driver setups). */
message ProbeStroppyConfigRequest {
    cloud.v1.iam.TenantId tenant_id = 1 [(validate.rules).message = {required: true}];

    /* stroppy_version — semver tag from StroppyService.ListStroppyVersions.
       Empty = server default. */
    string stroppy_version = 2 [(validate.rules).string.max_len = 64];

    /* script — workload script id, e.g. "tpcc/procs", "tpcb/tx". */
    string script = 3 [(validate.rules).string = {min_len: 1, max_len: 128}];

    /* sql — optional second SQL argument for script variants. */
    string sql = 4 [(validate.rules).string.max_len = 128];

    /* driver_type — e.g. "postgres", "mysql", "picodata". */
    string driver_type = 5 [(validate.rules).string.max_len = 64];

    uint32 pool_size = 6 [(validate.rules).uint32.lte = 10000];
    uint32 scale_factor = 7;

    /* env — overrides merged into stroppy-config.json env block. */
    map<string, string> env = 8;

    /* files — auxiliary workload files written next to the probe config. */
    repeated ProbeWorkloadFile files = 9 [(validate.rules).repeated.max_items = 64];

    /* include_human — also return the human-readable probe output. */
    bool include_human = 10;
}

/* ProbeEnvDecl — declared env variable expected by the workload. */
message ProbeEnvDecl {
    string name = 1;
    string type = 2;          // "string" | "int" | "bool" | ...
    string default_value = 3;
    string description = 4;
    bool required = 5;
}

message ProbeStep {
    string name = 1;
    string kind = 2;          // "sql" | "setup" | "driver" | ...
    string description = 3;
}

message ProbeSqlSection {
    string name = 1;
    string sql = 2;
}

message ProbeDriverSetup {
    string driver_type = 1;
    map<string, string> settings = 2;
}

message ProbeStroppyConfigResponse {
    repeated ProbeEnvDecl env_declarations = 1;
    repeated ProbeStep steps = 2;
    repeated ProbeSqlSection sql_sections = 3;
    repeated ProbeDriverSetup driver_setups = 4;
    /* human — optional human-readable form (when include_human=true). */
    string human = 5;
    /* raw_json — original stroppy probe JSON for clients that want the
       untranslated payload. */
    string raw_json = 6;
}

/* PreviewStroppyConfigRequest — wizard "review" step. Server renders the
   final stroppy-config.json from the in-progress TestRun draft (or honours
   a raw override). Frontend shows it in a read-only textarea. */
message PreviewStroppyConfigRequest {
    cloud.v1.iam.TenantId tenant_id = 1 [(validate.rules).message = {required: true}];

    /* config_override_json — when non-empty, server passes it through
       verbatim (skips the builder path). */
    string config_override_json = 2 [(validate.rules).string.max_bytes = 4194304];

    /* stroppy_version — version used to choose the right config schema
       (some fields are gated by binary version). */
    string stroppy_version = 3 [(validate.rules).string.max_len = 64];

    string script = 4 [(validate.rules).string.max_len = 128];
    string sql = 5 [(validate.rules).string.max_len = 128];
    string driver_type = 6 [(validate.rules).string.max_len = 64];
    uint32 pool_size = 7 [(validate.rules).uint32.lte = 10000];
    uint32 scale_factor = 8;
    map<string, string> env = 9;
    repeated ProbeWorkloadFile files = 10 [(validate.rules).repeated.max_items = 64];
}

message PreviewStroppyConfigResponse {
    /* stroppy_config_json — the final stroppy-config.json that will be
       shipped to the runner. */
    string stroppy_config_json = 1;
}


// ============================================================================
// Service
// ============================================================================

/* StroppyService — everything that wraps the stroppy binary itself:
   binary version catalog (GitHub-proxy with TTL cache) and wizard helpers
   that invoke the binary server-side to render workout structure and the
   final stroppy-config.json. No state mutation. */
service StroppyService {
    /* Versions — cached proxy to GitHub releases / commits feed.
       Backed by server-side 5-min TTL cache (avoids per-user GitHub rate-limit). */
    rpc ListStroppyVersions  (google.protobuf.Empty)            returns (StroppyVersionList)         { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc ListStroppyCommits   (google.protobuf.Empty)            returns (StroppyCommitList)          { option idempotency_level = NO_SIDE_EFFECTS; }

    /* ProbeStroppyConfig — invokes `stroppy probe` server-side and returns
       the parsed workout structure. Used by the wizard's "stroppy" step. */
    rpc ProbeStroppyConfig   (ProbeStroppyConfigRequest)        returns (ProbeStroppyConfigResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
    /* PreviewStroppyConfig — renders the final stroppy-config.json from the
       wizard inputs. Used by the "review" step. */
    rpc PreviewStroppyConfig (PreviewStroppyConfigRequest)      returns (PreviewStroppyConfigResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
}
