syntax = "proto3";

package cloud.v1.testing;

import "v1/common/timestamps.proto";
import "goplain/goplain.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "v1/iam/tenant.proto";
import "v1/iam/user.proto";
import "ratelproto/ratelproto.proto";
import "v1/testing/test_run.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/testing";


message SharedTestRunId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }
/* SharedTestRun — public read-only snapshot of a single TestRun accessible
   by URL token. Snapshot + metrics are frozen at share time. */
message SharedTestRun {
    message List {repeated SharedTestRun shared_test_runs = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "shared_test_runs"
        indexes: [
            {name: "shared_test_runs_token_uniq", columns: ["token"], unique: true},
            {name: "shared_test_runs_run_idx",    columns: ["test_run_id"]},
            {name: "shared_test_runs_tenant_idx", columns: ["tenant_id"]}
        ]
    };

    SharedTestRunId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    cloud.v1.iam.TenantId tenant_id = 2 [
        (ratel.column).constraints = {
            references_schema: "public"
            references_table: "tenants"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 3 [(goplain.field).embed = true];

    cloud.v1.testing.TestRunId test_run_id = 4 [
        (ratel.column).constraints = {
            references_schema: "public"
            references_table: "test_runs"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];
    optional cloud.v1.iam.UserId created_by = 5 [(ratel.column).constraints = {
        references_schema: "public"
        references_table: "users"
        references_column: "id"
        on_delete: SET_NULL
    }];

    /* token — URL-safe random slug; unique. Public lookup column. */
    string token = 10 [(validate.rules).string = {min_len: 16, max_len: 64, pattern: "^[A-Za-z0-9_-]+$"}];
    /* snapshot — frozen TestRun + Database + Workload at share time. */
    google.protobuf.Struct snapshot = 11 [
        (goplain.field).serialize = true,
        (ratel.column).constraints.default_value = "'{}'::jsonb"
    ];
    /* metrics — frozen aggregate metrics for the run. */
    google.protobuf.Struct metrics = 12 [
        (goplain.field).serialize = true,
        (ratel.column).constraints.default_value = "'{}'::jsonb"
    ];
    optional google.protobuf.Timestamp expires_at = 13;
    uint64 view_count = 14;
}


message CreateSharedTestRunRequest {
    TestRunId test_run_id = 1 [(validate.rules).message = {required: true}];
    /* expires_in_days — auto-expiry; 0 = no expiry. */
    uint32 expires_in_days = 2 [(validate.rules).uint32.lte = 3650];
}

message GetSharedTestRunByTokenRequest {
    string token = 1 [(validate.rules).string = {min_len: 16, max_len: 64}];
}


service SharedTestRunService {
    rpc CreateSharedTestRun (CreateSharedTestRunRequest)     returns (SharedTestRun)      { option idempotency_level = IDEMPOTENT; }
    rpc RevokeSharedTestRun (SharedTestRunId)                returns (SharedTestRun)      { option idempotency_level = IDEMPOTENT; }
    rpc ListSharedTestRuns  (cloud.v1.iam.TenantId)          returns (SharedTestRun.List) { option idempotency_level = NO_SIDE_EFFECTS; }
    /* GetByToken — public, unauthenticated endpoint. */
    rpc GetByToken          (GetSharedTestRunByTokenRequest) returns (SharedTestRun)      { option idempotency_level = NO_SIDE_EFFECTS; }
}
