syntax = "proto3";

package cloud.v1.testing;

import "v1/iam/user.proto";
import "v1/catalog/database.proto";
import "v1/catalog/workload.proto";
import "v1/common/identity.proto";
import "v1/common/timestamps.proto";
import "goplain/goplain.proto";
import "v1/iam/tenant.proto";
import "ratelproto/ratelproto.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/testing";


message TestSuiteId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }
/* TestSuite — parameterized benchmark specification with database × workload
   matrix and admission policy. Launches produce TestSuiteRun batches. */
message TestSuite {
    message List {repeated TestSuite test_suites = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "test_suites"
        indexes: [
            {name: "test_suites_tenant_idx", columns: ["tenant_id"]}
        ]
    };

    TestSuiteId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    cloud.v1.iam.TenantId tenant_id = 2 [
        (ratel.column).constraints = {
            references_schema: "public"
            references_table: "tenants"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 3 [(goplain.field).embed = true];
    cloud.v1.common.Identity identity = 4 [(goplain.field).embed = true];
    optional cloud.v1.iam.UserId created_by = 9 [(ratel.column).constraints = {
        references_schema: "public"
        references_table: "users"
        references_column: "id"
        on_delete: SET_NULL
    }];

    /* Matrix — cartesian product of databases × workloads. */
    message Matrix {
        repeated cloud.v1.catalog.DatabaseOrPreset databases = 1 [(validate.rules).repeated.min_items = 1];
        repeated cloud.v1.catalog.WorkloadOrPreset workloads = 2 [(validate.rules).repeated.min_items = 1];
    }
    Matrix matrix = 7 [
        (validate.rules).message.required = true,
        (goplain.field).serialize = true,
        (ratel.column).constraints.default_value = "'{}'::jsonb"
    ];

    /* Policy — admission of matrix cells (DB × Workload jobs).
       Source: stroppy-cloud/internal/infrastructure/postgres/suite_storage.go. */
    message Policy {
        enum Mode {
            MODE_UNSPECIFIED = 0;
            MODE_SEQUENTIAL  = 1;     // block N until N-1 terminal (default)
            MODE_PARALLEL    = 2;     // admit up to max_parallel concurrently
        }
        enum OnStepFail {
            ON_STEP_FAIL_UNSPECIFIED = 0;
            ON_STEP_FAIL_CONTINUE    = 1;  // default
            ON_STEP_FAIL_STOP        = 2;  // abort remaining cells
        }
        enum ConcurrentPolicy {
            CONCURRENT_POLICY_UNSPECIFIED = 0;
            CONCURRENT_POLICY_FORBID      = 1;  // reject new batch (default)
            CONCURRENT_POLICY_ALLOW       = 2;  // run side-by-side
        }
        enum CatchupMode {
            CATCHUP_MODE_UNSPECIFIED = 0;
            CATCHUP_MODE_SKIP        = 1;  // missed schedule windows dropped (default)
            CATCHUP_MODE_RUN_ONCE    = 2;  // run a single catch-up cycle
        }

        Mode mode = 1 [(validate.rules).enum.defined_only = true];
        uint32 max_parallel = 2 [(validate.rules).uint32.lte = 1024];  // mode=PARALLEL only; 0 = unlimited
        OnStepFail on_step_fail = 3 [(validate.rules).enum.defined_only = true];
        uint32 step_timeout_min = 4 [(validate.rules).uint32.lte = 10080];   // 1 week; 0 = no timeout
        ConcurrentPolicy concurrent_policy = 5 [(validate.rules).enum.defined_only = true];
        CatchupMode catchup_mode = 6 [(validate.rules).enum.defined_only = true];
    }
    Policy policy = 8 [
        (goplain.field).serialize = true,
        (ratel.column).constraints.default_value = "'{}'::jsonb"
    ];
}
