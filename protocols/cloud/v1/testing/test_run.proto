syntax = "proto3";

package cloud.v1.testing;

import "v1/iam/user.proto";
import "v1/catalog/database.proto";
import "v1/catalog/workload.proto";
import "v1/common/identity.proto";
import "v1/common/timestamps.proto";
import "goplain/goplain.proto";
import "v1/iam/tenant.proto";
import "ratelproto/ratelproto.proto";
import "v1/system/dag.proto";
import "v1/testing/test_run_template.proto";
import "v1/testing/test_suite_run.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/testing";


message TestRunId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }
/* TestRun — individual benchmark execution instance with database, workload,
   and optional reference to its template or parent suite-run batch. */
message TestRun {
    message List {repeated TestRun test_runs = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "test_runs"
        indexes: [
            {name: "test_runs_suite_run_idx", columns: ["suite_run_id"]},
            {name: "test_runs_template_idx",  columns: ["template_id"]},
            {name: "test_runs_tenant_idx",    columns: ["tenant_id"]}
        ]
    };

    TestRunId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    cloud.v1.iam.TenantId tenant_id = 2 [
        (ratel.column).constraints = {
            references_schema: "public"
            references_table: "tenants"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 3 [(goplain.field).embed = true];
    cloud.v1.common.Identity identity = 4 [(goplain.field).embed = true];

    optional cloud.v1.testing.TestSuiteRunId suite_run_id = 5 [(ratel.column).constraints = {
        references_schema: "public"
        references_table: "test_suite_runs"
        references_column: "id"
        on_delete: CASCADE
    }]; // Parent suite-run batch, null if standalone.
    optional cloud.v1.testing.TestRunTemplateId template_id = 6 [(ratel.column).constraints = {
        references_schema: "public"
        references_table: "test_run_templates"
        references_column: "id"
        on_delete: SET_NULL
    }]; // Template this run was instantiated from.

    /* Latest DagRun executing this TestRun. Engine is source of truth for
       execution state; this is a back-pointer for domain queries. */
    optional cloud.v1.system.DagRunId dag_run_id = 7 [(ratel.column).constraints = {
        references_schema: "public"
        references_table: "dag_runs"
        references_column: "id"
        on_delete: SET_NULL
    }];
    optional cloud.v1.iam.UserId created_by = 9 [(ratel.column).constraints = {
        references_schema: "public"
        references_table: "users"
        references_column: "id"
        on_delete: SET_NULL
    }];

    cloud.v1.catalog.DatabaseOrPreset database = 10 [(goplain.field).embed = true];
    cloud.v1.catalog.WorkloadOrPreset workload = 11 [(goplain.field).embed = true];
}
