syntax = "proto3";

package cloud.v1.testing;

import "v1/common/timestamps.proto";
import "goplain/goplain.proto";
import "v1/iam/tenant.proto";
import "ratelproto/ratelproto.proto";
import "v1/system/dag.proto";
import "v1/testing/test_suite.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/testing";


message TestSuiteRunId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }
/* TestSuiteRun — concrete batch execution of a TestSuite. Captures the
   matrix snapshot at launch time so later edits to the suite don't
   retroactively change historical runs. */
message TestSuiteRun {
    message List {repeated TestSuiteRun test_suite_runs = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "test_suite_runs"
        indexes: [
            {name: "test_suite_runs_tenant_idx", columns: ["tenant_id"]},
            {name: "test_suite_runs_suite_idx",  columns: ["suite_id"]}
        ]
    };

    TestSuiteRunId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    /* Denormalised tenant_id — inherited via suite_id, kept here so
       cross-tenant queries do not require a JOIN. Backend invariant:
       must match the suite's tenant. */
    cloud.v1.iam.TenantId tenant_id = 2 [
        (ratel.column).constraints = {
            references_schema: "public"
            references_table: "tenants"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 3 [(goplain.field).embed = true];

    cloud.v1.testing.TestSuiteId suite_id = 4 [
        (ratel.column).constraints = {
            references_schema: "public"
            references_table: "test_suites"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];

    /* ULIDs of test_runs in this batch. No FK — app-enforced integrity
       to allow batch creation before all rows are inserted. */
    repeated string test_run_ids = 5 [(validate.rules).repeated = {
        max_items: 4096,
        items: {string: {len: 26}}
    }];

    /* Latest meta-DagRun (SUITE_RUN-level) executing this TestSuiteRun. */
    optional cloud.v1.system.DagRunId dag_run_id = 6 [(ratel.column).constraints = {
        references_schema: "public"
        references_table: "dag_runs"
        references_column: "id"
        on_delete: SET_NULL
    }];

    /* Snapshot of suite matrix at run time — suite.matrix can change later. */
    cloud.v1.testing.TestSuite.Matrix matrix = 7 [
        (goplain.field).serialize = true,
        (ratel.column).constraints.default_value = "'{}'::jsonb"
    ];
}
