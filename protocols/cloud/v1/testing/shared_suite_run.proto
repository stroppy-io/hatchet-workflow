syntax = "proto3";

package cloud.v1.testing;

import "v1/common/timestamps.proto";
import "goplain/goplain.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "v1/iam/tenant.proto";
import "v1/iam/user.proto";
import "ratelproto/ratelproto.proto";
import "v1/testing/test_suite_run.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/testing";


message SharedSuiteRunId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }
/* SharedSuiteRun — public read-only snapshot of a whole TestSuiteRun batch
   accessible by URL token. Carries the matrix + per-cell metrics aggregate
   so viewers compare all DB×Workload cells at once. */
message SharedSuiteRun {
    message List {repeated SharedSuiteRun shared_suite_runs = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "shared_suite_runs"
        indexes: [
            {name: "shared_suite_runs_token_uniq",   columns: ["token"], unique: true},
            {name: "shared_suite_runs_run_idx",      columns: ["test_suite_run_id"]},
            {name: "shared_suite_runs_tenant_idx",   columns: ["tenant_id"]}
        ]
    };

    SharedSuiteRunId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    cloud.v1.iam.TenantId tenant_id = 2 [
        (ratel.column).constraints = {
            references_schema: "public"
            references_table: "tenants"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 3 [(goplain.field).embed = true];

    cloud.v1.testing.TestSuiteRunId test_suite_run_id = 4 [
        (ratel.column).constraints = {
            references_schema: "public"
            references_table: "test_suite_runs"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];
    optional cloud.v1.iam.UserId created_by = 5 [(ratel.column).constraints = {
        references_schema: "public"
        references_table: "users"
        references_column: "id"
        on_delete: SET_NULL
    }];

    /* token — URL-safe random slug; unique. */
    string token = 10 [(validate.rules).string = {min_len: 16, max_len: 64, pattern: "^[A-Za-z0-9_-]+$"}];
    /* snapshot — frozen TestSuite + Matrix + child TestRuns refs at share time. */
    google.protobuf.Struct snapshot = 11 [
        (goplain.field).serialize = true,
        (ratel.column).constraints.default_value = "'{}'::jsonb"
    ];
    /* metrics — per-cell aggregate metrics for the whole batch. */
    google.protobuf.Struct metrics = 12 [
        (goplain.field).serialize = true,
        (ratel.column).constraints.default_value = "'{}'::jsonb"
    ];
    optional google.protobuf.Timestamp expires_at = 13;
    uint64 view_count = 14;
}
