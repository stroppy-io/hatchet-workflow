syntax = "proto3";

package cloud.v1.api;

import "cloud/v1/iam/options.proto";
import "cloud/v1/iam/permission.proto";
import "cloud/v1/models/test_run.proto";
import "cloud/v1/monitor/logs.proto";
import "cloud/v1/monitor/metrics.proto";
import "cloud/v1/monitor/overview.proto";
import "cloud/v1/topology/topology.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

import "ogen/ogen.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api";

option (ogen.file) = { generate_openapi: true };

/*
    test_run_overview.proto is the single API behind the test-run overview page
    (tabs: Overview, Logs, Metrics). Grafana is a separate concern served by a
    plain HTTP proxy straight to VictoriaMetrics — NOT modeled here.

    All of this is RUNTIME (queried live, keyed by run id), tenant-scoped
    (tenant_id) and gated by RESOURCE_TEST_RUN/READ — it is read-only insight into
    a run the caller can already see.

    Logs are the hard part: a run can emit hundreds of thousands of lines at high
    rate. The design separates two modes so the frontend never drowns:
      - QueryLogs: cursor-paged history, scroll BOTH directions (older/newer).
      - StreamLogs: bounded live tail (follow), the server may coalesce/rate-limit.
    Every line has a stable global line_no + LogCursor, so links to a line are
    deterministic (two users opening the same LogRef see the same line) and the
    user can filter the live stream, jump, or scroll without losing position.
 */

/*
    LogFilter is the flexible log filter shared by query and stream. All fields are
    optional and AND-combined. `query` is the raw-LogsQL escape hatch for advanced
    filtering beyond the structured fields.
 */
message LogFilter {
    /*
        node_execution_ids restricts to lines emitted by these node executions.
     */
    repeated string node_execution_ids = 1 [(validate.rules).repeated = {max_items: 256, items: {string: {max_len: 128}}}];
    /*
        component_ids restricts to lines emitted by these components.
     */
    repeated string component_ids = 2 [(validate.rules).repeated = {max_items: 256, items: {string: {max_len: 128}}}];
    /*
        node_ids restricts to lines emitted by these logical topology nodes.
     */
    repeated string node_ids = 3 [(validate.rules).repeated = {max_items: 256, items: {string: {max_len: 128}}}];
    /*
        sources restricts to these log sources.
     */
    repeated monitor.Source sources = 4;
    /*
        streams restricts to these log streams (e.g. stdout/stderr).
     */
    repeated monitor.Stream streams = 5;
    /*
        unit restricts to a specific systemd/log unit.
     */
    string unit = 6 [(validate.rules).string.max_len = 256];
    /*
        start keeps lines at or after this time.
     */
    google.protobuf.Timestamp start = 7;
    /*
        end keeps lines at or before this time.
     */
    google.protobuf.Timestamp end = 8;
    /*
        search is a simple substring match over the line text.
     */
    string search = 9 [(validate.rules).string.max_len = 1024];
    /*
        query is a raw LogsQL fragment, AND-ed with the structured filters (advanced).
     */
    string query = 10 [(validate.rules).string.max_len = 4096];
    /*
        phases restrict to logs belonging to these top-level pipeline phases.
     */
    repeated string phases = 11 [(validate.rules).repeated = {max_items: 64, items: {string: {max_len: 128}}}];
    /*
        parent_node_execution_ids restrict to logs under these parent stages.
     */
    repeated string parent_node_execution_ids = 12 [(validate.rules).repeated = {max_items: 256, items: {string: {max_len: 128}}}];
    /*
        stage_names restrict to logs emitted by stages with these display names.
     */
    repeated string stage_names = 13 [(validate.rules).repeated = {max_items: 256, items: {string: {max_len: 256}}}];
    /*
        step_ids restrict to component-local deployment step ids.
     */
    repeated string step_ids = 14 [(validate.rules).repeated = {max_items: 256, items: {string: {max_len: 128}}}];
    /*
        actions restrict to generic action classes such as call_cmd/write_file.
     */
    repeated string actions = 15 [(validate.rules).repeated = {max_items: 64, items: {string: {max_len: 128}}}];
    /*
        mentions restrict to normalized operation tokens such as vector/vmagent/postgres.
     */
    repeated string mentions = 16 [(validate.rules).repeated = {max_items: 128, items: {string: {max_len: 64}}}];
    /*
        machine_ids restricts to logs emitted by these provider/runtime machines.
        This is the explicit UI-facing machine filter; node_ids remains accepted
        for older links and clients.
     */
    repeated string machine_ids = 17 [(validate.rules).repeated = {max_items: 256, items: {string: {max_len: 128}}}];
    /*
        units restrict to these systemd units or tailed log-file units.
        unit remains accepted for older links and clients.
     */
    repeated string units = 18 [(validate.rules).repeated = {max_items: 256, items: {string: {max_len: 256}}}];
}

/*
    TestRunOverviewSnapshot is the overview page state: persisted run record,
    current staged topology envelope, and live monitor pipeline/timeline view.
 */
message TestRunOverviewSnapshot {
    /*
        run is the persisted run record, including immutable spec and any stored
        infrastructure/deployment artifacts.
     */
    models.TestRunRecord run = 1 [(validate.rules).message.required = true];
    /*
        topology is the staged topology envelope composed from the run spec,
        infrastructure state and deployment plan.
     */
    topology.Topology topology = 2 [(validate.rules).message.required = true];
    /*
        overview is the live status/pipeline/workers/timeline projection.
     */
    monitor.Overview overview = 3 [(validate.rules).message.required = true];

    // 4 was suite_run (models.SuiteRunRecord): suites/suite runs were removed
    // with the old test-orchestration backend.
    reserved 4;
    reserved "suite_run";
}

/*
    GetTestRunOverviewRequest fetches the Overview tab payload for a run.
 */
message GetTestRunOverviewRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        run_id identifies the run whose overview is requested.
     */
    string run_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
}
/*
    GetTestRunOverviewResponse returns the run's staged Overview snapshot.
 */
message GetTestRunOverviewResponse {
    /*
        snapshot is the full overview page state.
     */
    TestRunOverviewSnapshot snapshot = 1 [(validate.rules).message.required = true];
}

/*
    StreamTestRunOverviewRequest opens a live overview stream for a run. Each stream
    tick is a fresh full snapshot so the client just replaces its state; no diff
    merging.
 */
message StreamTestRunOverviewRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        run_id identifies the run to follow.
     */
    string run_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
}

/*
    LogScrollDirection selects which way QueryLogs pages relative to the anchor.
 */
enum LogScrollDirection {
    /*
        LOG_SCROLL_DIRECTION_UNSPECIFIED uses the server default (newer).
     */
    LOG_SCROLL_DIRECTION_UNSPECIFIED = 0;
    /*
        LOG_SCROLL_DIRECTION_OLDER pages back in time.
     */
    LOG_SCROLL_DIRECTION_OLDER = 1;
    /*
        LOG_SCROLL_DIRECTION_NEWER pages forward in time.
     */
    LOG_SCROLL_DIRECTION_NEWER = 2;
}

/*
    QueryLogsRequest fetches a bounded, cursor-paged window of historical log lines.
 */
message QueryLogsRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        run_id identifies the run whose logs are queried.
     */
    string run_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /*
        filter narrows the lines returned.
     */
    LogFilter filter = 3;
    /*
        from is the anchor to page from; empty = newest (when OLDER) / oldest (when
        NEWER).
     */
    monitor.LogCursor from = 4;
    /*
        direction selects which way to page relative to the anchor.
     */
    LogScrollDirection direction = 5;
    /*
        limit caps the lines returned; 0 -> server default. Bounded so the UI never
        drowns.
     */
    uint32 limit = 6 [(validate.rules).uint32.lte = 5000];
}
/*
    QueryLogsResponse returns a page of log lines plus cursors to page either way.
 */
message QueryLogsResponse {
    /*
        lines is the matching page of log lines.
     */
    repeated monitor.LogLine lines = 1;
    /*
        older is the cursor to fetch the page OLDER than these results (empty = at
        the start).
     */
    monitor.LogCursor older = 2;
    /*
        newer is the cursor to fetch the page NEWER than these results (empty = at
        the end / tip).
     */
    monitor.LogCursor newer = 3;
}

/*
    StreamLogsRequest opens a live log tail. StreamLogs returns a live stream of
    LogLine; the server MAY coalesce / rate-limit under very high throughput. The
    client uses QueryLogs for exact scrollback.
 */
message StreamLogsRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        run_id identifies the run to tail.
     */
    string run_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /*
        filter is the live filter (the user can re-subscribe with a new filter to
        filter the tail).
     */
    LogFilter filter = 3;
    /*
        from is an optional start position; empty = from now (tail). Set to backfill
        from a point.
     */
    monitor.LogCursor from = 4;
}

/*
    ResolveLogRef turns a shareable LogRef (deep-link, e.g. built from a pipeline
    node) into a concrete filter + anchor cursor, so opening a link lands every
    user on the exact same place.
 */
message ResolveLogRefRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        ref is the shareable log reference (deep-link) to resolve.
     */
    monitor.LogRef ref = 2 [(validate.rules).message.required = true];
}
/*
    ResolveLogRefResponse returns the run id, filter and anchor cursor the LogRef
    resolves to.
 */
message ResolveLogRefResponse {
    /*
        run_id is the run the ref points at.
     */
    string run_id = 1;
    /*
        filter is the concrete filter the ref resolves to.
     */
    LogFilter filter = 2;
    /*
        cursor is the anchor cursor to land on.
     */
    monitor.LogCursor cursor = 3;
}

/*
    GetRunMetricsRequest fetches the Metrics tab payload for a run. Multi-run
    comparison lives in compare.proto (CompareService.CompareRuns).
 */
message GetRunMetricsRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        run_id identifies the run whose metrics are requested.
     */
    string run_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /*
        window optionally scopes the aggregation to a sub-range of the run — e.g.
        a single workload segment's [started_at, finished_at] taken from the
        Overview pipeline — so averages exclude bootstrap/load time. Unset means
        the whole run window (the run record's start/finish).
     */
    monitor.TimeRange window = 3;
}
/*
    GetRunMetricsResponse returns the run's metrics.
 */
message GetRunMetricsResponse {
    /*
        metrics is the run's aggregated metrics.
     */
    monitor.RunMetrics metrics = 1 [(validate.rules).message.required = true];
}

/*
    GetLogFacetsRequest asks for the distinct values (and their hit counts) of the
    log filter dimensions across the WHOLE run, not just a loaded buffer. The
    optional filter cross-narrows the facets (e.g. counts under the active
    machine/phase selection), matching the behaviour of the QueryLogs filter.
 */
message GetLogFacetsRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        run_id identifies the run whose log facets are requested.
     */
    string run_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /*
        filter cross-narrows the facet values (AND-ed with the run id). Unset =
        facets over the whole run.
     */
    LogFilter filter = 3;
}

/*
    LogFacetValue is one distinct value of a facet field plus how many lines carry
    it (under the request filter).
 */
message LogFacetValue {
    string value = 1;
    uint64 count = 2;
}

/*
    LogFacetField is the distinct-value set for one log filter dimension.
 */
message LogFacetField {
    /*
        field is the wire field name (e.g. component_id, machine_id, unit, phase,
        action, step_id, stage_name, node_execution_id).
     */
    string field = 1;
    /*
        values are the distinct values with hit counts, most frequent first.
     */
    repeated LogFacetValue values = 2;
}

/*
    GetLogFacetsResponse returns the per-field distinct values across the run.
 */
message GetLogFacetsResponse {
    repeated LogFacetField fields = 1;
}

/*
    TestRunOverviewService serves the read-only overview, logs and metrics for a
    single run.
 */
service TestRunOverviewService {
    option (ogen.service) = {
        path_prefix: "/api/v1/test-run-overview"
        tags: "test-run-overview"
    };

    /*
        GetTestRunOverview fetches the Overview snapshot. Read-only.
     */
    rpc GetTestRunOverview (GetTestRunOverviewRequest) returns (GetTestRunOverviewResponse) {
        option (ogen.method) = {
            http_method: HTTP_METHOD_GET
            path: "/get-test-run-overview"
            operation_id: "getTestRunOverview"
            request_body: {
                required: true
            }
            responses: {
                status: 200
                description: "OK"
            }
            responses: {
                description: "Unexpected error."
                schema: {
                    ref: "#/components/schemas/Error"
                }
            }
        };

        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_TEST_RUN, action: ACTION_READ}]};
    }
    /*
        StreamTestRunOverview streams full staged snapshots as the run progresses.
     */
    rpc StreamTestRunOverview (StreamTestRunOverviewRequest) returns (stream TestRunOverviewSnapshot) {
        option (ogen.method) = {
            http_method: HTTP_METHOD_POST
            path: "/stream-test-run-overview"
            operation_id: "streamTestRunOverview"
            request_body: {
                required: true
            }
            responses: {
                status: 200
                description: "OK"
            }
            responses: {
                description: "Unexpected error."
                schema: {
                    ref: "#/components/schemas/Error"
                }
            }
        };

        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_TEST_RUN, action: ACTION_READ}]};
    }
    /*
        QueryLogs fetches a cursor-paged window of historical log lines. Read-only.
     */
    rpc QueryLogs (QueryLogsRequest) returns (QueryLogsResponse) {
        option (ogen.method) = {
            http_method: HTTP_METHOD_GET
            path: "/query-logs"
            operation_id: "queryLogs"
            request_body: {
                required: true
            }
            responses: {
                status: 200
                description: "OK"
            }
            responses: {
                description: "Unexpected error."
                schema: {
                    ref: "#/components/schemas/Error"
                }
            }
        };

        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_TEST_RUN, action: ACTION_READ}]};
    }
    /*
        StreamLogs streams a live log tail (server may coalesce/rate-limit).
     */
    rpc StreamLogs (StreamLogsRequest) returns (stream monitor.LogLine) {
        option (ogen.method) = {
            http_method: HTTP_METHOD_POST
            path: "/stream-logs"
            operation_id: "streamLogs"
            request_body: {
                required: true
            }
            responses: {
                status: 200
                description: "OK"
            }
            responses: {
                description: "Unexpected error."
                schema: {
                    ref: "#/components/schemas/Error"
                }
            }
        };

        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_TEST_RUN, action: ACTION_READ}]};
    }
    /*
        ResolveLogRef resolves a shareable LogRef into a filter + anchor. Read-only.
     */
    rpc ResolveLogRef (ResolveLogRefRequest) returns (ResolveLogRefResponse) {
        option (ogen.method) = {
            http_method: HTTP_METHOD_GET
            path: "/resolve-log-ref"
            operation_id: "resolveLogRef"
            request_body: {
                required: true
            }
            responses: {
                status: 200
                description: "OK"
            }
            responses: {
                description: "Unexpected error."
                schema: {
                    ref: "#/components/schemas/Error"
                }
            }
        };

        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_TEST_RUN, action: ACTION_READ}]};
    }
    /*
        GetRunMetrics fetches the run's metrics. Read-only.
     */
    rpc GetRunMetrics (GetRunMetricsRequest) returns (GetRunMetricsResponse) {
        option (ogen.method) = {
            http_method: HTTP_METHOD_GET
            path: "/get-run-metrics"
            operation_id: "getRunMetrics"
            request_body: {
                required: true
            }
            responses: {
                status: 200
                description: "OK"
            }
            responses: {
                description: "Unexpected error."
                schema: {
                    ref: "#/components/schemas/Error"
                }
            }
        };

        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_TEST_RUN, action: ACTION_READ}]};
    }
    /*
        GetLogFacets returns the distinct values + counts of the log filter
        dimensions across the whole run (so the filter dropdowns don't depend on
        which page of logs is loaded). Read-only.
     */
    rpc GetLogFacets (GetLogFacetsRequest) returns (GetLogFacetsResponse) {
        option (ogen.method) = {
            http_method: HTTP_METHOD_GET
            path: "/get-log-facets"
            operation_id: "getLogFacets"
            request_body: {
                required: true
            }
            responses: {
                status: 200
                description: "OK"
            }
            responses: {
                description: "Unexpected error."
                schema: {
                    ref: "#/components/schemas/Error"
                }
            }
        };

        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_TEST_RUN, action: ACTION_READ}]};
    }
}
