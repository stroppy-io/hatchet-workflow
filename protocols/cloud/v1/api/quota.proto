syntax = "proto3";

package cloud.v1.api;

import "cloud/v1/deployment/provider.proto";
import "cloud/v1/deployment/quota.proto";
import "cloud/v1/iam/options.proto";
import "cloud/v1/iam/permission.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api";

/*
    quota.proto exposes provider quota snapshots and the control-plane
    reservation ledger. Provider snapshots answer "what does YC currently use?",
    reservations answer "what did this control plane reserve for runs?".
 */

/*
    QuotaRefreshPolicy controls whether a read may talk to the provider.
 */
enum QuotaRefreshPolicy {
    /*
        QUOTA_REFRESH_POLICY_UNSPECIFIED behaves as REFRESH_IF_STALE.
     */
    QUOTA_REFRESH_POLICY_UNSPECIFIED = 0;
    /*
        QUOTA_REFRESH_POLICY_CACHE_ONLY returns stored snapshots only.
     */
    QUOTA_REFRESH_POLICY_CACHE_ONLY = 1;
    /*
        QUOTA_REFRESH_POLICY_REFRESH_IF_STALE refreshes stale/missing snapshots.
     */
    QUOTA_REFRESH_POLICY_REFRESH_IF_STALE = 2;
    /*
        QUOTA_REFRESH_POLICY_FORCE_REFRESH always refreshes from the provider.
     */
    QUOTA_REFRESH_POLICY_FORCE_REFRESH = 3;
}

/*
    QuotaView is one quota row as shown to users/operators.
 */
message QuotaView {
    /*
        info identifies the provider quota.
     */
    deployment.Quota.Info info = 1 [(validate.rules).message.required = true];
    /*
        resource_type is the provider scope type, e.g. resource-manager.cloud.
     */
    string resource_type = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /*
        resource_id is the provider scope id, e.g. YC cloud_id.
     */
    string resource_id = 3 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /*
        service is the provider service id, e.g. compute.
     */
    string service = 4 [(validate.rules).string.max_len = 128];
    /*
        provider_used is the usage value reported by the provider snapshot.
     */
    double provider_used = 5;
    /*
        limit is the provider quota limit.
     */
    double limit = 6;
    /*
        provider_available is max(limit - provider_used, 0).
     */
    double provider_available = 7;
    /*
        reserved is our active pre-deploy reservation amount.
     */
    double reserved = 8;
    /*
        available_for_runs is max(provider_available - reserved, 0).
     */
    double available_for_runs = 9;
    /*
        observed_at is when the provider snapshot was fetched.
     */
    google.protobuf.Timestamp observed_at = 10;
    /*
        stale_after is when the snapshot should be refreshed.
     */
    google.protobuf.Timestamp stale_after = 11;
    /*
        stale is true when now >= stale_after or the row is synthetic.
     */
    bool stale = 12;
}

/*
    QuotaReservationView is one run reservation/allocation row.
 */
message QuotaReservationView {
    string id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
    string run_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
    string node_id = 3 [(validate.rules).string = {min_len: 1, max_len: 128}];
    deployment.Quota.Info info = 4 [(validate.rules).message.required = true];
    string resource_type = 5 [(validate.rules).string = {min_len: 1, max_len: 128}];
    string resource_id = 6 [(validate.rules).string = {min_len: 1, max_len: 128}];
    string service = 7 [(validate.rules).string.max_len = 128];
    uint64 amount = 8;
    deployment.Quota.ReservationStatus status = 9 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    google.protobuf.Timestamp created_at = 10;
    google.protobuf.Timestamp updated_at = 11;
    google.protobuf.Timestamp expires_at = 12;
}

message ListQuotasRequest {
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    deployment.Provider provider = 2 [(validate.rules).enum.defined_only = true];
    QuotaRefreshPolicy refresh_policy = 3 [(validate.rules).enum.defined_only = true];
}

message ListQuotasResponse {
    repeated QuotaView quotas = 1;
}

message RefreshQuotasRequest {
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    deployment.Provider provider = 2 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
}

message RefreshQuotasResponse {
    repeated QuotaView quotas = 1;
}

message GetRunQuotaUsageRequest {
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    string run_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
}

message GetRunQuotaUsageResponse {
    repeated QuotaReservationView reservations = 1;
}

service QuotaService {
    rpc ListQuotas (ListQuotasRequest) returns (ListQuotasResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SETTINGS, action: ACTION_READ}]};
    }

    rpc RefreshQuotas (RefreshQuotasRequest) returns (RefreshQuotasResponse) {
        option idempotency_level = IDEMPOTENT;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SETTINGS, action: ACTION_UPDATE}]};
    }

    rpc GetRunQuotaUsage (GetRunQuotaUsageRequest) returns (GetRunQuotaUsageResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_TEST_RUN, action: ACTION_READ}]};
    }
}
