syntax = "proto3";

package cloud.v1.api.ui;

import "cloud/v1/common/tags.proto";
import "cloud/v1/domain/topology.proto";
import "cloud/v1/domain/workload.proto";
import "cloud/v1/models/common.proto";
import "cloud/v1/models/workload_preset.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api/ui";

message ListWorkloadPresetRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    optional models.AccountId owner_account_id = 2;
    optional common.Tags tags = 3;
    optional domain.Workload.Protocol protocol = 4;
    string script = 5;
}

message CreatePresetRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    domain.Workload database = 2 [(validate.rules).message.required = true];
    domain.Topology topology = 3 [(validate.rules).message.required = true];
}

message UpdatePresetRequest {
    models.WorkloadPreset preset = 1 [(validate.rules).message.required = true];
    google.protobuf.FieldMask update_mask = 2 [(validate.rules).message.required = true];
}

service WorkloadPresetService {
    rpc CreatePreset (CreatePresetRequest) returns (models.WorkloadPreset) {option idempotency_level = NO_SIDE_EFFECTS;};
    rpc UpdatePreset (UpdatePresetRequest) returns (models.WorkloadPreset) {option idempotency_level = IDEMPOTENT;};
    rpc DeletePreset (models.WorkloadPresetId) returns (google.protobuf.Empty) {option idempotency_level = IDEMPOTENT;};
    rpc ClonePreset (models.WorkloadPresetId) returns (models.WorkloadPreset) {option idempotency_level = IDEMPOTENT;};
}