syntax = "proto3";

package cloud.v1.api.ui;

import "cloud/v1/domain/test.proto";
import "cloud/v1/models/common.proto";
import "cloud/v1/models/testing.proto";
import "cloud/v1/runtime/logs/logs.proto";
import "cloud/v1/runtime/metrics/metrics.proto";
import "cloud/v1/runtime/primitive/status.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api/ui";

/*
    RunService launches and observes test runs, and serves their metrics, run
    comparison, and share links (F). Metrics and Share are folded in here.

    EVERY request carries tenant_id (the tenant context the caller acts in); the
    server validates the caller is a member of that tenant with a sufficient
    TenantMember.Role (or Account.is_admin) and scopes all entities by it (A).
    The one exception is GetSharedRun, which is PUBLIC (token-addressed, no auth,
    no tenant_id).

    Submitting a TestPreset snapshot (B6) creates a models.Dag (D14); run status
    IS Dag.status. Live logs stream via connect-go server-streaming (F2). Lists
    are typed per-model queries (H42). Cost is not here (= QuotaRequest, D19).
 */
message SubmitTestRunRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    domain.TestPreset test_preset = 2 [(validate.rules).message.required = true];
    optional string name = 3 [(validate.rules).string.max_len = 255];
    optional string description = 4 [(validate.rules).string.max_len = 1024];
}

message GetTestRunRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    models.TestRunId id = 2 [(validate.rules).message.required = true];
}

/* ListTestRunsRequest is a typed per-model query (no generic CommonQuery). */
message ListTestRunsRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    optional runtime.primitive.Status status = 2 [(validate.rules).enum.defined_only = true];
    uint32 page_size = 3 [(validate.rules).uint32.lte = 1000];
    string page_token = 4 [(validate.rules).string.max_len = 256];
}

message CancelTestRunRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    models.TestRunId id = 2 [(validate.rules).message.required = true];
}

message StreamTestRunLogsRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    models.TestRunId id = 2 [(validate.rules).message.required = true];
    /* optional filters to follow only one stage or component live. */
    optional string node_execution_id = 3 [(validate.rules).string.max_len = 128];
    optional string component_id = 4 [(validate.rules).string.max_len = 128];
}

/*
    QueryRunLogsRequest queries a run's logs along both axes (logs feature): a DAG
    stage (node_execution_id) and/or a component (component_id), optionally a source
    and time window. Backend maps run_id -> dag_id and runs LogsQL over VictoriaLogs.
 */
message QueryRunLogsRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    models.TestRunId run_id = 2 [(validate.rules).message.required = true];
    optional string node_execution_id = 3 [(validate.rules).string.max_len = 128];
    optional string component_id = 4 [(validate.rules).string.max_len = 128];
    optional runtime.logs.Source source = 5 [(validate.rules).enum.defined_only = true];
    optional google.protobuf.Timestamp start = 6;
    optional google.protobuf.Timestamp end = 7;
    uint32 page_size = 8 [(validate.rules).uint32.lte = 10000];
    string page_token = 9 [(validate.rules).string.max_len = 256];
}

/* BuildLogLinkRequest builds a deep-link to a component slice or a specific line. */
message BuildLogLinkRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    models.TestRunId run_id = 2 [(validate.rules).message.required = true];
    optional string node_execution_id = 3 [(validate.rules).string.max_len = 128];
    optional string component_id = 4 [(validate.rules).string.max_len = 128];
    /* cursor pins a specific line (deep-link to line); absent = component/stage slice. */
    optional runtime.logs.LogCursor cursor = 5;
}
message BuildLogLinkResponse {
    /* url is a ready deep-link into the log viewer (LogsQL + time + line anchor). */
    string url = 1 [(validate.rules).string = {min_len: 1, max_len: 4096}];
    /* ref is the structured handle the link encodes. */
    runtime.logs.LogRef ref = 2;
}

message GetRunMetricsRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    models.TestRunId run_id = 2 [(validate.rules).message.required = true];
}

/* CompareRunsRequest compares two runs' metrics (E). */
message CompareRunsRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    models.TestRunId run_a = 2 [(validate.rules).message.required = true];
    models.TestRunId run_b = 3 [(validate.rules).message.required = true];
    /* threshold is the percent change above which a metric counts as better/worse. */
    double threshold = 4 [(validate.rules).double = {gte: 0, lte: 100}];
}

/* CreateShareLinkRequest freezes a run into a read-only share (G5). */
message CreateShareLinkRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    models.TestRunId run_id = 2 [(validate.rules).message.required = true];
}
message CreateShareLinkResponse {
    string token = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
    string url = 2 [(validate.rules).string = {min_len: 1, max_len: 512}];
}

/* GetSharedRunRequest is PUBLIC (token only, no tenant_id, no auth). */
message GetSharedRunRequest {
    string token = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
}
message GetSharedRunResponse {
    /* run is the frozen run snapshot. */
    models.TestRun run = 1;
    /* metrics is the frozen metric summary set. */
    runtime.metrics.RunMetrics metrics = 2;
}

service RunService {
    /* --- run lifecycle (tenant-scoped) --- */
    rpc SubmitTestRun (SubmitTestRunRequest) returns (models.TestRun) {option idempotency_level = IDEMPOTENT;}
    rpc GetTestRun (GetTestRunRequest) returns (models.TestRun) {option idempotency_level = NO_SIDE_EFFECTS;}
    rpc ListTestRuns (ListTestRunsRequest) returns (models.TestRun.List) {option idempotency_level = NO_SIDE_EFFECTS;}
    rpc CancelTestRun (CancelTestRunRequest) returns (models.TestRun) {option idempotency_level = IDEMPOTENT;}
    /* --- logs (both axes: stage + component; unified runtime.logs.LogLine) --- */
    /* StreamTestRunLogs is a connect-go server-stream of unified log lines (F2). */
    rpc StreamTestRunLogs (StreamTestRunLogsRequest) returns (stream runtime.logs.LogLine) {option idempotency_level = NO_SIDE_EFFECTS;}
    rpc QueryRunLogs (QueryRunLogsRequest) returns (runtime.logs.LogPage) {option idempotency_level = NO_SIDE_EFFECTS;}
    rpc BuildLogLink (BuildLogLinkRequest) returns (BuildLogLinkResponse) {option idempotency_level = NO_SIDE_EFFECTS;}

    /* --- metrics (folded from MetricsService) --- */
    rpc GetRunMetrics (GetRunMetricsRequest) returns (runtime.metrics.RunMetrics) {option idempotency_level = NO_SIDE_EFFECTS;}
    rpc CompareRuns (CompareRunsRequest) returns (runtime.metrics.Comparison) {option idempotency_level = NO_SIDE_EFFECTS;}

    /* --- share (folded from ShareService) --- */
    rpc CreateShareLink (CreateShareLinkRequest) returns (CreateShareLinkResponse) {option idempotency_level = IDEMPOTENT;}
    /* GetSharedRun is the single PUBLIC (no-auth, no tenant_id) RPC. */
    rpc GetSharedRun (GetSharedRunRequest) returns (GetSharedRunResponse) {option idempotency_level = NO_SIDE_EFFECTS;}
}
