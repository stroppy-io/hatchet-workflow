syntax = "proto3";

package cloud.v1.api.ui;

import "cloud/v1/models/common.proto";
import "cloud/v1/models/tenant.proto";
import "google/protobuf/empty.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api/ui";

/*
    TenantService is the tenant-scoped membership surface. A tenant OWNER manages
    their own tenant's members (A); platform tenant create/update/delete stays in
    admin TenantAdminService (is_admin). ListMyTenants is available to any
    authenticated account (its own memberships).
 */
message AddMemberRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    models.AccountId account_id = 2 [(validate.rules).message.required = true];
    /* role to grant the member. */
    models.TenantMember.Role role = 3 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
}
message RemoveMemberRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    models.AccountId account_id = 2 [(validate.rules).message.required = true];
}

service TenantService {
    rpc ListMyTenants (google.protobuf.Empty) returns (models.Tenant.List) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }
    /* AddMemberToTenant / RemoveMemberFromTenant require OWNER of the tenant. */
    rpc AddMemberToTenant (AddMemberRequest) returns (models.TenantMember) {
        option idempotency_level = IDEMPOTENT;
    }
    rpc RemoveMemberFromTenant (RemoveMemberRequest) returns (models.TenantMember) {
        option idempotency_level = IDEMPOTENT;
    }
}
