syntax = "proto3";

package cloud.v1.api;

import "google/protobuf/duration.proto";
import "validate/validate.proto";
import "cloud/v1/iam/account.proto";
import "cloud/v1/iam/tenant.proto";
import "cloud/v1/iam/role.proto";
import "cloud/v1/iam/membership.proto";
import "cloud/v1/iam/permission.proto";
import "cloud/v1/iam/options.proto";
import "cloud/v1/iam/sso.proto";

import "ogen/ogen.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api";

option (ogen.file) = { generate_openapi: true };

/*
    test.proto is the aggregation point for the tenant-scoped IAM-adjacent API
    surface: it pulls together the iam building blocks (account, tenant, role,
    membership, permission, options, sso) used by the cloud.v1.api package. It
    declares no messages or services itself — it exists so dependents can import a
    single file to bring the related iam definitions into scope.
 */