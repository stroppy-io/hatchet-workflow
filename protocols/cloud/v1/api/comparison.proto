syntax = "proto3";

package cloud.v1.api;

import "v1/api/metrics.proto";
import "v1/testing/test_run.proto";
import "v1/testing/test_suite_run.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/api";


message CompareRunsRequest {
    cloud.v1.testing.TestRunId a = 1 [(validate.rules).message = {required: true}];
    cloud.v1.testing.TestRunId b = 2 [(validate.rules).message = {required: true}];
    /* metric_names — limit comparison to these; empty = all common metrics. */
    repeated string metric_names = 3;
}

message MetricDiff {
    string metric_name = 1;
    double a_value = 2;
    double b_value = 3;
    double abs_delta = 4;
    double pct_delta = 5;        // (b - a) / a * 100
    Verdict verdict = 6;
    enum Verdict {
        VERDICT_UNSPECIFIED = 0;
        VERDICT_IMPROVED    = 1;   // b better than a (engine/metric-specific direction)
        VERDICT_REGRESSED   = 2;
        VERDICT_NEUTRAL     = 3;
    }
}
message CompareRunsResponse {
    repeated MetricDiff diffs = 1;
    cloud.v1.testing.TestRunId a = 2;
    cloud.v1.testing.TestRunId b = 3;
}

message CrossCompareBatchRequest {
    cloud.v1.testing.TestSuiteRunId test_suite_run_id = 1 [(validate.rules).message = {required: true}];
    /* baseline_run_id — reference TestRun (other cells compared to it).
       Empty = pairwise matrix across all cells. */
    optional cloud.v1.testing.TestRunId baseline_run_id = 2;
}
message CrossCompareBatchResponse {
    repeated CellMetrics cells = 1;
    message CellMetrics {
        cloud.v1.testing.TestRunId test_run_id = 1;
        MetricSeriesList metrics = 2;
        repeated MetricDiff diffs_vs_baseline = 3;
    }
}


service ComparisonService {
    rpc CompareRuns       (CompareRunsRequest)       returns (CompareRunsResponse)       { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc CrossCompareBatch (CrossCompareBatchRequest) returns (CrossCompareBatchResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
}
