syntax = "proto3";

package cloud.v1.api;

import "cloud/v1/common/entity.proto";
import "cloud/v1/iam/options.proto";
import "cloud/v1/iam/permission.proto";
import "cloud/v1/models/share.proto";
import "google/protobuf/duration.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api";

/*
    share.proto is the AUTHENTICATED management side of run shares (the public
    resolve lives in public_share.proto). Tenant-scoped, gated by RESOURCE_SHARE.
    Creating a share mints an unguessable token + captures the first snapshot; a
    background job keeps the snapshot fresh while the share is alive.
 */

message CreateShareRequest {
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    // What to share (test run / suite run + id).
    models.ShareRecord.Target target = 2 [(validate.rules).message.required = true];
    /*
        Lifetime. 0 / unset -> server default (1 week). Explicit 0 to mean "never"
        is allowed but the client SHOULD warn the user: it is insecure and keeps
        the background refresh running forever.
     */
    google.protobuf.Duration ttl = 3;
}
message CreateShareResponse {
    models.ShareRecord share = 1 [(validate.rules).message.required = true];
}

message GetShareRequest {
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    string id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
}
message GetShareResponse {
    models.ShareRecord share = 1 [(validate.rules).message.required = true];
}

message ListSharesRequest {
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    common.EntityFilter filter = 2;
    common.EntitySort sort = 3;
    common.Page page = 4;
    // Narrow to shares of one run; empty = any.
    string target_id = 5 [(validate.rules).string.max_len = 64];
}
message ListSharesResponse {
    repeated models.ShareRecord shares = 1;
    string next_page_token = 2;
}

/*
    RevokeShare disables a share (the public endpoint returns gone) without
    deleting the record. Idempotent.
 */
message RevokeShareRequest {
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    string id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
}
message RevokeShareResponse {
    models.ShareRecord share = 1 [(validate.rules).message.required = true];
}

/*
    SetShareExpiry changes the lifetime (extend / shorten). Same ttl semantics as
    create (0/unset = default, explicit 0 = never with a warning).
 */
message SetShareExpiryRequest {
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    string id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
    google.protobuf.Duration ttl = 3;
}
message SetShareExpiryResponse {
    models.ShareRecord share = 1 [(validate.rules).message.required = true];
}

message DeleteShareRequest {
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    string id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
}
message DeleteShareResponse {}

service ShareService {
    /*
        CreateShare is not idempotent: each call mints a new token + snapshot.
     */
    rpc CreateShare (CreateShareRequest) returns (CreateShareResponse) {
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SHARE, action: ACTION_CREATE}]};
    }
    rpc GetShare (GetShareRequest) returns (GetShareResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SHARE, action: ACTION_READ}]};
    }
    rpc ListShares (ListSharesRequest) returns (ListSharesResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SHARE, action: ACTION_LIST}]};
    }
    /*
        RevokeShare is idempotent: revoking an already-revoked share is a no-op.
     */
    rpc RevokeShare (RevokeShareRequest) returns (RevokeShareResponse) {
        option idempotency_level = IDEMPOTENT;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SHARE, action: ACTION_UPDATE}]};
    }
    /*
        SetShareExpiry is idempotent: setting the same lifetime converges.
     */
    rpc SetShareExpiry (SetShareExpiryRequest) returns (SetShareExpiryResponse) {
        option idempotency_level = IDEMPOTENT;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SHARE, action: ACTION_UPDATE}]};
    }
    /*
        DeleteShare is idempotent: deleting an absent share is a no-op.
     */
    rpc DeleteShare (DeleteShareRequest) returns (DeleteShareResponse) {
        option idempotency_level = IDEMPOTENT;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SHARE, action: ACTION_DELETE}]};
    }
}
