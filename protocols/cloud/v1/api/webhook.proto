syntax = "proto3";

package cloud.v1.api;

import "google/protobuf/field_mask.proto";
import "v1/iam/tenant.proto";
import "v1/ops/webhook.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/api";


message CreateWebhookRequest {
    cloud.v1.ops.Webhook webhook = 1 [(validate.rules).message = {required: true}];
}

message UpdateWebhookRequest {
    cloud.v1.ops.Webhook webhook = 1 [(validate.rules).message = {required: true}];
    google.protobuf.FieldMask update_mask = 2 [(validate.rules).message = {required: true}];
}

message TestWebhookRequest {
    cloud.v1.ops.WebhookId id = 1 [(validate.rules).message = {required: true}];
    /* Override event for test ping; default = RUN_STARTED. */
    cloud.v1.ops.WebhookEvent event = 2 [(validate.rules).enum.defined_only = true];
}

message TestWebhookResponse {
    bool delivered = 1;
    uint32 status_code = 2;
    string error = 3;
    uint32 latency_ms = 4;
}


service WebhookService {
    rpc CreateWebhook (CreateWebhookRequest) returns (cloud.v1.ops.Webhook)       { option idempotency_level = IDEMPOTENT; }
    rpc UpdateWebhook (UpdateWebhookRequest) returns (cloud.v1.ops.Webhook)       { option idempotency_level = IDEMPOTENT; }
    rpc DeleteWebhook (cloud.v1.ops.WebhookId)  returns (cloud.v1.ops.Webhook)       { option idempotency_level = IDEMPOTENT; }
    rpc GetWebhook    (cloud.v1.ops.WebhookId)  returns (cloud.v1.ops.Webhook)       { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc ListWebhooks  (cloud.v1.iam.TenantId)   returns (cloud.v1.ops.Webhook.List)  { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc TestWebhook   (TestWebhookRequest)   returns (TestWebhookResponse)     { option idempotency_level = IDEMPOTENT; }
}
