syntax = "proto3";

package cloud.v1.api.agent;

import "cloud/v1/common/tags.proto";
import "cloud/v1/models/agent.proto";
import "cloud/v1/models/common.proto";
import "cloud/v1/runtime/agent/agent.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api/agent";

message RegisterRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    runtime.agent.Target target = 2 [(validate.rules).message.required = true];
    string host = 3 [(validate.rules).string.max_len = 255];
    uint32 port = 4 [(validate.rules).uint32.lte = 65535];
    string version = 5 [(validate.rules).string.max_len = 128];
    string boot_id = 6 [(validate.rules).string.max_len = 128];
}

message HeartbeatRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    runtime.agent.Target target = 2 [(validate.rules).message.required = true];
    runtime.agent.AgentStatus status = 3 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
}

message PollRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    runtime.agent.Target target = 2 [(validate.rules).message.required = true];
    string host = 3 [(validate.rules).string.max_len = 255];
    uint32 port = 4 [(validate.rules).uint32.lte = 65535];
}

message PollResponse {
    optional CommandLease lease = 1;
}

message NodeAddress {
    models.DagId dag_id = 1 [(validate.rules).message.required = true];
    string node_execution_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
}

message CommandLease {
    NodeAddress address = 1 [(validate.rules).message.required = true];
    runtime.agent.Command command = 2 [(validate.rules).message.required = true];
    google.protobuf.Timestamp lease_expires_at = 3;
}

message ReportRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    NodeAddress address = 2 [(validate.rules).message.required = true];
    runtime.agent.Report report = 3 [(validate.rules).message.required = true];
}

message SendLogsRequest {
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    repeated runtime.agent.LogLine lines = 2 [(validate.rules).repeated.max_items = 1024];
}

message ListAgentsRequest {
    /* SortField — typed sortable columns (no arbitrary strings). */
    enum SortField {
        SORT_FIELD_UNSPECIFIED = 0;
        SORT_FIELD_CREATED_AT = 1;
        SORT_FIELD_LAST_SEEN_AT = 2;
        SORT_FIELD_STATUS = 3;
    }
    models.TenantId tenant_id = 1 [(validate.rules).message.required = true];
    /* status filters by agent runtime status. */
    optional runtime.agent.AgentStatus status = 2 [(validate.rules).enum.defined_only = true];
    /* search filters by host / machine_id (free text). */
    optional string search = 3 [(validate.rules).string.max_len = 256];
    SortField sort_field = 4 [(validate.rules).enum.defined_only = true];
    models.SortOrder order = 5 [(validate.rules).enum.defined_only = true];
    models.Page page = 6;
    /* tags filters by labels and/or key=value labels (common.Tags); empty = no tag filter. */
    common.Tags tags = 7;
}

/* ListAgentsResponse — rows plus pagination metadata (H42). */
message ListAgentsResponse {
    repeated models.Agent agents = 1;
    models.PageInfo page_info = 2;
}

/*
    BDD decisions (D16, features/agent/lifecycle.feature) — fully pull lifecycle,
    replaces the old PollClient (blocking Send + agent_commands table + reaper):

    - the command queue IS the set of Dag agent.command nodes; there is no
      separate durable command table. Poll surfaces the next ready command node
      for the agent's machine and returns a CommandLease (NodeAddress + Command +
      lease_expires_at).
    - the server never blocks waiting for an agent; a leased node stays
      STATUS_RUNNING and only advances when a Report arrives.
    - a long-running command (e.g. run_stroppy) keeps its lease alive by sending
      periodic Report{RUNNING}; each one pushes lease_expires_at forward (Report
      RUNNING = progress + keepalive).
    - recovery: an expired lease returns its node to the pool (replaces the
      orphan-reaper). On Register with a new boot_id, the agent's in-flight
      leases are invalidated immediately so reboots recover fast.
    - addressing is strictly NodeAddress (dag_id + node_execution_id); no
      structural paths or machine-id parsing.
    - Poll offers ONLY agent-locus task nodes (see ExecutionLocus in dag.proto,
      D18). Server-locus nodes (terraform/docker/render/collect) run on the
      control-plane and are never leased to agents.
    - bootstrap auth: a fresh VM carries a per-machine JWT in cloud-init
      (Yandex.Vm.user_data); the agent authenticates its first Register with it.
 */
service AgentService {
    /* Agent-facing registration and liveness. */
    rpc Register (RegisterRequest) returns (models.Agent) {option idempotency_level = IDEMPOTENT;};
    rpc Heartbeat (HeartbeatRequest) returns (models.Agent) {option idempotency_level = IDEMPOTENT;};
    /* Agent-facing long poll for the next queued command. */
    rpc Poll (PollRequest) returns (PollResponse) {option idempotency_level = NO_SIDE_EFFECTS;};
    /* Agent-facing command result and logs. */
    rpc Report (ReportRequest) returns (google.protobuf.Empty) {option idempotency_level = IDEMPOTENT;};
    rpc SendLogs (SendLogsRequest) returns (google.protobuf.Empty) {option idempotency_level = IDEMPOTENT;};

    /* Control-plane agent observability API. Commands are persisted as DAG nodes. */
    rpc ListAgents (ListAgentsRequest) returns (ListAgentsResponse) {option idempotency_level = NO_SIDE_EFFECTS;};
    rpc GetAgent (models.AgentId) returns (models.Agent) {option idempotency_level = NO_SIDE_EFFECTS;};
}
