syntax = "proto3";

package cloud.v1.api.admin;

import "cloud/v1/models/account.proto";
import "cloud/v1/models/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api/admin";


message CreateAccountRequest {
    models.Account account = 1 [(validate.rules).message = {required: true}];
    string password = 2 [(validate.rules).string = {min_len: 8, max_len: 128}];
}

message UpdateAccountRequest {
    models.Account account = 1 [(validate.rules).message = {required: true}];
    google.protobuf.FieldMask update_mask = 2 [(validate.rules).message = {required: true}];
}

message UpdatePasswordRequest {
    string new_password = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
}

service AccountAdminService {
    rpc CreateAccount (CreateAccountRequest) returns (models.Account) {option idempotency_level = IDEMPOTENT;}
    rpc UpdateAccount (UpdateAccountRequest) returns (google.protobuf.Empty) {option idempotency_level = IDEMPOTENT;}
    rpc DeleteAccount (models.AccountId) returns (google.protobuf.Empty) {option idempotency_level = IDEMPOTENT;}
    rpc UpdatePassword (UpdatePasswordRequest) returns (google.protobuf.Empty) {option idempotency_level = IDEMPOTENT;}
}