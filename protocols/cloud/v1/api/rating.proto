syntax = "proto3";

package cloud.v1.api;

import "cloud/v1/deployment/provider.proto";
import "cloud/v1/domain/database.proto";
import "cloud/v1/iam/options.proto";
import "cloud/v1/iam/permission.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api";

/*
    rating.proto is the benchmark leaderboard, AUTHENTICATED scopes (the public
    scope lives in public_rating.proto). A "benchmark" is a test run; only runs
    flagged in_global_rating (system scope) / in_tenant_rating (tenant scope) take
    part. Two scopes here:
      - GetSystemRating: cross-system, any authenticated account (no specific
        permission) — the private system-wide board.
      - GetTenantRating: this tenant only, gated by RESOURCE_TEST_RUN/LIST.

    NOT stored: ratings are computed (and likely precomputed by a background job,
    same idea as the share-snapshot refresh) — there is no rating DB record.
 */

/*
    RatingFilter selects and ranks the benchmark runs. Ranking is by one metric
    (metric_key); direction is the metric's own higher_is_better.
 */
message RatingFilter {
    /*
        metric_key is the metric to rank by (a MetricSummary.key). Required.
     */
    string metric_key = 1 [(validate.rules).string = {min_len: 1, max_len: 256}];
    /*
        db_kinds narrows to specific database engines (AND; empty = not applied).
     */
    repeated domain.Database.Kind db_kinds = 2;
    /*
        stroppy_versions narrows to specific engine versions (AND; empty = not
        applied).
     */
    repeated string stroppy_versions = 3 [(validate.rules).repeated = {max_items: 100, items: {string: {max_len: 64}}}];
    /*
        providers narrows to specific deployment providers (AND; empty = not
        applied).
     */
    repeated deployment.Provider providers = 4;
    /*
        started_after keeps only runs that started at/after this time.
     */
    google.protobuf.Timestamp started_after = 5;
    /*
        started_before keeps only runs that started at/before this time.
     */
    google.protobuf.Timestamp started_before = 6;
}

/*
    RatingEntry is one ranked benchmark for the authenticated boards. Includes
    identifying info (run_id, author, tenant) the public board omits.
 */
message RatingEntry {
    /*
        rank is the 1-based position on the leaderboard.
     */
    uint32 rank = 1;
    /*
        metric_value is the ranked metric's value for this entry.
     */
    double metric_value = 2;
    /*
        metric_unit is the unit the metric_value is expressed in.
     */
    string metric_unit = 3 [(validate.rules).string.max_len = 32];
    /*
        db_kind is the database engine the benchmark ran against.
     */
    domain.Database.Kind db_kind = 4;
    /*
        workload_name is the workload the benchmark executed.
     */
    string workload_name = 5 [(validate.rules).string.max_len = 255];
    /*
        stroppy_version is the stroppy engine version used.
     */
    string stroppy_version = 6 [(validate.rules).string.max_len = 64];
    /*
        provider is the deployment/cloud provider the benchmark ran on.
     */
    deployment.Provider provider = 7;
    /*
        topology_label is a human-readable summary of the cluster topology.
     */
    string topology_label = 8 [(validate.rules).string.max_len = 128];
    /*
        node_count is the number of nodes in the topology.
     */
    uint32 node_count = 9;
    /*
        run_at is when the benchmark run started.
     */
    google.protobuf.Timestamp run_at = 10;
    /*
        run_id identifies the underlying test run (authenticated scopes only).
     */
    string run_id = 11 [(validate.rules).string.max_len = 64];
    /*
        author_name is who created the run (authenticated scopes only).
     */
    string author_name = 12 [(validate.rules).string.max_len = 255];
    /*
        tenant_name is the owning tenant; set only on the system-wide board.
     */
    string tenant_name = 13 [(validate.rules).string.max_len = 255];
}

/*
    GetSystemRatingRequest selects and pages the cross-system private board.
 */
message GetSystemRatingRequest {
    /*
        filter selects and ranks the benchmark runs.
     */
    RatingFilter filter = 1 [(validate.rules).message.required = true];
    /*
        limit caps returned entries (<= 500); 0 -> server default.
     */
    uint32 limit = 2 [(validate.rules).uint32.lte = 500];
    /*
        page_token is the opaque cursor from a previous response.
     */
    string page_token = 3;
}
/*
    GetSystemRatingResponse returns one page of the system-wide board.
 */
message GetSystemRatingResponse {
    /*
        entries are the ranked benchmarks for this page.
     */
    repeated RatingEntry entries = 1;
    /*
        next_page_token is empty when there are no more rows.
     */
    string next_page_token = 2;
}

/*
    GetTenantRatingRequest selects and pages one tenant's board.
 */
message GetTenantRatingRequest {
    /*
        tenant_id scopes the board to one tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        filter selects and ranks the benchmark runs.
     */
    RatingFilter filter = 2 [(validate.rules).message.required = true];
    /*
        limit caps returned entries (<= 500); 0 -> server default.
     */
    uint32 limit = 3 [(validate.rules).uint32.lte = 500];
    /*
        page_token is the opaque cursor from a previous response.
     */
    string page_token = 4;
}
/*
    GetTenantRatingResponse returns one page of the tenant's board.
 */
message GetTenantRatingResponse {
    /*
        entries are the ranked benchmarks for this page.
     */
    repeated RatingEntry entries = 1;
    /*
        next_page_token is empty when there are no more rows.
     */
    string next_page_token = 2;
}

/*
    RatingService serves the authenticated benchmark leaderboards (system + tenant
    scopes).
 */
service RatingService {
    /*
        GetSystemRating: cross-system private board over in_global_rating runs. Any
        authenticated account (no specific permission).
     */
    rpc GetSystemRating (GetSystemRatingRequest) returns (GetSystemRatingResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {};
    }
    /*
        GetTenantRating: this tenant's board over in_tenant_rating runs.
     */
    rpc GetTenantRating (GetTenantRatingRequest) returns (GetTenantRatingResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_TEST_RUN, action: ACTION_LIST}]};
    }
}
