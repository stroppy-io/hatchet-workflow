syntax = "proto3";

package cloud.v1.api;

import "google/protobuf/timestamp.proto";
import "v1/agent/agent.proto";
import "v1/common/config_file.proto";
import "v1/iam/tenant.proto";
import "v1/system/dag.proto";
import "v1/testing/test_run.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/api";


message ListDagRunsRequest {
    cloud.v1.iam.TenantId tenant_id = 1 [(validate.rules).message = {required: true}];
    optional cloud.v1.system.DagRunStatus status_filter = 2;
    uint32 limit = 3 [(validate.rules).uint32.lte = 1000];
    string cursor = 4;
}

message ListDagRunsResponse {
    cloud.v1.system.DagRun.List dag_runs = 1;
    string next_cursor = 2;
}

message ListNodeRunsRequest {
    cloud.v1.system.DagRunId dag_run_id = 1 [(validate.rules).message = {required: true}];
}

/* ListTenantNodeRunsRequest — tenant-wide cross-DagRun node view. Replaces
   the legacy queue introspection: queue = node_runs filtered by status. */
message ListTenantNodeRunsRequest {
    cloud.v1.iam.TenantId tenant_id = 1 [(validate.rules).message = {required: true}];
    /* Default = PENDING_DEPS + READY + RUNNING (live queue). */
    repeated cloud.v1.system.NodeRunStatus statuses = 2;
    uint32 limit = 3 [(validate.rules).uint32.lte = 1000];
    string cursor = 4;
}
message ListTenantNodeRunsResponse {
    cloud.v1.system.NodeRun.List node_runs = 1;
    string next_cursor = 2;
}

/* ValidateRequest — pre-flight check of a TestRun's intent.
   Returns diagnostics without spawning a Dag. */
message ValidateRequest {
    cloud.v1.testing.TestRunId test_run_id = 1 [(validate.rules).message = {required: true}];
}
message ValidateResponse {
    bool ok = 1;
    repeated Diagnostic diagnostics = 2;
    message Diagnostic {
        Severity severity = 1;
        string code = 2;
        string message = 3;
        string path = 4;     // field path, e.g. "database.postgres.shape.replicas"
        enum Severity {
            SEVERITY_UNSPECIFIED = 0;
            SEVERITY_INFO = 1;
            SEVERITY_WARN = 2;
            SEVERITY_ERROR = 3;
        }
    }
}

/* DryRunRequest — preview the DAG that would be built for a TestRun, with
   all variables resolved, without creating it. */
message DryRunRequest {
    cloud.v1.testing.TestRunId test_run_id = 1 [(validate.rules).message = {required: true}];
}
message DryRunResponse {
    cloud.v1.system.Dag.Graph graph = 1;
    repeated cloud.v1.common.ConfigFile rendered_configs = 2;
    map<string, string> resolved_vars = 3;   // tf vars + workload vars after rendering
}

/* GetLogsRequest — bounded fetch of node-run logs. For live streaming use LogsService. */
message GetLogsRequest {
    cloud.v1.system.DagRunId dag_run_id = 1 [(validate.rules).message = {required: true}];
    optional string node_id = 2;             // filter by single node
    optional google.protobuf.Timestamp since = 3;
    uint32 limit = 4 [(validate.rules).uint32 = {gte: 1, lte: 10000}];
    string cursor = 5;
}
message GetLogsResponse {
    repeated cloud.v1.agent.LogLine lines = 1;
    string next_cursor = 2;
}

/* GetRenderedConfigsRequest — fetch final rendered terraform/configs for a
   DagRun (after vars resolution). For UI debug pane. */
message GetRenderedConfigsRequest {
    cloud.v1.system.DagRunId dag_run_id = 1 [(validate.rules).message = {required: true}];
    /* node_id_filter — restrict to a single node's outputs; empty = all nodes. */
    string node_id_filter = 2 [(validate.rules).string.max_len = 64];
}
message GetRenderedConfigsResponse {
    repeated cloud.v1.common.ConfigFile files = 1;
}

message ListAgentsForRunRequest {
    cloud.v1.system.DagRunId dag_run_id = 1 [(validate.rules).message = {required: true}];
}


/* DagService — view + operate on dags and runs. Engine writes execution state. */
service DagService {
    rpc GetDag       (cloud.v1.system.DagId)     returns (cloud.v1.system.Dag)         { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc ListDags     (cloud.v1.iam.TenantId)     returns (cloud.v1.system.Dag.List)    { option idempotency_level = NO_SIDE_EFFECTS; }

    rpc GetDagRun    (cloud.v1.system.DagRunId)  returns (cloud.v1.system.DagRun)      { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc ListDagRuns  (ListDagRunsRequest)     returns (ListDagRunsResponse)      { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc CancelDagRun (cloud.v1.system.DagRunId)  returns (cloud.v1.system.DagRun)      { option idempotency_level = IDEMPOTENT; }
    rpc RetryDagRun  (cloud.v1.system.DagRunId)  returns (cloud.v1.system.DagRun)      { option idempotency_level = IDEMPOTENT; }

    rpc GetNodeRun   (cloud.v1.system.NodeRunId) returns (cloud.v1.system.NodeRun)     { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc ListNodeRuns (ListNodeRunsRequest)    returns (cloud.v1.system.NodeRun.List){ option idempotency_level = NO_SIDE_EFFECTS; }
    /* ListTenantNodeRuns — replaces standalone QueueService. queue = node_runs
       filtered by status across all DagRuns in a tenant. */
    rpc ListTenantNodeRuns (ListTenantNodeRunsRequest) returns (ListTenantNodeRunsResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc RetryNode    (cloud.v1.system.NodeRunId) returns (cloud.v1.system.NodeRun)     { option idempotency_level = IDEMPOTENT; }

    /* Validate — pre-flight check of a TestRun. No state mutation. */
    rpc Validate     (ValidateRequest)        returns (ValidateResponse)         { option idempotency_level = NO_SIDE_EFFECTS; }
    /* DryRun — build + resolve DAG without persisting/launching. */
    rpc DryRun       (DryRunRequest)          returns (DryRunResponse)           { option idempotency_level = NO_SIDE_EFFECTS; }
    /* GetLogs — bounded log fetch (for non-streaming clients). */
    rpc GetLogs      (GetLogsRequest)         returns (GetLogsResponse)          { option idempotency_level = NO_SIDE_EFFECTS; }
    /* GetRenderedConfigs — final rendered tf/configs for ops debug. */
    rpc GetRenderedConfigs (GetRenderedConfigsRequest) returns (GetRenderedConfigsResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
    /* ListAgentsForRun — agents bound to this DagRun. */
    rpc ListAgentsForRun (ListAgentsForRunRequest) returns (cloud.v1.agent.Agent.List) { option idempotency_level = NO_SIDE_EFFECTS; }
}
