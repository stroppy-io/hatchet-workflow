syntax = "proto3";

package cloud.v1.api;

import "cloud/v1/common/entity.proto";
import "cloud/v1/deployment/infrastructure.proto";
import "cloud/v1/deployment/provider.proto";
import "cloud/v1/deployment/render.proto";
import "cloud/v1/domain/database.proto";
import "cloud/v1/domain/test.proto";
import "cloud/v1/domain/workload.proto";
import "cloud/v1/iam/options.proto";
import "cloud/v1/iam/permission.proto";
import "cloud/v1/models/preset.proto";
import "cloud/v1/models/test_run.proto";
import "cloud/v1/models/test_wizard.proto";
import "cloud/v1/topology/topology.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api";

/*
    test_wizard.proto is the TEST wizard API (suite wizard is separate). Big-schema
    patch-loop: provider/database/workload/render edits are submitted, the server
    derives topology_spec, infrastructure_plan and render_preview, then merges
    user machine overrides from infrastructure_plan and editable config overrides
    from render_overrides. Provider account settings come from tenant settings at
    finish/start time.

    Every request is tenant-scoped (tenant_id, the default auth tenant_field) and
    gated by RESOURCE_WIZARD.
 */

/*
    StartTestWizardRequest opens a new test wizard draft.
 */
message StartTestWizardRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        name is the optional human label for the draft.
     */
    string name = 2 [(validate.rules).string = {max_len: 255}];
    /*
        test_preset_id optionally seeds the whole draft from an existing test preset.
     */
    string test_preset_id = 3 [(validate.rules).string = {max_len: 64}];
}
/*
    StartTestWizardResponse returns the freshly created draft.
 */
message StartTestWizardResponse {
    /*
        draft is the new wizard draft (carrying the initial form schema).
     */
    models.TestWizardDraftRecord draft = 1 [(validate.rules).message.required = true];
}

/*
    GetTestWizardDraftRequest fetches a single wizard draft by id.
 */
message GetTestWizardDraftRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        draft_id is the wizard draft identifier to fetch.
     */
    string draft_id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
}
/*
    GetTestWizardDraftResponse returns the requested wizard draft.
 */
message GetTestWizardDraftResponse {
    /*
        draft is the requested wizard draft.
     */
    models.TestWizardDraftRecord draft = 1 [(validate.rules).message.required = true];
}

/*
    ListTestWizardDrafts lets the UI offer "continue where you left off": filter by
    author (the caller) and sort by updated_at desc to pick the most recent draft.
 */
message ListTestWizardDraftsRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        filter holds the shared Entity-level filters (author, time windows, ...).
     */
    common.EntityFilter filter = 2;
    /*
        sort selects the result ordering.
     */
    common.EntitySort sort = 3;
    /*
        page carries pagination (page size + token).
     */
    common.Page page = 4;
}
/*
    ListTestWizardDraftsResponse returns a page of wizard drafts.
 */
message ListTestWizardDraftsResponse {
    /*
        drafts is the matching page of wizard drafts.
     */
    repeated models.TestWizardDraftRecord drafts = 1;
    /*
        next_page_token fetches the following page; empty when at the end.
     */
    string next_page_token = 2;
}

/*
    PatchTestWizard submits edited typed draft fields. The server validates,
    re-derives topology_spec, infrastructure_plan and render_preview, preserves
    compatible machine overrides from infrastructure_plan, applies compatible
    render_overrides, recomputes readiness and returns the full new draft. Send
    the fields you changed; unset typed messages are treated as "no change".
 */
message PatchTestWizardRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        draft_id is the wizard draft being edited.
     */
    string draft_id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        provider selects/updates the deployment backend.
     */
    deployment.Provider provider = 3 [(validate.rules).enum = {defined_only: true}];
    /*
        database is the typed, provider-agnostic database under test.
     */
    domain.Database database = 4;
    /*
        workload is the typed stroppy workload.
     */
    domain.Workload workload = 5;
    /*
        topology_spec optionally carries the server-derived graph back to the
        server. Structural edits are ignored; it exists for optimistic clients
        that patch all draft sections at once.
     */
    topology.TopologySpec topology_spec = 6;
    /*
        infrastructure_plan optionally carries user edits to provider-specific
        machine params. The server re-derives the plan and merges compatible
        MachinePlan overrides by node_id.
     */
    deployment.InfrastructurePlan infrastructure_plan = 8;
    /*
        render_overrides carries user edits to editable render artifacts. The
        server applies compatible overrides and drops or reports stale ones.
     */
    deployment.RenderOverrideSet render_overrides = 9;
}
/*
    PatchTestWizardResponse returns the recomputed wizard draft.
 */
message PatchTestWizardResponse {
    /*
        draft is the full new draft after validation/topology/readiness recompute.
     */
    models.TestWizardDraftRecord draft = 1 [(validate.rules).message.required = true];
}

/*
    DeleteTestWizardDraftRequest deletes a wizard draft by id.
 */
message DeleteTestWizardDraftRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        draft_id is the wizard draft identifier to delete.
     */
    string draft_id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
}
/*
    DeleteTestWizardDraftResponse is empty; deletion success is signalled by a
    non-error reply.
 */
message DeleteTestWizardDraftResponse {}

/*
    FinishTestWizard bakes the draft into a ready domain.TestRun containing
    database/workload/topology_spec/infrastructure_plan. Rejected unless
    draft.ready. Optionally, in the same call: start it (persist a TestRunRecord
    + launch workflow) and/or save it as a TestPresetRecord.
 */
message FinishTestWizardRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        draft_id is the wizard draft to bake.
     */
    string draft_id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        start, when true, launches the baked run immediately.
     */
    bool start = 3;
    /*
        save_as_preset, when true, also saves the baked db+workload as a reusable
        test preset.
     */
    bool save_as_preset = 4;
    /*
        preset_name names the saved preset (used only when save_as_preset; empty ->
        derived).
     */
    string preset_name = 5 [(validate.rules).string = {max_len: 255}];
    /*
        in_tenant_rating sets tenant-rating membership for the started run; unset ->
        defaults (tenant true).
     */
    optional bool in_tenant_rating = 6;
    /*
        in_global_rating sets global-rating membership for the started run; unset ->
        defaults (global false).
     */
    optional bool in_global_rating = 7;
}
/*
    FinishTestWizardResponse returns the baked run and, optionally, the launched run
    and saved preset.
 */
message FinishTestWizardResponse {
    /*
        test_run is the baked run spec (always present).
     */
    domain.TestRun test_run = 1 [(validate.rules).message.required = true];
    /*
        run is set when start = true: the persisted, launched run.
     */
    models.TestRunRecord run = 2;
    /*
        preset is set when save_as_preset = true: the saved preset.
     */
    models.TestPresetRecord preset = 3;
}

/*
    TestWizardService drives the test wizard: start, fetch/list, patch-loop and
    finish into a baked TestRun (optionally started and/or saved as a preset).
 */
service TestWizardService {
    /*
        StartTestWizard opens a new draft. Not idempotent.
     */
    rpc StartTestWizard (StartTestWizardRequest) returns (StartTestWizardResponse) {
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_WIZARD, action: ACTION_CREATE}]};
    }
    /*
        GetTestWizardDraft fetches a single draft by id. Read-only.
     */
    rpc GetTestWizardDraft (GetTestWizardDraftRequest) returns (GetTestWizardDraftResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_WIZARD, action: ACTION_READ}]};
    }
    /*
        ListTestWizardDrafts lists drafts with filtering and pagination. Read-only.
     */
    rpc ListTestWizardDrafts (ListTestWizardDraftsRequest) returns (ListTestWizardDraftsResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_WIZARD, action: ACTION_LIST}]};
    }
    /*
        PatchTestWizard is idempotent: re-submitting the same form converges.
     */
    rpc PatchTestWizard (PatchTestWizardRequest) returns (PatchTestWizardResponse) {
        option idempotency_level = IDEMPOTENT;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_WIZARD, action: ACTION_UPDATE}]};
    }
    /*
        DeleteTestWizardDraft is idempotent: deleting an absent draft is a no-op.
     */
    rpc DeleteTestWizardDraft (DeleteTestWizardDraftRequest) returns (DeleteTestWizardDraftResponse) {
        option idempotency_level = IDEMPOTENT;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_WIZARD, action: ACTION_DELETE}]};
    }
    /*
        FinishTestWizard mints a TestRun from the draft. Not idempotent.
     */
    rpc FinishTestWizard (FinishTestWizardRequest) returns (FinishTestWizardResponse) {
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_WIZARD, action: ACTION_UPDATE}]};
    }
}
