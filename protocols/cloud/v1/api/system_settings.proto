syntax = "proto3";

package cloud.v1.api;

import "cloud/v1/api/admin.proto";
import "cloud/v1/iam/options.proto";
import "validate/validate.proto";

import "ogen/ogen.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api";

option (ogen.file) = { generate_openapi: true };

/*
    system_settings.proto manages the GLOBAL control-plane settings (api.PlatformSettings,
    the singleton). Platform-reserved: admin_only on both read and write — there is
    one control plane and one row, changed only by the root admin. Tenant-level
    settings are a SEPARATE api (tenant_settings.proto).
 */

/*
    GetSystemSettingsRequest takes no arguments: it reads the singleton settings.
 */
message GetSystemSettingsRequest {}
/*
    GetSystemSettingsResponse returns the current control-plane settings.
 */
message GetSystemSettingsResponse {
    /*
        settings is the singleton platform configuration.
     */
    PlatformSettings settings = 1 [(validate.rules).message.required = true];
}

/*
    UpdateSystemSettings replaces the singleton wholesale. Idempotent.
 */
message UpdateSystemSettingsRequest {
    /*
        settings is the full replacement platform configuration.
     */
    PlatformSettings settings = 1 [(validate.rules).message.required = true];
}
/*
    UpdateSystemSettingsResponse returns the settings after the update.
 */
message UpdateSystemSettingsResponse {
    /*
        settings is the updated singleton platform configuration.
     */
    PlatformSettings settings = 1 [(validate.rules).message.required = true];
}

/*
    GetPublicConfigRequest takes no arguments: it reads the public-safe subset of
    the singleton settings, with NO authentication. It exists so the sign-in /
    sign-up screens (which run before any token exists) can learn whether open
    self-registration and member tenant creation are enabled, and hide the
    affordances up front instead of only failing on submit.
 */
message GetPublicConfigRequest {}
/*
    GetPublicConfigResponse returns only the non-sensitive flags safe to expose
    to an unauthenticated caller — never server_addr or any internal config.
 */
message GetPublicConfigResponse {
    /*
        allow_self_registration mirrors PlatformSettings.allow_self_registration:
        when false the public Register endpoint is closed.
     */
    bool allow_self_registration = 1;
    /*
        allow_member_tenant_creation mirrors
        PlatformSettings.allow_member_tenant_creation.
     */
    bool allow_member_tenant_creation = 2;
}

/*
    SystemSettingsService manages the global, singleton control-plane settings.
    Admin-only on both read and write, EXCEPT GetPublicConfig which is public.
 */
service SystemSettingsService {
    option (ogen.service) = {
        path_prefix: "/api/v1"
        tags: "system-settings"
    };

    /*
        GetPublicConfig reads the public-safe flags with no auth, for the
        pre-login UI. Read-only.
     */
    rpc GetPublicConfig (GetPublicConfigRequest) returns (GetPublicConfigResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
        option (ogen.method) = {
            http_method: HTTP_METHOD_GET
            path: "/public-config"
            operation_id: "getPublicConfig"
            responses: {
                status: 200
                description: "OK"
            }
            responses: {
                description: "Unexpected error."
                schema: {
                    ref: "#/components/schemas/Error"
                }
            }
        };
        option (cloud.v1.iam.auth) = {public: true};
    }
    /*
        GetSystemSettings reads the singleton platform settings. Admin-only,
        read-only.
     */
    rpc GetSystemSettings (GetSystemSettingsRequest) returns (GetSystemSettingsResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
        option (ogen.method) = {
            http_method: HTTP_METHOD_GET
            path: "/system/settings"
            operation_id: "getSystemSettings"
            responses: {
                status: 200
                description: "OK"
            }
            responses: {
                description: "Unexpected error."
                schema: {
                    ref: "#/components/schemas/Error"
                }
            }
        };
        option (cloud.v1.iam.auth) = {admin_only: true};
    }
    /*
        UpdateSystemSettings replaces the singleton wholesale. Admin-only.
        Idempotent.
     */
    rpc UpdateSystemSettings (UpdateSystemSettingsRequest) returns (UpdateSystemSettingsResponse) {
        option idempotency_level = IDEMPOTENT;
        option (ogen.method) = {
            http_method: HTTP_METHOD_PUT
            path: "/system/settings"
            operation_id: "updateSystemSettings"
            request_body: {
                required: true
            }
            responses: {
                status: 200
                description: "OK"
            }
            responses: {
                description: "Unexpected error."
                schema: {
                    ref: "#/components/schemas/Error"
                }
            }
        };
        option (cloud.v1.iam.auth) = {admin_only: true};
    }
}
