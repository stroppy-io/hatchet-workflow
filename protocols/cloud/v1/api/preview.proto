syntax = "proto3";

package cloud.v1.api;

import "v1/api/dag.proto";
import "v1/iam/tenant.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/api";


message StroppyConfigPreviewRequest {
    cloud.v1.iam.TenantId tenant_id = 1 [(validate.rules).message = {required: true}];
    /* yaml — raw stroppy.yaml content. Server parses → renders preview DAG. */
    string yaml = 2 [(validate.rules).string = {min_len: 1, max_len: 1048576}];
}
message StroppyConfigPreviewResponse {
    DryRunResponse dry_run = 1;
    ValidateResponse validation = 2;
}

message ProbeRequest {
    cloud.v1.iam.TenantId tenant_id = 1 [(validate.rules).message = {required: true}];
    /* target_host — address of running stroppy instance to probe (host:port).
       Empty = probe locally. */
    string target_host = 2 [(validate.rules).string.max_len = 512];
    repeated ProbeCheck checks = 3 [(validate.rules).repeated.max_items = 32];
}
enum ProbeCheck {
    PROBE_CHECK_UNSPECIFIED       = 0;
    PROBE_CHECK_HTTP_READY        = 1;
    PROBE_CHECK_WEBSOCKET_READY   = 2;
    PROBE_CHECK_CONFIG_VALID      = 3;
    PROBE_CHECK_DB_REACHABLE      = 4;
}
message ProbeResponse {
    repeated ProbeResult results = 1;
    message ProbeResult {
        ProbeCheck check = 1;
        bool ok = 2;
        string detail = 3;
        uint32 latency_ms = 4;
    }
}


service PreviewService {
    /* StroppyConfigPreview — parse stroppy.yaml → DAG preview + validation. */
    rpc StroppyConfigPreview (StroppyConfigPreviewRequest) returns (StroppyConfigPreviewResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
    /* Probe — health-probe an existing stroppy instance. */
    rpc Probe                (ProbeRequest)                returns (ProbeResponse)                 { option idempotency_level = NO_SIDE_EFFECTS; }
}
