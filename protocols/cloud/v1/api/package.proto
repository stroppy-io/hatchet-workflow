syntax = "proto3";

package cloud.v1.api;

import "cloud/v1/common/entity.proto";
import "cloud/v1/domain/database.proto";
import "cloud/v1/iam/options.proto";
import "cloud/v1/iam/permission.proto";
import "cloud/v1/models/package.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

import "ogen/ogen.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api";

option (ogen.file) = { generate_openapi: true };

/*
    package.proto is the tenant package registry (custom DB builds: .deb / binary).
    Upload is PRESIGNED so the blob goes straight to object storage, not through our
    backend:
      1. CreatePackageUpload(meta) -> a PackageRecord (STATUS_UPLOADING) + a presigned
         PUT url.
      2. client PUTs the file to that url.
      3. CompleteUpload(id) -> server verifies size + sha256, flips to STATUS_READY.
    A package is referenced from a database's params schema (a package_id field), not
    by a dedicated proto field; install resolves it (typically replacing the stock
    install) and the agent fetches the blob via a file reference.

    Tenant-scoped, gated by RESOURCE_PACKAGE. SECURITY: a package executes on the
    host (e.g. dpkg postinst) — it only runs on the tenant's own provisioned
    machines; verify sha256/size, enforce a size limit, keep it tenant-private.
 */

/*
    CreatePackageUploadRequest declares the package metadata and mints a presigned
    upload; the blob is PUT directly to object storage afterward.
 */
message CreatePackageUploadRequest {
    /*
        tenant_id scopes the package; packages are tenant-private.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        name is the package's display name.
     */
    string name = 2 [(validate.rules).string = {min_len: 1, max_len: 255}];
    /*
        format is the package format (.deb / binary); must be defined, non-zero.
     */
    models.PackageRecord.Format format = 3 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    /*
        version is the package version string.
     */
    string version = 4 [(validate.rules).string.max_len = 128];
    /*
        target_db_kind is the database engine this package builds/installs.
     */
    domain.Database.Kind target_db_kind = 5;
    /*
        os is the target operating system the package is built for.
     */
    string os = 6 [(validate.rules).string.max_len = 128];
    /*
        arch is the target CPU architecture the package is built for.
     */
    string arch = 7 [(validate.rules).string.max_len = 32];
    /*
        size_bytes is the declared blob size; verified on CompleteUpload against
        the uploaded object.
     */
    uint64 size_bytes = 8 [(validate.rules).uint64.gt = 0];
    /*
        sha256 is the declared blob hash; verified on CompleteUpload against the
        uploaded object.
     */
    string sha256 = 9 [(validate.rules).string = {len: 64, pattern: "^[0-9a-fA-F]{64}$"}];
}
/*
    CreatePackageUploadResponse returns the pending record plus the presigned PUT
    url the client uploads the blob to.
 */
message CreatePackageUploadResponse {
    /*
        package is the created record (STATUS_UPLOADING).
     */
    models.PackageRecord package = 1 [(validate.rules).message.required = true];
    /*
        upload_url is the presigned PUT url the client uploads the blob to.
     */
    string upload_url = 2 [(validate.rules).string = {min_len: 1, max_len: 4096}];
    /*
        upload_url_expires_at is when the upload url stops working.
     */
    google.protobuf.Timestamp upload_url_expires_at = 3;
}

/*
    CompleteUpload finalizes after the client PUT the blob: the server verifies
    size + sha256 and flips the record to READY (or FAILED). Idempotent.
 */
message CompleteUploadRequest {
    /*
        tenant_id scopes the request to the package's tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        id is the package record being finalized.
     */
    string id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
}
/*
    CompleteUploadResponse returns the record after verification (READY/FAILED).
 */
message CompleteUploadResponse {
    /*
        package is the finalized record (now STATUS_READY or STATUS_FAILED).
     */
    models.PackageRecord package = 1 [(validate.rules).message.required = true];
}

/*
    GetPackageRequest fetches one package by id.
 */
message GetPackageRequest {
    /*
        tenant_id scopes the request to the package's tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        id is the package to fetch.
     */
    string id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
}
/*
    GetPackageResponse returns the requested package.
 */
message GetPackageResponse {
    /*
        package is the fetched package record.
     */
    models.PackageRecord package = 1 [(validate.rules).message.required = true];
}

/*
    ListPackagesRequest lists a tenant's packages with filtering, sort and paging.
 */
message ListPackagesRequest {
    /*
        tenant_id scopes the listing to one tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        filter is the shared Entity-level filter (search, ids, time windows).
     */
    common.EntityFilter filter = 2;
    /*
        formats narrows to specific package formats (facet filter).
     */
    repeated models.PackageRecord.Format formats = 3;
    /*
        db_kinds narrows to specific target database engines (facet filter).
     */
    repeated domain.Database.Kind db_kinds = 4;
    /*
        sort is the ordering over the common Entity columns.
     */
    common.EntitySort sort = 5;
    /*
        page is the pagination cursor/size.
     */
    common.Page page = 6;
}
/*
    ListPackagesResponse returns one page of packages.
 */
message ListPackagesResponse {
    /*
        packages is this page of package records.
     */
    repeated models.PackageRecord packages = 1;
    /*
        next_page_token is empty when there are no more rows.
     */
    string next_page_token = 2;
}

/*
    DeletePackageRequest removes one package by id.
 */
message DeletePackageRequest {
    /*
        tenant_id scopes the request to the package's tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        id is the package to remove.
     */
    string id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
}
/*
    DeletePackageResponse is empty; success is signalled by the absence of error.
 */
message DeletePackageResponse {}

/*
    PackageService is the tenant package registry (custom DB builds).
 */
service PackageService {
    option (ogen.service) = {
        path_prefix: "/api/v1/package"
        tags: "package"
    };

    /*
        CreatePackageUpload mints a record + presigned PUT url. Not idempotent.
     */
    rpc CreatePackageUpload (CreatePackageUploadRequest) returns (CreatePackageUploadResponse) {
        option (ogen.method) = {
            http_method: HTTP_METHOD_POST
            path: "/create-package-upload"
            operation_id: "createPackageUpload"
            request_body: {
                required: true
            }
            responses: {
                status: 200
                description: "OK"
            }
            responses: {
                description: "Unexpected error."
                schema: {
                    ref: "#/components/schemas/Error"
                }
            }
        };

        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_PACKAGE, action: ACTION_CREATE}]};
    }
    /*
        CompleteUpload verifies size + sha256 and flips the record to READY (or
        FAILED). Idempotent.
     */
    rpc CompleteUpload (CompleteUploadRequest) returns (CompleteUploadResponse) {
        option (ogen.method) = {
            http_method: HTTP_METHOD_POST
            path: "/complete-upload"
            operation_id: "completeUpload"
            request_body: {
                required: true
            }
            responses: {
                status: 200
                description: "OK"
            }
            responses: {
                description: "Unexpected error."
                schema: {
                    ref: "#/components/schemas/Error"
                }
            }
        };

        option idempotency_level = IDEMPOTENT;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_PACKAGE, action: ACTION_UPDATE}]};
    }
    /*
        GetPackage fetches one package by id. Read-only.
     */
    rpc GetPackage (GetPackageRequest) returns (GetPackageResponse) {
        option (ogen.method) = {
            http_method: HTTP_METHOD_GET
            path: "/get-package"
            operation_id: "getPackage"
            request_body: {
                required: true
            }
            responses: {
                status: 200
                description: "OK"
            }
            responses: {
                description: "Unexpected error."
                schema: {
                    ref: "#/components/schemas/Error"
                }
            }
        };

        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_PACKAGE, action: ACTION_READ}]};
    }
    /*
        ListPackages lists a tenant's packages. Read-only.
     */
    rpc ListPackages (ListPackagesRequest) returns (ListPackagesResponse) {
        option (ogen.method) = {
            http_method: HTTP_METHOD_GET
            path: "/list-packages"
            operation_id: "listPackages"
            request_body: {
                required: true
            }
            responses: {
                status: 200
                description: "OK"
            }
            responses: {
                description: "Unexpected error."
                schema: {
                    ref: "#/components/schemas/Error"
                }
            }
        };

        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_PACKAGE, action: ACTION_LIST}]};
    }
    /*
        DeletePackage is idempotent: deleting an absent package is a no-op.
     */
    rpc DeletePackage (DeletePackageRequest) returns (DeletePackageResponse) {
        option (ogen.method) = {
            http_method: HTTP_METHOD_POST
            path: "/delete-package"
            operation_id: "deletePackage"
            request_body: {
                required: true
            }
            responses: {
                status: 200
                description: "OK"
            }
            responses: {
                description: "Unexpected error."
                schema: {
                    ref: "#/components/schemas/Error"
                }
            }
        };

        option idempotency_level = IDEMPOTENT;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_PACKAGE, action: ACTION_DELETE}]};
    }
}
