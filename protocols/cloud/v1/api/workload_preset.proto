syntax = "proto3";

package cloud.v1.api;

import "v1/catalog/workload.proto";
import "google/protobuf/field_mask.proto";
import "v1/iam/tenant.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/api";


message CreateWorkloadPresetRequest {
    cloud.v1.catalog.WorkloadPreset preset = 1 [(validate.rules).message = {required: true}];
}

message UpdateWorkloadPresetRequest {
    cloud.v1.catalog.WorkloadPreset preset = 1 [(validate.rules).message = {required: true}];
    google.protobuf.FieldMask update_mask = 2 [(validate.rules).message = {required: true}];
}


service WorkloadPresetService {
    rpc CreateWorkloadPreset (CreateWorkloadPresetRequest) returns (cloud.v1.catalog.WorkloadPreset)       { option idempotency_level = IDEMPOTENT; }
    rpc UpdateWorkloadPreset (UpdateWorkloadPresetRequest) returns (cloud.v1.catalog.WorkloadPreset)       { option idempotency_level = IDEMPOTENT; }
    rpc DeleteWorkloadPreset (cloud.v1.catalog.WorkloadPresetId) returns (cloud.v1.catalog.WorkloadPreset)    { option idempotency_level = IDEMPOTENT; }
    rpc GetWorkloadPreset    (cloud.v1.catalog.WorkloadPresetId) returns (cloud.v1.catalog.WorkloadPreset)    { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc ListWorkloadPresets  (cloud.v1.iam.TenantId)             returns (cloud.v1.catalog.WorkloadPreset.List) { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc CloneWorkloadPreset  (cloud.v1.catalog.WorkloadPresetId) returns (cloud.v1.catalog.WorkloadPreset)    { option idempotency_level = IDEMPOTENT; }
}
