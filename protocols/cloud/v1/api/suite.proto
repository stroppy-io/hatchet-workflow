syntax = "proto3";

package cloud.v1.api;

import "cloud/v1/common/entity.proto";
import "cloud/v1/deployment/provider.proto";
import "cloud/v1/domain/suite.proto";
import "cloud/v1/iam/options.proto";
import "cloud/v1/iam/permission.proto";
import "cloud/v1/models/suite.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api";

/*
    suite.proto is the tenant-scoped API over models.SuiteRecord — the reusable
    suite DEFINITION. CRUD + clone for definitions, plus Start which resolves
    preset-backed cells into child TestRunRecords and launches SuiteWorkflow.
    Every request is tenant-scoped (tenant_id); CRUD/clone gated by
    RESOURCE_SUITE, Start by RESOURCE_SUITE_RUN (it creates a run).
 */

/*
    CreateSuiteRequest creates a new suite definition under a tenant.
 */
message CreateSuiteRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        suite is the definition to persist. Server assigns entity.id / tenant_id /
        timings.
     */
    models.SuiteRecord suite = 2 [(validate.rules).message.required = true];
}
/*
    CreateSuiteResponse returns the newly created suite definition.
 */
message CreateSuiteResponse {
    /*
        suite is the persisted definition with server-assigned fields populated.
     */
    models.SuiteRecord suite = 1 [(validate.rules).message.required = true];
}

/*
    GetSuiteRequest fetches a single suite definition by id.
 */
message GetSuiteRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        id is the suite definition identifier to fetch.
     */
    string id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
}
/*
    GetSuiteResponse returns the requested suite definition.
 */
message GetSuiteResponse {
    /*
        suite is the requested definition.
     */
    models.SuiteRecord suite = 1 [(validate.rules).message.required = true];
}

/*
    ListSuitesRequest lists suite definitions with filtering, faceting, sorting
    and pagination.
 */
message ListSuitesRequest {
    /*
        Sort selects the ordering column for the listing.
     */
    message Sort {
        /*
            Kind is a suite-specific sortable column (alternative to a common
            Entity column).
         */
        enum Kind {
            /*
                KIND_UNSPECIFIED leaves the suite-specific ordering unset.
             */
            KIND_UNSPECIFIED = 0;
            /*
                KIND_PROVIDER orders by deployment provider.
             */
            KIND_PROVIDER = 1;
            /*
                KIND_SCHEDULE_ENABLED orders by whether the cron schedule is enabled.
             */
            KIND_SCHEDULE_ENABLED = 2;
            /*
                KIND_NEXT_RUN_AT orders by the next planned auto-run time.
             */
            KIND_NEXT_RUN_AT = 3;
            /*
                KIND_LAST_RUN_AT orders by the most recent run time.
             */
            KIND_LAST_RUN_AT = 4;
            /*
                KIND_RUN_COUNT orders by the total number of runs.
             */
            KIND_RUN_COUNT = 5;
        }
        /*
            by selects either a common Entity sort field or a suite-specific Kind.
         */
        oneof by {
            /*
                entity orders by a shared Entity column (name, created_at, ...).
             */
            common.EntitySortField entity = 1;
            /*
                kind orders by a suite-specific column.
             */
            Kind kind = 2;
        }
        /*
            desc reverses the order (descending) when true.
         */
        bool desc = 3;
    }

    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        filter holds the shared Entity-level filters (search, ids, time windows).
     */
    common.EntityFilter filter = 2;
    /*
        providers restricts the listing to suites targeting these providers (facet
        filter).
     */
    repeated deployment.Provider providers = 3;
    /*
        schedule_enabled facets by schedule state. Unset = any; true = only
        scheduled+enabled; false = only paused/none.
     */
    optional bool schedule_enabled = 4;
    /*
        sort selects the result ordering.
     */
    Sort sort = 5;
    /*
        page carries pagination (page size + token).
     */
    common.Page page = 6;
}
/*
    ListSuitesResponse returns a page of suite definitions.
 */
message ListSuitesResponse {
    /*
        suites is the matching page of definitions.
     */
    repeated models.SuiteRecord suites = 1;
    /*
        next_page_token fetches the following page; empty when at the end.
     */
    string next_page_token = 2;
}

/*
    ListSuiteFacetsRequest returns distinct values used by suite-list facet
    controls. It is tenant-scoped and honors EntityFilter.include_deleted.
 */
message ListSuiteFacetsRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        filter holds shared Entity-level filters. include_deleted controls
        whether soft-deleted suites contribute to facet values.
     */
    common.EntityFilter filter = 2;
}
/*
    ListSuiteFacetsResponse returns distinct non-empty values present in the
    matching tenant's suite definitions.
 */
message ListSuiteFacetsResponse {
    /*
        author_ids are distinct entity.author_id values.
     */
    repeated string author_ids = 1;
}

/*
    UpdateSuiteRequest wholesale-replaces an existing suite definition.
 */
message UpdateSuiteRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        suite is the full replacement; suite.entity.id selects the row.
     */
    models.SuiteRecord suite = 2 [(validate.rules).message.required = true];
}
/*
    UpdateSuiteResponse returns the updated suite definition.
 */
message UpdateSuiteResponse {
    /*
        suite is the stored definition after the update.
     */
    models.SuiteRecord suite = 1 [(validate.rules).message.required = true];
}

/*
    DeleteSuiteRequest soft-deletes a suite definition by id.
 */
message DeleteSuiteRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        id is the suite definition identifier to delete.
     */
    string id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
}
/*
    DeleteSuiteResponse is empty; soft-delete success is signalled by a
    non-error reply.
 */
message DeleteSuiteResponse {}

/*
    CloneSuite copies a suite definition into a new editable one owned by the
    caller (fresh id, caller as author).
 */
message CloneSuiteRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        id is the source suite definition to clone.
     */
    string id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        name is the optional name for the clone; empty -> server derives one.
     */
    string name = 3 [(validate.rules).string = {max_len: 255}];
}
/*
    CloneSuiteResponse returns the freshly cloned suite definition.
 */
message CloneSuiteResponse {
    /*
        suite is the new definition owned by the caller.
     */
    models.SuiteRecord suite = 1 [(validate.rules).message.required = true];
}

/*
    SetSuiteSchedule sets/replaces a suite's cron schedule (and its enabled flag)
    without sending the whole definition — handy for pausing/resuming auto-runs.
 */
message SetSuiteScheduleRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        id is the suite definition whose schedule is being set.
     */
    string id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        schedule is the cron schedule (and enabled flag) to apply.
     */
    domain.Schedule schedule = 3 [(validate.rules).message.required = true];
}
/*
    SetSuiteScheduleResponse returns the suite definition with the new schedule.
 */
message SetSuiteScheduleResponse {
    /*
        suite is the stored definition after the schedule change.
     */
    models.SuiteRecord suite = 1 [(validate.rules).message.required = true];
}

/*
    StartSuite expands a non-deleted suite definition into a SuiteRunRecord (one
    TestRunRecord per enabled compatible cell) and launches SuiteWorkflow.
    Provide a stored `suite_id` or an inline `suite` definition directly
    (CLI/API).
 */
message StartSuiteRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        source selects the suite definition to start: a stored definition by id,
        or an inline definition supplied directly.
     */
    oneof source {
        option (validate.required) = true;
        /*
            suite_id re-runs a stored suite definition by id.
         */
        string suite_id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
        /*
            suite is an inline suite definition supplied directly (CLI path).
         */
        domain.Suite suite = 3;
    }
    /*
        max_parallel caps concurrent child run workflows. 0 = suite default, then
        tenant default, then unlimited.
     */
    uint32 max_parallel = 4;
    /*
        in_tenant_rating sets tenant-rating membership for all child runs; unset ->
        suite defaults, then platform defaults (tenant true).
     */
    optional bool in_tenant_rating = 5;
    /*
        in_global_rating sets global-rating membership for all child runs; unset ->
        suite defaults, then platform defaults (global false).
     */
    optional bool in_global_rating = 6;
}
/*
    StartSuiteResponse returns the newly created suite run.
 */
message StartSuiteResponse {
    /*
        suite_run is the launched suite execution record.
     */
    models.SuiteRunRecord suite_run = 1 [(validate.rules).message.required = true];
}

/*
    SuiteService is the tenant-scoped CRUD + lifecycle API for suite definitions.
 */
service SuiteService {
    /*
        CreateSuite persists a new suite definition. Not idempotent.
     */
    rpc CreateSuite (CreateSuiteRequest) returns (CreateSuiteResponse) {
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SUITE, action: ACTION_CREATE}]};
    }
    /*
        GetSuite fetches a single suite definition by id. Read-only.
     */
    rpc GetSuite (GetSuiteRequest) returns (GetSuiteResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SUITE, action: ACTION_READ}]};
    }
    /*
        ListSuites lists suite definitions with filtering and pagination. Read-only.
     */
    rpc ListSuites (ListSuitesRequest) returns (ListSuitesResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SUITE, action: ACTION_LIST}]};
    }
    /*
        ListSuiteFacets lists distinct values for suite-list facet controls.
        Read-only.
     */
    rpc ListSuiteFacets (ListSuiteFacetsRequest) returns (ListSuiteFacetsResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SUITE, action: ACTION_LIST}]};
    }
    /*
        UpdateSuite is idempotent: a wholesale field set converges on retry.
     */
    rpc UpdateSuite (UpdateSuiteRequest) returns (UpdateSuiteResponse) {
        option idempotency_level = IDEMPOTENT;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SUITE, action: ACTION_UPDATE}]};
    }
    /*
        DeleteSuite is idempotent: soft-deleting an absent or already-deleted
        suite is a no-op.
     */
    rpc DeleteSuite (DeleteSuiteRequest) returns (DeleteSuiteResponse) {
        option idempotency_level = IDEMPOTENT;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SUITE, action: ACTION_DELETE}]};
    }
    /*
        CloneSuite mints a new definition. Not idempotent.
     */
    rpc CloneSuite (CloneSuiteRequest) returns (CloneSuiteResponse) {
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SUITE, action: ACTION_CREATE}]};
    }
    /*
        SetSuiteSchedule is idempotent: setting the same schedule converges.
     */
    rpc SetSuiteSchedule (SetSuiteScheduleRequest) returns (SetSuiteScheduleResponse) {
        option idempotency_level = IDEMPOTENT;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SUITE, action: ACTION_UPDATE}]};
    }
    /*
        StartSuite mints a SuiteRunRecord. Not idempotent: each call launches a run.
     */
    rpc StartSuite (StartSuiteRequest) returns (StartSuiteResponse) {
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_SUITE_RUN, action: ACTION_CREATE}]};
    }
}
