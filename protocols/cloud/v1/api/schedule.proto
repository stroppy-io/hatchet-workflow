syntax = "proto3";

package cloud.v1.api;

import "google/protobuf/field_mask.proto";
import "v1/iam/tenant.proto";
import "v1/system/schedule.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/api";


message CreateScheduleRequest {
    cloud.v1.system.Schedule schedule = 1 [(validate.rules).message = {required: true}];
}

message UpdateScheduleRequest {
    cloud.v1.system.Schedule schedule = 1 [(validate.rules).message = {required: true}];
    google.protobuf.FieldMask update_mask = 2 [(validate.rules).message = {required: true}];
}


service ScheduleService {
    rpc CreateSchedule  (CreateScheduleRequest) returns (cloud.v1.system.Schedule)      { option idempotency_level = IDEMPOTENT; }
    rpc UpdateSchedule  (UpdateScheduleRequest) returns (cloud.v1.system.Schedule)      { option idempotency_level = IDEMPOTENT; }
    rpc DeleteSchedule  (cloud.v1.system.ScheduleId) returns (cloud.v1.system.Schedule)   { option idempotency_level = IDEMPOTENT; }
    rpc GetSchedule     (cloud.v1.system.ScheduleId) returns (cloud.v1.system.Schedule)   { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc ListSchedules   (cloud.v1.iam.TenantId)      returns (cloud.v1.system.Schedule.List) { option idempotency_level = NO_SIDE_EFFECTS; }

    rpc EnableSchedule  (cloud.v1.system.ScheduleId) returns (cloud.v1.system.Schedule)   { option idempotency_level = IDEMPOTENT; }
    rpc DisableSchedule (cloud.v1.system.ScheduleId) returns (cloud.v1.system.Schedule)   { option idempotency_level = IDEMPOTENT; }
    /* TriggerNow — fire the schedule's hook immediately, ignoring cron. */
    rpc TriggerNow      (cloud.v1.system.ScheduleId) returns (cloud.v1.system.Schedule)   { option idempotency_level = IDEMPOTENT; }
}
