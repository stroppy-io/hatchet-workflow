syntax = "proto3";

package cloud.v1.api;

import "v1/agent/protocol.proto";
import "google/protobuf/timestamp.proto";
import "v1/system/dag.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/api";


/* StreamLogsRequest — server-streaming live log feed. Client filters by
   dag_run_id and optional node_id. Server streams LogLine until client
   cancels or dag_run reaches terminal status. */
message StreamLogsRequest {
    cloud.v1.system.DagRunId dag_run_id = 1 [(validate.rules).message = {required: true}];
    /* node_id — optional filter; empty = all nodes of the run. */
    string node_id = 2 [(validate.rules).string.max_len = 64];
    /* since — replay backlog from this time; default = now (live tail). */
    optional google.protobuf.Timestamp since = 3;
    bool follow = 4;     // keep stream open until run terminates; false = backlog only
}


service LogsService {
    /* StreamLogs — server-streaming RPC. Maps to WebSocket on HTTP gateway. */
    rpc StreamLogs (StreamLogsRequest) returns (stream cloud.v1.agent.LogLine) { option idempotency_level = NO_SIDE_EFFECTS; }
}
