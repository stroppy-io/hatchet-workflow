    keys. Every request carries tenant_id (the default auth tenant_field); presets
    never cross tenants.

    Shared filtering/sorting/pagination over the common Entity fields comes from
    common.EntityFilter / common.EntitySort / common.Page. Kind-specific filters
    and sort keys are nested in the one request that uses them.
 */

