syntax = "proto3";

package cloud.v1.api;

import "cloud/v1/common/entity.proto";
import "cloud/v1/common/status.proto";
import "cloud/v1/common/trigger.proto";
import "cloud/v1/deployment/provider.proto";
import "cloud/v1/domain/database.proto";
import "cloud/v1/domain/test.proto";
import "cloud/v1/iam/options.proto";
import "cloud/v1/iam/permission.proto";
import "cloud/v1/models/preset.proto";
import "cloud/v1/models/test_run.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api";

/*
    test_run.proto is the tenant-scoped API over models.TestRunRecord. A run is
    started from a fully-baked domain.TestRun (produced by the test wizard finish,
    or supplied directly by a CLI), or re-run by id. Starting persists the record
    and launches TestWorkflow. Runtime logs/metrics are keyed by the run id (see
    monitor/*). Every request is tenant-scoped (tenant_id) and gated by
    RESOURCE_TEST_RUN (ExtractToPreset is gated by RESOURCE_PRESET).
 */

/*
    StartTestRun launches a run. Provide a fully-baked `run` (CLI / wizard finish)
    to persist a new record and start it; or `test_run_id` to re-run an existing
    record's spec as a new run. Launches TestWorkflow.
 */
message StartTestRunRequest {
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    oneof source {
        option (validate.required) = true;
        domain.TestRun run = 2;
        string test_run_id = 3 [(validate.rules).string = {min_len: 1, max_len: 64}];
    }
    // Rating membership; unset -> server defaults (tenant true, global false).
    optional bool in_tenant_rating = 4;
    optional bool in_global_rating = 5;
}
message StartTestRunResponse {
    models.TestRunRecord run = 1 [(validate.rules).message.required = true];
}

message GetTestRunRequest {
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    string id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
}
message GetTestRunResponse {
    models.TestRunRecord run = 1 [(validate.rules).message.required = true];
}

message ListTestRunsRequest {
    /*
        Sort orders by a common Entity column OR a denormalized Summary column.
        desc applies to whichever is chosen.
     */
    message Sort {
        enum Kind {
            KIND_UNSPECIFIED = 0;
            KIND_STATUS = 1;
            KIND_DB_KIND = 2;
            KIND_WORKLOAD = 3;        // workload_name / stroppy_version
            KIND_PROVIDER = 4;
            KIND_PROGRESS = 5;
            KIND_DURATION = 6;
            KIND_STARTED_AT = 7;
            KIND_FINISHED_AT = 8;
            KIND_NODE_COUNT = 9;
        }
        oneof by {
            common.EntitySortField entity = 1;
            Kind kind = 2;
        }
        bool desc = 3;
    }

    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    // Shared Entity-level filters (search, ids, author, time windows, soft-delete).
    common.EntityFilter filter = 2;

    // --- facet filters (all AND; empty list / unset = not applied) ---
    repeated common.Status statuses = 3;
    repeated domain.Database.Kind db_kinds = 4;
    repeated deployment.Provider providers = 5;
    repeated string db_preset_ids = 6 [(validate.rules).repeated = {max_items: 200, items: {string: {max_len: 64}}}];
    repeated string workload_preset_ids = 7 [(validate.rules).repeated = {max_items: 200, items: {string: {max_len: 64}}}];
    repeated string stroppy_versions = 8 [(validate.rules).repeated = {max_items: 100, items: {string: {max_len: 64}}}];
    // Suite scoping.
    string suite_run_id = 9 [(validate.rules).string.max_len = 64];
    // Unset = both; true = only standalone (no suite); false = only suite children.
    optional bool standalone = 10;
    // progress_pct window [min,max], 0..100.
    optional uint32 progress_min = 11 [(validate.rules).uint32.lte = 100];
    optional uint32 progress_max = 12 [(validate.rules).uint32.lte = 100];
    // duration window.
    google.protobuf.Duration duration_min = 13;
    google.protobuf.Duration duration_max = 14;
    // started_at / finished_at windows.
    google.protobuf.Timestamp started_after = 15;
    google.protobuf.Timestamp started_before = 16;
    google.protobuf.Timestamp finished_after = 17;
    google.protobuf.Timestamp finished_before = 18;
    // Filter by how the run was triggered (manual / api / suite child); empty = any.
    repeated common.Trigger triggers = 21;

    Sort sort = 19;
    common.Page page = 20;
}
message ListTestRunsResponse {
    repeated models.TestRunRecord runs = 1;
    string next_page_token = 2;
}

/*
    CancelTestRun requests cancellation (status -> CANCELLING, then CANCELLED when
    the workflow stops). Idempotent: cancelling a finished/cancelled run is a no-op.
 */
message CancelTestRunRequest {
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    string id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
}
message CancelTestRunResponse {
    models.TestRunRecord run = 1 [(validate.rules).message.required = true];
}

message DeleteTestRunRequest {
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    string id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
}
message DeleteTestRunResponse {}

/*
    ExtractToPreset saves a run's database+workload as a reusable TestPresetRecord,
    so a one-off run can be promoted into a named preset.
 */
message ExtractToPresetRequest {
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    string id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
    // Optional name for the new preset; empty -> server derives one.
    string name = 3 [(validate.rules).string = {max_len: 255}];
}
message ExtractToPresetResponse {
    models.TestPresetRecord preset = 1 [(validate.rules).message.required = true];
}

service TestRunService {
    /*
        StartTestRun is not idempotent: each call launches a new run.
     */
    rpc StartTestRun (StartTestRunRequest) returns (StartTestRunResponse) {
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_TEST_RUN, action: ACTION_CREATE}]};
    }
    rpc GetTestRun (GetTestRunRequest) returns (GetTestRunResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_TEST_RUN, action: ACTION_READ}]};
    }
    rpc ListTestRuns (ListTestRunsRequest) returns (ListTestRunsResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_TEST_RUN, action: ACTION_LIST}]};
    }
    rpc CancelTestRun (CancelTestRunRequest) returns (CancelTestRunResponse) {
        option idempotency_level = IDEMPOTENT;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_TEST_RUN, action: ACTION_UPDATE}]};
    }
    /*
        DeleteTestRun is idempotent: deleting an absent run is a no-op.
     */
    rpc DeleteTestRun (DeleteTestRunRequest) returns (DeleteTestRunResponse) {
        option idempotency_level = IDEMPOTENT;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_TEST_RUN, action: ACTION_DELETE}]};
    }
    /*
        ExtractToPreset mints a new preset. Not idempotent.
     */
    rpc ExtractToPreset (ExtractToPresetRequest) returns (ExtractToPresetResponse) {
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_PRESET, action: ACTION_CREATE}]};
    }
}
