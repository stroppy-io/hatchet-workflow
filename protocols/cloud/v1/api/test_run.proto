syntax = "proto3";

package cloud.v1.api;

import "google/protobuf/field_mask.proto";
import "v1/iam/tenant.proto";
import "v1/testing/test_run.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/api";


message CreateTestRunRequest {
    cloud.v1.testing.TestRun test_run = 1 [(validate.rules).message = {required: true}];
}

message UpdateTestRunRequest {
    cloud.v1.testing.TestRun test_run = 1 [(validate.rules).message = {required: true}];
    google.protobuf.FieldMask update_mask = 2 [(validate.rules).message = {required: true}];
}


service TestRunService {
    /* CreateTestRun — persists intent. Launching = LaunchTestRun creates DagRun. */
    rpc CreateTestRun (CreateTestRunRequest) returns (cloud.v1.testing.TestRun)      { option idempotency_level = IDEMPOTENT; }
    rpc UpdateTestRun (UpdateTestRunRequest) returns (cloud.v1.testing.TestRun)      { option idempotency_level = IDEMPOTENT; }
    rpc DeleteTestRun (cloud.v1.testing.TestRunId) returns (cloud.v1.testing.TestRun)   { option idempotency_level = IDEMPOTENT; }
    rpc GetTestRun    (cloud.v1.testing.TestRunId) returns (cloud.v1.testing.TestRun)   { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc ListTestRuns  (cloud.v1.iam.TenantId)      returns (cloud.v1.testing.TestRun.List) { option idempotency_level = NO_SIDE_EFFECTS; }

    /* LaunchTestRun — creates a DagRun for the TestRun. Idempotent on
       (test_run_id, attempt) — re-launching with same attempt is a no-op. */
    rpc LaunchTestRun (cloud.v1.testing.TestRunId) returns (cloud.v1.testing.TestRun)   { option idempotency_level = IDEMPOTENT; }
    /* CancelTestRun — cancels the running DagRun bound to this TestRun. */
    rpc CancelTestRun (cloud.v1.testing.TestRunId) returns (cloud.v1.testing.TestRun)   { option idempotency_level = IDEMPOTENT; }
}
