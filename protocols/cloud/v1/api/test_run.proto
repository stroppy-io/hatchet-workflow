syntax = "proto3";

package cloud.v1.api;

import "cloud/v1/common/entity.proto";
import "cloud/v1/common/status.proto";
import "cloud/v1/common/trigger.proto";
import "cloud/v1/deployment/provider.proto";
import "cloud/v1/domain/database.proto";
import "cloud/v1/domain/workload.proto";
import "cloud/v1/models/test_run.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

import "ogen/ogen.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api";

option (ogen.file) = { generate_openapi: true };

/*
    test_run.proto carries the filter/facet/sort/pagination query contract
    over models.Run that internal callers share when listing runs
    against postgres: internal/services/recipe (RecipeService.ListRuns),
    internal/services/rating and internal/app's tenant-dashboard/rating glue
    all list through postgres.TestRunRepo.List(ctx, *ListTestRunsRequest, ...)
    reusing this one query shape rather than each defining a narrower one. The
    tenant-facing lifecycle API that used to live in this file (StartTestRun,
    GetTestRun, CancelTestRun, DeleteTestRun, ExtractToPreset, and the
    TestRunService that served them) was removed with the DAG-based test
    executor; runs are now started/cancelled/deleted through RecipeService
    (see api/recipe.proto's StartRun/CancelRun/DeleteRun), which reads through
    the same TestRunRepo these messages describe.
 */

/*
    ListTestRunsRequest lists test runs with filtering, faceting, sorting and
    pagination.
 */
message ListTestRunsRequest {
    /*
        Sort orders by a common Entity column OR a denormalized Summary column.
        desc applies to whichever is chosen.
     */
    message Sort {
        /*
            Kind is a test-run-specific sortable column (alternative to a common
            Entity column).
         */
        enum Kind {
            /*
                KIND_UNSPECIFIED leaves the test-run-specific ordering unset.
             */
            KIND_UNSPECIFIED = 0;
            /*
                KIND_STATUS orders by lifecycle status.
             */
            KIND_STATUS = 1;
            /*
                KIND_DB_KIND orders by database kind.
             */
            KIND_DB_KIND = 2;
            /*
                KIND_WORKLOAD orders by workload_name / stroppy_version.
             */
            KIND_WORKLOAD = 3;
            /*
                KIND_PROVIDER orders by deployment provider.
             */
            KIND_PROVIDER = 4;
            /*
                KIND_PROGRESS orders by progress.
             */
            KIND_PROGRESS = 5;
            /*
                KIND_DURATION orders by run duration.
             */
            KIND_DURATION = 6;
            /*
                KIND_STARTED_AT orders by start time.
             */
            KIND_STARTED_AT = 7;
            /*
                KIND_FINISHED_AT orders by finish time.
             */
            KIND_FINISHED_AT = 8;
            /*
                KIND_NODE_COUNT orders by node count.
             */
            KIND_NODE_COUNT = 9;
            /*
                KIND_PROTOCOL orders by workload protocol.
             */
            KIND_PROTOCOL = 10;
            /*
                KIND_TEST_PRESET orders by test preset name/id.
             */
            KIND_TEST_PRESET = 11;
            /*
                KIND_TRIGGER orders by how the run was launched (manual/cron/api).
             */
            KIND_TRIGGER = 12;
        }
        /*
            by selects either a common Entity sort field or a test-run-specific Kind.
         */
        oneof by {
            option (ogen.oneof) = { schema_mode: ONEOF_SCHEMA_MODE_OBJECT };
            /*
                entity orders by a shared Entity column (name, created_at, ...).
             */
            common.EntitySortField entity = 1;
            /*
                kind orders by a test-run-specific column.
             */
            Kind kind = 2;
        }
        /*
            desc reverses the order (descending) when true.
         */
        bool desc = 3;
    }

    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        filter holds the shared Entity-level filters (search, ids, author, time
        windows, soft-delete).
     */
    common.EntityFilter filter = 2;

    /*
        statuses facets by lifecycle status (all AND; empty list / unset = not
        applied).
     */
    repeated common.Status statuses = 3;
    /*
        db_kinds facets by database kind.
     */
    repeated domain.Database.Kind db_kinds = 4;
    /*
        providers facets by deployment provider.
     */
    repeated deployment.Provider providers = 5;
    /*
        db_preset_ids facets by database preset id.
     */
    repeated string db_preset_ids = 6 [(validate.rules).repeated = {max_items: 200, items: {string: {max_len: 64}}}];
    /*
        workload_preset_ids facets by workload preset id.
     */
    repeated string workload_preset_ids = 7 [(validate.rules).repeated = {max_items: 200, items: {string: {max_len: 64}}}];
    /*
        test_preset_ids facets by complete test preset id.
     */
    repeated string test_preset_ids = 23 [(validate.rules).repeated = {max_items: 200, items: {string: {max_len: 64}}}];
    /*
        stroppy_versions facets by stroppy version.
     */
    repeated string stroppy_versions = 8 [(validate.rules).repeated = {max_items: 100, items: {string: {max_len: 64}}}];
    /*
        protocols facets by workload wire protocol.
     */
    repeated domain.Workload.Protocol protocols = 22;
    /*
        suite_run_id scopes to a single suite run's children.
     */
    string suite_run_id = 9 [(validate.rules).string.max_len = 64];
    /*
        suite_cell_ids scopes to specific cells inside a suite run.
     */
    repeated string suite_cell_ids = 24 [(validate.rules).repeated = {max_items: 200, items: {string: {max_len: 64}}}];
    /*
        standalone facets by suite membership. Unset = both; true = only standalone
        (no suite); false = only suite children.
     */
    optional bool standalone = 10;
    /*
        progress_min is the lower bound of the progress_pct window, 0..100.
     */
    optional uint32 progress_min = 11 [(validate.rules).uint32.lte = 100];
    /*
        progress_max is the upper bound of the progress_pct window, 0..100.
     */
    optional uint32 progress_max = 12 [(validate.rules).uint32.lte = 100];
    /*
        duration_min is the lower bound of the duration window.
     */
    google.protobuf.Duration duration_min = 13;
    /*
        duration_max is the upper bound of the duration window.
     */
    google.protobuf.Duration duration_max = 14;
    /*
        started_after keeps runs started at or after this time.
     */
    google.protobuf.Timestamp started_after = 15;
    /*
        started_before keeps runs started at or before this time.
     */
    google.protobuf.Timestamp started_before = 16;
    /*
        finished_after keeps runs finished at or after this time.
     */
    google.protobuf.Timestamp finished_after = 17;
    /*
        finished_before keeps runs finished at or before this time.
     */
    google.protobuf.Timestamp finished_before = 18;
    /*
        triggers filters by how the run was triggered (manual / api / suite child);
        empty = any.
     */
    repeated common.Trigger triggers = 21;

    /*
        sort selects the result ordering.
     */
    Sort sort = 19;
    /*
        page carries pagination (page size + token).
     */
    common.Page page = 20;
}
/*
    ListTestRunsResponse returns a page of test runs.
 */
message ListTestRunsResponse {
    /*
        runs is the matching page of run records.
     */
    repeated models.Run runs = 1;
    /*
        next_page_token fetches the following page; empty when at the end.
     */
    string next_page_token = 2;
}

/*
    ListTestRunFacetsRequest returns distinct values used by run-list facet
    controls. It is tenant-scoped and honors the shared EntityFilter so clients
    can exclude deleted rows by default or ask for deleted-inclusive facets.
 */
message ListTestRunFacetsRequest {
    /*
        tenant_id scopes the request to the owning tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /*
        filter holds shared Entity-level filters. include_deleted controls
        whether soft-deleted runs contribute to facet values.
     */
    common.EntityFilter filter = 2;
}
/*
    ListTestRunFacetsResponse returns distinct non-empty values present in the
    matching tenant's runs.
 */
message ListTestRunFacetsResponse {
    /*
        author_ids are distinct entity.author_id values.
     */
    repeated string author_ids = 1;
    /*
        stroppy_versions are distinct summary.stroppy_version values.
     */
    repeated string stroppy_versions = 2;
    /*
        db_preset_ids are distinct summary.db_preset_id values.
     */
    repeated string db_preset_ids = 3;
    /*
        workload_preset_ids are distinct summary.workload_preset_id values.
     */
    repeated string workload_preset_ids = 4;
    /*
        test_preset_ids are distinct summary.test_preset_id values.
     */
    repeated string test_preset_ids = 5;
}
