syntax = "proto3";

package cloud.v1.api;

import "cloud/v1/iam/options.proto";
import "cloud/v1/iam/permission.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/api";

/*
    stroppy.proto exposes control-plane metadata about upstream Stroppy builds.
    It does not start runs or touch wizard drafts; it only returns suggested
    release versions for UI pickers. Commit pins are still accepted by the wizard
    as explicit client input (domain.Workload.stroppy_version = "commit:<sha>").
 */

/*
    ListStroppyVersionsRequest lists release tags accepted by the server
    configuration.
 */
message ListStroppyVersionsRequest {
    /*
        tenant_id scopes the request to the caller's tenant.
     */
    string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
}

/*
    ListStroppyVersionsResponse returns release tags sorted newest first.
 */
message ListStroppyVersionsResponse {
    /*
        versions are release tags from the configured GitHub repository, filtered
        by the server's configured minimum version.
     */
    repeated string versions = 1;
}

/*
    StroppyService exposes Stroppy metadata needed by run/suite wizards.
 */
service StroppyService {
    /*
        ListStroppyVersions returns suggested release versions. Read-only.
     */
    rpc ListStroppyVersions (ListStroppyVersionsRequest) returns (ListStroppyVersionsResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
        option (cloud.v1.iam.auth) = {all_of: [{resource: RESOURCE_WIZARD, action: ACTION_READ}]};
    }
}
