syntax = "proto3";

package cloud.v1.api;

import "v1/iam/tenant.proto";
import "v1/testing/shared_suite_run.proto";
import "v1/testing/test_suite_run.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/api";


message CreateSharedSuiteRunRequest {
    cloud.v1.testing.TestSuiteRunId test_suite_run_id = 1 [(validate.rules).message = {required: true}];
    uint32 expires_in_days = 2 [(validate.rules).uint32.lte = 3650];
}

message GetSharedSuiteRunByTokenRequest {
    string token = 1 [(validate.rules).string = {min_len: 16, max_len: 64}];
}


service SharedSuiteRunService {
    rpc CreateSharedSuiteRun (CreateSharedSuiteRunRequest)    returns (cloud.v1.testing.SharedSuiteRun)      { option idempotency_level = IDEMPOTENT; }
    rpc RevokeSharedSuiteRun (cloud.v1.testing.SharedSuiteRunId) returns (cloud.v1.testing.SharedSuiteRun)      { option idempotency_level = IDEMPOTENT; }
    rpc ListSharedSuiteRuns  (cloud.v1.iam.TenantId)             returns (cloud.v1.testing.SharedSuiteRun.List) { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc GetByToken           (GetSharedSuiteRunByTokenRequest) returns (cloud.v1.testing.SharedSuiteRun)     { option idempotency_level = NO_SIDE_EFFECTS; }
}
