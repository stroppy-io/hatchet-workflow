syntax = "proto3";

package cloud.v1.common;

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/common";

/*
    tags.proto defines the reusable Tags container — a flat label set plus
    arbitrary key/value metadata — embeddable by any model and always stored as
    a single column.
 */

/* Tags carries a flat label set and arbitrary key/value metadata for a model. */
message Tags {
    /* tags is a flat label set. */
    repeated string tags = 1;
    /*
        labels is arbitrary key/value metadata (reconcile/observability) — free to
        extend since Tags is always serialized as a single column.
     */
    map<string, string> labels = 2;
}
