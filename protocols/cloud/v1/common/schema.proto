syntax = "proto3";

package cloud.v1.common;

import "google/protobuf/struct.proto";
import "schemapb/schema.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/common";

/*
    schema.proto defines the pairing of a schema definition with a concrete
    value that conforms to it, used to carry validated, structured data through
    the control plane.
 */

/*
    RenderedSchema couples a schema definition with a concrete value rendered
    against it.
 */
message RenderedSchema {
    /* schema is the schema definition the value conforms to. */
    schemapb.Schema schema = 1;
    /* value is the structured data rendered against the schema. */
    google.protobuf.Struct value = 2;
}