syntax = "proto3";

package cloud.v1.common;

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/common";

/*
    FavoriteKind names the table a favorite points at. Presets are split (the RBAC
    RESOURCE_PRESET lumps the three preset tables together, but a favorite must
    address one exact row, so the kind has to distinguish them). (kind, target_id)
    together identify the favorited row.
 */
enum FavoriteKind {
    FAVORITE_KIND_UNSPECIFIED = 0;
    FAVORITE_KIND_DATABASE_PRESET = 1;
    FAVORITE_KIND_WORKLOAD_PRESET = 2;
    FAVORITE_KIND_TEST_PRESET = 3;
    FAVORITE_KIND_TEST_RUN = 4;
    FAVORITE_KIND_SUITE = 5;
    FAVORITE_KIND_SUITE_RUN = 6;
}
