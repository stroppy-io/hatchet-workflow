syntax = "proto3";

package cloud.v1.common;

import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/common";

/*
    ip.proto defines reusable IP networking value types: a single address, an
    address+port pair, a CIDR block, and a network grouping CIDRs with their
    addresses.
 */

/* IpAddress describes an address assigned to a network interface. */
message IpAddress {
    /* Family identifies IP protocol version. */
    enum Family {
        /* UNSPECIFIED means unknown address family. */
        FAMILY_UNSPECIFIED = 0;
        /* IPV4 is an IPv4 address. */
        FAMILY_IPV4 = 1;
        /* IPV6 is an IPv6 address. */
        FAMILY_IPV6 = 2;
    }

    /* family identifies IP protocol version. */
    Family family = 1 [(validate.rules).enum.defined_only = true];
    /* address is the textual IP address. */
    string address = 2 [(validate.rules).string.max_len = 128];
    /* prefix_len is CIDR prefix length. */
    uint32 prefix_len = 3 [(validate.rules).uint32.lte = 128];
    /* scope is address scope. */
    string scope = 4 [(validate.rules).string.max_len = 64];
}

/* AddrPort pairs an IP address with a port number. */
message AddrPort {
    /* address is the IP address. */
    IpAddress address = 1;
    /* port is the associated port number. */
    uint32 port = 2;
}

/* Cidr describes a network block in CIDR notation. */
message Cidr {
    /* value is the CIDR string, e.g. 10.0.0.0/24. */
    string value = 1 [(validate.rules).string = {min_len: 1}];
    /* addresses optionally denormalizes the addresses covered by this block. */
    repeated IpAddress addresses = 2; /* optional for denormalize */
}

/* Net groups one or more CIDR blocks together with their member addresses. */
message Net {
    /* cidrs lists the CIDR blocks that make up this network. */
    repeated Cidr cidrs = 1 [(validate.rules).repeated = {min_items: 1}];
    /* addresses lists the IP addresses belonging to this network. */
    repeated IpAddress addresses = 2 [(validate.rules).repeated = {min_items: 1}];
}