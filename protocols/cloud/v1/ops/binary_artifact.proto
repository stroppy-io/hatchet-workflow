syntax = "proto3";

package cloud.v1.ops;

import "cloud/v1/common/timestamps.proto";
import "goplain/goplain.proto";
import "google/protobuf/timestamp.proto";
import "ratelproto/ratelproto.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/ops";


/* BinaryArtifactKind — well-known binary types the cache serves to agents.
   Open-ended: agents can request arbitrary binaries by (name, version). */
enum BinaryArtifactKind {
    BINARY_ARTIFACT_KIND_UNSPECIFIED  = 0;
    BINARY_ARTIFACT_KIND_AGENT        = 1;   // stroppy-agent binary
    BINARY_ARTIFACT_KIND_STROPPY      = 2;   // stroppy main binary
    BINARY_ARTIFACT_KIND_NODE_EXPORTER = 3;
    BINARY_ARTIFACT_KIND_VMAGENT      = 4;
    BINARY_ARTIFACT_KIND_OTEL_COL     = 5;
    BINARY_ARTIFACT_KIND_PG_EXPORTER  = 6;
    BINARY_ARTIFACT_KIND_ETCD         = 7;
    BINARY_ARTIFACT_KIND_PATRONI      = 8;
    BINARY_ARTIFACT_KIND_HAPROXY      = 9;
    BINARY_ARTIFACT_KIND_OTHER        = 99;  // identified by name; new kinds reserved
}


message BinaryArtifactId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }
/* BinaryArtifact — server-side cache row for a binary fetched from an
   external origin (GitHub release, vendor repo) and re-served to agents.
   Agents reference by (name, version, filename); server resolves to row
   and serves from disk/S3 via FetchSpec URL. */
message BinaryArtifact {
    message List {repeated BinaryArtifact artifacts = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "binary_artifacts"
        indexes: [
            {name: "binary_artifacts_lookup_uniq", columns: ["name", "version", "filename"], unique: true},
            {name: "binary_artifacts_kind_idx",    columns: ["kind"]},
            {name: "binary_artifacts_sha_idx",     columns: ["sha256"]}
        ]
    };

    BinaryArtifactId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 2 [(goplain.field).embed = true];

    BinaryArtifactKind kind = 10 [(validate.rules).enum.defined_only = true];
    /* name — canonical short name ("node_exporter", "stroppy", "agent"). */
    string name = 11 [(validate.rules).string = {min_len: 1, max_len: 64, pattern: "^[a-z][a-z0-9_-]*$"}];
    string version = 12 [(validate.rules).string = {min_len: 1, max_len: 64}];
    string filename = 13 [(validate.rules).string = {min_len: 1, max_len: 255}];
    /* arch / os — multi-target cache key extension. */
    string arch = 14 [(validate.rules).string.max_len = 16];   // "amd64", "arm64"
    string os = 15   [(validate.rules).string.max_len = 16];   // "linux"

    /* origin_url — upstream source (GitHub release asset, vendor URL). */
    string origin_url = 20 [(validate.rules).string.max_len = 4096];
    /* storage_uri — server-side blob location (file://, s3://). */
    string storage_uri = 21 [(validate.rules).string = {min_len: 1, max_len: 4096}];
    string sha256 = 22 [(validate.rules).string.len = 64];
    uint64 size_bytes = 23;
    string content_type = 24 [(validate.rules).string.max_len = 128];

    /* cache lifecycle. */
    optional google.protobuf.Timestamp fetched_at = 30;
    optional google.protobuf.Timestamp last_served_at = 31;
    uint64 serve_count = 32;
}
