syntax = "proto3";

package cloud.v1.ops;

import "cloud/v1/iam/user.proto";
import "cloud/v1/common/timestamps.proto";
import "cloud/v1/common/identity.proto";
import "cloud/v1/iam/tenant.proto";
import "goplain/goplain.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "ratelproto/ratelproto.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/ops";


/* WebhookEvent — event types the sender emits. */
enum WebhookEvent {
    WEBHOOK_EVENT_UNSPECIFIED   = 0;
    WEBHOOK_EVENT_RUN_STARTED   = 1;
    WEBHOOK_EVENT_RUN_COMPLETED = 2;
    WEBHOOK_EVENT_RUN_FAILED    = 3;
    WEBHOOK_EVENT_NODE_DONE     = 4;
    WEBHOOK_EVENT_NODE_FAILED   = 5;
    WEBHOOK_EVENT_SUITE_STARTED   = 6;
    WEBHOOK_EVENT_SUITE_COMPLETED = 7;
}


message WebhookId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }
/* Webhook — tenant-scoped outbound HTTP notification target.
   Payload schema: { event, run_id?, node_id?, error?, timestamp, data? }. */
message Webhook {
    message List {repeated Webhook webhooks = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "webhooks"
        indexes: [
            {name: "webhooks_tenant_idx", columns: ["tenant_id"]}
        ]
    };

    WebhookId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    cloud.v1.iam.TenantId tenant_id = 2 [
        (ratel.column).constraints = {
            references_table: "tenants"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 3 [(goplain.field).embed = true];
    cloud.v1.common.Identity identity = 4 [(goplain.field).embed = true];
    optional cloud.v1.iam.UserId created_by = 9 [(ratel.column).constraints = {
        references_table: "users"
        references_column: "id"
        on_delete: SET_NULL
    }];

    string url = 10 [(validate.rules).string = {min_len: 8, max_len: 4096, pattern: "^https?://"}];
    /* events — filter; empty = all events. */
    repeated WebhookEvent events = 11 [(validate.rules).repeated = {
        max_items: 32,
        items: {enum: {defined_only: true, not_in: [0]}}
    }];
    /* secret — used for HMAC-SHA256 signature header (X-Stroppy-Signature).
       Empty = no signing. Stored as plaintext (tenant-managed). */
    string secret = 12 [(validate.rules).string.max_len = 512];
    /* extra headers sent on every delivery (e.g. Authorization: Bearer ...). */
    map<string, string> headers = 13 [(validate.rules).map.max_pairs = 16];

    uint32 timeout_seconds = 20 [(validate.rules).uint32 = {gte: 1, lte: 300}];
    uint32 max_retries = 21 [(validate.rules).uint32.lte = 10];
    bool enabled = 22;
    /* last_*_at — sender-updated cheaply for UI freshness; not for control flow. */
    optional google.protobuf.Timestamp last_success_at = 23;
    optional google.protobuf.Timestamp last_failure_at = 24;
    string last_failure_error = 25 [(validate.rules).string.max_len = 1024];
}

/* WebhookDeliveryState — outbox row lifecycle. */
enum WebhookDeliveryState {
    WEBHOOK_DELIVERY_STATE_UNSPECIFIED = 0;
    WEBHOOK_DELIVERY_STATE_PENDING     = 1;
    WEBHOOK_DELIVERY_STATE_IN_FLIGHT   = 2;
    WEBHOOK_DELIVERY_STATE_DELIVERED   = 3;
    WEBHOOK_DELIVERY_STATE_DEAD        = 4;
}

message WebhookDeliveryId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }

/* WebhookDelivery — durable outbox row. Worker drains state=PENDING and
   next_attempt_at<=now(), POSTs with HMAC signature, on failure schedules
   exponential backoff up to max_retries. */
message WebhookDelivery {
    message List {repeated WebhookDelivery deliveries = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "webhook_deliveries"
        indexes: [
            {name: "webhook_deliveries_drain_idx", columns: ["state", "next_attempt_at"]},
            {name: "webhook_deliveries_webhook_idx", columns: ["webhook_id"]}
        ]
    };

    WebhookDeliveryId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 2 [(goplain.field).embed = true];
    WebhookId webhook_id = 4 [
        (ratel.column).constraints = {
            references_table: "webhooks"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];

    WebhookEvent event = 10 [(validate.rules).enum.defined_only = true];
    bytes payload = 11 [(validate.rules).bytes.max_len = 1048576];
    WebhookDeliveryState state = 12 [(validate.rules).enum.defined_only = true];
    uint32 attempts = 13;
    optional google.protobuf.Timestamp next_attempt_at = 14;
    optional google.protobuf.Timestamp delivered_at = 15;
    string last_error = 16 [(validate.rules).string.max_len = 4096];
    optional uint32 last_status_code = 17;
}


message CreateWebhookRequest {
    Webhook webhook = 1 [(validate.rules).message = {required: true}];
}

message UpdateWebhookRequest {
    Webhook webhook = 1 [(validate.rules).message = {required: true}];
    google.protobuf.FieldMask update_mask = 2 [(validate.rules).message = {required: true}];
}

message TestWebhookRequest {
    WebhookId id = 1 [(validate.rules).message = {required: true}];
    /* Override event for test ping; default = RUN_STARTED. */
    WebhookEvent event = 2 [(validate.rules).enum.defined_only = true];
}

message TestWebhookResponse {
    bool delivered = 1;
    uint32 status_code = 2;
    string error = 3;
    uint32 latency_ms = 4;
}


service WebhookService {
    rpc CreateWebhook (CreateWebhookRequest) returns (Webhook)      { option idempotency_level = IDEMPOTENT; }
    rpc UpdateWebhook (UpdateWebhookRequest) returns (Webhook)      { option idempotency_level = IDEMPOTENT; }
    rpc DeleteWebhook (WebhookId)            returns (Webhook)      { option idempotency_level = IDEMPOTENT; }
    rpc GetWebhook    (WebhookId)            returns (Webhook)      { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc ListWebhooks  (cloud.v1.iam.TenantId) returns (Webhook.List) { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc TestWebhook   (TestWebhookRequest)   returns (TestWebhookResponse) { option idempotency_level = IDEMPOTENT; }
}
