syntax = "proto3";

package cloud.v1.workflow;

import "cloud/v1/common/ip.proto";
import "cloud/v1/deployment/docker.proto";
import "cloud/v1/deployment/infrastructure.proto";
import "cloud/v1/deployment/plan.proto";
import "cloud/v1/deployment/quota.proto";
import "cloud/v1/deployment/render.proto";
import "cloud/v1/deployment/terraform.proto";
import "cloud/v1/domain/database.proto";
import "cloud/v1/topology/topology.proto";
import "temporal/v1/temporal.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/workflow";

/*
    deployment.proto defines workflows and activities for the staged deployment
    pipeline: provider infrastructure, deployment-plan rendering, and
    agent-plan execution.
 */

/*
    ProcessInfrastructureWorkflowRequest is the input to provider provisioning.
 */
message ProcessInfrastructureWorkflowRequest {
    /*
        plan is the provider-specific infrastructure plan to materialize.
     */
    deployment.InfrastructurePlan plan = 1 [(validate.rules).message.required = true];
}

/*
    ProcessInfrastructureWorkflowResponse is provider runtime output.
 */
message ProcessInfrastructureWorkflowResponse {
    /*
        state is the runtime provider state after apply/up.
     */
    deployment.InfrastructureState state = 1 [(validate.rules).message.required = true];
}

/*
    CalculateQuotasWorkflowRequest asks to compute quota requests for a plan.
 */
message CalculateQuotasWorkflowRequest {
    /*
        plan is the infrastructure plan to compute quotas for.
     */
    deployment.InfrastructurePlan plan = 1 [(validate.rules).message.required = true];
}

/*
    CalculateQuotasWorkflowResponse returns quota requests keyed by node id.
 */
message CalculateQuotasWorkflowResponse {
    /*
        plan is the plan the quotas were computed for.
     */
    deployment.InfrastructurePlan plan = 1 [(validate.rules).message.required = true];
    /*
        quota_requests are requested quotas keyed by topology node id.
     */
    map<string, deployment.Quota.Request> quota_requests = 2;
}

/*
    AcquireNetworkActivityRequest asks the provider to acquire a network.
 */
message AcquireNetworkActivityRequest {
    /*
        plan is the infrastructure plan whose provider settings drive network
        acquisition.
     */
    deployment.InfrastructurePlan plan = 1 [(validate.rules).message.required = true];
}

/*
    AcquireNetworkActivityResponse returns the acquired network.
 */
message AcquireNetworkActivityResponse {
    /*
        net is the network acquired from the provider.
     */
    common.Net net = 1;
}

/*
    AcquireQuotasActivityRequest asks the provider to acquire requested quotas.
 */
message AcquireQuotasActivityRequest {
    /*
        quota_requests are requested quotas keyed by topology node id.
     */
    map<string, deployment.Quota.Request> quota_requests = 1;
}

/*
    AcquireQuotasActivityResponse returns granted allocations keyed by node id.
 */
message AcquireQuotasActivityResponse {
    /*
        quota_allocations are granted allocations keyed by topology node id.
     */
    map<string, deployment.Quota.Allocation> quota_allocations = 1;
}

/*
    RenderDeploymentPlanWorkflowRequest asks to render install/config agent steps.
 */
message RenderDeploymentPlanWorkflowRequest {
    /*
        topology_spec is the provider-agnostic logical graph.
     */
    topology.TopologySpec topology_spec = 1 [(validate.rules).message.required = true];
    /*
        infrastructure_plan is provider input, including OS/image choices.
     */
    deployment.InfrastructurePlan infrastructure_plan = 2 [(validate.rules).message.required = true];
    /*
        infrastructure_state carries runtime facts such as addresses. It may be
        partially filled when a renderer can use logical hostnames instead.
     */
    deployment.InfrastructureState infrastructure_state = 3;
    /*
        render_overrides are user edits to editable render artifacts.
     */
    deployment.RenderOverrideSet render_overrides = 4;
    /*
        database is the engine input used by package resolution and config
        renderers. It is not topology because renderers need version/package and
        editable engine config values.
     */
    domain.Database database = 5 [(validate.rules).message.required = true];
}

/*
    RenderDeploymentPlanWorkflowResponse returns an executable deployment plan.
 */
message RenderDeploymentPlanWorkflowResponse {
    /*
        deployment_plan is the agent-executable plan.
     */
    deployment.DeploymentPlan deployment_plan = 1 [(validate.rules).message.required = true];
}

/*
    ExecuteDeploymentPlanWorkflowRequest asks to execute an agent plan.
 */
message ExecuteDeploymentPlanWorkflowRequest {
    /*
        deployment_plan is the plan to execute.
     */
    deployment.DeploymentPlan deployment_plan = 1 [(validate.rules).message.required = true];
    /*
        infrastructure_state is used to route steps to node agents.
     */
    deployment.InfrastructureState infrastructure_state = 2 [(validate.rules).message.required = true];
}

/*
    ExecuteDeploymentPlanWorkflowResponse returns the executed plan with statuses.
 */
message ExecuteDeploymentPlanWorkflowResponse {
    /*
        deployment_plan is the executed plan with statuses/results filled.
     */
    deployment.DeploymentPlan deployment_plan = 1 [(validate.rules).message.required = true];
}

/*
    DeploymentService groups the staged deployment workflows and provider
    activities.
 */
service DeploymentService {
    /*
        task_queue: shared queue for deployment workflows/activities.
     */
    option (temporal.v1.service) = {task_queue: "stroppy-cloud"};

    /*
        ProcessInfrastructureWorkflow provisions provider infrastructure.
     */
    rpc ProcessInfrastructureWorkflow (ProcessInfrastructureWorkflowRequest) returns (ProcessInfrastructureWorkflowResponse) {
        option (temporal.v1.workflow) = {
            name: "ProcessInfrastructureWorkflow"
            retry_policy: {max_attempts: 1}
        };
    }

    /*
        CalculateQuotasWorkflow computes quota requests from an infrastructure
        plan.
     */
    rpc CalculateQuotasWorkflow (CalculateQuotasWorkflowRequest) returns (CalculateQuotasWorkflowResponse) {
        option (temporal.v1.workflow) = {
            name: "CalculateQuotasWorkflow"
            run_timeout: {seconds: 300}
            retry_policy: {max_attempts: 3}
        };
    }

    /*
        AcquireNetworkActivity acquires a provider network.
     */
    rpc AcquireNetworkActivity (AcquireNetworkActivityRequest) returns (AcquireNetworkActivityResponse) {
        option (temporal.v1.activity) = {
            start_to_close_timeout: {seconds: 300}
            retry_policy: {max_attempts: 3, initial_interval: {seconds: 5}, backoff_coefficient: 2.0}
        };
    }

    /*
        AcquireQuotasActivity acquires requested quotas.
     */
    rpc AcquireQuotasActivity (AcquireQuotasActivityRequest) returns (AcquireQuotasActivityResponse) {
        option (temporal.v1.activity) = {
            start_to_close_timeout: {seconds: 300}
            retry_policy: {max_attempts: 3, initial_interval: {seconds: 5}, backoff_coefficient: 2.0}
        };
    }

    /*
        RenderDockerInputWorkflow renders infrastructure plan to Docker input.
     */
    rpc RenderDockerInputWorkflow (deployment.InfrastructurePlan) returns (deployment.Docker.Input) {
        option (temporal.v1.workflow) = {
            name: "RenderDockerInputWorkflow"
            run_timeout: {seconds: 60}
            retry_policy: {max_attempts: 3}
        };
    }

    /*
        DockerPullActivity pulls container images.
     */
    rpc DockerPullActivity (deployment.Docker.Input) returns (deployment.Docker.Output) {
        option (temporal.v1.activity) = {
            start_to_close_timeout: {seconds: 600}
            retry_policy: {max_attempts: 3, initial_interval: {seconds: 5}, backoff_coefficient: 2.0}
        };
    }

    /*
        DockerUpActivity starts the Docker topology.
     */
    rpc DockerUpActivity (deployment.Docker.Input) returns (deployment.Docker.Output) {
        option (temporal.v1.activity) = {
            start_to_close_timeout: {seconds: 600}
            heartbeat_timeout: {seconds: 60}
            retry_policy: {max_attempts: 3, initial_interval: {seconds: 5}}
        };
    }

    /*
        DockerDownActivity tears down the Docker topology.
     */
    rpc DockerDownActivity (deployment.Docker.Input) returns (deployment.Docker.Output) {
        option (temporal.v1.activity) = {
            start_to_close_timeout: {seconds: 300}
            retry_policy: {max_attempts: 3, initial_interval: {seconds: 5}}
        };
    }

    /*
        RenderTerraformVariablesWorkflow renders infrastructure plan to Terraform
        input.
     */
    rpc RenderTerraformVariablesWorkflow (deployment.InfrastructurePlan) returns (deployment.Terraform.Input) {
        option (temporal.v1.workflow) = {
            name: "RenderTerraformVariablesWorkflow"
            run_timeout: {seconds: 60}
            retry_policy: {max_attempts: 3}
        };
    }

    /*
        TerraformPlanActivity runs terraform plan.
     */
    rpc TerraformPlanActivity (deployment.Terraform.Input) returns (deployment.Terraform.Output) {
        option (temporal.v1.activity) = {
            start_to_close_timeout: {seconds: 900}
            heartbeat_timeout: {seconds: 60}
            retry_policy: {max_attempts: 2, initial_interval: {seconds: 10}}
        };
    }

    /*
        TerraformApplyActivity runs terraform apply.
     */
    rpc TerraformApplyActivity (deployment.Terraform.Input) returns (deployment.Terraform.Output) {
        option (temporal.v1.activity) = {
            start_to_close_timeout: {seconds: 1800}
            heartbeat_timeout: {seconds: 60}
            retry_policy: {max_attempts: 2, initial_interval: {seconds: 10}}
        };
    }

    /*
        TerraformDestroyActivity runs terraform destroy.
     */
    rpc TerraformDestroyActivity (deployment.Terraform.Input) returns (deployment.Terraform.Output) {
        option (temporal.v1.activity) = {
            start_to_close_timeout: {seconds: 1800}
            heartbeat_timeout: {seconds: 60}
            retry_policy: {max_attempts: 3, initial_interval: {seconds: 10}}
        };
    }

    /*
        RenderDeploymentPlanWorkflow renders package/config/agent steps.
     */
    rpc RenderDeploymentPlanWorkflow (RenderDeploymentPlanWorkflowRequest) returns (RenderDeploymentPlanWorkflowResponse) {
        option (temporal.v1.workflow) = {
            name: "RenderDeploymentPlanWorkflow"
            run_timeout: {seconds: 300}
            retry_policy: {max_attempts: 3}
        };
    }

    /*
        ExecuteDeploymentPlanWorkflow executes rendered agent steps.
     */
    rpc ExecuteDeploymentPlanWorkflow (ExecuteDeploymentPlanWorkflowRequest) returns (ExecuteDeploymentPlanWorkflowResponse) {
        option (temporal.v1.workflow) = {
            name: "ExecuteDeploymentPlanWorkflow"
            retry_policy: {max_attempts: 1}
        };
    }
}
