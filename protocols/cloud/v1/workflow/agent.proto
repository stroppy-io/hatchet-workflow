syntax = "proto3";

package cloud.v1.workflow;

import "cloud/v1/common/cmd.proto";
import "cloud/v1/common/dir.proto";
import "cloud/v1/common/file.proto";
import "google/protobuf/empty.proto";
import "temporal/v1/temporal.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/workflow";

/*
    agent.proto defines the Temporal activities the server invokes against an
    agent host: ensuring the agent is online, creating directories, writing
    files, and running commands. These are the low-level building blocks that the
    higher-level test/deployment workflows compose, each annotated with its own
    timeout/heartbeat/retry policy. It also carries AgentBootstrap, the runtime
    control-plane data delivered to every provisioned agent.
 */

/*
    AgentBootstrap is the provider-independent startup contract for every agent.
    It is runtime control-plane data, not topology and not provider settings.
 */
message AgentBootstrap {
    /*
        server_addr is the public/base control-plane address agents use to reach
        the server and Temporal proxy, e.g. http://10.0.0.10:8080.
     */
    string server_addr = 1 [(validate.rules).string.max_len = 2048];
    /*
        binary_url overrides the agent binary URL. Empty means
        server_addr + "/agent/binary".
     */
    string binary_url = 2 [(validate.rules).string.max_len = 2048];
    /*
        temporal_namespace is the namespace agents use when registering their
        Temporal worker. Empty means default.
     */
    string temporal_namespace = 3 [(validate.rules).string.max_len = 128];
    /*
        extra_env is appended to the agent env file. Core STROPPY and AGENT
        fields are still rendered by the system and win over this map.
     */
    map<string, string> extra_env = 4 [(validate.rules).map = {
        max_pairs: 64,
        keys: {string: {min_len: 1, max_len: 256, pattern: "^[A-Z_][A-Z0-9_]*$"}},
        values: {string: {max_len: 8192}}
    }];
    /*
        agent_tokens carries per-node bearer tokens. The renderer injects only
        the token matching the current node into that node's env as
        STROPPY_AGENT_TOKEN; it must not be rendered as generic extra env.
     */
    map<string, string> agent_tokens = 5 [(validate.rules).map = {
        max_pairs: 1024,
        keys: {string: {min_len: 1, max_len: 256}},
        values: {string: {min_len: 1, max_len: 8192}}
    }];
    /*
        agent_task_queues carries the per-node Temporal task queue name. It is
        generated with a per-run secret suffix and rendered only to the matching
        node so a valid agent token alone is not enough to poll another node's
        work.
     */
    map<string, string> agent_task_queues = 6 [(validate.rules).map = {
        max_pairs: 1024,
        keys: {string: {min_len: 1, max_len: 256}},
        values: {string: {min_len: 1, max_len: 512}}
    }];
}

/*
    AgentCommandService groups the agent-facing Temporal activities that perform
    filesystem and command work on an agent host.
 */
service AgentCommandService {
    /*
        task_queue: shared queue for the agent-facing activities.
    */
    option (temporal.v1.service) = {task_queue: "stroppy-cloud"};

    /*
        EnsureAgentOnlineActivity blocks until the target agent reports online,
        heartbeating while it polls.
     */
    rpc EnsureAgentOnlineActivity (google.protobuf.Empty) returns (google.protobuf.Empty) {
        option (temporal.v1.activity) = {
            /*
                start_to_close_timeout: a single attempt waits up to 15m for the
                agent to report online.
            */
            start_to_close_timeout: {seconds: 900}
            /*
                heartbeat_timeout: the activity must heartbeat while polling, so a
                dead worker is detected within 60s instead of after 15m.
            */
            heartbeat_timeout: {seconds: 60}
            /*
                retry_policy: an agent may take a while to come up; keep retrying
                with backoff. Unlimited attempts (max_attempts 0) bounded by the
                caller's schedule/run timeout.
            */
            retry_policy: {initial_interval: {seconds: 5}, backoff_coefficient: 2.0, max_interval: {seconds: 60}, max_attempts: 0}
        };
    }
    /*
        CreateDirActivity creates a directory on the agent host (mkdir -p
        semantics).
     */
    rpc CreateDirActivity (common.Dir) returns (google.protobuf.Empty) {
        option (temporal.v1.activity) = {
            start_to_close_timeout: {seconds: 30}
            /*
                Idempotent (mkdir -p semantics) => safe to retry a few times.
            */
            retry_policy: {max_attempts: 3, initial_interval: {seconds: 2}}
        };
    };
    /*
        CreateTempDirActivity creates a fresh temporary directory on the agent
        host and returns its path.
     */
    rpc CreateTempDirActivity (common.Dir.Temp) returns (common.Dir) {
        option (temporal.v1.activity) = {
            start_to_close_timeout: {seconds: 30}
            /*
                NOT idempotent: each attempt creates a new temp dir. Retry once
                only to avoid leaking directories on a flaky network.
            */
            retry_policy: {max_attempts: 1}
        };
    };
    /*
        WriteFileActivity writes a file's full contents to the agent host.
     */
    rpc WriteFileActivity (common.File) returns (google.protobuf.Empty) {
        option (temporal.v1.activity) = {
            start_to_close_timeout: {seconds: 30}
            /*
                Idempotent (full-content write) => safe to retry.
            */
            retry_policy: {max_attempts: 3, initial_interval: {seconds: 2}}
        };
    };
    /*
        FetchFileActivity downloads a file/binary by reference (URL / S3 minio) to
        the agent host at File.info.path and caches it by File.AsRef.checksum (e.g.
        the stroppy binary, packages). Idempotent given the checksum => retryable.
     */
    rpc FetchFileActivity (common.File) returns (google.protobuf.Empty) {
        option (temporal.v1.activity) = {
            start_to_close_timeout: {seconds: 600}
            heartbeat_timeout: {seconds: 60}
            retry_policy: {max_attempts: 3, initial_interval: {seconds: 5}, backoff_coefficient: 2.0}
        };
    };
    /*
        CallCmdActivity runs a command on the agent host (including the long
        stroppy load) and returns its result, heartbeating while it runs.
     */
    rpc CallCmdActivity (common.Cmd) returns (common.Cmd.Result) {
        option (temporal.v1.activity) = {
            /*
                start_to_close_timeout: this activity runs the actual stroppy load,
                which can stream terabytes over many days. Set a deliberately huge
                cap (30d) so a long-but-healthy command is never killed by the wall
                clock; real liveness comes from the heartbeat below. Short commands
                finish well within this and the cap costs nothing. Per-call override
                in code is still possible for cmds that should be capped tighter.
            */
            start_to_close_timeout: {seconds: 2592000}
            /*
                heartbeat_timeout: the command must heartbeat while running, so a
                stuck/dead worker is detected within 60s instead of waiting out the
                30d cap. This is the real liveness mechanism for long loads.
            */
            heartbeat_timeout: {seconds: 60}
            /*
                retry_policy: a command is NOT guaranteed idempotent, so do not
                auto-retry. The caller must make commands idempotent if it wants
                retries.
            */
            retry_policy: {max_attempts: 1}
        };
    };
}

