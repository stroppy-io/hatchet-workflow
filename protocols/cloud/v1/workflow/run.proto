syntax = "proto3";

package cloud.v1.workflow;

import "cloud/v1/deployment/infrastructure.proto";
import "cloud/v1/deployment/plan.proto";
import "cloud/v1/deployment/render.proto";
import "cloud/v1/workflow/deployment.proto";
import "cloud/v1/domain/database.proto";
import "cloud/v1/domain/workload.proto";
import "cloud/v1/topology/topology.proto";
import "google/protobuf/empty.proto";
import "temporal/v1/temporal.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/workflow";

/*
    run.proto defines the top-level workflow input. A run is staged: logical
    topology -> infrastructure plan/state -> deployment plan -> workload.
 */

/*
    RunConfig is the durable input to one benchmark run workflow.
 */
message RunConfig {
    /*
        id is the stable run identifier.
     */
    string id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /*
        database is the database under test.
     */
    domain.Database database = 2 [(validate.rules).message.required = true];
    /*
        workload is the workload to run against the database.
     */
    domain.Workload workload = 3 [(validate.rules).message.required = true];
    /*
        topology_spec is the provider-agnostic logical graph.
     */
    topology.TopologySpec topology_spec = 4 [(validate.rules).message.required = true];
    /*
        infrastructure_plan is the provider-specific machine/resource intent.
     */
    deployment.InfrastructurePlan infrastructure_plan = 5 [(validate.rules).message.required = true];
    /*
        infrastructure_state is filled after provider provisioning. It may be
        empty at workflow start and carried forward by the workflow.
     */
    deployment.InfrastructureState infrastructure_state = 6;
    /*
        deployment_plan is filled after package/config rendering. It may be empty
        at workflow start and carried forward by the workflow.
     */
    deployment.DeploymentPlan deployment_plan = 7;
    /*
        render_overrides are user edits to editable render artifacts. Workflow
        renderers apply them when producing deployment_plan.
     */
    deployment.RenderOverrideSet render_overrides = 8;
    /*
        agent_bootstrap is runtime control-plane data delivered to provisioned
        agents through the provider-specific carrier.
     */
    AgentBootstrap agent_bootstrap = 9;
}

/*
    RunWorkflowService is the top-level Temporal workflow over all stages.
 */
service RunWorkflowService {
    /*
        task_queue: the shared server-side worker queue.
     */
    option (temporal.v1.service) = {task_queue: "stroppy-cloud"};

    /*
        TestRunWorkflow runs one full benchmark run:
        infrastructure -> deployment plan render -> agent execution -> workload.
     */
    rpc TestRunWorkflow (RunConfig) returns (google.protobuf.Empty) {
        option (temporal.v1.workflow) = {
            name: "TestRunWorkflow"
            id: 'run/${! id }'
            id_reuse_policy: WORKFLOW_ID_REUSE_POLICY_ALLOW_DUPLICATE_FAILED_ONLY
            retry_policy: {max_attempts: 1}
        };
    }
}
