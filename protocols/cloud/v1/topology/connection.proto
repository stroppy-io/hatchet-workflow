syntax = "proto3";

package cloud.v1.topology;

import "cloud/v1/common/tags.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/topology";

/*
    connection.proto defines logical communication edges between components.
    Runtime addresses are resolved later from deployment.InfrastructureState.
 */

/*
    Connection is a directed logical edge from one component to another.
 */
message Connection {
    /*
        Kind is the semantic relationship represented by the edge.
     */
    enum Kind {
        KIND_UNSPECIFIED = 0;
        KIND_FLOW = 1;
        KIND_PROXY = 2;
        KIND_REPLICATION = 3;
        KIND_COORDINATION = 4;
        KIND_OBSERVATION = 5;
        KIND_SUPPORT = 6;
    }

    /*
        Protocol is the wire/protocol family carried over the edge.
     */
    enum Protocol {
        PROTOCOL_UNSPECIFIED = 0;
        PROTOCOL_TCP = 1;
        PROTOCOL_GRPC = 2;
        PROTOCOL_HTTP = 3;
        PROTOCOL_REPLICATION = 4;
        PROTOCOL_POOL = 5;
        PROTOCOL_CONTROL = 6;
        PROTOCOL_OTLP = 7;
        PROTOCOL_PROMETHEUS_REMOTE_WRITE = 8;
        PROTOCOL_PROMETHEUS_PULL = 9;
    }

    /*
        Mode is the traffic character of the edge.
     */
    enum Mode {
        MODE_UNSPECIFIED = 0;
        MODE_REQUEST = 1;
        MODE_STREAM = 2;
        MODE_SYNC = 3;
        MODE_HEARTBEAT = 4;
        MODE_BROADCAST = 5;
    }

    /*
        from_component_id is the source component id.
     */
    string from_component_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /*
        to_component_id is the destination component id.
     */
    string to_component_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /*
        kind is the semantic relationship.
     */
    Kind kind = 3 [(validate.rules).enum.defined_only = true];
    /*
        protocol is the protocol family.
     */
    Protocol protocol = 4 [(validate.rules).enum.defined_only = true];
    /*
        mode is the traffic character.
     */
    Mode mode = 5 [(validate.rules).enum.defined_only = true];
    /*
        endpoint_name optionally selects a named destination endpoint, e.g.
        postgres, pgbouncer, patroni_rest, etcd_peer. Empty means renderer
        chooses the role default.
     */
    string endpoint_name = 6 [(validate.rules).string.max_len = 64];
    /*
        port is the destination port when it is known at spec time.
     */
    optional uint32 port = 7 [(validate.rules).uint32.lte = 65535];
    /*
        colocated is true when this edge intentionally stays inside one node.
     */
    bool colocated = 8;
    /*
        tags are arbitrary metadata on the edge.
     */
    common.Tags tags = 9;
}
