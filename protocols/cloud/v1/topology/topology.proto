syntax = "proto3";

package cloud.v1.topology;

import "cloud/v1/common/tags.proto";
import "cloud/v1/deployment/infrastructure.proto";
import "cloud/v1/deployment/plan.proto";
import "cloud/v1/topology/component.proto";
import "cloud/v1/topology/connection.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/topology";

/*
    topology.proto defines the staged deployment model. TopologySpec is the
    provider-agnostic graph. Topology is an envelope that can accumulate later
    stage artifacts without making the spec itself depend on runtime facts.
 */

/*
    Node is a logical placement unit. A node may become a VM, a Docker container,
    or a managed/external provider resource after the infrastructure stage.
 */
message Node {
    /*
        id is the stable logical node id.
     */
    string id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /*
        component_ids are the components intentionally colocated on this node.
     */
    repeated string component_ids = 2 [(validate.rules).repeated = {min_items: 1, max_items: 64, items: {string: {min_len: 1, max_len: 128}}}];
    /*
        labels are structured metadata used by planners and UI.
     */
    map<string, string> labels = 3 [(validate.rules).map.max_pairs = 128];
    /*
        tags are arbitrary user/system tags.
     */
    common.Tags tags = 4;
}

/*
    TopologySpec is the pure logical graph produced from domain params.
 */
message TopologySpec {
    /*
        nodes are logical placement units.
     */
    repeated Node nodes = 1 [(validate.rules).repeated.min_items = 1];
    /*
        components are logical services/roles.
     */
    repeated Component components = 2 [(validate.rules).repeated.min_items = 1];
    /*
        connections are logical edges between components. Single-node topologies
        may legitimately have no edges.
     */
    repeated Connection connections = 3;
    /*
        external_components are logical components not deployed by this run.
     */
    repeated Component external_components = 4 [(validate.rules).repeated.max_items = 64];
    /*
        labels are structured metadata attached to the spec.
     */
    map<string, string> labels = 5 [(validate.rules).map.max_pairs = 128];
    /*
        tags are arbitrary user/system tags.
     */
    common.Tags tags = 6;
}

/*
    Topology is the full staged object for a run or wizard draft.
 */
message Topology {
    /*
        State records the furthest stage represented by the envelope.
     */
    enum State {
        STATE_UNSPECIFIED = 0;
        STATE_SPEC = 1;
        STATE_INFRASTRUCTURE_PLANNED = 2;
        STATE_INFRASTRUCTURE_DEPLOYED = 3;
        STATE_DEPLOYMENT_PLANNED = 4;
        STATE_DEPLOYED = 5;
        STATE_UNDEPLOYED = 6;
        STATE_ARCHIVE = 7;
    }

    /*
        state records the current stage.
     */
    State state = 1 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    /*
        spec is the logical graph.
     */
    TopologySpec spec = 2 [(validate.rules).message.required = true];
    /*
        infrastructure_plan is provider input derived from spec + provider
        choices. Present from STATE_INFRASTRUCTURE_PLANNED.
     */
    deployment.InfrastructurePlan infrastructure_plan = 3;
    /*
        infrastructure_state is provider output: ids, addresses, allocated
        quotas. Present from STATE_INFRASTRUCTURE_DEPLOYED.
     */
    deployment.InfrastructureState infrastructure_state = 4;
    /*
        deployment_plan is the agent execution plan. Present from
        STATE_DEPLOYMENT_PLANNED.
     */
    deployment.DeploymentPlan deployment_plan = 5;
    /*
        tags are arbitrary metadata on the envelope.
     */
    common.Tags tags = 6;
}
