syntax = "proto3";

package cloud.v1.topology;

import "cloud/v1/common/cmd.proto";
import "cloud/v1/common/file.proto";
import "cloud/v1/common/status.proto";
import "cloud/v1/common/tags.proto";
import "schemapb/schema.proto";

import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/topology";

message Component {
    string id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
    enum Kind {
        KIND_UNSPECIFIED = 0;
        KIND_AGENT = 1;
        KIND_MONITOR = 2;
        KIND_DATABASE = 3;
        KIND_REPLICA = 4;
        KIND_PROXY = 5;
        KIND_WORKLOAD = 6;
        KIND_COORDINATOR = 7;
        KIND_ADDON = 8;
        KIND_EXTERNAL = 9;
    }
    Kind kind = 2 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    common.Status status = 3;
    message Strategy {
        repeated common.BakedFile configuration_files = 1;
        repeated common.Cmd deployment_commands = 2;
    }
    Strategy deployment_strategy = 4; // calculated (build)
    optional schemapb.Baked provider_parms = 5; // calculated (wisard actual for non-owr components)
    optional string allocated_on_instance_id = 6; // calculated (deployment)
    common.Tags tags = 7;
}

