syntax = "proto3";

package cloud.v1.domain;

import "cloud/v1/common/tags.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/domain";

// Worker is a unit that executes pipeline stages: the master (orchestrator) or an
// agent (on a host). The live pipeline / worker info lives in monitor/overview.proto.
message Worker {
    string id = 1;
    enum Kind {
        KIND_UNSPECIFIED = 0;
        KIND_MASTER = 1;
        KIND_AGENT = 2;
    }
    Kind kind = 2;
    common.Tags tags = 3;
}
