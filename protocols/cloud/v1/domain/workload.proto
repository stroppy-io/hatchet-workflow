syntax = "proto3";

package cloud.v1.domain;

import "cloud/v1/common/tags.proto";
import "validate/validate.proto";
import "ogen/ogen.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/domain";

/*
    Workload is the cloud-facing workload DTO sent by the wizard. It is a thin
    outer envelope — what is shared across the whole run — wrapping an ordered list
    of Segments, each a self-contained stroppy invocation against the SAME database.

    Shared at this level because it is structurally forced or DB-bound:
      - stroppy_version: the binary installs ONCE per runner node, so one version
        per run (a single selector for which stroppy the load needs).
      - protocol (driver type): every segment hits the one provisioned DB, so the
        wire format is shared.

    Everything that legitimately varies per phase (script, k6 profile, parameters,
    run-scoped files, step filter) lives on Segment. The canonical use is a
    "bootstrap" segment (create_schema + load_data) followed by a "workload" segment
    (the measured load) so Grafana averages are not polluted by load time; but N
    segments are allowed (multiple benchmarks back to back on one DB), default 1.

    Segments run SEQUENTIALLY on a single DB (not in parallel) — each is rendered
    into its own stroppy RunConfig protojson and gets its own execution time window.

    These are the params the user supplies AROUND the probe: the wizard sends the
    base fields (version, script, sql, files, protocol, scale_factor, pool_size) to
    `stroppy probe`; the frontend renders the discovered structure (env
    declarations, steps, sql sections, driver setups) itself; the user's choices
    land back in Parameters (env values, steps) + Execution. The probe OUTPUT is
    intentionally NOT modelled in proto — it is stroppy-version-specific and
    rendered client-side.

    protocol x engine support and the (kind, protocol, script) compatibility matrix
    stay backend data + validation, enforced when a preset binds Database.Kind to
    Workload.Protocol — intentionally not modeled in proto.
 */
message Workload {
    /*
        Protocol is the cloud-side wire-format selector. The backend maps this plus
        Database.Kind into stroppy driverType/url in stroppy-config.json.
     */
    enum Protocol {
        /* UNSPECIFIED defers to backend default per Database.Kind. */
        PROTOCOL_UNSPECIFIED = 0;
        /* PG is Postgres / CockroachDB / Yugabyte pg-wire. */
        PROTOCOL_PG = 1;
        /* MYSQL is MySQL / MariaDB / Percona / Vitess. */
        PROTOCOL_MYSQL = 2;
        /* PICODATA is Picodata-aware pg-wire routing. */
        PROTOCOL_PICODATA = 3;
        /* YDB_GRPC is YDB native gRPC. */
        PROTOCOL_YDB_GRPC = 4;
        /* YDB_GRPCS is YDB native gRPC over TLS. */
        PROTOCOL_YDB_GRPCS = 5;
        /* COCKROACH is CockroachDB pg-wire on its own default port. */
        PROTOCOL_COCKROACH = 7;
    }

    /*
        Execution is the k6 execution profile. Limit is exclusive: duration OR
        iterations.
     */
    message Execution {
        /* vus is virtual users (k6 --vus). */
        uint32 vus = 1 [(validate.rules).uint32 = {gte: 1, lte: 100000}];
        oneof limit {
            option (ogen.oneof) = { schema_mode: ONEOF_SCHEMA_MODE_OBJECT };
            option (validate.required) = true;
            /* duration maps to k6 --duration, format like "10m", "1h30m". */
            string duration = 2 [(validate.rules).string = {max_len: 32, pattern: "^([0-9]+(ns|us|ms|s|m|h))+$"}];
            /* iterations maps to k6 --iterations, fixed iteration count. */
            uint32 iterations = 3 [(validate.rules).uint32.gte = 1];
        }
        /* quiet maps to k6 -q. */
        bool quiet = 4;
        /* no_thresholds maps to k6 --no-thresholds. */
        bool no_thresholds = 5;
    }

    /*
        Parameters are workload/script parameters rendered into stroppy env, driver
        config, and step filters.
     */
    message Parameters {
        /* pool_size is DB connection pool size on the stroppy side. */
        uint32 pool_size = 1 [(validate.rules).uint32.lte = 65535];
        /* scale_factor is TPC-C warehouses / TPC-B branches / TPC-H scale factor.
           Fractional values are valid for smoke tests, e.g. TPCH SCALE_FACTOR=0.01. */
        double scale_factor = 2 [(validate.rules).double = {gt: 0, lte: 100000}];
        /* default_insert_method overrides insert method. "native" by default. */
        string default_insert_method = 3 [(validate.rules).string.max_len = 64];
        /* env are script-specific env overrides (POSIX-style key) — the values the
           user filled for the env declarations the probe reported. */
        map<string, string> env = 4 [(validate.rules).map = {
            max_pairs: 256,
            keys: {string: {min_len: 1, max_len: 256, pattern: "^[A-Z_][A-Z0-9_]*$"}},
            values: {string: {max_len: 8192}}
        }];
        /* steps is a phase allowlist (e.g. create_schema, load_data, workload).
           Mutually exclusive with no_steps — backend enforces. */
        repeated string steps = 5 [(validate.rules).repeated = {
            max_items: 32,
            items: {string: {min_len: 1, max_len: 64, pattern: "^[a-z][a-z0-9_]*$"}}
        }];
        /* no_steps is a phase blocklist. Mutually exclusive with steps. */
        repeated string no_steps = 6 [(validate.rules).repeated = {
            max_items: 32,
            items: {string: {min_len: 1, max_len: 64, pattern: "^[a-z][a-z0-9_]*$"}}
        }];
        /* bulk_size is rows per bulk INSERT for the plain_bulk insert method
           (stroppy driver bulkSize; default 2500 when unset). Only meaningful
           when default_insert_method == "plain_bulk". 0 means use the default. */
        uint32 bulk_size = 7 [(validate.rules).uint32.lte = 1000000];
    }

    /* WorkloadFile is a run-scoped file staged for stroppy (SQL probes, support files). */
    message WorkloadFile {
        /* name is the file basename inside the run dir. */
        string name = 1 [(validate.rules).string = {min_len: 1, max_len: 256, pattern: "^[A-Za-z0-9._-]+$"}];
        /* kind tags file usage, e.g. "sql", "config". */
        string kind = 2 [(validate.rules).string.max_len = 32];
        /* content is the raw file content. */
        string content = 3 [(validate.rules).string.max_bytes = 4194304];
    }

    /*
        Segment is one self-contained stroppy invocation in the run's sequence. Each
        segment is rendered into its own stroppy RunConfig and runs against the same
        DB, in order, with its own execution time window (so per-segment Grafana /
        metrics scoping is possible). A run has >= 1 segment; the common 2-segment
        shape is a "bootstrap" segment (steps: create_schema, load_data) followed by
        a measured "workload" segment.
     */
    message Segment {
        /* name is a human label for the segment, e.g. "bootstrap", "workload".
           Surfaced as the stage phase and the Grafana time-window label. */
        string name = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
        /* script is a stroppy-accepted script/preset/path/inline SQL,
           e.g. "tpcc/tx", "tpcds", "./bench.ts", "queries.sql". */
        string script = 2 [(validate.rules).string = {min_len: 1, max_len: 512}];
        /* sql is an optional second stroppy positional arg, e.g. an SQL probe file. */
        string sql = 3 [(validate.rules).string.max_len = 512];
        /* execution is the k6 execution profile for this segment. */
        Execution execution = 4 [(validate.rules).message.required = true];
        /* parameters are workload/script parameters for this segment. */
        Parameters parameters = 5;
        /* files are run-scoped files staged next to this segment's stroppy-config.json. */
        repeated WorkloadFile files = 6 [(validate.rules).repeated.max_items = 64];
    }

    reserved 2, 3, 5, 6, 7;
    reserved "script", "sql", "execution", "parameters", "files";

    /* stroppy_version is the stroppy binary version/tag the load needs. Shared
       across all segments: the binary installs once per runner node. */
    string stroppy_version = 1 [(validate.rules).string.max_len = 64];
    /* protocol selects wire format. UNSPECIFIED means backend default for Database.Kind.
       Shared across all segments: every segment hits the one provisioned DB. */
    Protocol protocol = 4 [(validate.rules).enum.defined_only = true];

    /* segments is the ordered list of stroppy invocations run back to back on the
       same DB. At least one; the first is typically bootstrap, the rest measured. */
    repeated Segment segments = 9 [(validate.rules).repeated = {min_items: 1, max_items: 16}];

    /* tags are free-form metadata attached to the workload. */
    common.Tags tags = 8;
}
