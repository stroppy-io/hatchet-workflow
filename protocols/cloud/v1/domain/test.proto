syntax = "proto3";

package cloud.v1.domain;

import "cloud/v1/common/tags.proto";
import "cloud/v1/deployment/infrastructure.proto";
import "cloud/v1/deployment/render.proto";
import "cloud/v1/domain/database.proto";
import "cloud/v1/domain/workload.proto";
import "cloud/v1/topology/topology.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/domain";

/*
    test.proto defines Test (what to test, provider-agnostic) and TestRun (a
    concrete execution input). A Test pairs a Database with a Workload; baking it
    derives a logical topology spec and an infrastructure plan. Runtime provider
    outputs and agent deployment plans are NOT part of domain.TestRun.
 */

/*
    Test is an abstract, provider-agnostic test definition: what to test.
    TopologySpec is derived from params later; provider infrastructure is chosen
    only when creating a TestRun.
 */
message Test {
    /* database is the database under test. */
    Database database = 1 [(validate.rules).message.required = true];
    /* workload is the stroppy workload to run against the database. */
    Workload workload = 2 [(validate.rules).message.required = true];
    /* tags are free-form metadata attached to the test definition. */
    common.Tags tags = 3;
}

/*
    TestRun is the durable input for a concrete execution. It is fully specified
    up to provider infrastructure intent. Runtime facts (IPs/resource ids) and
    rendered agent steps are produced by workflow stages and stored in the run
    record, not in this domain object.
 */
message TestRun {
    /*
        id is the stable test-run identifier. It may be empty in API start
        payloads because the server mints the persisted run id before launch.
     */
    string id = 1 [(validate.rules).string = {max_len: 64}];

    /* suite_id is the owning suite. Empty for a standalone (non-suite) run. */
    string suite_id = 2;

    /* database is the database under test (self-deploy / managed / external). */
    Database database = 3 [(validate.rules).message.required = true];

    /* workload is the stroppy workload to run on top of the database. */
    Workload workload = 4 [(validate.rules).message.required = true];

    /* topology_spec is the provider-agnostic logical graph. */
    topology.TopologySpec topology_spec = 5 [(validate.rules).message.required = true];

    /* infrastructure_plan is the provider-specific resource intent. */
    deployment.InfrastructurePlan infrastructure_plan = 6 [(validate.rules).message.required = true];

    /* render_overrides are user edits to editable render artifacts. */
    deployment.RenderOverrideSet render_overrides = 8;

    /* tags are free-form metadata attached to the test run. */
    common.Tags tags = 7;
}
