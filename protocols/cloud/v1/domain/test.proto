syntax = "proto3";

package cloud.v1.domain;

import "cloud/v1/common/tags.proto";
import "cloud/v1/deployment/provider.proto";
import "cloud/v1/domain/database.proto";
import "cloud/v1/domain/workload.proto";
import "cloud/v1/topology/topology.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/domain";

// Abstract test definition: what to test, provider-agnostic.
// Topology is derived from params (e.g. database replica count) in code; the
// provider is chosen later, and the wizard fills provider_parms into a TestRun.
message Test {
    Database database = 1 [(validate.rules).message.required = true];
    Workload workload = 2 [(validate.rules).message.required = true];
    common.Tags tags = 3;
}

// A single, fully-baked test execution.
// All fields are baked at creation time; TestWorkflow does not mutate the
// topology, only carries runtime info returned by the deployment.
message TestRun {
    string id = 1 [(validate.rules).string = {min_len: 1}];

    // Owning suite. Empty for a standalone (non-suite) run.
    string suite_id = 2;

    // Where/how to provision the stand: backend + baked provider settings.
    deployment.ProviderSettings provider = 3 [(validate.rules).message.required = true];

    // Baked topology: stroppy runner instances (+ db instances when self-deploy),
    // and external_components when the database is external.
    topology.Topology topology = 4 [(validate.rules).message.required = true];

    // Database under test (self-deploy / managed / external).
    Database database = 5 [(validate.rules).message.required = true];

    // Stroppy workload to run on top of the database.
    Workload workload = 6 [(validate.rules).message.required = true];

    common.Tags tags = 7;
}
