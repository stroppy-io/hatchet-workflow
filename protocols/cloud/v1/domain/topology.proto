syntax = "proto3";

package cloud.v1.domain;

import "cloud/v1/common/tags.proto";
import "cloud/v1/runtime/render/config.proto";
import "cloud/v1/runtime/system/net.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/domain";

message Topology {
    /*
      Component is a runtime+output bundle.
      It is a collection of configs and tags.
      It is a reference to a deployment machine or addon.
   */
    message Component {
        string id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
        runtime.render.Config config = 2 [(validate.rules).message.required = true];
        common.Tags tags = 3;
    }
    message Machine {
        /* cores is VM vCPU count. */
        uint32 cores = 1 [(validate.rules).uint32.gt = 0];
        /* memory_gb is VM RAM in GiB. */
        uint64 memory_gb = 2 [(validate.rules).uint64.gt = 0];

        repeated Component components = 3 [(validate.rules).repeated.min_items = 1];
    }
    repeated Machine machines = 2 [(validate.rules).repeated.min_items = 1];
    /*
        Connection is a directed edge between two components.
        Kind encodes the whole interaction pattern (both endpoints' roles).
        from→to direction is fixed by Kind semantics.
     */
    message Connection {
        /* Kind is the interaction pattern on this edge. */
        enum Kind {
            KIND_UNSPECIFIED = 0;
            /* FLOW is plain client→server data traffic (producer→consumer). */
            KIND_FLOW = 1;
            /* PROXY is forwarder→target (haproxy, pgbouncer, proxysql). */
            KIND_PROXY = 2;
            /* REPLICATION is primary→replica state propagation. */
            KIND_REPLICATION = 3;
            /* COORDINATION is symmetric peer↔peer (raft, gossip). */
            KIND_COORDINATION = 4;
            /* OBSERVATION is observer→target (metrics/logs/traces scrape). */
            KIND_OBSERVATION = 5;
            /* SUPPORT is sidecar→target auxiliary services. */
            KIND_SUPPORT = 6;
        }

        /* from is the source Component.id. */
        string from = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
        /* to is the destination Component.id. */
        string to = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
        /* protocol is the wire format on this edge. */
        runtime.system.Net.Protocol protocol = 3 [(validate.rules).enum.defined_only = true];
        /* mode is the traffic character on this edge. */
        runtime.system.Net.Mode mode = 4 [(validate.rules).enum.defined_only = true];
        /* kind is the interaction pattern on this edge. */
        Kind kind = 5 [(validate.rules).enum.defined_only = true];
        /* port is the destination port. Zero means unspecified. */
        uint32 port = 6 [(validate.rules).uint32.lte = 65535];
    }
    repeated Connection connections = 6 [(validate.rules).repeated.min_items = 1];
    common.Tags tags = 3;
}
