syntax = "proto3";

package cloud.v1.agent;

import "google/protobuf/timestamp.proto";
import "graphqlopt/graphql.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/agent";

/*
    registry.proto is the AGENT-FACING presence channel. The agent does its actual
    work via Temporal (polling activities), but it also registers + heartbeats to
    OUR server so the server knows which agents are online — this feeds
    monitor.WorkerInfo.online on the run overview and gates the reverse shell.

    Auth is the AGENT TOKEN, not the iam RBAC interceptor (no auth annotation).
 */

/*
    AgentInfo identifies an agent host.
 */
message AgentInfo {
    /*
        machine_id is the stable per-host identifier the agent registers under.
     */
    string machine_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /*
        host is the agent's hostname / network address (informational).
     */
    string host = 2 [(validate.rules).string.max_len = 256];
    /*
        agent_version is the running agent build version (for compatibility/audit).
     */
    string agent_version = 3 [(validate.rules).string.max_len = 64];
    /*
        run_id is the run this agent is provisioned for (scoping/audit), if any.
     */
    string run_id = 4 [(validate.rules).string.max_len = 128];
}

/*
    RegisterRequest announces an agent coming online to the server.
 */
message RegisterRequest {
    /*
        info is the identifying details of the agent host coming online.
     */
    AgentInfo info = 1 [(validate.rules).message.required = true];
}
/*
    RegisterResponse tells the agent it is registered and how often to heartbeat.
 */
message RegisterResponse {
    /*
        registered_at is the server clock time the agent was recorded online.
     */
    google.protobuf.Timestamp registered_at = 1;
    /*
        heartbeat_interval_seconds is the heartbeat cadence the server expects;
        the agent is considered offline after a missed window.
     */
    uint32 heartbeat_interval_seconds = 2;
}

/*
    HeartbeatRequest keeps an already-registered agent marked online.
 */
message HeartbeatRequest {
    /*
        machine_id is the host whose liveness is being refreshed.
     */
    string machine_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
}
/*
    HeartbeatResponse is the empty server acknowledgement of a heartbeat.
 */
message HeartbeatResponse {}

/*
    AgentRegistryService is the agent-facing presence channel: agents register
    and heartbeat so the server knows which agents are online.
 */
service AgentRegistryService {
    // agent→server registration/heartbeat. Not exposed via GraphQL.
    option (graphqlopt.service).skip = true;
    /*
        Register announces an agent coming online.
     */
    rpc Register (RegisterRequest) returns (RegisterResponse);
    /*
        Heartbeat keeps the agent marked online.
     */
    rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
}
