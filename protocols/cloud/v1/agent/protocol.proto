syntax = "proto3";

package cloud.v1.agent;

import "v1/common/timestamps.proto";
import "v1/catalog/package.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/agent";


/* Command — server → agent. Single envelope; payload is an Action oneof.
   Replaces the legacy 27-action enum + untyped JSON Config.

   Semantics: server-side handler decomposes each DAG spec into a sequence
   of agent Commands. Agent executes verb, streams LogLine's, posts Report. */
message Command {
    string id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    /* machine_id — self-tag of the target machine. Agent verifies its own
       identity matches before executing (defence-in-depth). */
    string machine_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
    /* run_id — DagRun id this command belongs to. Used for log correlation
       and audit. Engine-opaque to the agent. */
    string run_id = 3 [(validate.rules).string.max_len = 26];
    Action action = 10 [(validate.rules).message.required = true];
}


/* Action — five primitive verbs. Anything more complex (cluster bootstrap,
   placeholder substitution, multi-node coordination) is rendered server-side
   into a sequence of these. */
message Action {
    oneof verb {
        option (validate.required) = true;
        PutFile          put_file        = 1;
        RunShell         run_shell       = 2;
        SystemctlOp      systemctl       = 3;
        InstallPackage   install_package = 4;
        WaitForCondition wait_for        = 5;
    }
}


/* PutFile — write bytes (or fetched blob) to a path on the host. */
message PutFile {
    string path = 1 [(validate.rules).string = {min_len: 1, max_len: 4096}];
    oneof content {
        option (validate.required) = true;
        // inline — small text/binary content embedded directly.
        bytes inline = 2 [(validate.rules).bytes.max_len = 1048576];   // 1 MB
        // url — http(s)/s3 URL the agent fetches.
        FetchSpec fetch = 3;
    }
    uint32 mode = 10 [(validate.rules).uint32.lte = 0x7FF];            // unix perms (octal)
    string owner = 11 [(validate.rules).string.max_len = 64];          // chown user (empty = current)
    string group = 12 [(validate.rules).string.max_len = 64];          // chgrp group (empty = current)
    bool create_parents = 13;                                           // mkdir -p
}

/* FetchSpec — agent downloads from URL with integrity check + optional auth. */
message FetchSpec {
    string url = 1 [(validate.rules).string = {min_len: 1, max_len: 4096}];
    string sha256 = 2 [(validate.rules).string.len = 64];               // required
    map<string, string> headers = 3 [(validate.rules).map.max_pairs = 16];   // e.g. Authorization
}


/* RunShell — execute argv with env/cwd/timeout. Output (stdout+stderr)
   captured up to limit; full stream goes via LogLine. */
message RunShell {
    repeated string argv = 1 [(validate.rules).repeated.min_items = 1];
    string stdin = 2 [(validate.rules).string.max_len = 1048576];       // 1 MB
    map<string, string> env = 3 [(validate.rules).map.max_pairs = 256];
    string cwd = 4 [(validate.rules).string.max_len = 4096];
    uint32 timeout_seconds = 5 [(validate.rules).uint32.lte = 86400];   // 24h cap
    /* expected_exit — pass-thru codes (default {0}). Non-listed = FAILED. */
    repeated int32 expected_exits = 6 [(validate.rules).repeated.max_items = 16];
    /* shell — when true, argv joined and run via `/bin/sh -c`. */
    bool shell = 7;
    /* kill_grace_seconds — on timeout/cancel: SIGTERM, wait this many
       seconds, then SIGKILL. 0 = immediate SIGKILL. */
    uint32 kill_grace_seconds = 8 [(validate.rules).uint32.lte = 600];
}


/* SystemctlOp — manage a systemd unit. */
message SystemctlOp {
    Verb verb = 1 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    enum Verb {
        VERB_UNSPECIFIED = 0;
        VERB_START   = 1;
        VERB_STOP    = 2;
        VERB_RESTART = 3;
        VERB_RELOAD  = 4;
        VERB_ENABLE  = 5;
        VERB_DISABLE = 6;
        VERB_STATUS  = 7;   // returns active/inactive in Report.output
    }
    string unit = 2 [(validate.rules).string = {min_len: 1, max_len: 256}];
    bool now = 3;            // --now (enable+start, disable+stop)
}


/* InstallPackage — apt / deb_blob / binary / container install via inline
   Package recipe. Server copies the Package message verbatim — agent has
   no DB access. */
message InstallPackage {
    cloud.v1.catalog.Package package = 1 [(validate.rules).message.required = true];
}


/* WaitForCondition — poll until check passes or max_attempts exhausted. */
message WaitForCondition {
    oneof check {
        option (validate.required) = true;
        PortOpen      port_open  = 1;
        HttpProbe     http       = 2;
        ShellExitZero exit_zero  = 3;
    }
    uint32 max_attempts = 10 [(validate.rules).uint32 = {gte: 1, lte: 1000}];
    uint32 delay_seconds = 11 [(validate.rules).uint32 = {gte: 1, lte: 3600}];

    message PortOpen {
        string host = 1 [(validate.rules).string = {min_len: 1, max_len: 256}];
        uint32 port = 2 [(validate.rules).uint32 = {gte: 1, lte: 65535}];
    }
    message HttpProbe {
        string url = 1 [(validate.rules).string = {min_len: 1, max_len: 4096}];
        uint32 expected_status = 2 [(validate.rules).uint32 = {gte: 100, lte: 599}];
        map<string, string> headers = 3 [(validate.rules).map.max_pairs = 16];
    }
    message ShellExitZero {
        repeated string argv = 1 [(validate.rules).repeated.min_items = 1];
        map<string, string> env = 2 [(validate.rules).map.max_pairs = 64];
    }
}


/* Report — agent → server. Terminal status or progress beacon. */
message Report {
    string command_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    string machine_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
    ReportStatus status = 3 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    /* Human-readable failure cause when status=FAILED. */
    string error = 4 [(validate.rules).string.max_len = 65536];
    /* output — captured stdout+stderr tail (full stream via LogLine). */
    bytes output = 5 [(validate.rules).bytes.max_len = 1048576];
    /* exit_code — process exit for RunShell / shell-backed actions. */
    int32 exit_code = 6;
    google.protobuf.Timestamp finished_at = 7;
}


/* ReportStatus — terminal or RUNNING beacon. */
enum ReportStatus {
    REPORT_STATUS_UNSPECIFIED = 0;
    REPORT_STATUS_RUNNING     = 1;
    REPORT_STATUS_SUCCEEDED   = 2;
    REPORT_STATUS_FAILED      = 3;
}


/* LogLine — streamed output. One line per message; agent batches at
   transport layer (HTTP poll / WebSocket / gRPC stream). */
message LogLine {
    string command_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    string machine_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
    google.protobuf.Timestamp ts = 3 [(validate.rules).timestamp = {required: true}];
    Stream stream = 4 [(validate.rules).enum.defined_only = true];
    string line = 5 [(validate.rules).string.max_len = 65536];

    enum Stream {
        STREAM_UNSPECIFIED = 0;
        STREAM_STDOUT      = 1;
        STREAM_STDERR      = 2;
    }
}


/* Heartbeat — agent → server liveness probe. Includes self-identity and
   capabilities for registry. */
message Heartbeat {
    string machine_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
    google.protobuf.Timestamp ts = 2;
    string agent_version = 3 [(validate.rules).string.max_len = 32];
    repeated string capabilities = 4 [(validate.rules).repeated.max_items = 64];   // e.g. "systemd", "docker", "apt"
    /* log_cursor — last log_line offset the agent successfully delivered.
       Server uses for resumable streaming after disconnect (LogsService). */
    string log_cursor = 5 [(validate.rules).string.max_len = 128];
    /* report_cursor — last terminal Report id delivered, for at-least-once
       acknowledgement on reconnect. */
    string report_cursor = 6 [(validate.rules).string.max_len = 128];
    /* in_flight_command_ids — commands currently executing. Allows server
       to reconcile after agent restart. */
    repeated string in_flight_command_ids = 7 [(validate.rules).repeated.max_items = 64];
}


/* CommandBatch — server response to agent poll. Multiple pending commands
   in execution order. */
message CommandBatch {
    repeated Command commands = 1 [(validate.rules).repeated.max_items = 64];
    /* poll_delay_ms — server hint when next to poll. */
    uint32 poll_delay_ms = 2 [(validate.rules).uint32.lte = 60000];
}


/* AgentReport — agent → server poll body. Batches reports + logs + heartbeat
   to minimise round-trips. */
message AgentReport {
    Heartbeat heartbeat = 1;
    repeated Report reports = 2 [(validate.rules).repeated.max_items = 256];
    repeated LogLine log_lines = 3 [(validate.rules).repeated.max_items = 1024];
}
