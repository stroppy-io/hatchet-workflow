syntax = "proto3";

package cloud.v1.agent;

import "v1/agent/agent.proto";
import "v1/agent/protocol.proto";
import "v1/catalog/deployment.proto";
import "google/protobuf/empty.proto";
import "v1/iam/tenant.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/v1/agent";


/* RegisterRequest — agent boot-time registration. Cloud-init injects a
   one-shot bootstrap token that authorises this call and binds the agent
   to a tenant + DagRun. */
message RegisterRequest {
    /* bootstrap_token — short-lived secret issued by the server when the
       VM was provisioned (terraform-side). Encodes tenant_id + dag_run_id +
       expected_role + machine_id. Server verifies + invalidates on use. */
    string bootstrap_token = 1 [(validate.rules).string = {min_len: 16, max_len: 1024}];

    string machine_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
    cloud.v1.catalog.MachineRole role = 3 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    string internal_ip = 4 [(validate.rules).string = {min_len: 1, max_len: 45}];
    optional string public_ip = 5 [(validate.rules).string.max_len = 45];
    string agent_version = 6 [(validate.rules).string.max_len = 32];
    repeated string capabilities = 7 [(validate.rules).repeated.max_items = 64];
}

message RegisterResponse {
    cloud.v1.agent.Agent agent = 1;
    /* poll_token — long-lived bearer for subsequent Poll calls. */
    string poll_token = 2 [(validate.rules).string.max_len = 1024];
}


/* PollRequest — agent → server. Carries Heartbeat + Reports + LogLines.
   Server responds with CommandBatch. Authentication via Authorization
   header (poll_token), transport-level. */
message PollRequest {
    cloud.v1.agent.AgentId agent_id = 1 [(validate.rules).message = {required: true}];
    cloud.v1.agent.AgentReport report = 2 [(validate.rules).message = {required: true}];
}


/* AdminListAgentsRequest — server-side admin view. */
message AdminListAgentsRequest {
    cloud.v1.iam.TenantId tenant_id = 1 [(validate.rules).message = {required: true}];
    optional cloud.v1.agent.AgentStatus status_filter = 2;
}


/* AgentService — wire protocol between agent daemons and the server.
   Transport: HTTP long-poll OR gRPC bidi stream. Messages are the same. */
service AgentService {
    /* Register — agent boot. Returns Agent row + long-lived poll_token. */
    rpc Register (RegisterRequest) returns (RegisterResponse) { option idempotency_level = IDEMPOTENT; }
    /* Poll — submit report batch, receive command batch. Server may return
       an empty CommandBatch with poll_delay_ms hint. */
    rpc Poll     (PollRequest)     returns (cloud.v1.agent.CommandBatch) { option idempotency_level = IDEMPOTENT; }
    /* Deregister — agent graceful shutdown; server marks TERMINATED. */
    rpc Deregister (cloud.v1.agent.AgentId) returns (google.protobuf.Empty) { option idempotency_level = IDEMPOTENT; }
}


/* AgentAdminService — server admin / UI side. Manage agents from operator console. */
service AgentAdminService {
    rpc GetAgent       (cloud.v1.agent.AgentId)      returns (cloud.v1.agent.Agent)      { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc ListAgents     (AdminListAgentsRequest)   returns (cloud.v1.agent.Agent.List) { option idempotency_level = NO_SIDE_EFFECTS; }
    /* TerminateAgent — force-mark as TERMINATED (e.g. orphaned after run). */
    rpc TerminateAgent (cloud.v1.agent.AgentId)      returns (cloud.v1.agent.Agent)      { option idempotency_level = IDEMPOTENT; }
}
