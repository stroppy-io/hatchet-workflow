syntax = "proto3";

package cloud.v1.agent;

import "google/protobuf/empty.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/agent";

/*
    shell.proto is the AGENT-FACING side of the interactive reverse shell. The
    agent authenticates with its agent token and dials a single long-lived control
    stream (Connect); the server multiplexes any number of shell sessions over it,
    keyed by session_id. This is the inner half — the admin/user half lives in
    api/agent_shell.proto and the server bridges the two (admin websocket <-> this
    grpc stream).

    Direction: server -> agent = ServerShellMsg (open / stdin / resize / close);
    agent -> server = AgentShellMsg (register / stdout / stderr / exit).
 */

// OpenShell asks the agent to spawn a PTY for a new session.
message OpenShell {
    // Run this shell in the context of a run (for audit/scoping); may be empty.
    string run_id = 1;
    // Target component on the host, optional.
    string component_id = 2;
    // Initial terminal size.
    uint32 cols = 3;
    uint32 rows = 4;
    // Shell to launch (e.g. "/bin/bash"); empty -> agent default.
    string shell = 5;
}

// ShellResize updates the PTY window size.
message ShellResize {
    uint32 cols = 1;
    uint32 rows = 2;
}

// ShellExit reports a session ending.
message ShellExit {
    int32 code = 1;
    string error = 2;
}

// Register is the agent's first AgentShellMsg, identifying which host it is.
message Register {
    string machine_id = 1;
}

// ServerShellMsg is server -> agent over the control stream.
message ServerShellMsg {
    // Session this frame belongs to (server-assigned on open).
    string session_id = 1;
    oneof msg {
        OpenShell open = 2;
        bytes stdin = 3;
        ShellResize resize = 4;
        google.protobuf.Empty close = 5;
    }
}

// AgentShellMsg is agent -> server over the control stream.
message AgentShellMsg {
    string session_id = 1;
    oneof msg {
        Register register = 2;   // first frame, session_id empty
        bytes stdout = 3;
        bytes stderr = 4;
        ShellExit exit = 5;
    }
}

/*
    AgentShellAgentApi is dialed by the agent (not by users). Auth is the agent
    token, NOT the iam RBAC interceptor — hence no (cloud.v1.iam.auth) annotation.
 */
service AgentShellAgentService {
    // Connect opens the long-lived, multiplexed control stream.
    rpc Connect (stream AgentShellMsg) returns (stream ServerShellMsg);
}
