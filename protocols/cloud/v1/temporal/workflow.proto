syntax = "proto3";

package cloud.v1.temporal;

import "cloud/v1/common/cmd.proto";
import "cloud/v1/common/dir.proto";
import "cloud/v1/common/file.proto";
import "cloud/v1/common/ip.proto";
import "cloud/v1/deployment/deployment.proto";
import "cloud/v1/deployment/docker.proto";
import "cloud/v1/deployment/provider.proto";
import "cloud/v1/deployment/quota.proto";
import "google/protobuf/empty.proto";
import "temporal/v1/temporal.proto";
import "cloud/v1/deployment/terraform.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/temporal";

message TestWorkflowRequest {string job_id = 1;}
message TestWorkflowResponse {string final_result = 1;}

service TestApi {
    rpc TestWorkflow (TestWorkflowRequest) returns (TestWorkflowResponse) {
        option (temporal.v1.workflow) = {name: "TestWorkflow"};
    }
}

message SuiteWorkflowRequest {}
message SuiteWorkflowResponse {}

service SuiteWorkflowApi {
    rpc SuiteWorkflow (SuiteWorkflowRequest) returns (SuiteWorkflowResponse) {
        option (temporal.v1.workflow) = {name: "SuiteWorkflow"};
    }
}

message ProcessDeploymentWorkflowRequest {

}
message ProcessDeploymentWorkflowResponse {
    deployment.Deployment deployment = 1;
}

message AcquireQuotasActivityRequest {
    deployment.Provider provider = 1;
}
message AcquireQuotasActivityResponse {
    repeated deployment.Quota.Allocation quota_allocation = 1;
}

message AcquireNetworkActivityRequest {
    deployment.Provider provider = 1;
}

service DeploymentApi {
    rpc ProcessDeploymentWorkflow (ProcessDeploymentWorkflowRequest) returns (ProcessDeploymentWorkflowResponse) {
        option (temporal.v1.workflow) = {name: "ProcessDeploymentWorkflow"};
    }
    rpc AcquireQuotasActivity (AcquireQuotasActivityRequest) returns (AcquireQuotasActivityResponse) {
        option (temporal.v1.activity) = {start_to_close_timeout: {seconds: 300}};
    }
    rpc AcquireNetworkActivity (AcquireNetworkActivityRequest) returns (common.Net) {
        option (temporal.v1.activity) = {start_to_close_timeout: {seconds: 300}};
    }
    rpc PlanTerraformActivity (deployment.Terraform.Input) returns (deployment.Terraform.Output) {
        option (temporal.v1.activity) = {start_to_close_timeout: {seconds: 300}};
    }
    rpc ApplyTerraformActivity (deployment.Terraform.Input) returns (deployment.Terraform.Output) {
        option (temporal.v1.activity) = {start_to_close_timeout: {seconds: 600}};
    }
    rpc DeployTerraformActivity (deployment.Terraform.Input) returns (deployment.Terraform.Output) {
        option (temporal.v1.activity) = {start_to_close_timeout: {seconds: 600}};
    }
    rpc DeployDockerActivity (deployment.Docker.Input) returns (deployment.Docker.Output) {
        option (temporal.v1.activity) = {start_to_close_timeout: {seconds: 300}};
    }
    rpc DestroyDockerActivity (deployment.Docker.Input) returns (deployment.Docker.Output) {
        option (temporal.v1.activity) = {start_to_close_timeout: {seconds: 300}};
    }
}

service AgentCommandApi {
    rpc EnsureAgentOnlineActivity (google.protobuf.Empty) returns (google.protobuf.Empty) {
        option (temporal.v1.activity) = {start_to_close_timeout: {seconds: 600}};
    }
    rpc CreateDirActivity (common.Dir) returns (google.protobuf.Empty) {
        option (temporal.v1.activity) = {start_to_close_timeout: {seconds: 30}};
    };
    rpc CreateTempDirActivity (common.Dir.Temp) returns (common.Dir) {
        option (temporal.v1.activity) = {start_to_close_timeout: {seconds: 30}};
    };
    rpc WriteFileActivity (common.File) returns (google.protobuf.Empty) {
        option (temporal.v1.activity) = {start_to_close_timeout: {seconds: 30}};
    };
    rpc CallCmdActivity (common.Cmd) returns (common.Cmd.Result) {
        option (temporal.v1.activity) = {start_to_close_timeout: {seconds: 600}};
    };
}

