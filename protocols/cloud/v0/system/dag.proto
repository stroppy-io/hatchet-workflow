syntax = "proto3";

package cloud.v1.system;

import "goplain/goplain.proto";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "cloud/v1/common/timestamps.proto";
import "ratelproto/ratelproto.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/system";


/* DagRunStatus — overall DagRun execution state. */
enum DagRunStatus {
    DAG_RUN_STATUS_UNSPECIFIED = 0;
    DAG_RUN_STATUS_PENDING     = 1;   // created, scheduler has not picked it yet
    DAG_RUN_STATUS_RUNNING     = 2;
    DAG_RUN_STATUS_SUCCEEDED   = 3;
    DAG_RUN_STATUS_FAILED      = 4;
    DAG_RUN_STATUS_CANCELLED   = 5;
}

/* NodeRunStatus — per-node execution state. */
enum NodeRunStatus {
    NODE_RUN_STATUS_UNSPECIFIED  = 0;
    NODE_RUN_STATUS_PENDING_DEPS = 1;  // upstream deps not yet satisfied
    NODE_RUN_STATUS_READY        = 2;  // deps OK, awaiting quota/admission
    NODE_RUN_STATUS_RUNNING      = 3;
    NODE_RUN_STATUS_SUCCEEDED    = 4;
    NODE_RUN_STATUS_FAILED       = 5;
    NODE_RUN_STATUS_CANCELLED    = 6;
    NODE_RUN_STATUS_SKIPPED      = 7;  // dep failed and node was not must_complete
}


message DagId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }
/* Dag — immutable execution plan (template). Engine does not know who owns
   it or what it does; metadata is a free-form domain tag store. */
message Dag {
    message List {repeated Dag dags = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "dags"
    };

    DagId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 2 [(goplain.field).embed = true];

    Graph graph = 10 [
        (validate.rules).message.required = true,
        (goplain.field).serialize = true,
        (ratel.column).constraints.default_value = "'{}'::jsonb"
    ];

    // metadata — free-form JSON for domain annotations (tenant_id, owner ref,
    // display name, tags). Engine treats it as opaque.
    google.protobuf.Struct metadata = 11 [
        (goplain.field).serialize = true,
        (ratel.column).constraints.default_value = "'{}'::jsonb"
    ];

    /* Graph — DAG topology. */
    message Graph {
        repeated Node nodes = 1 [(validate.rules).repeated.min_items = 1];
    }

    /* Node — single execution unit. `type` is a registered typeURL; engine
       dispatches to the Go handler bound to it. `spec` is the typed payload
       the handler reads. Engine treats spec as opaque bytes. */
    message Node {
        string id = 1 [(validate.rules).string = {min_len: 1, max_len: 64, pattern: "^[a-z][a-z0-9_-]*$"}];
        // type — registered typeURL (Any standard "<package>.<MessageName>").
        string type = 2 [(validate.rules).string = {min_len: 1, max_len: 256}];
        repeated string deps = 3 [(validate.rules).repeated = {
            max_items: 64,
            items: {string: {min_len: 1, max_len: 64}}
        }];
        bool always_run = 4;       // run even when upstream failed (teardown-like)
        bool must_complete = 5;    // FAILED ⇒ terminates whole DagRun
        google.protobuf.Any spec = 6;
        uint32 max_attempts = 7 [(validate.rules).uint32.lte = 100];
        uint32 timeout_seconds = 8 [(validate.rules).uint32.lte = 86400];   // 24h cap
    }
}


message DagRunId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }
/* DagRun — one execution instance of a Dag. Retries create a NEW DagRun
   row, with `previous_attempt_id` pointing back to the prior attempt and
   `attempt` incremented. */
message DagRun {
    message List {repeated DagRun dag_runs = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "dag_runs"
        indexes: [
            {name: "dag_runs_dag_idx",    columns: ["dag_id"]},
            {name: "dag_runs_status_idx", columns: ["status"]},
            {name: "dag_runs_queue_idx",  columns: ["status", "priority", "created_at"]}
        ]
    };

    DagRunId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 2 [(goplain.field).embed = true];

    DagId dag_id = 4 [
        (ratel.column).constraints = {
            references_table: "dags"
            references_column: "id"
            on_delete: RESTRICT
        },
        (validate.rules).message = {required: true}
    ];

    DagRunStatus status = 10 [(validate.rules).enum.defined_only = true];
    uint32 priority = 11 [(validate.rules).uint32.lte = 1000];
    optional google.protobuf.Timestamp scheduled_at = 12;
    optional google.protobuf.Timestamp started_at = 13;
    optional google.protobuf.Timestamp finished_at = 14;

    /* attempt — 1..N. Retries spawn a NEW DagRun row with attempt+1
       and previous_attempt_id set. History preserved. */
    uint32 attempt = 20 [(validate.rules).uint32.gte = 1];
    optional DagRunId previous_attempt_id = 21 [(ratel.column).constraints = {
        references_table: "dag_runs"
        references_column: "id"
        on_delete: SET_NULL
    }];

    // Terminal error message when status=FAILED.
    string error = 22 [(validate.rules).string.max_len = 65536];

    // cancel_requested — soft cancel flag. Workers poll this between handler
    // yield points and propagate via ctx.Done.
    bool cancel_requested = 23 [(ratel.column).constraints.default_value = "false"];

    // metadata — free-form JSON for domain annotations (tenant_id, owner
    // ref, request_id, anything). Engine treats it as opaque.
    google.protobuf.Struct metadata = 30 [
        (goplain.field).serialize = true,
        (ratel.column).constraints.default_value = "'{}'::jsonb"
    ];
}


message NodeRunId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }
/* NodeRun — per-node execution state row. One row per (DagRun, Node). */
message NodeRun {
    message List {repeated NodeRun node_runs = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "node_runs"
        indexes: [
            {name: "node_runs_dag_run_idx",          columns: ["dag_run_id"]},
            {name: "node_runs_dag_run_node_uniq",    columns: ["dag_run_id", "node_id"], unique: true},
            {name: "node_runs_dag_run_status_idx",   columns: ["dag_run_id", "status"]},
            {name: "node_runs_status_idx",           columns: ["status"]}
        ]
    };

    NodeRunId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    DagRunId dag_run_id = 2 [
        (ratel.column).constraints = {
            references_table: "dag_runs"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 3 [(goplain.field).embed = true];

    // node_id — slug from Dag.Graph.Node.id; not a real FK because Graph
    // lives inside the dag's jsonb column.
    string node_id = 4 [(validate.rules).string = {min_len: 1, max_len: 64}];
    NodeRunStatus status = 5 [(validate.rules).enum.defined_only = true];
    uint32 attempt = 6;
    string error = 7 [(validate.rules).string.max_len = 65536];
    optional google.protobuf.Timestamp started_at = 8;
    optional google.protobuf.Timestamp finished_at = 9;

    // output — typed payload produced by the handler; passed downstream
    // via DagRunStateEntry writes.
    google.protobuf.Any output = 10;

    // metadata — free-form JSON for domain annotations.
    google.protobuf.Struct metadata = 11 [
        (goplain.field).serialize = true,
        (ratel.column).constraints.default_value = "'{}'::jsonb"
    ];
}


message DagRunStateEntryId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }
/* DagRunStateEntry — single (key, value) row of a DagRun's shared state.
   Each row is independent — handlers update their keys without locking
   the whole state blob. Domain decides the key schema. */
message DagRunStateEntry {
    message List {repeated DagRunStateEntry entries = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "dag_run_state_entries"
        indexes: [
            {name: "dag_run_state_entries_run_key_uniq", columns: ["dag_run_id", "key"], unique: true}
        ]
    };

    DagRunStateEntryId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    DagRunId dag_run_id = 2 [
        (ratel.column).constraints = {
            references_table: "dag_runs"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 3 [(goplain.field).embed = true];

    string key = 4 [(validate.rules).string = {min_len: 1, max_len: 128, pattern: "^[a-z][a-z0-9_.-]*$"}];
    google.protobuf.Any value = 5;
    /* version — optimistic concurrency counter. Writers do
       `UPDATE ... SET version=version+1 WHERE id=? AND version=?`;
       conflict triggers Code=ABORTED, client retries. */
    uint64 version = 6;
}
