syntax = "proto3";

package cloud.v1.admin;

import "google/protobuf/empty.proto";
import "cloud/v1/iam/tenant.proto";
import "cloud/v1/iam/user.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/admin";


message AdminCreateTenantRequest {
    cloud.v1.iam.Tenant tenant = 1 [(validate.rules).message = {required: true}];
    /* owner_user_id — bootstrap owner; new TenantMember row created with OWNER role. */
    cloud.v1.iam.UserId owner_user_id = 2 [(validate.rules).message = {required: true}];
}

message AdminCreateUserRequest {
    cloud.v1.iam.User user = 1 [(validate.rules).message = {required: true}];
    string password = 2 [(validate.rules).string = {min_len: 8, max_len: 128}];
}

message AdminResetPasswordRequest {
    cloud.v1.iam.UserId user_id = 1 [(validate.rules).message = {required: true}];
    string new_password = 2 [(validate.rules).string = {min_len: 8, max_len: 128}];
}


/* AdminService — root-only cross-tenant operations. Bypasses tenant context. */
service AdminService {
    rpc ListAllTenants    (google.protobuf.Empty)        returns (cloud.v1.iam.Tenant.List) { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc CreateTenant      (AdminCreateTenantRequest)     returns (cloud.v1.iam.Tenant)      { option idempotency_level = IDEMPOTENT; }
    rpc DeleteTenantHard  (cloud.v1.iam.TenantId)        returns (cloud.v1.iam.Tenant)      { option idempotency_level = IDEMPOTENT; }

    rpc ListAllUsers      (google.protobuf.Empty)        returns (cloud.v1.iam.User.List)   { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc CreateUser        (AdminCreateUserRequest)       returns (cloud.v1.iam.User)        { option idempotency_level = IDEMPOTENT; }
    rpc DeleteUser        (cloud.v1.iam.UserId)          returns (cloud.v1.iam.User)        { option idempotency_level = IDEMPOTENT; }
    rpc ResetUserPassword (AdminResetPasswordRequest)    returns (cloud.v1.iam.User)        { option idempotency_level = IDEMPOTENT; }
}
