syntax = "proto3";

package cloud.v1.errors;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/errors";


/*
  Error model — canonical gRPC / ConnectRPC status code at the envelope
  level + typed details. Domain-specific reasons live inside ErrorInfo as
  free-form strings (NOT in a closed enum), matching Google AIP-193 and
  google.rpc.Status / Connect error model.

  Wire: HTTP gateway / Connect transport encodes Code as the canonical
  status code (NOT_FOUND→404, INVALID_ARGUMENT→400, etc).
  `details` carries one or more typed messages.

  Why not a domain enum at the top level: Connect/gRPC retry/log/trace
  tooling keys off the canonical Code. A custom enum bypasses that
  ecosystem.
*/


/* Code — canonical gRPC / ConnectRPC status codes. Identical numbering. */
enum Code {
    CODE_OK                  = 0;
    CODE_CANCELLED           = 1;
    CODE_UNKNOWN             = 2;
    CODE_INVALID_ARGUMENT    = 3;
    CODE_DEADLINE_EXCEEDED   = 4;
    CODE_NOT_FOUND           = 5;
    CODE_ALREADY_EXISTS      = 6;
    CODE_PERMISSION_DENIED   = 7;
    CODE_RESOURCE_EXHAUSTED  = 8;   // quotas
    CODE_FAILED_PRECONDITION = 9;
    CODE_ABORTED             = 10;
    CODE_OUT_OF_RANGE        = 11;
    CODE_UNIMPLEMENTED       = 12;
    CODE_INTERNAL            = 13;
    CODE_UNAVAILABLE         = 14;
    CODE_DATA_LOSS           = 15;
    CODE_UNAUTHENTICATED     = 16;
}


/* Error — envelope. Mirrors google.rpc.Status. */
message Error {
    Code code = 1 [(validate.rules).enum.defined_only = true];
    /* message — human-readable; localised at gateway. Safe to display. */
    string message = 2 [(validate.rules).string.max_len = 4096];
    /* details — typed extra context. Order: ErrorInfo first, then any. */
    repeated Detail details = 3;
}


/* Detail — discriminated union of typed details on an Error. */
message Detail {
    oneof kind {
        ErrorInfo           error_info           = 1;
        FieldViolation     field_violation     = 2;
        QuotaFailure       quota_failure       = 3;
        RetryInfo          retry_info          = 4;
        PreconditionFailure precondition_failure = 5;
        RequestInfo        request_info        = 6;
        ResourceInfo       resource_info       = 7;
    }
}


/* ErrorInfo — domain reason. `reason` is free-form UPPER_SNAKE so new
   reasons don't require proto changes. Mirrors google.rpc.ErrorInfo. */
message ErrorInfo {
    /* reason — e.g. "TF_APPLY_FAILED", "AGENT_OFFLINE", "REFRESH_TOKEN_REUSED". */
    string reason = 1 [(validate.rules).string = {min_len: 1, max_len: 128, pattern: "^[A-Z][A-Z0-9_]*$"}];
    /* domain — producing service, e.g. "stroppy.cloud". */
    string domain = 2 [(validate.rules).string.max_len = 128];
    map<string, string> metadata = 3 [(validate.rules).map.max_pairs = 64];
}


/* FieldViolation — single field's validation failure. Multiple may appear. */
message FieldViolation {
    string field = 1 [(validate.rules).string = {min_len: 1, max_len: 256}];
    string description = 2 [(validate.rules).string.max_len = 1024];
    /* reason — short machine-readable tag, e.g. "REQUIRED", "OUT_OF_RANGE". */
    string reason = 3 [(validate.rules).string.max_len = 64];
}


/* QuotaFailure — paired with code=RESOURCE_EXHAUSTED. */
message QuotaFailure {
    repeated Violation violations = 1;
    message Violation {
        /* subject — owner being throttled, e.g. "tenants/<ulid>". */
        string subject = 1 [(validate.rules).string.max_len = 256];
        string description = 2 [(validate.rules).string.max_len = 1024];
        /* quota_id — matches cloud.v1.ops.Quota.resource_id. */
        string quota_id = 3 [(validate.rules).string.max_len = 128];
        int64 limit = 4;
        int64 used = 5;
    }
}


/* RetryInfo — backoff hint to the client. */
message RetryInfo {
    google.protobuf.Duration retry_delay = 1;
}


/* PreconditionFailure — preflight failed (terms not accepted, tenant not
   activated, dependency unhealthy). */
message PreconditionFailure {
    repeated Violation violations = 1;
    message Violation {
        string type = 1 [(validate.rules).string.max_len = 128];
        string subject = 2 [(validate.rules).string.max_len = 256];
        string description = 3 [(validate.rules).string.max_len = 1024];
    }
}


/* RequestInfo — correlation for support / log lookup. */
message RequestInfo {
    string request_id = 1 [(validate.rules).string.max_len = 64];
    string serving_data = 2 [(validate.rules).string.max_len = 256];
    google.protobuf.Timestamp ts = 3;
}


/* ResourceInfo — pinpoints the resource that was missing or conflicted. */
message ResourceInfo {
    string resource_type = 1 [(validate.rules).string.max_len = 128];
    string resource_name = 2 [(validate.rules).string.max_len = 256];
    string owner = 3 [(validate.rules).string.max_len = 256];
    string description = 4 [(validate.rules).string.max_len = 1024];
}
