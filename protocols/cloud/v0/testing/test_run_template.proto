syntax = "proto3";

package cloud.v1.testing;

import "cloud/v1/iam/user.proto";
import "cloud/v1/catalog/database.proto";
import "cloud/v1/catalog/workload.proto";
import "cloud/v1/common/identity.proto";
import "cloud/v1/common/timestamps.proto";
import "goplain/goplain.proto";
import "google/protobuf/field_mask.proto";
import "cloud/v1/iam/tenant.proto";
import "ratelproto/ratelproto.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/testing";


message TestRunTemplateId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }
/* TestRunTemplate — reusable test configuration capturing database preset,
   workload preset, and execution parameters. */
message TestRunTemplate {
    message List {repeated TestRunTemplate test_run_templates = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "test_run_templates"
        indexes: [
            {name: "test_run_templates_tenant_idx", columns: ["tenant_id"]}
        ]
    };

    TestRunTemplateId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    cloud.v1.iam.TenantId tenant_id = 2 [
        (ratel.column).constraints = {
            references_table: "tenants"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 3 [(goplain.field).embed = true];
    cloud.v1.common.Identity identity = 4 [(goplain.field).embed = true];
    optional cloud.v1.iam.UserId created_by = 9 [(ratel.column).constraints = {
        references_table: "users"
        references_column: "id"
        on_delete: SET_NULL
    }];

    cloud.v1.catalog.DatabaseOrPreset database = 10 [(goplain.field).embed = true];
    cloud.v1.catalog.WorkloadOrPreset workload = 11 [(goplain.field).embed = true];
}


message CreateTestRunTemplateRequest {
    TestRunTemplate template = 1 [(validate.rules).message = {required: true}];
}

message UpdateTestRunTemplateRequest {
    TestRunTemplate template = 1 [(validate.rules).message = {required: true}];
    google.protobuf.FieldMask update_mask = 2 [(validate.rules).message = {required: true}];
}


service TestRunTemplateService {
    rpc CreateTestRunTemplate (CreateTestRunTemplateRequest) returns (TestRunTemplate)      { option idempotency_level = IDEMPOTENT; }
    rpc UpdateTestRunTemplate (UpdateTestRunTemplateRequest) returns (TestRunTemplate)      { option idempotency_level = IDEMPOTENT; }
    rpc DeleteTestRunTemplate (TestRunTemplateId)            returns (TestRunTemplate)      { option idempotency_level = IDEMPOTENT; }
    rpc GetTestRunTemplate    (TestRunTemplateId)            returns (TestRunTemplate)      { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc ListTestRunTemplates  (cloud.v1.iam.TenantId)        returns (TestRunTemplate.List) { option idempotency_level = NO_SIDE_EFFECTS; }
}
