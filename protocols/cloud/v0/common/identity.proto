syntax = "proto3";

package cloud.v1.common;

import "goplain/goplain.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/common";


/* Labels — arbitrary string tags for categorizing/filtering entities. */
message Labels {
    repeated string label = 1 [(validate.rules).repeated = {
        max_items: 32,
        items: {string: {min_len: 1, max_len: 64}}
    }];
}

/* Identity — name/description/labels embed. Composite uniqueness lives on
   the host table (tenant_id, name) when needed — see each table's
   ratel.indexes. */
message Identity {
    string name = 1 [(validate.rules).string = {min_len: 1, max_len: 255}];
    optional string description = 2 [(validate.rules).string.max_len = 1024];
    optional Labels labels = 3 [(goplain.field).embed = true];
    /* Query criteria for filtering identities by name and labels. */
    message SearchFilter {
        optional string name = 1;
        optional Labels labels = 2;
    }
}
