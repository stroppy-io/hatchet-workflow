syntax = "proto3";

package cloud.v1.common;

import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/common";


/* ConfigFile — file rendered onto a host. Cloud renders all configs from
   presets and sends fully-rendered text inline; the agent simply writes it.
   No templating, no external blob references. */
message ConfigFile {
    string path = 1;                          // e.g. "/etc/postgresql/17/main/postgresql.conf"
    string inline = 2 [(validate.rules).string.min_len = 0];  // fully-rendered file content
    uint32 mode = 3;                          // unix perms, e.g. 0644
    string owner = 4;                         // optional chown user
}
