syntax = "proto3";

package cloud.v1.ops;

import "google/protobuf/timestamp.proto";
import "cloud/v1/iam/tenant.proto";
import "cloud/v1/common/timestamps.proto";
import "goplain/goplain.proto";
import "ratelproto/ratelproto.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/ops";


/* QuotaSource — where a quota is enforced/measured. */
enum QuotaSource {
    QUOTA_SOURCE_UNSPECIFIED = 0;
    QUOTA_SOURCE_PLATFORM    = 1;   // stroppy internal limits (max queue depth, concurrent runs)
    QUOTA_SOURCE_TENANT      = 2;   // TenantQuotas (per-tenant cap)
    QUOTA_SOURCE_PROVIDER    = 3;   // cloud API (YC limit) — queried live
}

/* Quota — single resource limit. resource_id is a free-form string so new
   quota kinds can be added without proto changes (e.g. "yc.cpus",
   "yc.gpus", "yc.memory_gb", "runs.concurrent", "queue.depth"). */
message Quota {
    string resource_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128, pattern: "^[a-z][a-z0-9_.-]*$"}];
    string display_name = 2 [(validate.rules).string.max_len = 128];
    string unit = 3 [(validate.rules).string.max_len = 32];   // "cores", "GB", "count"
    QuotaSource source = 4 [(validate.rules).enum.defined_only = true];
    int64 limit = 5;
    int64 used = 6;
    int64 available = 7;
    optional google.protobuf.Timestamp queried_at = 8;
    /* zone / region — provider-side scoping when source=PROVIDER (empty for platform/tenant). */
    string scope = 9 [(validate.rules).string.max_len = 64];
}

message QuotaList {
    repeated Quota quotas = 1;
}


message GetQuotasRequest {
    cloud.v1.iam.TenantId tenant_id = 1 [(validate.rules).message = {required: true}];
    /* sources — filter by source. Empty = all (platform + tenant + provider). */
    repeated QuotaSource sources = 2;
    /* resource_id_prefix — filter by prefix ("yc.", "runs.", ...). */
    string resource_id_prefix = 3 [(validate.rules).string.max_len = 64];
}

message RefreshQuotasRequest {
    cloud.v1.iam.TenantId tenant_id = 1 [(validate.rules).message = {required: true}];
    /* force_provider — re-query cloud API even if cache fresh. */
    bool force_provider = 2;
}


service QuotaService {
    rpc GetQuotas     (GetQuotasRequest)     returns (QuotaList) { option idempotency_level = NO_SIDE_EFFECTS; }
    /* RefreshQuotas — force provider re-query (YC API call). */
    rpc RefreshQuotas (RefreshQuotasRequest) returns (QuotaList) { option idempotency_level = IDEMPOTENT; }
}


message QuotaCounterId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }

/* QuotaCounter — persisted enforcement counter for atomic check-and-reserve.
   Keyed by (tenant_id, resource_id). `used` is incremented on reserve and
   decremented on release. `limit_value` is the cap; reserve fails when
   used+amount > limit_value. */
message QuotaCounter {
    message List {repeated QuotaCounter counters = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "quota_counters"
        indexes: [
            {name: "quota_counters_tenant_resource_uniq", columns: ["tenant_id", "resource_id"], unique: true}
        ]
    };

    QuotaCounterId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    cloud.v1.iam.TenantId tenant_id = 2 [
        (ratel.column).constraints = {
            references_table: "tenants"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 3 [(goplain.field).embed = true];

    string resource_id = 10 [(validate.rules).string = {min_len: 1, max_len: 128}];
    int64 limit_value = 11;
    int64 used = 12;
}
