syntax = "proto3";

package cloud.v1.catalog;

import "cloud/v1/iam/user.proto";
import "cloud/v1/common/timestamps.proto";
import "goplain/goplain.proto";
import "google/protobuf/field_mask.proto";
import "cloud/v1/common/identity.proto";
import "cloud/v1/iam/tenant.proto";
import "ratelproto/ratelproto.proto";
import "cloud/v1/common/config_file.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/cloud/v1/catalog";


/*
  Database — kind + variant. Each variant bundles its own Shape + Tuning.
  Backend validation rules:
  1. sync_replicas <= replicas (Postgres).
  2. replicas <= 9 when group_replication=true (MySQL).
  3. storage_nodes min зависит от fault_tolerance (YDB).
  4. auto_scale.max_size >= min_size (YDBManaged).
  5. node_count ignored if auto_scale set (YDBManaged).
  6. resource_preset_id filtered by compute_type OLTP/OLAP.
  7. zone_replicas <= nodes (Cockroach).
  8. tiers пустой ⇒ используются nodes/replication_factor (Picodata)
*/
message Database {
    enum Kind {
        DATABASE_KIND_UNSPECIFIED = 0;
        DATABASE_KIND_POSTGRES = 1;
        DATABASE_KIND_MYSQL = 2;
        DATABASE_KIND_MARIADB = 3;       // wire-compat with MySQL; reuses Mysql
        DATABASE_KIND_YDB = 4;
        DATABASE_KIND_YDB_MANAGED = 5;
        DATABASE_KIND_COCKROACH = 6;
        DATABASE_KIND_PICODATA = 7;
    }
    Kind kind = 1 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    oneof variant {
        option (validate.required) = true;
        Postgres postgres = 100;
        Mysql mysql = 101;
        Mysql mariadb = 102;     // shares Mysql shape+tuning
        Ydb ydb = 103;
        YdbManaged ydb_managed = 104;
        Cockroach cockroach = 105;
        Picodata picodata = 106;
        External external = 107; // BYOD — connect to user-managed DB, skip infra
    }

    /* External — BYOD (bring-your-own-database). No provisioning, no agent
       setup; stroppy runs the workload against a pre-existing endpoint.
       `kind` on the parent Database still indicates wire protocol family. */
    message External {
        string endpoint = 1 [(validate.rules).string = {min_len: 3, max_len: 512}];   // host:port (e.g. "10.1.0.5:5432")
        string database = 2 [(validate.rules).string.max_len = 256];                  // db name / path (e.g. "/Root/testdb")
        string username = 3 [(validate.rules).string.max_len = 256];
        // password — stored in plaintext per-deployment; consider SettingsItem
        // ref for shared credentials.
        string password = 4 [(validate.rules).string.max_len = 512];
        string ssl_mode = 5 [(validate.rules).string.max_len = 32];                   // engine-specific: "disable", "require", ...
        /* extra query-string params appended to driver URL. */
        map<string, string> extra_params = 10 [(validate.rules).map.max_pairs = 16];
    }

    // Options — what gets applied to one role's machines.
    message Options {
        repeated cloud.v1.common.ConfigFile files = 1 [(validate.rules).repeated.max_items = 64];
        repeated string cli_args = 2 [(validate.rules).repeated = {
            max_items: 256,
            items: {string: {max_len: 4096}}
        }];
        map<string, string> env = 3 [(validate.rules).map = {
            max_pairs: 256,
            keys: {string: {min_len: 1, max_len: 256, pattern: "^[A-Z_][A-Z0-9_]*$"}},
            values: {string: {max_len: 8192}}
        }];
    }

    /* PostgreSQL streaming-replication configuration. */
    message Postgres {
        Shape  shape  = 1 [(validate.rules).message.required = true];
        Tuning tuning = 2 [(validate.rules).message.required = true];
        /* PostgreSQL cluster topology and replication settings. */
        message Shape {
            // PostgreSQL streaming-replication: 1 primary + N replicas.
            // No hard upper bound; sane cap.
            uint32 replicas = 1 [(validate.rules).uint32.lte = 32];
            // sync_standby_names list size. Must be <= replicas (cross-field — not enforced here).
            uint32 sync_replicas = 2 [(validate.rules).uint32.lte = 32];
            bool patroni = 3; // Patroni HA orchestrator enabled
            bool etcd_colocated = 4; // etcd runs on same nodes as postgres
            bool pgbouncer_colocated = 5; // pgBouncer connection pooling on same nodes
            bool haproxy_dedicated = 6; // HAProxy load balancer on separate nodes
        }
        /* PostgreSQL per-role configuration options. */
        message Tuning {
            Options master = 1;
            Options replica = 2;
            Options haproxy = 3;
            Options pgbouncer = 4;
            Options patroni = 5;
            Options etcd = 6;
        }
    }

    /* MySQL/MariaDB replication configuration. */
    message Mysql {
        Shape  shape  = 1 [(validate.rules).message.required = true];
        Tuning tuning = 2 [(validate.rules).message.required = true];
        /* MySQL cluster topology and replication settings. */
        message Shape {
            // MySQL 8.0 Group Replication: HARD cap 9 members per group
            // (dev.mysql.com/doc/refman/8.0/en/group-replication-limitations).
            // Async replication has no formal cap; 32 is a practical sane bound.
            // Cross-field rule (replicas<=9 when group_replication=true) — backend.
            uint32 replicas = 1 [(validate.rules).uint32.lte = 32];
            bool group_replication = 2; // MySQL Group Replication enabled (limits replicas to 9)
            bool semi_sync = 3; // Semi-synchronous replication enabled
            bool proxysql_dedicated = 4; // ProxySQL load balancer on separate nodes
        }
        /* MySQL per-role configuration options. */
        message Tuning {
            Options primary = 1;
            Options replica = 2;
            Options proxysql = 3;
        }
    }

    /* YDB self-hosted configuration. */
    message Ydb {
        Shape  shape  = 1 [(validate.rules).message.required = true];
        Tuning tuning = 2 [(validate.rules).message.required = true];
        /* YDB cluster storage topology and fault tolerance. */
        message Shape {
            /* YDB fault tolerance levels: none, 4-2 block, or 3-datacenter mirror. */
            enum FaultTolerance {
                YDB_FAULT_TOLERANCE_UNSPECIFIED = 0;
                YDB_FAULT_TOLERANCE_NONE = 1; // No redundancy (dev/test only)
                YDB_FAULT_TOLERANCE_BLOCK_4_2 = 2; // 4-replica block with 2-replica mirror
                YDB_FAULT_TOLERANCE_MIRROR_3_DC = 3; // 3-way replication across datacenters
            }
            /* Failure domain granularity for replica placement. */
            enum FailureDomainType {
                YDB_FAILURE_DOMAIN_TYPE_UNSPECIFIED = 0;
                YDB_FAILURE_DOMAIN_TYPE_DISK = 1; // Disk/volume granularity
                YDB_FAILURE_DOMAIN_TYPE_BODY = 2; // Machine/server granularity
                YDB_FAILURE_DOMAIN_TYPE_RACK = 3; // Rack granularity
                YDB_FAILURE_DOMAIN_TYPE_DATACENTER = 4; // Datacenter granularity
            }
            // Storage nodes per ydb.tech/docs/en/concepts/topology:
            //   none        — min 1 (dev/test, no redundancy)
            //   block-4-2   — min 8 failure domains (10 recommended)
            //   mirror-3-dc — min 3 (3-node), 9 standard (3 DC × 3 racks)
            // Mode-specific min — cross-field, enforced backend.
            uint32 storage_nodes = 1 [(validate.rules).uint32 = {gte: 1, lte: 1024}];
            uint32 database_nodes = 2 [(validate.rules).uint32.lte = 1024]; // 0 = combined with storage
            bool haproxy_dedicated = 3; // HAProxy load balancer on separate nodes
            FaultTolerance fault_tolerance = 4 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
            uint32 storage_groups = 5 [(validate.rules).uint32 = {gte: 1, lte: 256}];
            bool auto_size_pdisks = 6; // Auto-size persistent disks (pdisks)
            FailureDomainType failure_domain_type = 7 [(validate.rules).enum.defined_only = true];
            string database_path = 8 [(validate.rules).string = {min_len: 2, max_len: 255, pattern: "^/[A-Za-z0-9_/-]+$"}]; // YDB database path in cluster
        }
        /* YDB per-role configuration options. */
        message Tuning {
            Options storage = 1;
            Options database = 2;
            Options haproxy = 3;
        }
    }

    /* YDB Managed (YC Managed Database) configuration. */
    message YdbManaged {
        Shape  shape  = 1 [(validate.rules).message.required = true];
        Tuning tuning = 2;
        /* YDB Managed cluster shape and scaling settings. */
        message Shape {
            /* YDB Managed deployment type: serverless or dedicated cluster. */
            enum Kind {
                YDB_MANAGED_KIND_UNSPECIFIED = 0;
                YDB_MANAGED_KIND_SERVERLESS = 1; // Serverless auto-scaling
                YDB_MANAGED_KIND_DEDICATED = 2; // Dedicated cluster
            }
            /* YDB Managed workload profile: OLTP or OLAP. */
            enum ComputeType {
                YDB_MANAGED_COMPUTE_TYPE_UNSPECIFIED = 0;
                YDB_MANAGED_COMPUTE_TYPE_OLTP = 1; // Online transaction processing
                YDB_MANAGED_COMPUTE_TYPE_OLAP = 2; // Online analytical processing
            }
            /* Dedicated cluster auto-scaling settings. */
            message AutoScale {
                uint32 min_size = 1 [(validate.rules).uint32 = {gte: 1, lte: 64}]; // Minimum cluster size
                uint32 max_size = 2 [(validate.rules).uint32 = {gte: 1, lte: 64}]; // Maximum cluster size
                uint32 cpu_utilization_percent = 3 [(validate.rules).uint32 = {gte: 1, lte: 100}]; // Target CPU utilization threshold
            }
            /* YDB Managed resource preset from YC catalog. */
            enum ResourcePresetId {
                YDB_MANAGED_RESOURCE_PRESET_ID_UNSPECIFIED = 0;
                YDB_MANAGED_RESOURCE_PRESET_ID_SMALL_M8 = 1;   // 4c / 8GB  OLTP
                YDB_MANAGED_RESOURCE_PRESET_ID_SMALL = 2;   // 4c / 16GB OLTP
                YDB_MANAGED_RESOURCE_PRESET_ID_MEDIUM = 3;   // 8c / 32GB OLTP
                YDB_MANAGED_RESOURCE_PRESET_ID_MEDIUM_M64 = 4;   // 8c / 64GB OLTP
                YDB_MANAGED_RESOURCE_PRESET_ID_MEDIUM_M96 = 5;   // 8c / 96GB OLTP
                YDB_MANAGED_RESOURCE_PRESET_ID_LARGE = 6;   // 12c / 48GB OLTP
                YDB_MANAGED_RESOURCE_PRESET_ID_XLARGE = 7;   // 16c / 64GB OLTP
                YDB_MANAGED_RESOURCE_PRESET_ID_OLTP_C16_M128 = 8;   // 16c / 128GB OLTP
                YDB_MANAGED_RESOURCE_PRESET_ID_OLAP_MEDIUM = 9;   // 8c / 32GB OLAP
                YDB_MANAGED_RESOURCE_PRESET_ID_OLAP_LARGE = 10;  // 12c / 48GB OLAP
            }
            /* YDB Managed storage type from YC catalog. */
            enum StorageTypeId {
                YDB_MANAGED_STORAGE_TYPE_ID_UNSPECIFIED = 0;
                YDB_MANAGED_STORAGE_TYPE_ID_SSD = 1; // SSD storage
            }
            Kind kind = 1 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
            ComputeType compute_type = 2 [(validate.rules).enum.defined_only = true];
            uint32 node_count = 3 [(validate.rules).uint32 = {gte: 1, lte: 64}]; // Fixed cluster size; ignored when auto_scale set
            uint32 storage_groups = 4 [(validate.rules).uint32.lte = 256]; // Storage groups (dedicated only)
            ResourcePresetId resource_preset_id = 5 [(validate.rules).enum.defined_only = true];
            StorageTypeId storage_type_id = 6 [(validate.rules).enum.defined_only = true];
            uint32 throttling_rcus = 7 [(validate.rules).uint32.lte = 10000]; // RU/s throttle (serverless only)
            AutoScale auto_scale = 8; // Auto-scaling config (dedicated only)
        }
        /* YDB Managed has managed tuning; no host-level options. */
        message Tuning {}
    }

    /* CockroachDB distributed SQL configuration. */
    message Cockroach {
        Shape  shape  = 1 [(validate.rules).message.required = true];
        Tuning tuning = 2 [(validate.rules).message.required = true];
        /* CockroachDB cluster node topology. */
        message Shape {
            uint32 nodes = 1 [(validate.rules).uint32 = {gte: 1, lte: 256}]; // Cluster node count (min 3 for HA)
        }
        /* CockroachDB replication and zone configuration. */
        message Tuning {
            Options node = 1;
            uint32 zone_replicas = 2 [(validate.rules).uint32 = {gte: 1, lte: 7}]; // Zone replication factor for data ranges
        }
    }

    /* Tarantool Picodata configuration. */
    message Picodata {
        Shape  shape  = 1 [(validate.rules).message.required = true];
        Tuning tuning = 2 [(validate.rules).message.required = true];
        /* Multi-tier instance group with independent replication. */
        message Tier {
            string name = 1 [(validate.rules).string = {min_len: 1, max_len: 63, pattern: "^[a-z][a-z0-9_-]*$"}]; // Tier identifier
            uint32 replication_factor = 2 [(validate.rules).uint32 = {gte: 1, lte: 32}];
            uint32 count = 3 [(validate.rules).uint32 = {gte: 1, lte: 1024}]; // Instance count in tier
            bool can_vote = 4; // Participate in voting quorum
        }
        /* Picodata cluster topology and sharding. */
        message Shape {
            uint32 nodes = 1 [(validate.rules).uint32.lte = 1024]; // Single-tier instance count
            uint32 replication_factor = 2 [(validate.rules).uint32.lte = 32]; // Single-tier RF
            uint32 shards = 3 [(validate.rules).uint32.lte = 100000]; // Vshard bucket count
            bool haproxy_dedicated = 4; // HAProxy load balancer on separate nodes
            repeated Tier tiers = 5 [(validate.rules).repeated.max_items = 16]; // Multi-tier groups (overrides nodes/RF)
        }
        /* Picodata per-role configuration options. */
        message Tuning {
            Options instance = 1;
            Options haproxy = 2;
        }
    }
}

message DatabasePresetId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }
/* Reusable database configuration template. */
message DatabasePreset {
    message List {repeated DatabasePreset database_presets = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "database_presets"
        indexes: [
            {name: "database_presets_tenant_idx", columns: ["tenant_id"]}
        ]
    };

    DatabasePresetId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    cloud.v1.iam.TenantId tenant_id = 2 [
        (ratel.column).constraints = {
            references_table: "tenants"
            references_column: "id"
            on_delete: CASCADE
        },
        (validate.rules).message = {required: true}
    ];
    cloud.v1.common.Timestamps timestamps = 3 [(goplain.field).embed = true];
    cloud.v1.common.Identity identity = 4 [(goplain.field).embed = true];
    optional cloud.v1.iam.UserId created_by = 9 [(ratel.column).constraints = {
        references_table: "users"
        references_column: "id"
        on_delete: SET_NULL
    }];

    Database database = 12 [
        (validate.rules).message.required = true,
        (goplain.field).serialize = true,
        (ratel.column).constraints.default_value = "'{}'::jsonb"
    ];
}

/* Reference a preset or inline database configuration. */
message DatabaseOrPreset {
    /* Either a preset or inline database config. */
    oneof database_variant {
        option (goplain.oneof).embed = true;
        option (validate.required) = true;
        cloud.v1.catalog.DatabasePresetId database_preset_id = 10 [(ratel.column).constraints = {
            references_table: "database_presets"
            references_column: "id"
            on_delete: RESTRICT
        }]; // Use predefined preset
        cloud.v1.catalog.Database database = 11 [
            (goplain.field).serialize = true,
            (ratel.column).constraints.default_value = "'{}'::jsonb"
        ]; // Inline custom configuration
    }
}


message CreateDatabasePresetRequest {
    DatabasePreset preset = 1 [(validate.rules).message = {required: true}];
}

message UpdateDatabasePresetRequest {
    DatabasePreset preset = 1 [(validate.rules).message = {required: true}];
    google.protobuf.FieldMask update_mask = 2 [(validate.rules).message = {required: true}];
}


service DatabasePresetService {
    rpc CreateDatabasePreset (CreateDatabasePresetRequest) returns (DatabasePreset)       { option idempotency_level = IDEMPOTENT; }
    rpc UpdateDatabasePreset (UpdateDatabasePresetRequest) returns (DatabasePreset)       { option idempotency_level = IDEMPOTENT; }
    rpc DeleteDatabasePreset (DatabasePresetId)            returns (DatabasePreset)       { option idempotency_level = IDEMPOTENT; }
    rpc GetDatabasePreset    (DatabasePresetId)            returns (DatabasePreset)       { option idempotency_level = NO_SIDE_EFFECTS; }
    rpc ListDatabasePresets  (cloud.v1.iam.TenantId)       returns (DatabasePreset.List)  { option idempotency_level = NO_SIDE_EFFECTS; }
    /* CloneDatabasePreset — copy with new id + suffix "-copy" to allow edit. */
    rpc CloneDatabasePreset  (DatabasePresetId)            returns (DatabasePreset)       { option idempotency_level = IDEMPOTENT; }
}