syntax = "proto3";

package cloud.api;


option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/api";

enum ApiError {
    API_ERROR_UNSPECIFIED = 0;
    API_ERROR_NOT_FOUND = 1;
    API_ERROR_FORBIDDEN = 2;
    API_ERROR_PERMISSION_DENIED = 3;
}

enum LogicalError {
    LOGICAL_ERROR_UNSPECIFIED = 0;
    LOGICAL_ERROR_INSUFFICIENT_RESOURCES = 2;
}

message InsufficientResourcesError {
    string resource_name = 1;
    uint64 requested = 2;
    uint64 available = 3;
}