syntax = "proto3";

package cloud.models;

import "goplain/goplain.proto";
import "models/common.proto";
import "ratelproto/ratelproto.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/models";

message TenantId { option (goplain.message) = {generate: true, type_alias: true}; string value = 1 [(validate.rules).string.len = 26]; }
/* Root tenant entity representing an isolated workspace. */
message Tenant {
    /* Container for paginated tenant results. */
    message List {repeated Tenant tenants = 1;}
    option (goplain.message).generate = true;
    option (ratel.table) = {
        generate: true
        table_name: "tenants"
    };
    TenantId id = 1 [
        (ratel.column) = {constraints: {primary_key: true}},
        (validate.rules).message = {required: true}
    ];
    models.Timestamps timestamps = 2 [(goplain.field).embed = true];
    models.Identity identity = 3 [(goplain.field).embed = true];
}
