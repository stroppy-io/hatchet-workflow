syntax = "proto3";

package cloud.models;

import "models/settings.proto";   // YandexCloudPlatformId, YandexCloudZone
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/models";


/* Provider — infrastructure provider backend for deployment. */
enum Provider {
    PROVIDER_UNSPECIFIED = 0; // Default unset state.
    PROVIDER_DOCKER      = 1; // Local Docker containerization.
    PROVIDER_YANDEX      = 2; // Yandex Cloud managed infrastructure.
}

// MachineRole — tag identifying machine purpose within a run.
// Source: stroppy-cloud/internal/domain/types/run.go MachineRole.
enum MachineRole {
    MACHINE_ROLE_UNSPECIFIED  = 0;
    MACHINE_ROLE_DATABASE     = 1;
    MACHINE_ROLE_MONITOR      = 2;
    MACHINE_ROLE_STROPPY      = 3;
    MACHINE_ROLE_ETCD         = 4;
    MACHINE_ROLE_PROXY        = 5;     // HAProxy / ProxySQL
    MACHINE_ROLE_PGBOUNCER    = 6;
    MACHINE_ROLE_YDB_STORAGE  = 7;
    MACHINE_ROLE_YDB_DATABASE = 8;
}

// MachineSpec — sizing for a single VM. Generic.
// Static caps; tenant-level caps via TenantQuotas applied at admission time.
message MachineSpec {
    uint32 cpus      = 1 [(validate.rules).uint32 = {gte: 1, lte: 128}];
    uint32 memory_mb = 2 [(validate.rules).uint32 = {gte: 128, lte: 1048576}];   // 128 MB .. 1 TiB
    uint32 disk_gb   = 3 [(validate.rules).uint32 = {gte: 1, lte: 65536}];        // 1 GB .. 64 TiB
    string disk_type = 4 [(validate.rules).string.max_len = 64];
    repeated SecondaryDisk secondary_disks = 5 [(validate.rules).repeated.max_items = 16];

    // SecondaryDisk — raw block device. YDB pdisk consumer; appears in-guest
    // as /dev/disk/by-id/virtio-<device_name>.
    message SecondaryDisk {
        string device_name = 1 [(validate.rules).string = {min_len: 1, max_len: 32, pattern: "^[a-z][a-z0-9-]*$"}];
        uint32 size_gb     = 2 [(validate.rules).uint32 = {gte: 1, lte: 65536}];
        string disk_type   = 3 [(validate.rules).string.max_len = 64];
    }
}

// Deployment — provider-specific infrastructure spec.
// Mirrors terraform module inputs in stroppy-cloud/deployments/terraform/.
message Deployment {
    Provider provider = 1 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    oneof variant {
        option (validate.required) = true;
        Yandex yandex = 100;
        // PROVIDER_DOCKER has no spec — local docker runner.
    }

    // Yandex — YC self-hosted topology (VPC + compute).
    // Managed YDB lives on Database.YdbManaged (database.proto).
    // Mirrors stroppy-cloud/deployments/terraform/yandex/variables.tf.
    message Yandex {
        Network network = 1 [(validate.rules).message.required = true];
        Compute compute = 2 [(validate.rules).message.required = true];

        // Network — yandex networking input. Maps to module var `networking`.
        message Network {
            string name = 1                [(validate.rules).string = {min_len: 1, max_len: 63, pattern: "^[a-z][a-z0-9-]*$"}];
            // external_id — pre-created VPC network id.
            string external_id = 2         [(validate.rules).string = {min_len: 1, max_len: 64}];
            // cidr — subnet CIDR allocated by stroppy inside the VPC.
            string cidr = 3                [(validate.rules).string = {min_len: 9, max_len: 18, pattern: "^[0-9.]+/[0-9]{1,2}$"}];
            YandexCloudZone zone = 4       [(validate.rules).enum.defined_only = true];
        }

        // Compute — yandex compute input. Maps to module var `compute`.
        message Compute {
            YandexCloudPlatformId platform_id = 1 [(validate.rules).enum.defined_only = true];
            // image_id — YC compute image (Ubuntu, etc).
            string image_id = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
            bool serial_port_enable = 3;
            // Default placement for VMs that omit their own zone. Resolved
            // during terraform var rendering (run/task_infra.go).
            Placement placement = 4;
            repeated VM vms = 5 [(validate.rules).repeated.min_items = 1];
        }

        // Placement — zone distribution strategy.
        message Placement {
            enum Strategy {
                STRATEGY_UNSPECIFIED = 0;
                STRATEGY_SINGLE      = 1;   // every VM in zones[0]
                STRATEGY_ROUND_ROBIN = 2;   // distribute by index across zones
            }
            Strategy strategy = 1 [(validate.rules).enum.defined_only = true];
            repeated YandexCloudZone zones = 2;
        }

        // NetworkAcceleration — VM nic mode.
        // STANDARD = stock virtio.
        // SOFTWARE_ACCELERATED = YC SAN (dedicated host cores for packet
        // processing, lower jitter; requires standard-v2/v3 platforms).
        enum NetworkAcceleration {
            NETWORK_ACCELERATION_UNSPECIFIED          = 0;
            NETWORK_ACCELERATION_STANDARD             = 1;
            NETWORK_ACCELERATION_SOFTWARE_ACCELERATED = 2;
        }

        // VM — one element of compute.vms map in terraform.
        // Maps to module var `compute.vms[<name>]`.
        message VM {
            string name = 1            [(validate.rules).string = {min_len: 1, max_len: 63, pattern: "^[a-z][a-z0-9-]*$"}];
            MachineRole role = 2       [(validate.rules).enum = {defined_only: true, not_in: [0]}];
            MachineSpec spec = 3       [(validate.rules).message.required = true];
            // Pinned IPv4 inside the subnet. Empty = DHCP.
            string internal_ip = 4     [(validate.rules).string.max_len = 15];
            bool has_public_ip = 5;
            // user_data — cloud-init blob rendered by the agent.
            string user_data = 6       [(validate.rules).string.max_len = 65536];
            NetworkAcceleration network_acceleration = 7 [(validate.rules).enum.defined_only = true];
            // Optional per-VM zone override; falls back to Compute.placement.
            YandexCloudZone zone = 8   [(validate.rules).enum.defined_only = true];
        }
    }
}
