syntax = "proto3";

package cloud.models;

import "google/protobuf/timestamp.proto";
import "goplain/goplain.proto";
import "ratelproto/ratelproto.proto";
import "validate/validate.proto";

option go_package = "github.com/stroppy-io/stroppy-cloud/internal/proto/models";


/* Standard audit timestamps for entity lifecycle tracking. */
message Timestamps {
    google.protobuf.Timestamp created_at = 1 [
        (ratel.column) = {constraints: {default_value: "now()"}},
        (validate.rules).timestamp = {required: true, lt_now: true}
    ];
    google.protobuf.Timestamp updated_at = 2 [
        (ratel.column) = {constraints: {default_value: "now()"}},
        (validate.rules).timestamp = {required: true, lt_now: true}
    ];
    optional google.protobuf.Timestamp deleted_at = 3 [
        (ratel.column) = {constraints: {default_value: "null"}},
        (validate.rules).timestamp.lt_now = true
    ];
}

/* Arbitrary string labels for categorizing and filtering entities. */
message Labels {
    repeated string label = 1 [(validate.rules).repeated = {
        max_items: 32,
        items: {string: {min_len: 1, max_len: 64}}
    }];
}

// Identity — name/description/labels embed. Composite uniqueness lives on the
// host table (tenant_id, name) — see each table's ratel.indexes block.
message Identity {
    string name = 1 [(validate.rules).string = {min_len: 1, max_len: 255}];
    optional string description = 2 [(validate.rules).string.max_len = 1024];
    optional Labels labels = 3 [(goplain.field).embed = true];
    /* Query criteria for filtering identities by name and labels. */
    message SearchFilter {
        optional string name = 1;
        optional Labels labels = 2;
    }
}
