lint:
  use:
    - DEFAULT
  enum_zero_value_suffix: NONE
  service_suffix: Service
  ignore: []
  except: []
  allow_comment_ignores: false
  ignore_only: {}
deps:
  - github.com/bufbuild/protoc-gen-validate@v1.3.3
  - github.com/cludden/protoc-gen-go-temporal@v1.23.1
  - github.com/temporalio/api@v1.62.12
  - github.com/stroppy-io/schemapb@v1.3.0
  - github.com/gopherex/protoc-gen-go-ogen@v1.1.3
  - github.com/gopherex/protoc-gen-go-graphql@v1.0.1
#  - github.com/yaroher/protoc-gen-go-plain@v0.7.17
#  - github.com/yaroher/ratel@v0.4.26
generate:
  inputs:
    - directory: cloud/v1/agent
    - directory: cloud/v1/api
  plugins:
    - name: go-grpc
      out: ../internal/proto
      opts:
        paths: source_relative
    - name: connect-go
      out: ../internal/proto
      opts:
        paths: source_relative
        simple: true
#    - name: go-graphql
#      out: ../internal/proto
#      opts:
#        paths: source_relative
#    - name: go-ogen
#      out: ../internal/proto
#      opts:
#        paths: source_relative
#        openapi_out: ../docs/openapi
#        default_oneof_schema_mode: object

breaking:
  ignore: []
  against_git_ref: master-worker
