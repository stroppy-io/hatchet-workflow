                    maxLength: 128
                    minLength: 1
                    type: string
                labels:
                    additionalProperties:
                        type: string
                    maxProperties: 64
                    type: object
                order:
                    format: int32
                    minimum: 0
                    type: integer
                status:
                    enum:
                        - 0
                        - 1
                        - 2
                        - 5
                        - 3
                        - 4
                        - 6
                        - 7
                        - 8
                        - 9
                        - 10
                        - 11
                    format: int32
                    type: integer
                tags:
                    $ref: '#/components/schemas/Tags'
                writeFile:
                    $ref: '#/components/schemas/File'
            type: object
        Allocation:
            additionalProperties: false
            properties:
                info:
                    $ref: '#/components/schemas/Info'
                used:
                    format: uint64
                    type: string
            required:
                - info
            type: object
        ApiToken:
            additionalProperties: false
            properties:
                accountId:
                    maxLength: 64
                    minLength: 1
                    type: string
                createdAt:
                    format: date-time
                    type: string
                expiresAt:
                    format: date-time
                    type: string
                id:
                    maxLength: 64
                    minLength: 1
