components:
    schemas:
        Account:
            additionalProperties: false
            properties:
                createdAt:
                    format: date-time
                    type: string
                email:
                    format: email
                    maxLength: 255
                    minLength: 5
                    type: string
                emailVerified:
                    type: boolean
                id:
                    maxLength: 64
                    minLength: 1
                    type: string
                isAdmin:
                    type: boolean
                nickname:
                    maxLength: 64
                    minLength: 3
                    pattern: ^[a-zA-Z0-9_.-]+$
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            type: object
        AddFavoriteRequest:
            additionalProperties: false
            properties:
                kind:
                    enum:
                        - 1
                        - 2
                        - 3
                        - 4
                        - 5
                        - 6
                    format: int32
                    type: integer
                targetId:
                    maxLength: 64
                    minLength: 1
                    type: string
                tenantId:
                    maxLength: 64
                    minLength: 1
                    type: string
            type: object
        AddFavoriteResponse:
            additionalProperties: false
            properties:
                favorite:
                    $ref: '#/components/schemas/FavoriteRecord'
            required:
                - favorite
            type: object
        AgentStep:
            additionalProperties: false
            oneOf:
                - required:
                    - createDir
                - required:
                    - writeFile
                - required:
                    - fetchFile
                - required:
                    - callCmd
            properties:
                callCmd:
                    $ref: '#/components/schemas/Cmd'
                createDir:
                    $ref: '#/components/schemas/Dir'
                fetchFile:
                    $ref: '#/components/schemas/File'
