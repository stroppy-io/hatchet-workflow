services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: stroppy
      POSTGRES_USER: stroppy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stroppy}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stroppy" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- VictoriaMetrics cluster (multi-tenant metrics) ---
  vmstorage:
    image: victoriametrics/vmstorage:v1.139.0-cluster
    restart: always
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=30d"
    volumes:
      - vmdata:/storage

  vminsert:
    image: victoriametrics/vminsert:v1.139.0-cluster
    restart: always
    command:
      - "-storageNode=vmstorage:8400"
    depends_on:
      - vmstorage

  vmselect:
    image: victoriametrics/vmselect:v1.139.0-cluster
    restart: always
    command:
      - "-storageNode=vmstorage:8401"
    depends_on:
      - vmstorage

  # --- VictoriaLogs (multi-tenant logs) ---
  victorialogs:
    image: victoriametrics/victoria-logs:v1.48.0
    restart: always
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=30d"
    volumes:
      - vldata:/storage

  # --- vmauth (single entry point for all monitoring) ---
  vmauth:
    image: victoriametrics/vmauth:v1.139.0
    restart: always
    command:
      - "-auth.config=/etc/vmauth/config.yml"
    ports:
      - "8427:8427"
    environment:
      VMAUTH_TOKEN: ${MONITORING_TOKEN:-stroppy-monitoring-secret}
    volumes:
      - ./deployments/vmauth/config.yml:/etc/vmauth/config.yml:ro
    depends_on:
      - vminsert
      - vmselect
      - victorialogs

  grafana:
    image: grafana/grafana:12.4.2
    restart: always
    ports:
      - "${BIND_ADDR:-0.0.0.0}:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_ANON_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_ROOT_URL: ${GF_ROOT_URL:-http://localhost:3001}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GF_SERVE_SUB_PATH:-false}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # --- vmagent (scrapes server /metrics, pushes to vminsert) ---
  vmagent:
    image: victoriametrics/vmagent:v1.139.0
    restart: always
    command:
      - "-promscrape.config=/etc/vmagent/scrape.yml"
      - "-remoteWrite.url=http://vminsert:8480/insert/0/prometheus/api/v1/write"
    volumes:
      - ./deployments/vmagent/scrape.yml:/etc/vmagent/scrape.yml:ro
    depends_on:
      - vminsert

  # --- Valkey (share-snapshot store + locks) ---
  valkey:
    image: valkey/valkey:8-alpine
    restart: always
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:-valkey}"]
    ports:
      - "${BIND_ADDR:-0.0.0.0}:6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:-valkey}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- MinIO (S3-compatible package store) ---
  minio:
    image: minio/minio:latest
    restart: always
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-stroppy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-stroppy-minio}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:9000:9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: create the packages bucket (reachable by service name on the compose net).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-stroppy} ${MINIO_ROOT_PASSWORD:-stroppy-minio} &&
      mc mb -p local/${STROPPY_S3_BUCKET:-stroppy-packages} || true
      "
    restart: "no"

  # --- Stroppy Cloud server ---
  # Runs with host networking so it can reach Docker agent containers directly.
  server:
    restart: always
    build:
      context: .
      dockerfile: deployments/docker/stroppy-cloud.Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      vmauth:
        condition: service_started
    command:
      - serve
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Terraform workdir — survives `docker compose down/up` so a server
      # restart never strands cloud resources by losing tfstate.
      - tfstate:/tmp/stroppy-terraform
      # Persistent cache of fetched binaries (node_exporter, vmagent, stroppy,
      # vector, postgres_exporter, mysqld_exporter). Survives compose
      # restarts so agents reuse local downloads instead of going to github.
      - binaries:/var/lib/stroppy-cache
    # network_mode: host → reach every other service on 127.0.0.1:<published port>.
    environment:
      STROPPY_GRPC_ADDR: ":8080"
      STROPPY_PG_HOST: "127.0.0.1"
      STROPPY_PG_PORT: "5436"
      STROPPY_PG_USER: stroppy
      STROPPY_PG_PASSWORD: ${POSTGRES_PASSWORD:-stroppy}
      STROPPY_PG_DATABASE: stroppy
      STROPPY_VALKEY_ADDR: "127.0.0.1:6379"
      STROPPY_VALKEY_PASSWORD: ${VALKEY_PASSWORD:-valkey}
      STROPPY_JWT_SECRET: ${JWT_SECRET:-stroppy-dev-secret-change-me-32-bytes-long!!}
      STROPPY_VM_URL: ${STROPPY_VM_URL:-http://127.0.0.1:8427}
      STROPPY_VL_URL: ${STROPPY_VL_URL:-http://127.0.0.1:8427}
      STROPPY_VICTORIA_TOKEN: ${MONITORING_TOKEN:-stroppy-monitoring-secret}
      STROPPY_GRAFANA_URL: ${GRAFANA_URL:-http://127.0.0.1:3001}
      STROPPY_S3_ENDPOINT: "127.0.0.1:9000"
      STROPPY_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-stroppy}
      STROPPY_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-stroppy-minio}
      STROPPY_S3_BUCKET: ${STROPPY_S3_BUCKET:-stroppy-packages}
      STROPPY_S3_USE_SSL: "false"
      STROPPY_SHARE_BASE_URL: ${STROPPY_SHARE_BASE_URL:-http://127.0.0.1:8080/share/}
      STROPPY_ROOT_ADMIN_EMAIL: ${STROPPY_ROOT_ADMIN_EMAIL:-admin@stroppy.local}
      STROPPY_ROOT_ADMIN_PASSWORD: ${STROPPY_ROOT_ADMIN_PASSWORD:-stroppy-admin-change-me}
      STROPPY_SERVER_ADDR: ${STROPPY_SERVER_ADDR:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      YC_TOKEN: ${YC_TOKEN:-}
      YC_CLOUD_ID: ${YC_CLOUD_ID:-}
      YC_FOLDER_ID: ${YC_FOLDER_ID:-}

  # --- Caddy reverse proxy (prod only) ---
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: [prod]
    network_mode: host
    volumes:
      - ./deployments/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  valkeydata:
  miniodata:
  vmdata:
  vldata:
  tfstate:
  binaries:
  grafanadata:
  caddy_data:
  caddy_config:
