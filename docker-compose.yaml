services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: stroppy
      POSTGRES_USER: stroppy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stroppy}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stroppy" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- VictoriaMetrics cluster (multi-tenant metrics) ---
  vmstorage:
    image: victoriametrics/vmstorage:v1.139.0-cluster
    restart: always
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=30d"
    volumes:
      - vmdata:/storage

  vminsert:
    image: victoriametrics/vminsert:v1.139.0-cluster
    restart: always
    command:
      - "-storageNode=vmstorage:8400"
    depends_on:
      - vmstorage

  vmselect:
    image: victoriametrics/vmselect:v1.139.0-cluster
    restart: always
    command:
      - "-storageNode=vmstorage:8401"
    depends_on:
      - vmstorage

  # --- VictoriaLogs (multi-tenant logs) ---
  victorialogs:
    image: victoriametrics/victoria-logs:v1.48.0
    restart: always
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=30d"
    volumes:
      - vldata:/storage

  # --- vmauth (single entry point for all monitoring) ---
  vmauth:
    image: victoriametrics/vmauth:v1.139.0
    restart: always
    command:
      - "-auth.config=/etc/vmauth/config.yml"
    ports:
      - "8427:8427"
    environment:
      VMAUTH_TOKEN: ${MONITORING_TOKEN:-stroppy-monitoring-secret}
    volumes:
      - ./deployments/vmauth/config.yml:/etc/vmauth/config.yml:ro
    depends_on:
      - vminsert
      - vmselect
      - victorialogs

  grafana:
    image: grafana/grafana:12.4.2
    restart: always
    ports:
      - "${BIND_ADDR:-0.0.0.0}:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_ANON_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Grafana is reached through the server gateway at <server>/grafana (no
      # separate public Grafana URL). Serve from the /grafana sub-path; the
      # root_url path must be /grafana (domain is only used for absolute links).
      GF_SERVER_ROOT_URL: ${GF_ROOT_URL:-http://localhost:8080/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GF_SERVE_SUB_PATH:-true}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # --- vmagent (scrapes server /metrics, pushes to vminsert) ---
  vmagent:
    image: victoriametrics/vmagent:v1.139.0
    restart: always
    command:
      - "-promscrape.config=/etc/vmagent/scrape.yml"
      - "-remoteWrite.url=http://vminsert:8480/insert/0/prometheus/api/v1/write"
    volumes:
      - ./deployments/vmagent/scrape.yml:/etc/vmagent/scrape.yml:ro
    depends_on:
      - vminsert

  # --- Stroppy Cloud server ---
  # Runs with host networking so it can reach Docker agent containers directly.
  # --- apt cache (agents apt through the gateway -> this backend) ---
  apt-cacher-ng:
    image: sameersbn/apt-cacher-ng:3.7.4-20220421
    restart: unless-stopped
    volumes:
      - aptcache:/var/cache/apt-cacher-ng

  # --- Temporal (runs execute as workflows) ---
  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=stroppy
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-stroppy}
      - POSTGRES_SEEDS=postgres
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
    ports:
      - "${BIND_ADDR:-0.0.0.0}:7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    restart: always
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8233
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8233:8080"

  server:
    restart: on-failure
    build:
      context: .
      dockerfile: deployments/docker/stroppy-cloud.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      vmauth:
        condition: service_started
      temporal:
        condition: service_started
      apt-cacher-ng:
        condition: service_started
    command:
      - serve
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tfstate:/tmp/stroppy-terraform
      - binaries:/var/lib/stroppy-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8080:8080"   # agent gateway (Temporal proxy + binary + apt)
      - "${BIND_ADDR:-0.0.0.0}:8081:8081"   # control-plane API / UI
    environment:
      DATABASE_URL: postgres://stroppy:${POSTGRES_PASSWORD:-stroppy}@postgres:5432/stroppy?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-stroppy-dev-secret}
      MONITORING_URL: http://vmauth:8427
      MONITORING_TOKEN: ${MONITORING_TOKEN:-stroppy-monitoring-secret}
      # grafana.url returned to the SPA: a SAME-ORIGIN relative path served by the
      # gateway (GRAFANA_BACKEND) — no separate public Grafana URL per environment.
      GRAFANA_URL: ${GRAFANA_URL:-/grafana}
      GRAFANA_BACKEND: ${GRAFANA_BACKEND:-http://grafana:3000}
      # Seed a root admin on first boot so a fresh `docker compose up` is
      # immediately usable (login admin/admin). Override in prod via .env.
      STROPPY_ADMIN_EMAIL: ${STROPPY_ADMIN_EMAIL:-admin@stroppy.local}
      STROPPY_ADMIN_PASSWORD: ${STROPPY_ADMIN_PASSWORD:-admin}
      STROPPY_MIN_VERSION: ${STROPPY_MIN_VERSION:-5.1.2}
      # --- Temporal + gateway wiring ---
      TEMPORAL_HOSTPORT: temporal:7233
      TEMPORAL_NAMESPACE: default
      AGENT_GATEWAY_ADDR: ":8080"
      API_ADDR: ":8081"
      # Agents are joined to the server's compose network and dial the gateway
      # in-network (direct bridge DNAT, not a userland-proxy hairpin that breaks gRPC).
      AGENT_SERVER_ADDR: http://server:8080
      AGENT_ATTACH_NETWORK: stroppy-cloud_default
      AGENT_BINARY_PATH: /usr/local/bin/stroppy-cloud
      STROPPY_BINARY_CACHE_DIR: /var/lib/stroppy-cache/binaries
      STROPPY_APT_CACHE_BACKEND: apt-cacher-ng:3142
      STROPPY_UPSTREAM: https://github.com/stroppy-io/stroppy/releases/download/v5.1.2/stroppy_linux_amd64.tar.gz
      YC_TOKEN: ${YC_TOKEN:-}
      YC_CLOUD_ID: ${YC_CLOUD_ID:-}
      YC_FOLDER_ID: ${YC_FOLDER_ID:-}

  # --- Caddy reverse proxy (prod only) ---
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: [prod]
    network_mode: host
    volumes:
      - ./deployments/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  aptcache:
  vmdata:
  vldata:
  tfstate:
  binaries:
  grafanadata:
  caddy_data:
  caddy_config:
