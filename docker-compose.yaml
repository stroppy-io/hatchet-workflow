services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: stroppy
      POSTGRES_USER: stroppy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stroppy}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stroppy" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- VictoriaMetrics cluster (multi-tenant metrics) ---
  vmstorage:
    image: victoriametrics/vmstorage:v1.139.0-cluster
    restart: always
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=30d"
    volumes:
      - vmdata:/storage

  vminsert:
    image: victoriametrics/vminsert:v1.139.0-cluster
    restart: always
    command:
      - "-storageNode=vmstorage:8400"
    depends_on:
      - vmstorage

  vmselect:
    image: victoriametrics/vmselect:v1.139.0-cluster
    restart: always
    command:
      - "-storageNode=vmstorage:8401"
    depends_on:
      - vmstorage

  # --- VictoriaLogs (multi-tenant logs) ---
  victorialogs:
    image: victoriametrics/victoria-logs:v1.48.0
    restart: always
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=30d"
    volumes:
      - vldata:/storage

  # --- vmauth (single entry point for all monitoring) ---
  vmauth:
    image: victoriametrics/vmauth:v1.139.0
    restart: always
    command:
      - "-auth.config=/etc/vmauth/config.yml"
    ports:
      - "8427:8427"
    environment:
      VMAUTH_TOKEN: ${MONITORING_TOKEN:-stroppy-monitoring-secret}
    volumes:
      - ./deployments/vmauth/config.yml:/etc/vmauth/config.yml:ro
    depends_on:
      - vminsert
      - vmselect
      - victorialogs

  grafana:
    image: grafana/grafana:12.4.2
    restart: always
    ports:
      - "${BIND_ADDR:-0.0.0.0}:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_ANON_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Grafana is reached through the server gateway at <server>/grafana (no
      # separate public Grafana URL). Serve from the /grafana sub-path; the
      # root_url path must be /grafana (domain is only used for absolute links).
      GF_SERVER_ROOT_URL: ${GF_ROOT_URL:-http://localhost:8080/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GF_SERVE_SUB_PATH:-true}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # --- vmagent (scrapes server /metrics, pushes to vminsert) ---
  vmagent:
    image: victoriametrics/vmagent:v1.139.0
    restart: always
    command:
      - "-promscrape.config=/etc/vmagent/scrape.yml"
      - "-remoteWrite.url=http://vminsert:8480/insert/0/prometheus/api/v1/write"
    volumes:
      - ./deployments/vmagent/scrape.yml:/etc/vmagent/scrape.yml:ro
    depends_on:
      - vminsert

  # --- Stroppy Cloud server ---
  # Runs with host networking so it can reach Docker agent containers directly.
  # --- apt cache (agents apt through the gateway -> this backend) ---
  apt-cacher-ng:
    image: sameersbn/apt-cacher-ng:3.7.4-20220421
    restart: unless-stopped
    volumes:
      - aptcache:/var/cache/apt-cacher-ng
      # VfileUseRangeOps:0 — fixes 503 "unexpected range" on CDN repos (PGDG).
      - ./deployments/apt-cacher-ng/acng-rangefix.conf:/etc/apt-cacher-ng/zz-rangefix.conf:ro

  # --- Gitea (SP-C internal git backend: instance + org catalog repos) ---
  # GITEA_TOKEN is provisioned out-of-band, NOT baked into this compose file or
  # any image layer: after first boot, run once
  #   docker compose exec -T gitea gitea admin user create \
  #     --admin --username stroppy-bot --password '<random>' \
  #     --email bootstrap@stroppy.local --must-change-password=false
  #   docker compose exec -T gitea gitea admin user generate-access-token \
  #     --username stroppy-bot --token-name server --scopes write:repository,write:organization
  # and export the printed token as GITEA_TOKEN before `docker compose up
  # server` (or place it in a git-ignored .env — never commit it). The server
  # only reads it from its environment (internal/app.Config.GiteaToken); it
  # never crosses a Temporal workflow-history boundary and is not written to
  # any log.
  gitea:
    image: gitea/gitea:1.23
    restart: always
    environment:
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__security__INSTALL_LOCK: "true"
    volumes:
      - giteadata:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:3000/api/healthz || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Temporal (runs execute as workflows) ---
  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=stroppy
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-stroppy}
      - POSTGRES_SEEDS=postgres
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/stroppy.yaml
    volumes:
      - ./deployments/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/stroppy.yaml:ro
    ports:
      - "${BIND_ADDR:-0.0.0.0}:7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    restart: always
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8233
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8233:8080"

  server:
    restart: on-failure
    build:
      context: .
      dockerfile: deployments/docker/stroppy-cloud.Dockerfile
      secrets:
        - npm_token
    depends_on:
      postgres:
        condition: service_healthy
      vmauth:
        condition: service_started
      temporal:
        condition: service_started
      apt-cacher-ng:
        condition: service_started
      gitea:
        condition: service_started
    command:
      - serve
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tfstate:/tmp/stroppy-terraform
      - binaries:/var/lib/stroppy-cache
      - ide-worktrees:/var/lib/stroppy-ide
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8080:8080"   # agent gateway (Temporal proxy + binary + apt)
      - "${BIND_ADDR:-0.0.0.0}:8081:8081"   # control-plane API / UI
    environment:
      DATABASE_URL: postgres://stroppy:${POSTGRES_PASSWORD:-stroppy}@postgres:5432/stroppy?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-stroppy-dev-secret}
      MONITORING_URL: http://vmauth:8427
      MONITORING_TOKEN: ${MONITORING_TOKEN:-stroppy-monitoring-secret}
      # grafana.url returned to the SPA: a SAME-ORIGIN relative path served by the
      # gateway (GRAFANA_BACKEND) — no separate public Grafana URL per environment.
      GRAFANA_URL: ${GRAFANA_URL:-/grafana}
      GRAFANA_BACKEND: ${GRAFANA_BACKEND:-http://grafana:3000}
      # Seed a root admin on first boot so a fresh `docker compose up` is
      # immediately usable (login admin/admin). Override in prod via .env.
      STROPPY_ADMIN_EMAIL: ${STROPPY_ADMIN_EMAIL:-admin@stroppy.local}
      STROPPY_ADMIN_PASSWORD: ${STROPPY_ADMIN_PASSWORD:-admin}
      STROPPY_MIN_VERSION: ${STROPPY_MIN_VERSION:-5.1.2}
      # --- Temporal + gateway wiring ---
      TEMPORAL_HOSTPORT: temporal:7233
      TEMPORAL_NAMESPACE: default
      AGENT_GATEWAY_ADDR: ":8080"
      API_ADDR: ":8081"
      # Agents dial the server gateway. Dev (no PUBLIC_SERVER_ADDR) uses the
      # server compose service directly — caddy is a prod-only profile and is not
      # running in dev, so defaulting to http://caddy made docker agents time out
      # on bootstrap. Prod/cloud sets PUBLIC_SERVER_ADDR to the public origin.
      AGENT_SERVER_ADDR: ${AGENT_SERVER_ADDR:-${PUBLIC_SERVER_ADDR:-http://server:8080}}
      AGENT_ATTACH_NETWORK: stroppy-cloud_default
      AGENT_BINARY_PATH: /usr/local/bin/stroppy-cloud
      STROPPY_BINARY_CACHE_DIR: /var/lib/stroppy-cache/binaries
      STROPPY_APT_CACHE_BACKEND: apt-cacher-ng:3142
      STROPPY_REGISTRY_BACKEND: http://registry:5000
      # SP-C git backend. GITEA_TOKEN has NO default here on purpose — see the
      # gitea service comment above; leaving it unset disables instance-repo
      # bootstrap (internal/app/run.go) so a first-ever `docker compose up`
      # still succeeds before the operator provisions the token.
      GITEA_BACKEND: http://gitea:3000
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      # SP-C Task 4: per-org code-server lifecycle. Defaults OFF (empty ->
      # false in cmd/cli/serve_cmd.go) even when GITEA_TOKEN is set — this
      # spins up real docker containers via the mounted docker.sock above,
      # a bigger step than GitBundleStore's transparent storage swap, so an
      # operator opts in explicitly once Gitea + code-server image pulls are
      # both provisioned.
      IDE_MANAGER_ENABLED: ${IDE_MANAGER_ENABLED:-}
      IDE_WORKTREE_ROOT: /var/lib/stroppy-ide
      # Must name the SAME volume the `ide-worktrees:` mount below uses, so
      # Manager can mount each scope's subdirectory (not the whole volume)
      # into that scope's own code-server container.
      IDE_WORKTREE_VOLUME: stroppy-cloud_ide-worktrees
      # `make ide-image` bakes the stroppy-yaml code-server extension
      # (extensions/stroppy-yaml-lsp-client) into a derived code-server
      # image (deployments/docker/stroppy-ide.Dockerfile) tagged
      # stroppy-ide:latest by default — set IDE_IMAGE to that tag (and push
      # it wherever this compose file's dockerd pulls from) to get live
      # diagnostics/completion/preview in the embedded IDE. Left at the
      # stock upstream tag by default: no extension, plain editor, exactly
      # like every deployment before this feature existed.
      IDE_IMAGE: ${IDE_IMAGE:-codercom/code-server:4.96.4}
      # Same network agent containers attach to (AGENT_ATTACH_NETWORK) — the
      # per-org code-server containers Manager starts need to be reachable
      # from THIS container by name, exactly like agent containers do.
      IDE_DOCKER_NETWORK: stroppy-cloud_default
      # SP-C Tasks 5-7: host path to the compiled cmd/stroppy-yaml-lsp
      # binary (`make lsp-binary` -> bin/stroppy-yaml-lsp), bind-mounted
      # read-only into every scope's code-server container at
      # /usr/local/bin/stroppy-yaml-lsp (internal/ide.Manager.Config.
      # LSPBinaryPath) — the stroppy-yaml-lsp-client extension baked into
      # IDE_IMAGE (see above) spawns it from exactly that path. Unset by
      # default: no deploy pipeline builds and stages this binary yet, so a
      # scope's code-server simply has no LSP available until an operator
      # sets this — see .superpowers/sdd/lsp-extension-report.md.
      IDE_LSP_BINARY_PATH: ${IDE_LSP_BINARY_PATH:-}
      STROPPY_UPSTREAM: https://github.com/stroppy-io/stroppy/releases/download/v5.1.2/stroppy_linux_amd64.tar.gz
      QUOTA_REFRESH_INTERVAL: 0
      YC_TOKEN: ${YC_TOKEN:-}
      YC_CLOUD_ID: ${YC_CLOUD_ID:-}
      YC_FOLDER_ID: ${YC_FOLDER_ID:-}

  # --- Pull-through Docker registry (mirrors Docker Hub for egress-less nodes) ---
  registry:
    image: registry:2
    restart: unless-stopped
    environment:
      REGISTRY_PROXY_REMOTEURL: "https://registry-1.docker.io"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry-data:/var/lib/registry

  # --- Caddy reverse proxy (prod only) ---
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: [prod]
    depends_on:
      - server
      - grafana
    ports:
      - "${CADDY_HTTP_BIND_ADDR:-0.0.0.0}:80:80"
      - "${CADDY_HTTPS_BIND_ADDR:-0.0.0.0}:443:443"
    environment:
      # Defaults to local HTTP so running the prod profile on a laptop does not
      # try ACME for the real cloud domain. Prod should set PUBLIC_SERVER_ADDR or
      # CADDY_SITE_ADDRESS to https://<domain>.
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-${PUBLIC_SERVER_ADDR:-${CADDY_DOMAIN:-http://localhost, http://caddy}}}
      CADDY_UPSTREAM: server:8080
      CADDY_GRAFANA_UPSTREAM: grafana:3000
    volumes:
      - ./deployments/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

# NPM_TOKEN authenticates the SPA build against GitHub Packages, where
# @stroppy-io/schemapb lives. Export it before `docker compose build server`.
secrets:
  npm_token:
    environment: NPM_TOKEN

volumes:
  pgdata:
  aptcache:
  vmdata:
  vldata:
  tfstate:
  binaries:
  grafanadata:
  caddy_data:
  caddy_config:
  registry-data:
  giteadata:
  ide-worktrees:
