services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: stroppy
      POSTGRES_USER: stroppy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stroppy}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stroppy" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- VictoriaMetrics cluster (multi-tenant metrics) ---
  vmstorage:
    image: victoriametrics/vmstorage:v1.139.0-cluster
    restart: always
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=30d"
    volumes:
      - vmdata:/storage

  vminsert:
    image: victoriametrics/vminsert:v1.139.0-cluster
    restart: always
    command:
      - "-storageNode=vmstorage:8400"
    depends_on:
      - vmstorage

  vmselect:
    image: victoriametrics/vmselect:v1.139.0-cluster
    restart: always
    command:
      - "-storageNode=vmstorage:8401"
    depends_on:
      - vmstorage

  # --- VictoriaLogs (multi-tenant logs) ---
  victorialogs:
    image: victoriametrics/victoria-logs:v1.48.0
    restart: always
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=30d"
    volumes:
      - vldata:/storage

  # --- vmauth (single entry point for all monitoring) ---
  vmauth:
    image: victoriametrics/vmauth:v1.139.0
    restart: always
    command:
      - "-auth.config=/etc/vmauth/config.yml"
    ports:
      - "8427:8427"
    environment:
      VMAUTH_TOKEN: ${MONITORING_TOKEN:-stroppy-monitoring-secret}
    volumes:
      - ./deployments/vmauth/config.yml:/etc/vmauth/config.yml:ro
    depends_on:
      - vminsert
      - vmselect
      - victorialogs

  grafana:
    image: grafana/grafana:12.4.2
    restart: always
    ports:
      - "${BIND_ADDR:-0.0.0.0}:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_ANON_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_ROOT_URL: ${GF_ROOT_URL:-http://localhost:3001}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GF_SERVE_SUB_PATH:-false}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # --- vmagent (scrapes server /metrics, pushes to vminsert) ---
  vmagent:
    image: victoriametrics/vmagent:v1.139.0
    restart: always
    command:
      - "-promscrape.config=/etc/vmagent/scrape.yml"
      - "-remoteWrite.url=http://vminsert:8480/insert/0/prometheus/api/v1/write"
    volumes:
      - ./deployments/vmagent/scrape.yml:/etc/vmagent/scrape.yml:ro
    depends_on:
      - vminsert

  # --- Stroppy Cloud server ---
  # Runs with host networking so it can reach Docker agent containers directly.
  server:
    restart: always
    build:
      context: .
      dockerfile: deployments/docker/stroppy-cloud.Dockerfile
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      vmauth:
        condition: service_started
    command:
      - serve
      - --addr=:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Terraform workdir — survives `docker compose down/up` so a server
      # restart never strands cloud resources by losing tfstate.
      - tfstate:/tmp/stroppy-terraform
      # Persistent cache of fetched binaries (node_exporter, vmagent, stroppy,
      # vector, postgres_exporter, mysqld_exporter). Survives compose
      # restarts so agents reuse local downloads instead of going to github.
      - binaries:/var/lib/stroppy-cache
    environment:
      DATABASE_URL: postgres://stroppy:${POSTGRES_PASSWORD:-stroppy}@127.0.0.1:5436/stroppy?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-stroppy-dev-secret}
      MONITORING_URL: http://127.0.0.1:8427
      MONITORING_TOKEN: ${MONITORING_TOKEN:-stroppy-monitoring-secret}
      GRAFANA_URL: ${GRAFANA_URL:-http://127.0.0.1:3001}
      STROPPY_ADMIN_PASSWORD: ${STROPPY_ADMIN_PASSWORD:-}
      STROPPY_MIN_VERSION: ${STROPPY_MIN_VERSION:-5.1.2}
      YC_TOKEN: ${YC_TOKEN:-}
      YC_CLOUD_ID: ${YC_CLOUD_ID:-}
      YC_FOLDER_ID: ${YC_FOLDER_ID:-}

  # --- Temporal (demo profile) ---
  temporal:
    image: temporalio/auto-setup:1.25.2
    profiles: [demo]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=stroppy
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-stroppy}
      - POSTGRES_SEEDS=postgres
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
    ports:
      - "${BIND_ADDR:-0.0.0.0}:7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    profiles: [demo]
    restart: always
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8233
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8233:8080"

  # --- MinIO (stroppy binary / artifact store for the demo) ---
  minio:
    image: minio/minio:latest
    profiles: [demo]
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:9000:9000"
      - "${BIND_ADDR:-0.0.0.0}:9001:9001"
    volumes:
      - miniodata:/data

  # --- apt-cacher-ng (transparent .deb cache, hidden behind the server) ---
  # On the shared network but agents are never told its address: the server's apt
  # relay (:3142) forwards to it, so an agent's apt goes through the server alone.
  # Caches http repos (Ubuntu base, PGDG) → identical, fast repeat installs.
  apt-cacher-ng:
    image: sameersbn/apt-cacher-ng:3.7.4-20220421
    profiles: [demo]
    restart: always
    volumes:
      - aptcache:/var/cache/apt-cacher-ng

  # --- Demo control-plane server (docker-provider e2e) ---
  # Lean image (no SPA). On the compose network for its OWN server-side discovery
  # (temporal/postgres/apt-cacher by name) and publishes the agent gateway (:8080)
  # + api gRPC (:8081) on the host. Agent VMs run on per-run bridges and reach the
  # gateway at the address the server gives them — http://host.docker.internal:8080
  # (the docker host gateway), exactly like a cloud VM reaches a public endpoint.
  # Everything an agent needs (Temporal proxy, agent binary, artifacts, apt) is on
  # that one address.
  server-demo:
    profiles: [demo]
    restart: on-failure
    build:
      context: .
      dockerfile: deployments/docker/demo-server.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      apt-cacher-ng:
        condition: service_started
    command: ["serve", "--addr=:8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - binaries:/var/lib/stroppy-cache
    environment:
      TEMPORAL_HOSTPORT: temporal:7233
      TEMPORAL_NAMESPACE: default
      DATABASE_URL: postgres://stroppy:${POSTGRES_PASSWORD:-stroppy}@postgres:5432/stroppy?sslmode=disable
      AGENT_IMAGE: stroppy-agent:latest
      # The single address agent VMs are told (admin-set in prod; here the docker
      # host gateway so per-run-bridge agents reach the published gateway).
      AGENT_SERVER_ADDR: http://host.docker.internal:8080
      AGENT_GATEWAY_ADDR: :8080
      GRPC_ADDR: :8081
      STROPPY_BINARY_CACHE_DIR: /var/lib/stroppy-cache/binaries
      # Real stroppy 5.1.2 release; the gateway caches it and serves it at
      # /artifacts/stroppy so agents run an actual ~1-minute tpcc load.
      STROPPY_UPSTREAM: https://github.com/stroppy-io/stroppy/releases/download/v5.1.2/stroppy_linux_amd64.tar.gz
      # apt: the gateway forwards agent apt traffic (on the same :8080) to this
      # hidden apt-cacher-ng. Agents never address it directly.
      STROPPY_APT_CACHE_BACKEND: "apt-cacher-ng:3142"
      STROPPY_KEEP_AGENTS: "${STROPPY_KEEP_AGENTS:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8080:8080"
      - "${BIND_ADDR:-0.0.0.0}:8081:8081"

  # --- Caddy reverse proxy (prod only) ---
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: [prod]
    network_mode: host
    volumes:
      - ./deployments/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  aptcache:
  miniodata:
  vmdata:
  vldata:
  tfstate:
  binaries:
  grafanadata:
  caddy_data:
  caddy_config:
