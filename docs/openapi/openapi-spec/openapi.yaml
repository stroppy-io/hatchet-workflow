openapi: 3.0.3
info:
  title: Stroppy Cloud API
  description: "Complete HTTP API for the Stroppy Cloud control plane, extracted from the\nGo chi router\
    \ in `internal/domain/api/server.go` and the TypeScript client\nin `web/src/api/`. Covers every endpoint\
    \ the web UI consumes plus the\npublic share, agent, and binary-distribution surfaces.\n\n## Authentication\n\
    Most endpoints require a JWT bearer access token (`Authorization: Bearer <token>`),\nobtained via\
    \ `POST /api/v1/auth/login`. Access tokens live 15 minutes; a\nlong-lived refresh token is set as\
    \ an HttpOnly `refresh_token` cookie and\nrotated via `POST /api/v1/auth/refresh`.\n\n## Tenancy &\
    \ roles\nEndpoints under `/api/v1` (except auth/grafana) require a tenant-scoped JWT\n(select one\
    \ via `POST /api/v1/auth/select-tenant` when the user belongs to\nmultiple tenants). Role gates:\n\
    \  - **viewer**: read endpoints (runs, presets, suites, settings, metrics).\n  - **operator**: run\
    \ lifecycle, presets/suites/packages writes, uploads, baselines.\n  - **owner**: tenant settings,\
    \ members, API tokens.\n  - **root**: `/api/v1/admin/*` (tenants and users).\n\nThe per-operation\
    \ `description` notes the minimum role.\n"
  version: 1.0.0
servers:
- url: /
  description: Same-origin (SPA is served by the API server)
security:
- bearerAuth: []
tags:
- name: Auth
  description: Login, token refresh, session, password.
- name: Tenant Members
  description: Manage tenant membership (owner only).
- name: API Tokens
  description: Tenant API tokens (owner only).
- name: Admin
  description: Root-only tenant and user administration.
- name: Runs
  description: Single benchmark run lifecycle and inspection.
- name: Presets
  description: Per-tenant database topology presets.
- name: Run Presets
  description: Saved full run configurations.
- name: Suites
  description: Matrix suites (db presets × workloads) and batches.
- name: Suite Items
  description: Workload-axis items within a suite.
- name: Packages
  description: DB install packages (apt/deb).
- name: Metrics & Logs
  description: Run metrics, comparison, and log streaming.
- name: Settings
  description: Per-tenant cloud/monitoring/quota settings.
- name: Grafana
  description: Grafana embed configuration.
- name: Queue & Quotas
  description: Durable job queue and resource quota usage.
- name: Probe
  description: Stroppy workload introspection.
- name: Baselines
  description: Named baseline run pointers for comparison.
- name: Share
  description: Public read-only run share links.
- name: System
  description: Health and stroppy version discovery.
- name: Uploads
  description: Package binary uploads.
- name: Agent
  description: Internal agent ↔ server polling protocol (not used by the UI).
- name: Binaries
  description: Internal binary distribution (not used by the UI).
- name: WebSocket
  description: Live log/report stream (documented for reference).
