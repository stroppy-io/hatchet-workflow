openapi: 3.0.3
info:
  title: Stroppy Cloud — Auth API
  description: Self-contained Auth domain slice of the Stroppy Cloud API. Independently valid; no external
    $refs.
  version: 1.0.0
servers:
- url: /
  description: Same-origin (SPA is served by the API server)
security:
- bearerAuth: []
tags:
- name: Auth
  description: Login, token refresh, session, password.
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Log in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 'Access token returned in the body; an HttpOnly `refresh_token`

            cookie is set (Path=/api/v1/auth, 7d).

            '
          headers:
            Set-Cookie:
              schema:
                type: string
              description: refresh_token=<hex>; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Rotate refresh token, mint a new access token
      description: Reads the `refresh_token` cookie; rotates it and returns a new access token.
      security: []
      responses:
        '200':
          description: New access token; rotated refresh cookie set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Log out
      description: Deletes the refresh token server-side and clears the cookie.
      security: []
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Current user and tenant memberships
      responses:
        '200':
          description: Authenticated principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/select-tenant:
    post:
      tags:
      - Auth
      summary: Mint a tenant-scoped access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tenant_id
              properties:
                tenant_id:
                  type: string
      responses:
        '200':
          description: Tenant-scoped access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/password:
    put:
      tags:
      - Auth
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Error'
components:
  schemas:
    AccessTokenResponse:
      type: object
      properties:
        access_token:
          type: string
    AuthUser:
      type: object
      description: Returned by GET /api/v1/auth/me.
      properties:
        user_id:
          type: string
        username:
          type: string
        is_root:
          type: boolean
        tenant_id:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
          enum:
          - viewer
          - operator
          - owner
        tenants:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              tenant_name:
                type: string
              role:
                type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
