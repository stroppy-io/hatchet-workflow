openapi: 3.0.3
info:
  title: Stroppy Cloud — Queue & Quotas API
  description: Self-contained Queue & Quotas domain slice of the Stroppy Cloud API. Independently valid;
    no external $refs.
  version: 1.0.0
servers:
- url: /
  description: Same-origin (SPA is served by the API server)
security:
- bearerAuth: []
tags:
- name: Queue & Quotas
  description: Durable job queue and resource quota usage.
paths:
  /api/v1/queue:
    get:
      tags:
      - Queue & Quotas
      summary: List active/queued jobs
      description: Viewer+.
      responses:
        '200':
          description: Queue rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueRow'
  /api/v1/quotas:
    get:
      tags:
      - Queue & Quotas
      summary: Resource usage vs. limits
      description: Viewer+.
      responses:
        '200':
          description: Quota usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotasResponse'
components:
  schemas:
    JobCost:
      type: object
      properties:
        cpus:
          type: integer
        memory_mb:
          type: integer
        disk_gb:
          type: integer
        vm_count:
          type: integer
        runs_running:
          type: integer
    QueueRow:
      type: object
      properties:
        run_id:
          type: string
        batch_id:
          type: string
        suite_id:
          type: string
        position:
          type: integer
        state:
          type: string
          enum:
          - queued
          - claimed
          - running
          - finished
          - failed
          - cancelled
        cost:
          $ref: '#/components/schemas/JobCost'
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        heartbeat_at:
          type: string
          format: date-time
        error:
          type: string
        name:
          type: string
    QuotasResponse:
      type: object
      properties:
        used:
          $ref: '#/components/schemas/JobCost'
        limits:
          $ref: '#/components/schemas/JobCost'
        queue_depth:
          type: integer
        running_count:
          type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
