openapi: 3.0.3
info:
  title: Stroppy Cloud — Presets API
  description: Self-contained Presets domain slice of the Stroppy Cloud API. Independently valid; no external
    $refs.
  version: 1.0.0
servers:
- url: /
  description: Same-origin (SPA is served by the API server)
security:
- bearerAuth: []
tags:
- name: Presets
  description: Per-tenant database topology presets.
paths:
  /api/v1/presets:
    get:
      tags:
      - Presets
      summary: List database topology presets
      description: Viewer+.
      parameters:
      - name: db_kind
        in: query
        schema:
          $ref: '#/components/schemas/DatabaseKind'
      responses:
        '200':
          description: Presets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Preset'
    post:
      tags:
      - Presets
      summary: Create a preset
      description: Operator+.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - db_kind
              - topology
              properties:
                name:
                  type: string
                description:
                  type: string
                db_kind:
                  $ref: '#/components/schemas/DatabaseKind'
                topology:
                  $ref: '#/components/schemas/Topology'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
  /api/v1/presets/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Presets
      summary: Get a preset
      description: Viewer+.
      responses:
        '200':
          description: Preset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preset'
        '404':
          $ref: '#/components/responses/Error'
    put:
      tags:
      - Presets
      summary: Update a preset
      description: Operator+. Built-in presets cannot be edited (clone first).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                topology:
                  $ref: '#/components/schemas/Topology'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '403':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Presets
      summary: Delete a preset
      description: Operator+.
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /api/v1/presets/{id}/clone:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Presets
      summary: Clone a preset
      description: Operator+.
      responses:
        '201':
          description: Cloned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdNameResponse'
components:
  schemas:
    CockroachTopology:
      type: object
      properties:
        nodes:
          $ref: '#/components/schemas/MachineSpec'
        options:
          $ref: '#/components/schemas/StringMap'
    DatabaseKind:
      type: string
      enum:
      - postgres
      - mysql
      - mariadb
      - picodata
      - ydb
      - ydb-managed
      - cockroach
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    IdNameResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    IdResponse:
      type: object
      properties:
        id:
          type: string
    MachineRole:
      type: string
      enum:
      - database
      - monitor
      - stroppy
      - etcd
      - proxy
      - pgbouncer
      - ydb-storage
      - ydb-database
    MachineSpec:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/MachineRole'
        count:
          type: integer
        cpus:
          type: integer
        memory_mb:
          type: integer
        disk_gb:
          type: integer
        disk_type:
          type: string
        secondary_disks:
          type: array
          items:
            $ref: '#/components/schemas/SecondaryDisk'
        placement:
          $ref: '#/components/schemas/PlacementSpec'
    MySQLTopology:
      type: object
      properties:
        primary:
          $ref: '#/components/schemas/MachineSpec'
        replicas:
          type: array
          items:
            $ref: '#/components/schemas/MachineSpec'
        proxysql:
          $ref: '#/components/schemas/MachineSpec'
        group_replication:
          type: boolean
        semi_sync:
          type: boolean
        primary_options:
          $ref: '#/components/schemas/StringMap'
        replica_options:
          $ref: '#/components/schemas/StringMap'
        proxysql_options:
          $ref: '#/components/schemas/StringMap'
    PicodataTier:
      type: object
      properties:
        name:
          type: string
        replication_factor:
          type: integer
        can_vote:
          type: boolean
        count:
          type: integer
    PicodataTopology:
      type: object
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/MachineSpec'
        haproxy:
          $ref: '#/components/schemas/MachineSpec'
        replication_factor:
          type: integer
        shards:
          type: integer
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/PicodataTier'
        instance_options:
          $ref: '#/components/schemas/StringMap'
        haproxy_options:
          $ref: '#/components/schemas/StringMap'
    PlacementSpec:
      type: object
      properties:
        strategy:
          type: string
          enum:
          - single
          - round-robin
        zones:
          type: array
          items:
            type: string
    PostgresTopology:
      type: object
      properties:
        master:
          $ref: '#/components/schemas/MachineSpec'
        replicas:
          type: array
          items:
            $ref: '#/components/schemas/MachineSpec'
        haproxy:
          $ref: '#/components/schemas/MachineSpec'
        pgbouncer:
          type: boolean
        patroni:
          type: boolean
        etcd:
          type: boolean
        sync_replicas:
          type: integer
        master_options:
          $ref: '#/components/schemas/StringMap'
        replica_options:
          $ref: '#/components/schemas/StringMap'
        haproxy_options:
          $ref: '#/components/schemas/StringMap'
        pgbouncer_options:
          $ref: '#/components/schemas/StringMap'
        patroni_options:
          $ref: '#/components/schemas/StringMap'
        etcd_options:
          $ref: '#/components/schemas/StringMap'
    Preset:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        db_kind:
          $ref: '#/components/schemas/DatabaseKind'
        is_builtin:
          type: boolean
        topology:
          $ref: '#/components/schemas/Topology'
        created_at:
          type: string
          format: date-time
    SecondaryDisk:
      type: object
      properties:
        device_name:
          type: string
        size_gb:
          type: integer
        type:
          type: string
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
    StringMap:
      type: object
      additionalProperties:
        type: string
    Topology:
      description: One of the per-kind topology shapes (discriminated by the owning preset/config db_kind).
      oneOf:
      - $ref: '#/components/schemas/PostgresTopology'
      - $ref: '#/components/schemas/MySQLTopology'
      - $ref: '#/components/schemas/PicodataTopology'
      - $ref: '#/components/schemas/YDBTopology'
      - $ref: '#/components/schemas/YDBManagedTopology'
      - $ref: '#/components/schemas/CockroachTopology'
    YDBManagedAutoScale:
      type: object
      properties:
        min_size:
          type: integer
        max_size:
          type: integer
        cpu_utilization_percent:
          type: integer
          default: 70
    YDBManagedTerraformOutput:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - serverless
          - dedicated
        folder_id:
          type: string
        location_id:
          type: string
        database_path:
          type: string
        ydb_api_endpoint:
          type: string
        ydb_full_endpoint:
          type: string
        document_api_endpoint:
          type: string
        tls_enabled:
          type: boolean
        status:
          type: string
        created_at:
          type: string
        labels:
          $ref: '#/components/schemas/StringMap'
        resource_preset_id:
          type: string
        network_id:
          type: string
        subnet_ids:
          type: array
          items:
            type: string
        storage_groups:
          type: integer
        storage_type_id:
          type: string
        throttling_rcu_limit:
          type: integer
    YDBManagedTopology:
      type: object
      properties:
        type:
          type: string
          enum:
          - serverless
          - dedicated
        compute_type:
          type: string
          enum:
          - oltp
          - olap
        resource_preset_id:
          type: string
        node_count:
          type: integer
        auto_scale:
          $ref: '#/components/schemas/YDBManagedAutoScale'
        storage_groups:
          type: integer
        storage_type:
          type: string
        throttling_rcus:
          type: integer
        client:
          $ref: '#/components/schemas/MachineSpec'
        database_path:
          type: string
        endpoint:
          type: string
        terraform_output:
          $ref: '#/components/schemas/YDBManagedTerraformOutput'
    YDBTopology:
      type: object
      properties:
        storage:
          $ref: '#/components/schemas/MachineSpec'
        database:
          $ref: '#/components/schemas/MachineSpec'
        haproxy:
          $ref: '#/components/schemas/MachineSpec'
        fault_tolerance:
          type: string
        failure_domain_type:
          type: string
        default_disk_type:
          type: string
        storage_groups:
          type: integer
        auto_size_pdisks:
          type: boolean
        database_path:
          type: string
        storage_options:
          $ref: '#/components/schemas/StringMap'
        database_options:
          $ref: '#/components/schemas/StringMap'
        haproxy_options:
          $ref: '#/components/schemas/StringMap'
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
