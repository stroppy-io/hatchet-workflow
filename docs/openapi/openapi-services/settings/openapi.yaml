openapi: 3.0.3
info:
  title: Stroppy Cloud — Settings & Grafana API
  description: Self-contained Settings & Grafana domain slice of the Stroppy Cloud API. Independently
    valid; no external $refs.
  version: 1.0.0
servers:
- url: /
  description: Same-origin (SPA is served by the API server)
security:
- bearerAuth: []
tags:
- name: Settings
  description: Per-tenant cloud/monitoring/quota settings.
- name: Grafana
  description: Grafana embed configuration.
paths:
  /api/v1/settings:
    get:
      tags:
      - Settings
      summary: Get tenant settings
      description: Viewer+.
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerSettings'
    put:
      tags:
      - Settings
      summary: Update tenant settings
      description: Owner+. `server_addr`/`binary_url` are root-only and preserved otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerSettings'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /api/v1/grafana:
    get:
      tags:
      - Grafana
      summary: Grafana embed configuration
      description: Authenticated (no tenant required).
      responses:
        '200':
          description: Grafana config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrafanaSettings'
components:
  schemas:
    CloudSettings:
      type: object
      properties:
        yandex:
          $ref: '#/components/schemas/YandexCloudSettings'
        server_addr:
          type: string
          description: Root-only writable.
        binary_url:
          type: string
          description: Root-only writable.
    GrafanaSettings:
      type: object
      properties:
        url:
          type: string
        embed_enabled:
          type: boolean
        dashboards:
          $ref: '#/components/schemas/StringMap'
    ServerSettings:
      type: object
      properties:
        cloud:
          $ref: '#/components/schemas/CloudSettings'
        webhooks:
          $ref: '#/components/schemas/WebhookConfig'
        quotas:
          $ref: '#/components/schemas/TenantQuotas'
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
    StringMap:
      type: object
      additionalProperties:
        type: string
    TenantQuotas:
      type: object
      properties:
        allowed_db_kinds:
          type: array
          items:
            type: string
        allowed_providers:
          type: array
          items:
            type: string
        max_nodes:
          type: integer
        max_cpus_per_node:
          type: integer
        max_memory_mb_per_node:
          type: integer
        max_disk_gb_per_node:
          type: integer
        max_concurrent_runs:
          type: integer
        max_concurrent_cpus:
          type: integer
        max_concurrent_memory_mb:
          type: integer
        max_concurrent_disk_gb:
          type: integer
        max_concurrent_vms:
          type: integer
        max_queue_depth:
          type: integer
    WebhookConfig:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
        events:
          type: array
          items:
            type: string
        timeout:
          type: integer
          description: Request timeout (seconds); default 10.
    YandexCloudSettings:
      type: object
      properties:
        token:
          type: string
        cloud_id:
          type: string
        folder_id:
          type: string
        zone:
          type: string
        network_id:
          type: string
        network_name:
          type: string
        subnet_cidr:
          type: string
        platform_id:
          type: string
        image_id:
          type: string
        assign_public_ip:
          type: boolean
        software_accelerated_network:
          type: boolean
        ssh_user:
          type: string
        ssh_public_key:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
