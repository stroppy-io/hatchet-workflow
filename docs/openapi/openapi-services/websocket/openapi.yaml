openapi: 3.0.3
info:
  title: Stroppy Cloud — WebSocket API
  description: Self-contained WebSocket domain slice of the Stroppy Cloud API. Independently valid; no
    external $refs.
  version: 1.0.0
servers:
- url: /
  description: Same-origin (SPA is served by the API server)
security:
- bearerAuth: []
tags:
- name: WebSocket
  description: Live log/report stream (documented for reference).
paths:
  /ws/logs:
    get:
      tags:
      - WebSocket
      summary: Live log/report stream (all runs)
      description: 'WebSocket upgrade. JWT is passed via the `token` query parameter

        (browsers can''t set WS headers). Messages are `WSMessage` JSON.

        '
      parameters:
      - name: token
        in: query
        schema:
          type: string
        description: JWT access token
      responses:
        '101':
          description: Switching Protocols (WebSocket).
  /ws/logs/{runID}:
    parameters:
    - name: runID
      in: path
      required: true
      schema:
        type: string
    - name: token
      in: query
      schema:
        type: string
    get:
      tags:
      - WebSocket
      summary: Live log/report stream (one run)
      description: WebSocket upgrade scoped to a single run.
      responses:
        '101':
          description: Switching Protocols (WebSocket).
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
