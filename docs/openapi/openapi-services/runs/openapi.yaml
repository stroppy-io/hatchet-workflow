openapi: 3.0.3
info:
  title: Stroppy Cloud — Runs API
  description: Self-contained Runs domain slice of the Stroppy Cloud API. Independently valid; no external
    $refs.
  version: 1.0.0
servers:
- url: /
  description: Same-origin (SPA is served by the API server)
security:
- bearerAuth: []
tags:
- name: Runs
  description: Single benchmark run lifecycle and inspection.
paths:
  /api/v1/run:
    post:
      tags:
      - Runs
      summary: Start (enqueue) a run
      description: 'Operator+. Resolves run preset/package, probes the workload, validates

        quotas, and enqueues the run in the durable job queue.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunConfig'
      responses:
        '202':
          description: Run queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  status:
                    type: string
                    example: queued
        '400':
          $ref: '#/components/responses/Error'
        '403':
          description: Quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Run already exists or queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Queue depth limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/runs:
    get:
      tags:
      - Runs
      summary: List runs (incl. queued)
      description: Viewer+. Includes queued jobs not yet snapshotted.
      responses:
        '200':
          description: Run summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunSummary'
  /api/v1/validate:
    post:
      tags:
      - Runs
      summary: Validate a run config
      description: Operator+. Static validation; does not enqueue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunConfig'
      responses:
        '200':
          description: Valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: valid
        '422':
          description: Invalid config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/dry-run:
    post:
      tags:
      - Runs
      summary: Compile a run config into a DAG without executing
      description: Operator+. Returns the planned graph, resolved config, and rendered configs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunConfig'
      responses:
        '200':
          description: Dry-run result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResponse'
        '400':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/stroppy-config-preview:
    post:
      tags:
      - Runs
      summary: Preview the rendered stroppy-config.json
      description: Operator+.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunConfig'
      responses:
        '200':
          description: Stroppy config preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stroppy_config:
                    type: string
                    description: JSON-encoded stroppy config
  /api/v1/run/{runID}:
    parameters:
    - name: runID
      in: path
      required: true
      schema:
        type: string
    delete:
      tags:
      - Runs
      summary: Delete a run
      description: Operator+. Cleans up provider resources best-effort.
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StatusResponse'
                - type: object
                  properties:
                    run_id:
                      type: string
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/run/{runID}/cancel:
    parameters:
    - name: runID
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Runs
      summary: Cancel a queued or running run
      description: Operator+.
      responses:
        '200':
          description: Cancelling.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: cancelling
                  run_id:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/run/{runID}/status:
    parameters:
    - name: runID
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Runs
      summary: Run status snapshot
      description: 'Viewer+. Returns the DAG snapshot annotated with current job state.

        Queued runs return a minimal shim (empty nodes, `job_state=queued`).

        '
      responses:
        '200':
          description: Run status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatus'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/run/{runID}/rendered-configs:
    parameters:
    - name: runID
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Runs
      summary: Per-component rendered config files
      description: Viewer+. postgresql.conf, ydb.yaml, pgbouncer.ini, etc.
      responses:
        '200':
          description: Rendered configs keyed by filename.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rendered_configs:
                    type: object
                    additionalProperties:
                      type: string
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/run/{runID}/agents:
    parameters:
    - name: runID
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Runs
      summary: Agents (machines) for a run with live status
      description: Viewer+.
      responses:
        '200':
          description: Agent list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentInfo'
components:
  schemas:
    AgentInfo:
      type: object
      properties:
        machine_id:
          type: string
        role:
          type: string
        host:
          type: string
        internal_host:
          type: string
        agent_port:
          type: integer
        registered:
          type: boolean
        healthy:
          type: boolean
        health_error:
          type: string
        last_seen_at:
          type: string
          format: date-time
    CockroachTopology:
      type: object
      properties:
        nodes:
          $ref: '#/components/schemas/MachineSpec'
        options:
          $ref: '#/components/schemas/StringMap'
    DatabaseConfig:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/DatabaseKind'
        version:
          type: string
        postgres:
          $ref: '#/components/schemas/PostgresTopology'
        mysql:
          $ref: '#/components/schemas/MySQLTopology'
        mariadb:
          $ref: '#/components/schemas/MySQLTopology'
        picodata:
          $ref: '#/components/schemas/PicodataTopology'
        ydb:
          $ref: '#/components/schemas/YDBTopology'
        ydb_managed:
          $ref: '#/components/schemas/YDBManagedTopology'
        cockroach:
          $ref: '#/components/schemas/CockroachTopology'
        rendered_config_overrides:
          $ref: '#/components/schemas/StringMap'
    DatabaseKind:
      type: string
      enum:
      - postgres
      - mysql
      - mariadb
      - picodata
      - ydb
      - ydb-managed
      - cockroach
    DryRunResponse:
      type: object
      properties:
        graph:
          description: Full graph object (JSON).
        nodes:
          description: Node list extracted from the graph.
        resolved_config:
          $ref: '#/components/schemas/RunConfig'
        effective_config:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/StringMap'
        stroppy_config:
          type: string
        rendered_configs:
          type: object
          additionalProperties:
            type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    ExternalDBConfig:
      type: object
      properties:
        endpoint:
          type: string
        database:
          type: string
        username:
          type: string
        password:
          type: string
        ssl_mode:
          type: string
    MachineRole:
      type: string
      enum:
      - database
      - monitor
      - stroppy
      - etcd
      - proxy
      - pgbouncer
      - ydb-storage
      - ydb-database
    MachineSpec:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/MachineRole'
        count:
          type: integer
        cpus:
          type: integer
        memory_mb:
          type: integer
        disk_gb:
          type: integer
        disk_type:
          type: string
        secondary_disks:
          type: array
          items:
            $ref: '#/components/schemas/SecondaryDisk'
        placement:
          $ref: '#/components/schemas/PlacementSpec'
    MonitorConfig:
      type: object
      properties:
        metrics_endpoint:
          type: string
        logs_endpoint:
          type: string
    MySQLTopology:
      type: object
      properties:
        primary:
          $ref: '#/components/schemas/MachineSpec'
        replicas:
          type: array
          items:
            $ref: '#/components/schemas/MachineSpec'
        proxysql:
          $ref: '#/components/schemas/MachineSpec'
        group_replication:
          type: boolean
        semi_sync:
          type: boolean
        primary_options:
          $ref: '#/components/schemas/StringMap'
        replica_options:
          $ref: '#/components/schemas/StringMap'
        proxysql_options:
          $ref: '#/components/schemas/StringMap'
    NetworkConfig:
      type: object
      properties:
        cidr:
          type: string
        zone:
          type: string
    NodeStatus:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/NodeStatusValue'
        error:
          type: string
    NodeStatusValue:
      type: string
      enum:
      - pending
      - running
      - done
      - failed
      - cancelled
    PicodataTier:
      type: object
      properties:
        name:
          type: string
        replication_factor:
          type: integer
        can_vote:
          type: boolean
        count:
          type: integer
    PicodataTopology:
      type: object
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/MachineSpec'
        haproxy:
          $ref: '#/components/schemas/MachineSpec'
        replication_factor:
          type: integer
        shards:
          type: integer
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/PicodataTier'
        instance_options:
          $ref: '#/components/schemas/StringMap'
        haproxy_options:
          $ref: '#/components/schemas/StringMap'
    PlacementSpec:
      type: object
      properties:
        strategy:
          type: string
          enum:
          - single
          - round-robin
        zones:
          type: array
          items:
            type: string
    PostgresTopology:
      type: object
      properties:
        master:
          $ref: '#/components/schemas/MachineSpec'
        replicas:
          type: array
          items:
            $ref: '#/components/schemas/MachineSpec'
        haproxy:
          $ref: '#/components/schemas/MachineSpec'
        pgbouncer:
          type: boolean
        patroni:
          type: boolean
        etcd:
          type: boolean
        sync_replicas:
          type: integer
        master_options:
          $ref: '#/components/schemas/StringMap'
        replica_options:
          $ref: '#/components/schemas/StringMap'
        haproxy_options:
          $ref: '#/components/schemas/StringMap'
        pgbouncer_options:
          $ref: '#/components/schemas/StringMap'
        patroni_options:
          $ref: '#/components/schemas/StringMap'
        etcd_options:
          $ref: '#/components/schemas/StringMap'
    Protocol:
      type: string
      enum:
      - pg
      - mysql
      - picodata
      - ydb-grpc
      - ydb-pgwire
      - ydb-grpcs
      - cockroach
    Provider:
      type: string
      enum:
      - yandex
      - docker
    RunConfig:
      type: object
      required:
      - id
      - provider
      - network
      - machines
      - database
      - monitor
      - stroppy
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        provider:
          $ref: '#/components/schemas/Provider'
        network:
          $ref: '#/components/schemas/NetworkConfig'
        machines:
          type: array
          items:
            $ref: '#/components/schemas/MachineSpec'
        database:
          $ref: '#/components/schemas/DatabaseConfig'
        monitor:
          $ref: '#/components/schemas/MonitorConfig'
        stroppy:
          $ref: '#/components/schemas/StroppyConfig'
        preset_id:
          type: string
        package_id:
          type: string
        platform_id:
          type: string
        machine_override:
          $ref: '#/components/schemas/MachineSpec'
        run_preset_id:
          type: string
        suite_id:
          type: string
        external_db:
          $ref: '#/components/schemas/ExternalDBConfig'
    RunStatus:
      description: Snapshot annotated with current job state; queued runs return a minimal shim.
      allOf:
      - $ref: '#/components/schemas/Snapshot'
      - type: object
        properties:
          job_state:
            type: string
            enum:
            - queued
            - claimed
            - running
            - finished
            - failed
            - cancelled
          queue_position:
            type: integer
          batch_id:
            type: string
          created_at:
            type: string
            format: date-time
    RunSummary:
      type: object
      properties:
        id:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeStatus'
        total:
          type: integer
        done:
          type: integer
        failed:
          type: integer
        pending:
          type: integer
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        db_kind:
          type: string
        provider:
          type: string
        script:
          type: string
        duration:
          type: string
        vus:
          type: integer
        db_version:
          type: string
        node_count:
          type: integer
        preset_id:
          type: string
        cancelled:
          type: boolean
        name:
          type: string
        description:
          type: string
        suite_id:
          type: string
        run_preset_id:
          type: string
    SecondaryDisk:
      type: object
      properties:
        device_name:
          type: string
        size_gb:
          type: integer
        type:
          type: string
    Snapshot:
      type: object
      properties:
        graph:
          type: string
          description: JSON-encoded graph
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeStatus'
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        state:
          type: object
          additionalProperties: true
          properties:
            provider:
              type: string
            run_config:
              description: object or JSON string
            targets:
              type: array
              items:
                $ref: '#/components/schemas/SnapshotTarget'
            effective_configs:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/StringMap'
    SnapshotTarget:
      type: object
      properties:
        id:
          type: string
        host:
          type: string
        internal_host:
          type: string
        role:
          type: string
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
    StringMap:
      type: object
      additionalProperties:
        type: string
    StroppyConfig:
      type: object
      properties:
        version:
          type: string
        protocol:
          $ref: '#/components/schemas/Protocol'
        script:
          type: string
          description: e.g. tpcc/procs, tpcc/tx, tpcb/tx
        sql:
          type: string
        duration:
          type: string
        k6_mode:
          type: string
          enum:
          - duration
          - iterations
        iterations:
          type: integer
        quiet:
          type: boolean
        no_thresholds:
          type: boolean
        vus:
          type: integer
        pool_size:
          type: integer
        scale_factor:
          type: number
        default_insert_method:
          type: string
        env:
          $ref: '#/components/schemas/StringMap'
        files:
          type: array
          items:
            $ref: '#/components/schemas/WorkloadFile'
        steps:
          type: array
          items:
            type: string
        no_steps:
          type: array
          items:
            type: string
        machine:
          $ref: '#/components/schemas/MachineSpec'
        config_override_json:
          type: string
        workload:
          type: string
          deprecated: true
        vus_scale:
          type: number
          deprecated: true
        workers:
          type: integer
          deprecated: true
    WorkloadFile:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          description: e.g. sql
        content:
          type: string
    YDBManagedAutoScale:
      type: object
      properties:
        min_size:
          type: integer
        max_size:
          type: integer
        cpu_utilization_percent:
          type: integer
          default: 70
    YDBManagedTerraformOutput:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - serverless
          - dedicated
        folder_id:
          type: string
        location_id:
          type: string
        database_path:
          type: string
        ydb_api_endpoint:
          type: string
        ydb_full_endpoint:
          type: string
        document_api_endpoint:
          type: string
        tls_enabled:
          type: boolean
        status:
          type: string
        created_at:
          type: string
        labels:
          $ref: '#/components/schemas/StringMap'
        resource_preset_id:
          type: string
        network_id:
          type: string
        subnet_ids:
          type: array
          items:
            type: string
        storage_groups:
          type: integer
        storage_type_id:
          type: string
        throttling_rcu_limit:
          type: integer
    YDBManagedTopology:
      type: object
      properties:
        type:
          type: string
          enum:
          - serverless
          - dedicated
        compute_type:
          type: string
          enum:
          - oltp
          - olap
        resource_preset_id:
          type: string
        node_count:
          type: integer
        auto_scale:
          $ref: '#/components/schemas/YDBManagedAutoScale'
        storage_groups:
          type: integer
        storage_type:
          type: string
        throttling_rcus:
          type: integer
        client:
          $ref: '#/components/schemas/MachineSpec'
        database_path:
          type: string
        endpoint:
          type: string
        terraform_output:
          $ref: '#/components/schemas/YDBManagedTerraformOutput'
    YDBTopology:
      type: object
      properties:
        storage:
          $ref: '#/components/schemas/MachineSpec'
        database:
          $ref: '#/components/schemas/MachineSpec'
        haproxy:
          $ref: '#/components/schemas/MachineSpec'
        fault_tolerance:
          type: string
        failure_domain_type:
          type: string
        default_disk_type:
          type: string
        storage_groups:
          type: integer
        auto_size_pdisks:
          type: boolean
        database_path:
          type: string
        storage_options:
          $ref: '#/components/schemas/StringMap'
        database_options:
          $ref: '#/components/schemas/StringMap'
        haproxy_options:
          $ref: '#/components/schemas/StringMap'
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
