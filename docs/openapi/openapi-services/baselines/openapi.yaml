openapi: 3.0.3
info:
  title: Stroppy Cloud — Baselines API
  description: Self-contained Baselines domain slice of the Stroppy Cloud API. Independently valid; no
    external $refs.
  version: 1.0.0
servers:
- url: /
  description: Same-origin (SPA is served by the API server)
security:
- bearerAuth: []
tags:
- name: Baselines
  description: Named baseline run pointers for comparison.
paths:
  /api/v1/baselines:
    get:
      tags:
      - Baselines
      summary: List named baselines
      description: Operator+.
      responses:
        '200':
          description: Map of baseline name → run id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/baseline/{name}:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Baselines
      summary: Resolve a baseline to its run id
      description: Operator+.
      responses:
        '200':
          description: Baseline pointer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  baseline:
                    type: string
                  run_id:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
    put:
      tags:
      - Baselines
      summary: Set a baseline pointer
      description: Operator+.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - run_id
              properties:
                run_id:
                  type: string
      responses:
        '200':
          description: Baseline set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  baseline:
                    type: string
                  run_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
