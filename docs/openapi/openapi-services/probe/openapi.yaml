openapi: 3.0.3
info:
  title: Stroppy Cloud — Probe API
  description: Self-contained Probe domain slice of the Stroppy Cloud API. Independently valid; no external
    $refs.
  version: 1.0.0
servers:
- url: /
  description: Same-origin (SPA is served by the API server)
security:
- bearerAuth: []
tags:
- name: Probe
  description: Stroppy workload introspection.
paths:
  /api/v1/probe:
    post:
      tags:
      - Probe
      summary: Probe a stroppy workload
      description: Operator+. Runs `stroppy probe` and returns env declarations, steps, sql sections,
        driver setups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeRequest'
      responses:
        '200':
          description: Probe output.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResponse'
        '400':
          $ref: '#/components/responses/Error'
        '422':
          description: Probe failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  output:
                    type: string
components:
  schemas:
    EnvDeclaration:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
        default:
          type: string
        description:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    ProbeRequest:
      type: object
      required:
      - script
      properties:
        script:
          type: string
        version:
          type: string
        sql:
          type: string
        driver_type:
          type: string
        pool_size:
          type: integer
        scale_factor:
          type: integer
        env:
          $ref: '#/components/schemas/StringMap'
        files:
          type: array
          items:
            $ref: '#/components/schemas/WorkloadFile'
        include_human:
          type: boolean
    ProbeResponse:
      type: object
      properties:
        env_declarations:
          type: array
          items:
            $ref: '#/components/schemas/EnvDeclaration'
        steps:
          type: array
          items:
            type: string
        sql_sections:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              queries:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
        driver_setups:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              defaults:
                type: object
                additionalProperties: true
        human:
          type: string
        human_error:
          type: string
    StringMap:
      type: object
      additionalProperties:
        type: string
    WorkloadFile:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          description: e.g. sql
        content:
          type: string
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
