openapi: 3.0.3
info:
  title: Stroppy Cloud — Metrics & Logs API
  description: Self-contained Metrics & Logs domain slice of the Stroppy Cloud API. Independently valid;
    no external $refs.
  version: 1.0.0
servers:
- url: /
  description: Same-origin (SPA is served by the API server)
security:
- bearerAuth: []
tags:
- name: Metrics & Logs
  description: Run metrics, comparison, and log streaming.
paths:
  /api/v1/run/{runID}/metrics:
    parameters:
    - name: runID
      in: path
      required: true
      schema:
        type: string
    - name: start
      in: query
      schema:
        type: string
        format: date-time
      description: RFC3339; auto-derived from snapshot if omitted
    - name: end
      in: query
      schema:
        type: string
        format: date-time
      description: RFC3339; auto-derived from snapshot if omitted
    get:
      tags:
      - Metrics & Logs
      summary: Collected metrics for a run
      description: Viewer+. Requires monitoring configured (else 503).
      responses:
        '200':
          description: Run metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunMetrics'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/run/{runID}/logs:
    parameters:
    - name: runID
      in: path
      required: true
      schema:
        type: string
    - name: start
      in: query
      schema:
        type: string
        format: date-time
    - name: end
      in: query
      schema:
        type: string
        format: date-time
    - name: limit
      in: query
      schema:
        type: integer
        default: 500
    - name: dir
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
      description: Sort by time
    - name: search
      in: query
      schema:
        type: string
      description: Substring match on message
    - name: action
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      description: Filter by phase/action
    - name: role
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - name: unit
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      description: systemd unit
    - name: machine_id
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    get:
      tags:
      - Metrics & Logs
      summary: Query run logs (NDJSON)
      description: 'Viewer+. Proxies VictoriaLogs. Returns newline-delimited JSON log

        records. Responds 503 when monitoring is not configured.

        '
      responses:
        '200':
          description: NDJSON log lines.
          content:
            application/x-ndjson:
              schema:
                type: string
        '503':
          description: Log storage not configured.
  /api/v1/compare:
    get:
      tags:
      - Metrics & Logs
      summary: Compare metrics of two runs
      description: Viewer+. Requires monitoring configured.
      parameters:
      - name: a
        in: query
        required: true
        schema:
          type: string
        description: Run A id
      - name: b
        in: query
        required: true
        schema:
          type: string
        description: Run B id
      - name: start
        in: query
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        schema:
          type: string
          format: date-time
      - name: threshold
        in: query
        schema:
          type: number
          default: 5
        description: Verdict threshold percent
      responses:
        '200':
          description: Comparison.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonResponse'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  schemas:
    CockroachTopology:
      type: object
      properties:
        nodes:
          $ref: '#/components/schemas/MachineSpec'
        options:
          $ref: '#/components/schemas/StringMap'
    ComparisonResponse:
      type: object
      properties:
        run_a:
          type: string
        run_b:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/ComparisonRow'
        summary:
          $ref: '#/components/schemas/ComparisonVerdict'
        config_a:
          $ref: '#/components/schemas/RunConfig'
        config_b:
          $ref: '#/components/schemas/RunConfig'
    ComparisonRow:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        unit:
          type: string
        avg_a:
          type: number
        avg_b:
          type: number
        max_a:
          type: number
        max_b:
          type: number
        diff_avg_pct:
          type: number
        diff_max_pct:
          type: number
        verdict:
          type: string
          enum:
          - better
          - worse
          - same
    ComparisonVerdict:
      type: object
      properties:
        better:
          type: integer
        worse:
          type: integer
        same:
          type: integer
    DatabaseConfig:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/DatabaseKind'
        version:
          type: string
        postgres:
          $ref: '#/components/schemas/PostgresTopology'
        mysql:
          $ref: '#/components/schemas/MySQLTopology'
        mariadb:
          $ref: '#/components/schemas/MySQLTopology'
        picodata:
          $ref: '#/components/schemas/PicodataTopology'
        ydb:
          $ref: '#/components/schemas/YDBTopology'
        ydb_managed:
          $ref: '#/components/schemas/YDBManagedTopology'
        cockroach:
          $ref: '#/components/schemas/CockroachTopology'
        rendered_config_overrides:
          $ref: '#/components/schemas/StringMap'
    DatabaseKind:
      type: string
      enum:
      - postgres
      - mysql
      - mariadb
      - picodata
      - ydb
      - ydb-managed
      - cockroach
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    ExternalDBConfig:
      type: object
      properties:
        endpoint:
          type: string
        database:
          type: string
        username:
          type: string
        password:
          type: string
        ssl_mode:
          type: string
    MachineRole:
      type: string
      enum:
      - database
      - monitor
      - stroppy
      - etcd
      - proxy
      - pgbouncer
      - ydb-storage
      - ydb-database
    MachineSpec:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/MachineRole'
        count:
          type: integer
        cpus:
          type: integer
        memory_mb:
          type: integer
        disk_gb:
          type: integer
        disk_type:
          type: string
        secondary_disks:
          type: array
          items:
            $ref: '#/components/schemas/SecondaryDisk'
        placement:
          $ref: '#/components/schemas/PlacementSpec'
    MetricSummary:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        unit:
          type: string
        avg:
          type: number
        min:
          type: number
        max:
          type: number
        last:
          type: number
    MonitorConfig:
      type: object
      properties:
        metrics_endpoint:
          type: string
        logs_endpoint:
          type: string
    MySQLTopology:
      type: object
      properties:
        primary:
          $ref: '#/components/schemas/MachineSpec'
        replicas:
          type: array
          items:
            $ref: '#/components/schemas/MachineSpec'
        proxysql:
          $ref: '#/components/schemas/MachineSpec'
        group_replication:
          type: boolean
        semi_sync:
          type: boolean
        primary_options:
          $ref: '#/components/schemas/StringMap'
        replica_options:
          $ref: '#/components/schemas/StringMap'
        proxysql_options:
          $ref: '#/components/schemas/StringMap'
    NetworkConfig:
      type: object
      properties:
        cidr:
          type: string
        zone:
          type: string
    PicodataTier:
      type: object
      properties:
        name:
          type: string
        replication_factor:
          type: integer
        can_vote:
          type: boolean
        count:
          type: integer
    PicodataTopology:
      type: object
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/MachineSpec'
        haproxy:
          $ref: '#/components/schemas/MachineSpec'
        replication_factor:
          type: integer
        shards:
          type: integer
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/PicodataTier'
        instance_options:
          $ref: '#/components/schemas/StringMap'
        haproxy_options:
          $ref: '#/components/schemas/StringMap'
    PlacementSpec:
      type: object
      properties:
        strategy:
          type: string
          enum:
          - single
          - round-robin
        zones:
          type: array
          items:
            type: string
    PostgresTopology:
      type: object
      properties:
        master:
          $ref: '#/components/schemas/MachineSpec'
        replicas:
          type: array
          items:
            $ref: '#/components/schemas/MachineSpec'
        haproxy:
          $ref: '#/components/schemas/MachineSpec'
        pgbouncer:
          type: boolean
        patroni:
          type: boolean
        etcd:
          type: boolean
        sync_replicas:
          type: integer
        master_options:
          $ref: '#/components/schemas/StringMap'
        replica_options:
          $ref: '#/components/schemas/StringMap'
        haproxy_options:
          $ref: '#/components/schemas/StringMap'
        pgbouncer_options:
          $ref: '#/components/schemas/StringMap'
        patroni_options:
          $ref: '#/components/schemas/StringMap'
        etcd_options:
          $ref: '#/components/schemas/StringMap'
    Protocol:
      type: string
      enum:
      - pg
      - mysql
      - picodata
      - ydb-grpc
      - ydb-pgwire
      - ydb-grpcs
      - cockroach
    Provider:
      type: string
      enum:
      - yandex
      - docker
    RunConfig:
      type: object
      required:
      - id
      - provider
      - network
      - machines
      - database
      - monitor
      - stroppy
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        provider:
          $ref: '#/components/schemas/Provider'
        network:
          $ref: '#/components/schemas/NetworkConfig'
        machines:
          type: array
          items:
            $ref: '#/components/schemas/MachineSpec'
        database:
          $ref: '#/components/schemas/DatabaseConfig'
        monitor:
          $ref: '#/components/schemas/MonitorConfig'
        stroppy:
          $ref: '#/components/schemas/StroppyConfig'
        preset_id:
          type: string
        package_id:
          type: string
        platform_id:
          type: string
        machine_override:
          $ref: '#/components/schemas/MachineSpec'
        run_preset_id:
          type: string
        suite_id:
          type: string
        external_db:
          $ref: '#/components/schemas/ExternalDBConfig'
    RunMetrics:
      type: object
      properties:
        run_id:
          type: string
        range:
          $ref: '#/components/schemas/TimeRange'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricSummary'
    SecondaryDisk:
      type: object
      properties:
        device_name:
          type: string
        size_gb:
          type: integer
        type:
          type: string
    StringMap:
      type: object
      additionalProperties:
        type: string
    StroppyConfig:
      type: object
      properties:
        version:
          type: string
        protocol:
          $ref: '#/components/schemas/Protocol'
        script:
          type: string
          description: e.g. tpcc/procs, tpcc/tx, tpcb/tx
        sql:
          type: string
        duration:
          type: string
        k6_mode:
          type: string
          enum:
          - duration
          - iterations
        iterations:
          type: integer
        quiet:
          type: boolean
        no_thresholds:
          type: boolean
        vus:
          type: integer
        pool_size:
          type: integer
        scale_factor:
          type: number
        default_insert_method:
          type: string
        env:
          $ref: '#/components/schemas/StringMap'
        files:
          type: array
          items:
            $ref: '#/components/schemas/WorkloadFile'
        steps:
          type: array
          items:
            type: string
        no_steps:
          type: array
          items:
            type: string
        machine:
          $ref: '#/components/schemas/MachineSpec'
        config_override_json:
          type: string
        workload:
          type: string
          deprecated: true
        vus_scale:
          type: number
          deprecated: true
        workers:
          type: integer
          deprecated: true
    TimeRange:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    WorkloadFile:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          description: e.g. sql
        content:
          type: string
    YDBManagedAutoScale:
      type: object
      properties:
        min_size:
          type: integer
        max_size:
          type: integer
        cpu_utilization_percent:
          type: integer
          default: 70
    YDBManagedTerraformOutput:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - serverless
          - dedicated
        folder_id:
          type: string
        location_id:
          type: string
        database_path:
          type: string
        ydb_api_endpoint:
          type: string
        ydb_full_endpoint:
          type: string
        document_api_endpoint:
          type: string
        tls_enabled:
          type: boolean
        status:
          type: string
        created_at:
          type: string
        labels:
          $ref: '#/components/schemas/StringMap'
        resource_preset_id:
          type: string
        network_id:
          type: string
        subnet_ids:
          type: array
          items:
            type: string
        storage_groups:
          type: integer
        storage_type_id:
          type: string
        throttling_rcu_limit:
          type: integer
    YDBManagedTopology:
      type: object
      properties:
        type:
          type: string
          enum:
          - serverless
          - dedicated
        compute_type:
          type: string
          enum:
          - oltp
          - olap
        resource_preset_id:
          type: string
        node_count:
          type: integer
        auto_scale:
          $ref: '#/components/schemas/YDBManagedAutoScale'
        storage_groups:
          type: integer
        storage_type:
          type: string
        throttling_rcus:
          type: integer
        client:
          $ref: '#/components/schemas/MachineSpec'
        database_path:
          type: string
        endpoint:
          type: string
        terraform_output:
          $ref: '#/components/schemas/YDBManagedTerraformOutput'
    YDBTopology:
      type: object
      properties:
        storage:
          $ref: '#/components/schemas/MachineSpec'
        database:
          $ref: '#/components/schemas/MachineSpec'
        haproxy:
          $ref: '#/components/schemas/MachineSpec'
        fault_tolerance:
          type: string
        failure_domain_type:
          type: string
        default_disk_type:
          type: string
        storage_groups:
          type: integer
        auto_size_pdisks:
          type: boolean
        database_path:
          type: string
        storage_options:
          $ref: '#/components/schemas/StringMap'
        database_options:
          $ref: '#/components/schemas/StringMap'
        haproxy_options:
          $ref: '#/components/schemas/StringMap'
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
