openapi: 3.0.3
info:
  title: Stroppy Cloud — System API
  description: Self-contained System domain slice of the Stroppy Cloud API. Independently valid; no external
    $refs.
  version: 1.0.0
servers:
- url: /
  description: Same-origin (SPA is served by the API server)
security:
- bearerAuth: []
tags:
- name: System
  description: Health and stroppy version discovery.
paths:
  /health:
    get:
      tags:
      - System
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Server is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /metrics:
    get:
      tags:
      - System
      summary: Prometheus metrics exposition
      description: Prometheus text-format metrics for this server process.
      security: []
      responses:
        '200':
          description: Prometheus exposition format.
          content:
            text/plain:
              schema:
                type: string
  /api/v1/stroppy-versions:
    get:
      tags:
      - System
      summary: List available stroppy release versions
      description: 'Returns stroppy release tags ≥ the minimum supported version, stable

        releases first then prereleases. Cached 5 minutes from GitHub. Viewer+.

        '
      responses:
        '200':
          description: Version strings (without the leading `v`).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: 4.3.1
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/stroppy-commits:
    get:
      tags:
      - System
      summary: List per-commit stroppy pre-releases
      description: Per-commit nightly/pre-release builds. Cached 5 minutes. Viewer+.
      responses:
        '200':
          description: Commit builds.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StroppyCommit'
        '502':
          $ref: '#/components/responses/Error'
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    StroppyCommit:
      type: object
      properties:
        short:
          type: string
        tag:
          type: string
        name:
          type: string
        download_url:
          type: string
        published_at:
          type: string
          format: date-time
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
