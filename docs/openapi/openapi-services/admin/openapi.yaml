openapi: 3.0.3
info:
  title: Stroppy Cloud — Platform Admin API
  description: Self-contained Platform Admin domain slice of the Stroppy Cloud API. Independently valid;
    no external $refs.
  version: 1.0.0
servers:
- url: /
  description: Same-origin (SPA is served by the API server)
security:
- bearerAuth: []
tags:
- name: Admin
  description: Root-only tenant and user administration.
paths:
  /api/v1/admin/tenants:
    get:
      tags:
      - Admin
      summary: List all tenants
      description: Root only.
      responses:
        '200':
          description: Tenants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
    post:
      tags:
      - Admin
      summary: Create a tenant
      description: Root only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
  /api/v1/admin/tenants/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      tags:
      - Admin
      summary: Delete a tenant
      description: Root only.
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /api/v1/admin/users:
    get:
      tags:
      - Admin
      summary: List all users
      description: Root only.
      responses:
        '200':
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
    post:
      tags:
      - Admin
      summary: Create a user
      description: Root only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                is_root:
                  type: boolean
      responses:
        '200':
          description: User created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  username:
                    type: string
  /api/v1/admin/users/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      tags:
      - Admin
      summary: Delete a user
      description: Root only.
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /api/v1/admin/users/{id}/password:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    put:
      tags:
      - Admin
      summary: Reset a user's password
      description: Root only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
components:
  schemas:
    AdminUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        is_root:
          type: boolean
        created_at:
          type: string
          format: date-time
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
    Tenant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
