openapi: 3.0.3
info:
  title: Stroppy Cloud API
  description: |
    Complete HTTP API for the Stroppy Cloud control plane, extracted from the
    Go chi router in `internal/domain/api/server.go` and the TypeScript client
    in `web/src/api/`. Covers every endpoint the web UI consumes plus the
    public share, agent, and binary-distribution surfaces.

    ## Authentication
    Most endpoints require a JWT bearer access token (`Authorization: Bearer <token>`),
    obtained via `POST /api/v1/auth/login`. Access tokens live 15 minutes; a
    long-lived refresh token is set as an HttpOnly `refresh_token` cookie and
    rotated via `POST /api/v1/auth/refresh`.

    ## Tenancy & roles
    Endpoints under `/api/v1` (except auth/grafana) require a tenant-scoped JWT
    (select one via `POST /api/v1/auth/select-tenant` when the user belongs to
    multiple tenants). Role gates:
      - **viewer**: read endpoints (runs, presets, suites, settings, metrics).
      - **operator**: run lifecycle, presets/suites/packages writes, uploads, baselines.
      - **owner**: tenant settings, members, API tokens.
      - **root**: `/api/v1/admin/*` (tenants and users).

    The per-operation `description` notes the minimum role.
  version: 1.0.0

servers:
  - url: /
    description: Same-origin (SPA is served by the API server)

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Login, token refresh, session, password.
  - name: Tenant Members
    description: Manage tenant membership (owner only).
  - name: API Tokens
    description: Tenant API tokens (owner only).
  - name: Admin
    description: Root-only tenant and user administration.
  - name: Runs
    description: Single benchmark run lifecycle and inspection.
  - name: Presets
    description: Per-tenant database topology presets.
  - name: Run Presets
    description: Saved full run configurations.
  - name: Suites
    description: Matrix suites (db presets × workloads) and batches.
  - name: Suite Items
    description: Workload-axis items within a suite.
  - name: Packages
    description: DB install packages (apt/deb).
  - name: Metrics & Logs
    description: Run metrics, comparison, and log streaming.
  - name: Settings
    description: Per-tenant cloud/monitoring/quota settings.
  - name: Grafana
    description: Grafana embed configuration.
  - name: Queue & Quotas
    description: Durable job queue and resource quota usage.
  - name: Probe
    description: Stroppy workload introspection.
  - name: Baselines
    description: Named baseline run pointers for comparison.
  - name: Share
    description: Public read-only run share links.
  - name: System
    description: Health and stroppy version discovery.
  - name: Uploads
    description: Package binary uploads.
  - name: Agent
    description: Internal agent ↔ server polling protocol (not used by the UI).
  - name: Binaries
    description: Internal binary distribution (not used by the UI).
  - name: WebSocket
    description: Live log/report stream (documented for reference).

paths:
  # ============================================================
  # Health & system
  # ============================================================
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Server is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics exposition
      description: Prometheus text-format metrics for this server process.
      security: []
      responses:
        "200":
          description: Prometheus exposition format.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/stroppy-versions:
    get:
      tags: [System]
      summary: List available stroppy release versions
      description: |
        Returns stroppy release tags ≥ the minimum supported version, stable
        releases first then prereleases. Cached 5 minutes from GitHub. Viewer+.
      responses:
        "200":
          description: Version strings (without the leading `v`).
          content:
            application/json:
              schema:
                type: array
                items: { type: string, example: "4.3.1" }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/stroppy-commits:
    get:
      tags: [System]
      summary: List per-commit stroppy pre-releases
      description: Per-commit nightly/pre-release builds. Cached 5 minutes. Viewer+.
      responses:
        "200":
          description: Commit builds.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StroppyCommit" }
        "502": { $ref: "#/components/responses/Error" }

  # ============================================================
  # Auth
  # ============================================================
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: |
            Access token returned in the body; an HttpOnly `refresh_token`
            cookie is set (Path=/api/v1/auth, 7d).
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "refresh_token=<hex>; HttpOnly; SameSite=Strict"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessTokenResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token, mint a new access token
      description: Reads the `refresh_token` cookie; rotates it and returns a new access token.
      security: []
      responses:
        "200":
          description: New access token; rotated refresh cookie set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessTokenResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Deletes the refresh token server-side and clears the cookie.
      security: []
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user and tenant memberships
      responses:
        "200":
          description: Authenticated principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/select-tenant:
    post:
      tags: [Auth]
      summary: Mint a tenant-scoped access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string }
      responses:
        "200":
          description: Tenant-scoped access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessTokenResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/auth/password:
    put:
      tags: [Auth]
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
        "401": { $ref: "#/components/responses/Error" }

  # ============================================================
  # Tenant members (owner+)
  # ============================================================
  /api/v1/tenant/members:
    get:
      tags: [Tenant Members]
      summary: List tenant members
      description: Owner only.
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TenantMember" }
    post:
      tags: [Tenant Members]
      summary: Add a member to the tenant
      description: Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role]
              properties:
                user_id: { type: string }
                role: { $ref: "#/components/schemas/TenantRole" }
      responses:
        "200":
          description: Member added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantMember" }

  /api/v1/tenant/members/{userID}:
    parameters:
      - { name: userID, in: path, required: true, schema: { type: string } }
    put:
      tags: [Tenant Members]
      summary: Update a member's role
      description: Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/TenantRole" }
      responses:
        "200":
          description: Role updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
    delete:
      tags: [Tenant Members]
      summary: Remove a member
      description: Owner only.
      responses:
        "200":
          description: Member removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  # ============================================================
  # Tenant API tokens (owner+)
  # ============================================================
  /api/v1/tenant/tokens:
    get:
      tags: [API Tokens]
      summary: List tenant API tokens
      description: Owner only. Plaintext is never returned after creation.
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TenantAPIToken" }
    post:
      tags: [API Tokens]
      summary: Create an API token
      description: Owner only. The `plaintext` is shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: { type: string }
                role: { $ref: "#/components/schemas/TenantRole" }
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        "200":
          description: Token created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/TenantAPIToken" }
                  plaintext: { type: string }
  /api/v1/tenant/tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [API Tokens]
      summary: Revoke an API token
      description: Owner only.
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  # ============================================================
  # Admin (root only)
  # ============================================================
  /api/v1/admin/tenants:
    get:
      tags: [Admin]
      summary: List all tenants
      description: Root only.
      responses:
        "200":
          description: Tenants.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tenant" }
    post:
      tags: [Admin]
      summary: Create a tenant
      description: Root only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: Tenant created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
  /api/v1/admin/tenants/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Admin]
      summary: Delete a tenant
      description: Root only.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: List all users
      description: Root only.
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
    post:
      tags: [Admin]
      summary: Create a user
      description: Root only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                is_root: { type: boolean }
      responses:
        "200":
          description: User created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  username: { type: string }
  /api/v1/admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Admin]
      summary: Delete a user
      description: Root only.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
  /api/v1/admin/users/{id}/password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Admin]
      summary: Reset a user's password
      description: Root only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  # ============================================================
  # Runs
  # ============================================================
  /api/v1/run:
    post:
      tags: [Runs]
      summary: Start (enqueue) a run
      description: |
        Operator+. Resolves run preset/package, probes the workload, validates
        quotas, and enqueues the run in the durable job queue.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunConfig" }
      responses:
        "202":
          description: Run queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string }
                  status: { type: string, example: queued }
        "400": { $ref: "#/components/responses/Error" }
        "403":
          description: Quota exceeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Run already exists or queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Queue depth limit reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503": { $ref: "#/components/responses/Error" }

  /api/v1/runs:
    get:
      tags: [Runs]
      summary: List runs (incl. queued)
      description: Viewer+. Includes queued jobs not yet snapshotted.
      responses:
        "200":
          description: Run summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunSummary" }

  /api/v1/validate:
    post:
      tags: [Runs]
      summary: Validate a run config
      description: Operator+. Static validation; does not enqueue.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunConfig" }
      responses:
        "200":
          description: Valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: valid }
        "422":
          description: Invalid config.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/dry-run:
    post:
      tags: [Runs]
      summary: Compile a run config into a DAG without executing
      description: Operator+. Returns the planned graph, resolved config, and rendered configs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunConfig" }
      responses:
        "200":
          description: Dry-run result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DryRunResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/stroppy-config-preview:
    post:
      tags: [Runs]
      summary: Preview the rendered stroppy-config.json
      description: Operator+.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunConfig" }
      responses:
        "200":
          description: Stroppy config preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stroppy_config: { type: string, description: JSON-encoded stroppy config }

  /api/v1/run/{runID}:
    parameters:
      - { name: runID, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Runs]
      summary: Delete a run
      description: Operator+. Cleans up provider resources best-effort.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/StatusResponse" }
                  - type: object
                    properties:
                      run_id: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/run/{runID}/cancel:
    parameters:
      - { name: runID, in: path, required: true, schema: { type: string } }
    post:
      tags: [Runs]
      summary: Cancel a queued or running run
      description: Operator+.
      responses:
        "200":
          description: Cancelling.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: cancelling }
                  run_id: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/run/{runID}/status:
    parameters:
      - { name: runID, in: path, required: true, schema: { type: string } }
    get:
      tags: [Runs]
      summary: Run status snapshot
      description: |
        Viewer+. Returns the DAG snapshot annotated with current job state.
        Queued runs return a minimal shim (empty nodes, `job_state=queued`).
      responses:
        "200":
          description: Run status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunStatus" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/run/{runID}/rendered-configs:
    parameters:
      - { name: runID, in: path, required: true, schema: { type: string } }
    get:
      tags: [Runs]
      summary: Per-component rendered config files
      description: Viewer+. postgresql.conf, ydb.yaml, pgbouncer.ini, etc.
      responses:
        "200":
          description: Rendered configs keyed by filename.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rendered_configs:
                    type: object
                    additionalProperties: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/run/{runID}/agents:
    parameters:
      - { name: runID, in: path, required: true, schema: { type: string } }
    get:
      tags: [Runs]
      summary: Agents (machines) for a run with live status
      description: Viewer+.
      responses:
        "200":
          description: Agent list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentInfo" }

  /api/v1/run/{runID}/share:
    parameters:
      - { name: runID, in: path, required: true, schema: { type: string } }
    post:
      tags: [Share]
      summary: Create a public share link for a run
      description: Operator+. Freezes the snapshot + metrics into a read-only record.
      responses:
        "200":
          description: Share token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  url: { type: string, example: /share/abc123 }
        "404": { $ref: "#/components/responses/Error" }

  # ============================================================
  # Metrics & logs
  # ============================================================
  /api/v1/run/{runID}/metrics:
    parameters:
      - { name: runID, in: path, required: true, schema: { type: string } }
      - { name: start, in: query, schema: { type: string, format: date-time }, description: RFC3339; auto-derived from snapshot if omitted }
      - { name: end, in: query, schema: { type: string, format: date-time }, description: RFC3339; auto-derived from snapshot if omitted }
    get:
      tags: [Metrics & Logs]
      summary: Collected metrics for a run
      description: Viewer+. Requires monitoring configured (else 503).
      responses:
        "200":
          description: Run metrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunMetrics" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/v1/run/{runID}/logs:
    parameters:
      - { name: runID, in: path, required: true, schema: { type: string } }
      - { name: start, in: query, schema: { type: string, format: date-time } }
      - { name: end, in: query, schema: { type: string, format: date-time } }
      - { name: limit, in: query, schema: { type: integer, default: 500 } }
      - { name: dir, in: query, schema: { type: string, enum: [asc, desc] }, description: Sort by time }
      - { name: search, in: query, schema: { type: string }, description: Substring match on message }
      - { name: action, in: query, style: form, explode: true, schema: { type: array, items: { type: string } }, description: Filter by phase/action }
      - { name: role, in: query, style: form, explode: true, schema: { type: array, items: { type: string } } }
      - { name: unit, in: query, style: form, explode: true, schema: { type: array, items: { type: string } }, description: systemd unit }
      - { name: machine_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string } } }
    get:
      tags: [Metrics & Logs]
      summary: Query run logs (NDJSON)
      description: |
        Viewer+. Proxies VictoriaLogs. Returns newline-delimited JSON log
        records. Responds 503 when monitoring is not configured.
      responses:
        "200":
          description: NDJSON log lines.
          content:
            application/x-ndjson:
              schema: { type: string }
        "503":
          description: Log storage not configured.

  /api/v1/compare:
    get:
      tags: [Metrics & Logs]
      summary: Compare metrics of two runs
      description: Viewer+. Requires monitoring configured.
      parameters:
        - { name: a, in: query, required: true, schema: { type: string }, description: Run A id }
        - { name: b, in: query, required: true, schema: { type: string }, description: Run B id }
        - { name: start, in: query, schema: { type: string, format: date-time } }
        - { name: end, in: query, schema: { type: string, format: date-time } }
        - { name: threshold, in: query, schema: { type: number, default: 5 }, description: Verdict threshold percent }
      responses:
        "200":
          description: Comparison.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComparisonResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  # ============================================================
  # Baselines (operator+)
  # ============================================================
  /api/v1/baselines:
    get:
      tags: [Baselines]
      summary: List named baselines
      description: Operator+.
      responses:
        "200":
          description: Map of baseline name → run id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
  /api/v1/baseline/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [Baselines]
      summary: Resolve a baseline to its run id
      description: Operator+.
      responses:
        "200":
          description: Baseline pointer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  baseline: { type: string }
                  run_id: { type: string }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Baselines]
      summary: Set a baseline pointer
      description: Operator+.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id]
              properties:
                run_id: { type: string }
      responses:
        "200":
          description: Baseline set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  baseline: { type: string }
                  run_id: { type: string }
        "400": { $ref: "#/components/responses/Error" }

