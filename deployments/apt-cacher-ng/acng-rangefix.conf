# Disable Range-based revalidation of volatile index files (InRelease/Release/
# Packages). CDN-fronted repos like apt.postgresql.org (Fastly) ignore/alter the
# Range header, so apt-cacher-ng aborts revalidation with
#   503 "Server reports unexpected range"
# which makes `apt-get update` skip the PGDG repo and non-default postgres
# versions fail to install ("Unable to locate package postgresql-NN"). Clearing
# the cache only fixes it until the next revalidation. With Range ops off acng
# uses If-Modified-Since + a full re-fetch, which CDNs handle correctly.
# acng reads every *.conf in /etc/apt-cacher-ng, so this snippet is enough.
VfileUseRangeOps: 0
